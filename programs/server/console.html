function effectiveAccessView({access, columns, user_row, rules, verified, operation}) {
    const {database, table} = dap_state;
    const user = user_row.name;
    const subject = {type: 'user', name: user};
    const closure = roleClosure(access.role_grants, subject);
    const login_roles = dapLoginRoles(access.role_grants, user);
    const all_roles = dapAllRoles(access.role_grants, user);
    const names = columns.map(c => c.name);
    const matrix = dapColumnAccess(access.grants, access.role_grants, access.tree, subject, operation, database, table, names);
    const filter_login = dapRowFilter(access.policies, database, table, user, login_roles);
    const filter_all = dapRowFilter(access.policies, database, table, user, all_roles);
    const source_of = name => {
        const entity = access.roles.find(r => r.name === name) || access.users.find(u => u.name === name);
        return entity ? entitySource(entity.storage).label : 'unknown';
    };
    const verify_box = h('div', {});
    const status = (m, key) => {
        const effective = m.sources.filter(s => !s.revoked);
        if (key === 'login') return effective.some(s => s.grantee.active) ? badge('Yes', 'ok') : badge('No');
        return effective.length ? badge('Yes', effective.some(s => s.grantee.active) ? 'ok' : 'warn') : badge('No');
    };
    const conflicts = [];
    const broad = matrix.flatMap(m => m.broad);
    if (broad.length && matrix.some(m => m.sources.some(s => s.level === 'column'))) {
        conflicts.push(`Column grants restrict nothing: ${[...new Set(broad.map(s => `${s.row.access_type} ON ${grantTargetText(s.row)}${s.grantee.path.length ? ` via ${s.grantee.path.join(' → ')}` : ''}`))].join(', ')} gives every column.`);
    }
    if (filter_login.permissive.length > 1) conflicts.push(`Several permissive policies apply (${filter_login.permissive.map(p => p.short_name).join(', ')}): the user sees the rows of any of them.`);
    if (filter_login.text !== filter_all.text) conflicts.push(`After SET ROLE the row filter changes: ${filter_all.text}.`);
    if (rules) {
        for (const rule of rules.filter(r => r.enabled && !r.deleted && r.spec.kind === 'column_clearance')) {
            const role = `${DAP_PREFIX}${dapRuleShort(rule.rule_id)}_cleared`;
            if (all_roles.includes(role)) continue;
            const labeled = rule.classifications.filter(c => c.label === rule.spec.label && c.database === database && c.table === table).map(c => c.column);
            const open = matrix.filter(m => labeled.includes(m.column) && m.allowed_with_roles).map(m => m.column);
            if (open.length) conflicts.push(`The rule "${rule.name}" intends ${user} not to read the ${rule.spec.label} columns ${open.join(', ')}, but other grants give them: rules add access and never deny it.`);
        }
    }
    return [
        h('p', {className: 'note'}, `Observed at ${access.observed_at} UTC on ${session.hostname} only. Other servers keep their own users, grants, and policies `
            + 'unless the user directory is replicated: a deployment ON CLUSTER reports each server.'),
        h('h3', {}, 'Identity'),
        kvList([['User', adminLink(user, 'admin-users', user)], ['Source', entitySource(user_row.storage).label], ['State', badge(userState(user_row).label, userState(user_row).className)],
            ['Default roles', user_row.default_roles_all ? 'All granted roles' : (user_row.default_roles_list || []).join(', ') || 'None']]),
        h('h3', {}, 'Roles'),
        dataTable([
            {title: 'Role', render: item => adminLink(item.role, 'admin-roles', item.role)},
            {title: 'Path', render: item => item.path.join(' → ')},
            {title: 'At login', render: item => item.is_default ? badge('Active', 'ok') : badge('After SET ROLE', 'warn')},
            {title: 'Source', render: item => source_of(item.role)},
        ], closure, 'No roles are granted.', 'Roles'),
        h('h3', {}, `${operation} on ${database}.${table}, per column`),
        dataTable([
            {title: 'Column', render: m => m.column},
            {title: 'At login (configured)', render: m => status(m, 'login')},
            {title: 'With all granted roles', render: m => status(m, 'all')},
            {title: 'Given by', render: m => m.sources.filter(s => !s.revoked).map(s => `${s.row.access_type} ON ${grantTargetText(s.row)}`
                + ` — ${s.grantee.type === 'user' ? 'direct' : s.grantee.path.join(' → ')}`).join('; ') || (m.sources.length ? 'Revoked partially' : '—')},
        ], matrix, 'The table has no columns.', 'Columns'),
        h('h3', {}, 'Rows'),
        kvList([['At login', filter_login.outcome === 'filtered' ? h('code', {}, filter_login.text) : filter_login.text],
            ['With all granted roles', filter_all.outcome === 'filtered' ? h('code', {}, filter_all.text) : filter_all.text],
            ['Policies', [...filter_all.permissive, ...filter_all.restrictive].map(p => `${p.short_name} (${entitySource(p.storage).label})`).join(', ') || 'None']]),
        h('h3', {}, 'Conflicts'),
        conflicts.length ? h('ul', {}, conflicts.map(text => h('li', {}, text))) : paragraph('None found.'),
        h('h3', {}, 'Verification'),
        paragraph('Configured entitlement is what the grants say. "At login" assumes the default roles; a session that runs SET ROLE can differ. '
            + 'Verifying asks the server: EXECUTE AS the user, CHECK GRANT for each column and a count of the visible rows. It needs IMPERSONATE on this user, '
            + 'which should be granted only for dedicated test users.'),
        h('div', {className: 'actions-row'}, button('Verify with the server', () => verifyEffective(verify_box, user, operation, names), {className: 'small'})),
        verify_box,
        verified.length ? [h('p', {className: 'note'}, 'Recent access tests of this user:'), dataTable([
            {title: 'Time', render: r => r.ran_at}, {title: 'Test', render: r => r.test_id.slice(0, 8)},
            {title: 'Result', render: r => badge(r.outcome, r.outcome === 'pass' ? 'ok' : 'bad')}, {title: 'Observed', render: r => r.observed}], verified, '', 'Test runs')] : null,
    ];
}

async function verifyEffective(box, user, operation, columns) {
    const {database, table} = dap_state;
    box.replaceChildren(loadingBox('Asking the server…'));
    const target = `${quoteIdentifier(database)}.${quoteIdentifier(table)}`;
    const rows = [];
    for (const column of columns) {
        try {
            const text = await adminText(`EXECUTE AS ${quoteIdentifier(user)} CHECK GRANT ${operation}(${quoteIdentifier(column)}) ON ${target}`);
            rows.push({what: `${operation}(${column})`, result: text.trim() === '1' ? ['Allowed', 'ok'] : ['Denied', ''], detail: 'Verified at runtime'});
        } catch (e) {
            if (e instanceof AdminSessionChanged) return;
            rows.push({what: `${operation}(${column})`, result: ['Unknown', 'warn'], detail: `Not verified: ${e.message}`});
            break;
        }
    }
    if (operation === 'SELECT' && rows.length && rows[0].result[0] !== 'Unknown') {
        try {
            const count = await adminText(`EXECUTE AS ${quoteIdentifier(user)} SELECT count() FROM ${target}`);
            rows.push({what: 'Visible rows', result: [count.trim(), 'ok'], detail: 'Counted by the server with the user\'s grants and row policies at login'});
        } catch (e) {
            if (e instanceof AdminSessionChanged) return;
            rows.push({what: 'Visible rows', result: ['Denied', ''], detail: e.message});
        }
    }
    box.replaceChildren(dataTable([{title: 'Check', render: r => r.what}, {title: 'Result', render: r => badge(...r.result)}, {title: 'Evidence', render: r => r.detail}],
        rows, '', 'Runtime verification'));
}

function dapSetupBox(purpose) {
    const admin = session.admin;
    const box = h('div', {className: 'box'}, h('h2', {}, 'Set up Data Access Policies'),
        paragraph(`${purpose} needs the tables of attribute definitions, attribute values, classifications, policy rules, ownership of generated entities, `
            + `deployments, and access tests in the ${admin.db} database. Setting up creates them; it changes no grant or policy.`));
    if (!admin.db) return box;
    put(box, h('div', {className: 'actions-row'}, button('Set up', () => {
        const quoted = quoteIdentifier(admin.db);
        reviewPlan({action: 'dap_setup', target_type: 'platform', target_name: admin.db, summary: `Set up Data Access Policies in ${admin.db}`, local_only: true,
            steps: [{description: `Create the database ${admin.db}`, sql: `CREATE DATABASE IF NOT EXISTS ${quoted}`},
                ...Object.entries(DAP_TABLES).map(([table, ddl]) => ({description: `Create the table ${admin.db}.${table}`,
                    sql: `CREATE TABLE IF NOT EXISTS ${quoted}.${quoteIdentifier(table)}\n${ddl()}`}))],
            recovery: 'The statements use IF NOT EXISTS: run the setup again after fixing the error.', onclose: reloadAdminContext});
    }, {className: 'primary', disabled: !admin.can.setup, title: admin.can.setup ? null : `Needs CREATE TABLE on ${admin.db}.*.`})));
    return box;
}

/// --- Access Tests ---

async function dapLoadTests() {
    return adminRows(`SELECT t.test_id AS test_id, t.name AS name, t.user_name AS user_name, t.database AS database, t.table AS table, t.columns AS columns,
            toString(t.expect) AS expect, t.expected_rows AS expected_rows, t.updated_by AS updated_by,
            r.outcome AS last_outcome, r.observed AS last_observed, r.ran_text AS last_ran_at
        FROM (SELECT test_id, name, user_name, database, table, columns, expect, expected_rows, updated_by FROM ${dapTable('dap_access_tests')} FINAL WHERE NOT deleted) AS t
        LEFT JOIN (SELECT test_id, toString(argMax(outcome, ran_at)) AS outcome, argMax(observed, ran_at) AS observed,
            formatDateTime(max(ran_at), '%Y-%m-%d %H:%i:%S', 'UTC') AS ran_text FROM ${dapTable('dap_test_runs')} GROUP BY test_id) AS r ON r.test_id = t.test_id
        ORDER BY t.name`);
}

/// Runs one test: `EXECUTE AS` the test user, count the rows of the chosen columns. ACCESS_DENIED is the expected
/// outcome of a negative test; any other error (including a missing IMPERSONATE grant) is an error, not a pass.
async function runAccessTest(test) {
    const target = `${quoteIdentifier(test.database)}.${quoteIdentifier(test.table)}`;
    const inner = test.columns.length ? `SELECT ${test.columns.map(quoteIdentifier).join(', ')} FROM ${target}` : `SELECT 1 FROM ${target}`;
    const result = await runQuery(session, `EXECUTE AS ${quoteIdentifier(test.user_name)} SELECT count() FROM (${inner})`, session.controller.signal, 60000, {raw: true});
    let outcome;
    let observed;
    const denied = !result.ok && /\bACCESS_DENIED\b|Code: 497\b/.test(`${result.message} ${result.detail || ''}`) && !/IMPERSONATE/.test(`${result.message} ${result.detail || ''}`);
    if (result.ok) {
        const rows = Number(String(result.data).trim());
        observed = `allowed, ${rows} rows`;
        outcome = test.expect === 'allowed' && (test.expected_rows === null || Number(test.expected_rows) === rows) ? 'pass' : 'fail';
    } else if (denied) {
        observed = 'denied (ACCESS_DENIED)';
        outcome = test.expect === 'denied' ? 'pass' : 'fail';
    } else {
        observed = `error: ${`${result.detail || ''} ${result.message}`.trim().slice(0, 300)}`;
        outcome = 'error';
    }
    await adminText(`INSERT INTO ${dapTable('dap_test_runs')} (run_id, test_id, user_name, outcome, observed, path) FORMAT JSONEachRow\n`
        + JSON.stringify({run_id: crypto.randomUUID(), test_id: test.test_id, user_name: test.user_name, outcome, observed, path: 'execute_as'}));
    return {outcome, observed};
}

async function accessTestDialog() {
    let users;
    let databases;
    try {
        [users, databases] = await Promise.all([adminRows('SELECT name FROM system.users ORDER BY name'), dapDatabases()]);
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog('Add test', [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const name = h('input', {type: 'text', autocomplete: 'off'});
    const user = select([['', 'Choose a user'], ...users.map(u => [u.name, u.name])], '');
    const state = {database: dap_state.database, table: dap_state.table};
    const picker = dapObjectPicker(databases, state, () => {});
    const columns = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, placeholder: 'id, branch (empty: count the rows only)'});
    const expect = select([['allowed', 'Allowed'], ['denied', 'Denied (ACCESS_DENIED)']], 'allowed');
    const rows = h('input', {type: 'number', min: 0, placeholder: 'any'});
    await picker.ready;
    formDialog('Add an access test', [adminField('Name', name), adminField('As user', user, 'Use a dedicated synthetic user: running the test needs IMPERSONATE on it.'),
        adminField('Database', picker.database), adminField('Table', picker.table), adminField('Columns', columns),
        adminField('Expected', expect), adminField('Expected rows', rows, 'For an allowed read: the number of rows the user must see. Empty: any.')], 'Review', () => {
        if (!name.value.trim()) return 'Enter a name.';
        if (!user.value) return 'Choose the user.';
        if (!state.database || !state.table) return 'Choose the table.';
        const list = columns.value.split(',').map(s => s.trim()).filter(Boolean);
        for (const column of list) if (nameError(column, 'column')) return nameError(column, 'column');
        const expected_rows = rows.value === '' ? null : Number(rows.value);
        if (expected_rows !== null && (!Number.isInteger(expected_rows) || expected_rows < 0)) return 'Enter a whole number of rows, or leave it empty.';
        const row = {test_id: crypto.randomUUID(), name: name.value.trim(), user_name: user.value, database: state.database, table: state.table, columns: list,
            expect: expect.value, expected_rows: expect.value === 'allowed' ? expected_rows : null};
        return {action: 'dap_add_test', target_type: 'access_test', target_name: row.name, summary: `Add the access test ${row.name}`,
            steps: [{description: `Add the test: ${row.user_name} reads ${list.join(', ') || 'count()'} from ${row.database}.${row.table}, expected ${row.expect}`,
                sql: `INSERT INTO ${dapTable('dap_access_tests')} (test_id, name, user_name, database, table, columns, expect, expected_rows) FORMAT JSONEachRow\n${JSON.stringify(row)}`}],
            local_only: true};
    });
}

/// --- Attributes & Classifications ---

async function dapLoadAttributeState() {
    const [definitions, values, classifications] = await Promise.all([
        adminRows(`SELECT attribute, toString(category) AS category, dynamic, source, writer, owner, max_age_seconds, description, updated_by
            FROM ${dapTable('dap_attributes')} FINAL WHERE NOT deleted ORDER BY attribute`),
        adminRows(`SELECT user_name, attribute, value, source, toUnixTimestamp(observed_at) AS observed_seconds, updated_by,
            formatDateTime(observed_at, '%Y-%m-%d %H:%i:%S', 'UTC') AS observed_text FROM ${dapTable('dap_user_attributes')} FINAL WHERE NOT deleted ORDER BY user_name, attribute`),
        adminRows(`SELECT database, table, column, label, source, owner, updated_by FROM ${dapTable('dap_classifications')} FINAL WHERE NOT deleted ORDER BY database, table, column`),
    ]);
    return {definitions, values: values.map(v => ({...v, observed_at: v.observed_seconds})), classifications};
}

function attributeDialog() {
    const attribute = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, placeholder: 'department'});
    const category = select([['user', 'User'], ['resource', 'Resource'], ['operation', 'Operation'], ['environment', 'Environment']], 'user');
    const dynamic = checkbox('Evaluated per request (purpose, device, time, network): native controls cannot enforce rules on it', false);
    const source = h('input', {type: 'text', autocomplete: 'off', placeholder: 'keycloak, hr-feed, console'});
    const writer = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, placeholder: 'empty: any administrator who can write values'});
    const owner = h('input', {type: 'text', autocomplete: 'off', placeholder: 'Identity team'});
    const max_age = h('input', {type: 'number', min: 0, value: 86400});
    const description = h('input', {type: 'text', autocomplete: 'off'});
    formDialog('Define an attribute', [adminField('Attribute', attribute, 'Letters, digits, and underscores.'), adminField('Category', category), dynamic.element,
        adminField('Source of truth', source), adminField('Writer', writer, 'The database user whose writes are trusted, for example the account of the identity import. The server records the writer of every value.'),
        adminField('Owner', owner), adminField('Fresh for (seconds)', max_age, 'A value older than this is stale. 0: never stale.'), adminField('Description', description)], 'Review', () => {
        if (!/^[A-Za-z_][A-Za-z0-9_]{0,63}$/.test(attribute.value)) return 'Use letters, digits, and underscores for the attribute.';
        if (!source.value.trim()) return 'Enter the source of truth.';
        if (!owner.value.trim()) return 'Enter the owner.';
        const seconds = Number(max_age.value);
        if (!Number.isInteger(seconds) || seconds < 0) return 'Enter a whole number of seconds.';
        if (writer.value && nameError(writer.value, 'user')) return nameError(writer.value, 'user');
        const row = {attribute: attribute.value, category: category.value, dynamic: dynamic.input.checked, source: source.value.trim(), writer: writer.value.trim(),
            owner: owner.value.trim(), max_age_seconds: seconds, description: description.value.trim()};
        return {action: 'dap_define_attribute', target_type: 'attribute', target_name: row.attribute, summary: `Define the attribute ${row.attribute}`, local_only: true,
            steps: [{description: `Define ${row.attribute} (${row.category}, source ${row.source}${row.writer ? `, written by ${row.writer}` : ''})`,
                sql: `INSERT INTO ${dapTable('dap_attributes')} (attribute, category, dynamic, source, writer, owner, max_age_seconds, description) FORMAT JSONEachRow\n${JSON.stringify(row)}`}]};
    });
}

async function attributeValueDialog(definitions) {
    let users;
    try {
        users = await adminRows('SELECT name FROM system.users ORDER BY name');
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog('Set value', [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const usable = definitions.filter(d => d.category === 'user' && (!d.writer || d.writer === session.server_user));
    const user = select([['', 'Choose a user'], ...users.map(u => [u.name, u.name])], '');
    const attribute = select([['', 'Choose an attribute'], ...usable.map(d => [d.attribute, `${d.attribute} (${d.source})`])], '');
    const value = h('input', {type: 'text', autocomplete: 'off'});
    formDialog('Set a user attribute', [adminField('User', user), adminField('Attribute', attribute,
        'Only user attributes whose writer is you or any administrator. Attributes written by an import are set by the import.'), adminField('Value', value)], 'Review', () => {
        if (!user.value || !attribute.value) return 'Choose the user and the attribute.';
        if (!value.value.trim()) return 'Enter the value.';
        const def = usable.find(d => d.attribute === attribute.value);
        const row = {user_name: user.value, attribute: attribute.value, value: value.value.trim(), source: def.source, observed_at: Math.floor(Date.now() / 1000)};
        return {action: 'dap_set_attribute_value', target_type: 'user', target_name: row.user_name, summary: `Set ${row.attribute} of ${row.user_name}`, local_only: true,
            steps: [{description: `Set ${row.attribute} of ${row.user_name}`, sql: `INSERT INTO ${dapTable('dap_user_attributes')} (user_name, attribute, value, source, observed_at) FORMAT JSONEachRow\n${JSON.stringify(row)}`}],
            audit_details: {attribute: row.attribute},
            warning: 'Rules use the new value at the next deployment or reconciliation, not immediately.'};
    });
}

/// --- Policy Rules ---

async function dapLoadRules() {
    const [rows, classifications] = await Promise.all([
        /// The aliases differ from the column names: an alias named like a column would replace it inside the other aggregates.
        adminRows(`SELECT rule_id, max(revision) AS last_revision, argMax(name, revision) AS last_name, argMax(spec, revision) AS last_spec,
            argMax(enabled, revision) AS last_enabled, argMax(deleted, revision) AS last_deleted, argMax(created_by, revision) AS last_created_by,
            formatDateTime(max(created_at), '%Y-%m-%d %H:%i:%S', 'UTC') AS last_created_at
            FROM ${dapTable('dap_rules')} GROUP BY rule_id ORDER BY last_name`),
        adminRows(`SELECT database, table, column, label FROM ${dapTable('dap_classifications')} FINAL WHERE NOT deleted`),
    ]);
    return rows.map(r => ({rule_id: r.rule_id, revision: r.last_revision, name: r.last_name, spec: JSON.parse(r.last_spec), enabled: r.last_enabled, deleted: r.last_deleted,
        created_by: r.last_created_by, created_at: r.last_created_at, classifications}));
}

/// Everything a plan needs: rules, attributes, classifications, ownership, and the observed access entities.
async function dapLoadPlanState() {
    const [rules, attrs, owned, access, deployments] = await Promise.all([dapLoadRules(), dapLoadAttributeState(),
        adminRows(`SELECT key, rule_id, revision FROM ${dapTable('dap_owned')} FINAL WHERE NOT deleted`), dapLoadAccess(),
        adminRows(`SELECT deployment_id, toString(kind) AS kind, scope, rules, steps, toString(result) AS result, verification, created_by,
            formatDateTime(created_at, '%Y-%m-%d %H:%i:%S', 'UTC') AS created_at FROM ${dapTable('dap_deployments')} ORDER BY created_at DESC LIMIT 50`)]);
    const users = access.users.map(u => u.name);
    const {desired, rejected, index} = dapDesired(rules, attrs.definitions, attrs.values, attrs.classifications, users, owned, Date.now() / 1000);
    return {rules, attrs, owned, access, deployments, desired, rejected, index};
}

const RULE_KINDS = {role_membership: 'Grant a role', row_filter: 'Filter rows by an attribute', column_clearance: 'Columns of a label need a clearance'};

function ruleSummary(spec) {
    const selector = (spec.selector || []).map(c => `${c.attribute} ∈ {${c.values.join(', ')}}`).join(' and ') || 'every user with the attributes';
    if (spec.kind === 'role_membership') return `Users with ${selector} get the role ${spec.role}.`;
    if (spec.kind === 'row_filter') return `Users with ${selector} read the rows of ${spec.database}.${spec.table} where ${spec.column} equals their ${spec.attribute}.`;
    if (spec.kind === 'column_clearance') return `Users with ${selector} read the ${spec.label} columns only when ${spec.attribute} ∈ {${(spec.values || []).join(', ')}}.`;
    return spec.kind;
}

    const body = h('div', {});

            + 'made outside the platform, so this is not deny-overrides. Rules on attributes evaluated per request are refused, not approximated with permanent grants. '
            + 'Every change is a new revision with its author.'),
        h('div', {className: 'actions-row'}, button('New rule', () => ruleDialog(null), {className: 'small primary', disabled: !session.admin.can.write_dap_rules})),
        body));
    loadInto(page, body, dapLoadPlanState, state => {
        const verdict = rule => {
            const rejected = state.rejected.find(r => r.rule.rule_id === rule.rule_id);
            if (rejected) return badge('Not representable', 'bad', rejected.problem);
            if (!rule.enabled) return badge('Disabled');
            const d = state.desired.find(x => x.rule.rule_id === rule.rule_id);
            return badge(`${d.matched.length} users`, 'ok', `${d.excluded.length} excluded`);
        };
        return [dataTable([
            {title: 'Rule', render: r => [h('strong', {}, r.name), h('div', {className: 'note'}, `${RULE_KINDS[r.spec.kind] || r.spec.kind}; revision ${r.revision} by ${r.created_by}, ${r.created_at} UTC`)]},
            {title: 'Business rule', render: r => ruleSummary(r.spec)},
            {title: 'Status', render: r => r.deleted ? badge('Deleted') : verdict(r)},
            {title: '', render: r => r.deleted ? null : h('span', {className: 'actions-row'},
                button('Explain', () => explainRule(state, r), {className: 'small'}),
                button('Edit', () => ruleDialog(r), {className: 'small', disabled: !session.admin.can.write_dap_rules}),
                button(r.enabled ? 'Disable' : 'Enable', () => reviewPlan(ruleRevisionPlan(r, {enabled: !r.enabled}, r.enabled ? 'Disable' : 'Enable')), {className: 'small', disabled: !session.admin.can.write_dap_rules}),
                button('Delete', () => reviewPlan(ruleRevisionPlan(r, {deleted: true, enabled: false}, 'Delete')), {className: 'small', disabled: !session.admin.can.write_dap_rules}))},
        ], state.rules, 'No rules yet.', 'Rules')];
    });
}

function ruleRevisionPlan(rule, changes, verb) {
    const row = {rule_id: rule.rule_id, revision: rule.revision + 1, name: rule.name, spec: JSON.stringify(rule.spec), enabled: rule.enabled, deleted: false, note: verb, ...changes};
    return {action: 'dap_rule_revision', target_type: 'policy_rule', target_name: rule.name, summary: `${verb} the rule ${rule.name} (revision ${row.revision})`, local_only: true,
        steps: [{description: `${verb} the rule: revision ${row.revision}`, sql: `INSERT INTO ${dapTable('dap_rules')} (rule_id, revision, name, spec, enabled, deleted, note) FORMAT JSONEachRow\n${JSON.stringify(row)}`}],
        warning: 'Nothing changes on the server until the rules are deployed (Policy Deployments) or reconciled by the access policy worker.'};
}

/// Business rule → resolved attributes → generated controls → target nodes → verification result.
function explainRule(state, rule) {
    const d = state.desired.find(x => x.rule.rule_id === rule.rule_id);
    const rejected = state.rejected.find(r => r.rule.rule_id === rule.rule_id);
    const owned = new Set(state.owned.map(o => o.key));
    const have = dapObservedKeys(state.access);
    const last = state.deployments.find(dep => dep.kind !== 'verify' && JSON.parse(dep.rules || '[]').some(r => r.rule_id === rule.rule_id));
    openDialog(`Rule: ${rule.name}`, [
        h('h3', {}, 'Business rule'), paragraph(ruleSummary(rule.spec)),
        rejected ? h('div', {className: 'message error'}, `Not representable with native controls: ${rejected.problem}`) : [
            h('h3', {}, 'Resolved attributes'),
            dataTable([{title: 'User', render: m => m.user}, {title: 'Values', render: m => Object.entries(m.values).map(([k, v]) => `${k} = ${v}`).join(', ')}],
                d ? d.matched : [], 'No user matches.', 'Matched users'),
            d && d.excluded.length ? dataTable([{title: 'Excluded user', render: e => e.user}, {title: 'Why', render: e => e.reason},
                {title: 'Effect', render: e => e.hold ? 'Keeps what was provisioned' : (e.in_scope && rule.spec.kind === 'row_filter' ? 'Sees no row (fail closed)' : 'Gets nothing from this rule')}],
            d.excluded, '', 'Excluded users') : null,
            h('h3', {}, 'Generated controls'),
            dataTable([{title: 'Entity', render: e => h('code', {}, e.key)}, {title: 'Detail', render: e => e.kind === 'row_policy' ? `${e.filter} for ${e.users.join(', ')}` : ''},
                {title: 'On this server', render: e => have.has(e.key) ? (owned.has(e.key) ? badge('Deployed', 'ok') : badge('Exists, not owned', 'warn')) : badge('Not deployed', 'bad')}],
            d ? d.entities : [], 'None.', 'Generated controls'),
            d && d.notes.length ? h('ul', {}, d.notes.map(n => h('li', {}, n))) : null,
            h('h3', {}, 'Target nodes and verification'),
            last ? kvList([['Last deployment', `${last.created_at} UTC by ${last.created_by}: ${last.result}`], ['Scope', last.scope || `${session.hostname} only`],
                ['Verification', last.verification || 'Not verified']]) : paragraph('Never deployed.'),
        ],
    ], [button('Close', closeDialog, {className: 'primary'})]);
}

async function ruleDialog(existing) {
    let state;
    try {
        [state] = await Promise.all([dapLoadPlanState()]);
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog('Rule', [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const spec = existing ? existing.spec : {kind: 'role_membership', selector: [], on_stale: 'revoke', exceptions: []};
    const user_attrs = state.attrs.definitions.filter(d => d.category === 'user');
    const name = h('input', {type: 'text', autocomplete: 'off', value: existing ? existing.name : ''});
    const kind = select(Object.entries(RULE_KINDS), spec.kind);
    const selector = h('textarea', {rows: 2, spellcheck: false, className: 'code',
        value: (spec.selector || []).map(c => `${c.attribute} = ${c.values.join(', ')}`).join('\n'), placeholder: 'department = Finance\nemployment_status = active'});
    const role = select([['', 'Choose a role'], ...state.access.roles.map(r => [r.name, r.name])], spec.role || '');
    const pick = {database: spec.database || '', table: spec.table || ''};
    const picker = dapObjectPicker(await dapDatabases(), pick, () => fillColumns());
    const column = select([], spec.column || '');
    const fillColumns = async () => {
        const rows = pick.database && pick.table ? await adminRows('SELECT name FROM system.columns WHERE database = {db:String} AND table = {t:String} ORDER BY position', {db: pick.database, t: pick.table}) : [];
        column.replaceChildren(...rows.map(r => h('option', {value: r.name, selected: r.name === spec.column}, r.name)));
    };
    const attribute_options = [['', 'Choose an attribute'], ...user_attrs.map(d => [d.attribute, d.attribute])];
    const attribute = select(attribute_options, spec.kind === 'row_filter' ? spec.attribute || '' : '');
    const clearance = select(attribute_options, spec.kind === 'column_clearance' ? spec.attribute || '' : '');
    const labels = [...new Set(state.attrs.classifications.map(c => c.label))];
    const label = select([['', 'Choose a label'], ...labels.map(l => [l, l])], spec.label || '');
    const values = h('input', {type: 'text', autocomplete: 'off', value: (spec.values || []).join(', '), placeholder: 'secret, top_secret'});
    const on_stale = select([['revoke', 'Revoke what the rule gave (fail closed)'], ['keep', 'Keep what was provisioned until the value is fresh again']], spec.on_stale || 'revoke');
    const exceptions = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, value: (spec.exceptions || []).join(', '), placeholder: 'users the rule never provisions'});
    const enabled = checkbox('Enabled', existing ? existing.enabled : true);
    const groups = {
        role_membership: [adminField('Role', role, 'An existing role. The rule grants it; it never changes the role\'s privileges.')],
        row_filter: [adminField('Database', picker.database), adminField('Table', picker.table), adminField('Column', column),
            adminField('Attribute', attribute, 'Each user reads the rows whose column equals the user\'s value. Users in scope without a fresh value see no row.')],
        column_clearance: [adminField('Label', label), adminField('Clearance attribute', clearance), adminField('Values that clear', values)],
    };
    const group_boxes = Object.fromEntries(Object.entries(groups).map(([k, fields]) => [k, h('div', {}, fields)]));
    const sync = () => {
        for (const [k, box] of Object.entries(group_boxes)) box.hidden = k !== kind.value;
    };
    kind.addEventListener('change', sync);
    await picker.ready;
    await fillColumns();
    sync();
    formDialog(existing ? `Edit the rule ${existing.name}` : 'New policy rule', [
        adminField('Name', name), adminField('Kind', kind),
        adminField('Users', selector, `One condition per line: attribute = value, value. All must hold. User attributes: ${user_attrs.map(d => d.attribute).join(', ') || 'none defined'}.`),
        ...Object.values(group_boxes),
        adminField('Missing or stale attribute', on_stale), adminField('Exceptions', exceptions, 'Comma-separated user names.'), enabled.element,
    ], 'Review', () => {
        if (!name.value.trim()) return 'Enter a name.';
        const conditions = [];
        for (const line of selector.value.split('\n').map(l => l.trim()).filter(Boolean)) {
            const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
            if (!match) return `Write each condition as attribute = value, value: ${line}`;
            conditions.push({attribute: match[1], values: match[2].split(',').map(v => v.trim()).filter(Boolean)});
        }
        const next = {kind: kind.value, selector: conditions, on_stale: on_stale.value, exceptions: exceptions.value.split(',').map(s => s.trim()).filter(Boolean)};
        if (kind.value === 'role_membership') next.role = role.value;
        if (kind.value === 'row_filter') Object.assign(next, {database: pick.database, table: pick.table, column: column.value, attribute: attribute.value});
        if (kind.value === 'column_clearance') Object.assign(next, {label: label.value, attribute: clearance.value, values: values.value.split(',').map(v => v.trim()).filter(Boolean)});
        const problem = dapRuleProblem(next, state.attrs.definitions);
        if (problem) return `This rule cannot be represented with native controls: ${problem}`;
        const rule_id = existing ? existing.rule_id : crypto.randomUUID();
        const row = {rule_id, revision: existing ? existing.revision + 1 : 1, name: name.value.trim(), spec: JSON.stringify(next), enabled: enabled.input.checked, deleted: false,
            note: existing ? 'edited' : 'created'};
        const preview = dapRuleEntities({rule_id, spec: next}, state.access.users.map(u => u.name), state.index, state.attrs.classifications,
            new Set(state.owned.filter(o => o.rule_id === rule_id).map(o => o.key)));
        return {action: 'dap_rule_revision', target_type: 'policy_rule', target_name: row.name, summary: `${existing ? 'Change' : 'Create'} the rule ${row.name} (revision ${row.revision})`,
            local_only: true, steps: [{description: `Save revision ${row.revision}: ${ruleSummary(next)}`,
                sql: `INSERT INTO ${dapTable('dap_rules')} (rule_id, revision, name, spec, enabled, deleted, note) FORMAT JSONEachRow\n${JSON.stringify(row)}`}],
            warning: `Resolved now: ${preview.matched.length} users matched (${preview.matched.map(m => m.user).join(', ') || 'none'}), ${preview.excluded.length} excluded; `
                + `${preview.entities.length} generated controls. Nothing changes on the server until the rules are deployed.`};
    });
}

function deploymentsView(state, page) {
    const restore = checkbox('Restore entities that were removed outside the platform', false);
    const preview = h('div', {});
    const draw = () => {
        const plan = dapPlan(state.desired, state.access, state.owned, session.admin.scope, restore.input.checked);
        const unscoped = [];

            const scoped = new Set([...d.matched.map(m => m.user), ...d.excluded.filter(e => e.in_scope).map(e => e.user)]);

                && dapColumnAccess(state.access.grants, state.access.role_grants, state.access.tree, {type: 'user', name: user}, 'SELECT', database, table, [d.rule.spec.column])[0].allowed_at_login
                && dapRowFilter(state.access.policies, database, table, user, dapLoginRoles(state.access.role_grants, user)).outcome !== 'filtered');
            if (readers.length) unscoped.push(`${database}.${table} (rule "${d.rule.name}"): ${readers.join(', ')}`);
        }

        preview.replaceChildren(...[

                dapPlan(state.desired, state.access, state.owned, session.admin.scope, restore.input.checked))), {className: 'primary', disabled: !plan.steps.length || !session.admin.can.write_dap_deploy}),
                button('Verify', () => verifyDeployment(state), {className: 'small', disabled: !session.admin.can.write_dap_deploy})),

                {title: '', render: c => c.kind === 'exists-not-owned' ? button('Adopt', () => reviewPlan(adoptPlan(c)), {className: 'small', disabled: !session.admin.can.write_dap_deploy}) : null}],
            plan.conflicts, '', 'Conflicts')] : null,
            plan.removed_outside.length ? [h('h3', {}, 'Removed outside the platform'), h('ul', {}, plan.removed_outside.map(r => h('li', {}, r.message)))] : null,
            state.rejected.length ? [h('h3', {}, 'Rules not deployed'), h('ul', {}, state.rejected.map(r => h('li', {}, `${r.rule.name}: ${r.problem}`)))] : null,
            unscoped.length ? [h('h3', {}, 'Readers outside the rules'), paragraph('Users who can read a table filtered by a rule, are not in the rule\'s scope, '
                + 'and have no other policy on it: they see every row. Add them to a rule or a policy, or revoke their SELECT.'),
                h('ul', {}, unscoped.map(t => h('li', {}, t)))] : null,

                + 'ClickHouse with their own credentials and use grants made outside the platform until their account is suspended (Users page) or dropped.')] : null,
        ].flat(Infinity).filter(Boolean));
    };
    restore.input.addEventListener('change', draw);
    draw();
    return [
        h('div', {className: 'box'}, h('h2', {}, 'Deploy the rules'),
            paragraph('The plan brings this server, or the cluster chosen at the top, to the desired state of every enabled rule: it creates and removes only entities the '
                + 'platform owns (recorded in dap_owned), and leaves grants made outside of it alone. Statements are idempotent: deploying again repairs a partial '
                + 'deployment. The access policy worker runs the same plan on a schedule, so attribute changes take effect within its interval.'),
            kvList([['Observed', `${state.access.observed_at} UTC on ${session.hostname}`], ['Scope', session.admin.scope ? `ON CLUSTER ${session.admin.scope}` : `${session.hostname} only`],
                ['Rules', `${state.rules.filter(r => r.enabled && !r.deleted).length} enabled, ${state.rejected.length} not representable`]]),

                {title: 'Scope', render: d => d.scope || 'This server'},

/// A deployment plan: the statements, then the ownership and deployment records, written after the statements
/// from the outcome of each step, so that only applied changes become owned.
function deployPlan(state, plan) {
    const deployment_id = crypto.randomUUID();
    const scope = session.admin.scope;
    const rules = state.desired.map(d => ({rule_id: d.rule.rule_id, revision: d.rule.revision, name: d.rule.name}));
    const steps = plan.steps.filter(s => s.sql).map(s => ({description: s.description, sql: s.sql, plan_step: s}));
    const forgotten = plan.steps.filter(s => !s.sql);
    return {action: 'dap_deploy', target_type: 'data_access', target_name: scope || session.hostname, summary: `Deploy ${rules.length} policy rules (${steps.length} changes)`,
        steps, local_only: !scope, correlation_id: deployment_id, audit_details: {deployment_id, rules},
        warning: forgotten.length ? `${forgotten.length} owned entities no longer exist and are forgotten.` : null,
        after: outcome => recordDeployment(deployment_id, 'deploy', scope, rules, steps, forgotten, outcome),
        result_extra: () => paragraph('Verify the deployment to check the result per user, including alternative grants and running sessions.')};
}

async function recordDeployment(deployment_id, kind, scope, rules, steps, forgotten, outcome) {
    const owned_rows = [];
    outcome.steps.forEach((record, i) => {
        const step = steps[i].plan_step;
        const applied = record.status === 'ok' || record.status === 'partial';
        if (!applied) return;
        const rule = rules.find(r => r.rule_id === step.rule_id) || {revision: 0};
        owned_rows.push({key: step.key, rule_id: step.rule_id, revision: rule.revision, deployment_id, deleted: step.op === 'remove'});
    });
    for (const step of forgotten) owned_rows.push({key: step.key, rule_id: step.rule_id, revision: 0, deployment_id, deleted: true});
    const result = outcome.result === 'success' ? 'success' : outcome.result;
    const statements = [];
    if (owned_rows.length) statements.push(`INSERT INTO ${dapTable('dap_owned')} (key, rule_id, revision, deployment_id, deleted) FORMAT JSONEachRow\n${owned_rows.map(r => JSON.stringify(r)).join('\n')}`);
    statements.push(`INSERT INTO ${dapTable('dap_deployments')} (deployment_id, kind, scope, rules, steps, result, verification) FORMAT JSONEachRow\n`
        + JSON.stringify({deployment_id, kind, scope, rules: JSON.stringify(rules), result,
            steps: JSON.stringify(outcome.steps.map((r, i) => ({description: r.description, key: steps[i].plan_step.key, status: r.status, error: r.error || '', hosts: r.hosts || null}))),
            verification: ''}));
    for (const sql of statements) await adminText(sql);
}

function adoptPlan(conflict) {
    const row = {key: conflict.key, rule_id: conflict.rule_id, revision: 0, deployment_id: 'adopted', deleted: false};
    return {action: 'dap_adopt', target_type: 'data_access', target_name: conflict.key, summary: `Adopt ${conflict.key}`, local_only: true,
        steps: [{description: `Record ${conflict.key} as owned by the platform`, sql: `INSERT INTO ${dapTable('dap_owned')} (key, rule_id, revision, deployment_id, deleted) FORMAT JSONEachRow\n${JSON.stringify(row)}`}],
        warning: 'The platform will change or remove this entity as the rules require, although it was created outside of it.'};
}

/// Checks the deployed state per rule and user: generated entities present, revoked users without the access
/// through other grants, and queries still running for the affected users. Recorded as a `verify` deployment.
async function verifyDeployment(state) {
    openDialog('Verify the deployment', [loadingBox('Checking…')], null);
    const body = $('admin-dialog').querySelector('.dialog-body');
    try {
        const access = await dapLoadAccess();
        const have = dapObservedKeys(access);
        const results = [];
        for (const d of state.desired) {
            for (const e of d.entities) results.push({rule: d.rule.name, check: e.key, state: have.has(e.key) ? 'present' : 'missing'});
            /// Users known to the identity sources whom the rule does not provision: revocation is complete only
            /// when none of them keeps the access through another grant.
            const provisioned = new Set(d.entities.filter(e => e.kind === 'role_grant').map(e => e.user));
            const others = Object.keys(state.index).filter(user => !provisioned.has(user) && access.users.some(u => u.name === user));
            if (d.rule.spec.kind === 'column_clearance') {
                const labeled = d.rule.classifications.filter(c => c.label === d.rule.spec.label);
                for (const user of others) {
                    for (const c of labeled) {
                        const m = dapColumnAccess(access.grants, access.role_grants, access.tree, {type: 'user', name: user}, 'SELECT', c.database, c.table, [c.column])[0];
                        if (m.allowed_with_roles) results.push({rule: d.rule.name, check: `${user} still reads ${c.database}.${c.table}.${c.column}`, state: 'alternative access',
                            detail: m.sources.filter(s => !s.revoked).map(s => `${s.row.access_type} ON ${grantTargetText(s.row)}${s.grantee.path.length ? ` via ${s.grantee.path.join(' → ')}` : ''}`).join('; ')});
                    }
                }
            }
            if (d.rule.spec.kind === 'role_membership') {
                for (const user of others) {
                    if (dapAllRoles(access.role_grants, user).includes(d.rule.spec.role)) results.push({rule: d.rule.name, check: `${user} still has ${d.rule.spec.role}`, state: 'alternative access', detail: 'Granted outside the platform'});
                }
            }
        }
        const affected = Object.keys(state.index);
        const running = affected.length && session.admin.can.read_processes
            ? await adminRows('SELECT user, count() AS queries FROM system.processes WHERE user IN {users:Array(String)} GROUP BY user', {users: arrayParam(affected)}) : [];
        for (const r of running) results.push({rule: '—', check: `${r.user} has ${r.queries} running queries`, state: 'running', detail: 'Grants are checked when a query starts: running queries finish with the access they started with.'});
        const ok = results.every(r => r.state === 'present');
        const verification = {checked_at: access.observed_at, host: session.hostname, scope: session.admin.scope || 'local', results,
            coverage: session.admin.scope ? `Checked on ${session.hostname} only; other servers of ${session.admin.scope} are covered by the per-server results of the deployment.` : 'This server.'};
        await adminText(`INSERT INTO ${dapTable('dap_deployments')} (deployment_id, kind, scope, rules, steps, result, verification) FORMAT JSONEachRow\n`
            + JSON.stringify({deployment_id: crypto.randomUUID(), kind: 'verify', scope: session.admin.scope, rules: JSON.stringify(state.desired.map(d => ({rule_id: d.rule.rule_id, revision: d.rule.revision, name: d.rule.name}))),
                steps: '[]', result: ok ? 'success' : 'partial', verification: JSON.stringify(verification)}));
        body.replaceChildren(h('div', {className: `message ${ok ? 'info' : 'warning'}`}, ok ? 'Every generated control is present, and no excluded user keeps the access elsewhere.'
            : 'Some controls are missing, or excluded users keep the access through other grants: revocation is not complete.'),
        dataTable([{title: 'Rule', render: r => r.rule}, {title: 'Check', render: r => h('code', {}, r.check)},
            {title: 'State', render: r => badge(r.state, r.state === 'present' ? 'ok' : 'bad')}, {title: 'Detail', render: r => r.detail || ''}], results, 'Nothing to check.', 'Verification'),
        h('div', {className: 'dialog-actions'}, button('Close', closeDialog, {className: 'primary'})));
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) body.replaceChildren(errorBox(e), h('div', {className: 'dialog-actions'}, button('Close', closeDialog)));
    }
}

/// --- Administration: Backup & Restore ---

/// Backup and restore run in the server (`BACKUP ... ASYNC`, `RESTORE ... ASYNC`): they continue when the
/// browser closes, and `system.backups` shows them while the server runs. The console keeps its own records
/// in the admin database, because `system.backups` is lost on restart and `system.backup_log` is a log of one
/// server, kept only as long as its TTL:
/// - `backup_destinations`: approved destinations. S3 credentials are in a named collection on the server;
///   the row only names it.
/// - `backup_schedules`: automated backups, run by the backup worker (`utils/web-console/backup_worker.mjs`).
/// - `backup_operations`: one row per submitted operation, written once. The platform operation ID is also the
///   native `id` of the BACKUP or RESTORE, so the two can always be matched.
/// - `backup_events`: state changes and check results of operations, appended by the console and the worker.
/// The server fills in who wrote each row, as for the audit log.
const BACKUP_TABLES = {
    backup_destinations: () => `(
    id String,
    name String,
    description String,
    type Enum8('disk' = 1, 's3' = 2),
    disk String,
    named_collection String,
    endpoint String,
    bucket String,
    prefix String,
    credential_ref String,
    allow_http Bool DEFAULT false,
    enabled Bool,
    allowed_databases Array(String),
    test_result String,
    tested_at Nullable(DateTime64(3, 'UTC')),
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY id`,
    backup_schedules: () => `(
    id String,
    name String,
    enabled Bool,
    destination_id String,
    databases Array(String),
    tables Array(String),
    structure_only Bool,
    strategy Enum8('full' = 1, 'incremental' = 2),
    full_every UInt16,
    frequency Enum8('hourly' = 1, 'daily' = 2, 'weekly' = 3),
    minute UInt8,
    hour UInt8,
    weekday UInt8,
    timezone String,
    keep_chains UInt16,
    on_missing_base Enum8('fail' = 1, 'full' = 2),
    verify Bool,
    notify_ref String,
    copy_destination_id String DEFAULT '',
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY id`,
    backup_operations: () => `(
    op_id String,
    kind Enum8('backup' = 1, 'restore' = 2, 'verify' = 3, 'delete' = 4, 'test' = 5, 'bundle' = 6, 'bundle_restore' = 7),
    requested_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    requested_by String MATERIALIZED currentUser(),
    server String,
    destination_id String,
    artifact String,
    scope String,
    strategy String,
    base_op_id String,
    schedule_id String,
    scheduled_for Nullable(DateTime64(3, 'UTC')),
    target String,
    parameters String,
    expected String,
    CONSTRAINT requested_by_is_writer CHECK requested_by = currentUser()
)
ENGINE = MergeTree ORDER BY op_id`,
    backup_events: () => `(
    op_id String,
    at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    recorded_by String MATERIALIZED currentUser(),
    kind Enum8('state' = 1, 'check' = 2),
    state Enum8('queued' = 1, 'running' = 2, 'succeeded' = 3, 'failed' = 4, 'unknown' = 5, 'cancelled' = 6, 'deleted' = 7, 'passed' = 8),
    name String,
    native_id String,
    query_id String,

    total_size UInt64,

    CONSTRAINT recorded_by_is_writer CHECK recorded_by = currentUser()
)
ENGINE = MergeTree ORDER BY (op_id, at)`,
    /// S3 endpoints allowed in the console, in addition to `web_console.backup_s3_endpoints` of the server configuration.
    backup_endpoints: () => `(
    endpoint String,
    note String,
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),

ENGINE = ReplacingMergeTree(updated_at) ORDER BY endpoint`,

const BACKUP_TABS = [['overview', 'Overview'], ['backups', 'Backups'], ['server', 'Server state'], ['restore', 'Restore'], ['schedules', 'Schedules'],
    ['destinations', 'Destinations'], ['operations', 'Operations'], ['verification', 'Recovery verification']];

const TERMINAL_STATES = ['succeeded', 'failed', 'cancelled', 'deleted'];

const STATE_BADGES = {
    queued: ['Queued', ''], running: ['Running', 'warn'], succeeded: ['Succeeded', 'ok'], failed: ['Failed', 'bad'],
    unknown: ['Unknown', 'warn'], cancelled: ['Cancelled', ''], deleted: ['Deleted', ''], passed: ['Passed', 'ok'],
};

function stateBadge(state, title) {
    const [text, className] = STATE_BADGES[state] || [state, ''];
    return badge(text, className, title);
}

function formatBytes(bytes) {
    if (bytes === null || bytes === undefined || bytes === '') return '—';
    let value = Number(bytes);
    for (const unit of ['B', 'KiB', 'MiB', 'GiB', 'TiB']) {
        if (value < 1024 || unit === 'TiB') return `${unit === 'B' ? value : value.toFixed(1)} ${unit}`;
        value /= 1024;
    }
    return `${bytes} B`;
}

function formatSeconds(seconds) {
    if (seconds === null || seconds === undefined || Number.isNaN(seconds)) return '—';
    if (seconds < 1) return '< 1 s';
    if (seconds < 120) return `${Math.round(seconds)} s`;
    if (seconds < 7200) return `${Math.round(seconds / 60)} min`;
    return `${(seconds / 3600).toFixed(1)} h`;
}

function parseJSON(text, fallback) {
    if (!text) return fallback;
    try {
        return JSON.parse(text);
    } catch (e) {
        /// Written by another tool or truncated: show what is known.
        return fallback;
    }
}

function shortId(id) {
    return id.length > 13 ? id.slice(0, 8) : id;
}

function utcNowCompact() {
    return new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z').replace('T', '-');
}

/// A path inside a destination: letters, digits, `._-/`, no empty or `..` segments.
function backupPathError(path) {
    if (!path) return 'Enter a path.';
    if (!/^[A-Za-z0-9._\/-]+$/.test(path)) return 'Use only letters, digits, and . _ - / in paths.';
    if (path.split('/').some(segment => !segment || segment === '.' || segment === '..')) return 'Paths cannot have empty, . or .. segments.';
    return null;
}

/// The location expression of a backup: `Disk('disk', 'prefix/path')` or `S3(collection, 'path')`. The named
/// collection of an S3 destination holds the endpoint, the bucket, the prefix, and the credentials.
function backupLocationSQL(destination, artifact) {
    if (destination.type === 'disk') {
        return `Disk(${quoteString(destination.disk)}, ${quoteString(destination.prefix ? `${destination.prefix}/${artifact}` : artifact)})`;
    }
    return `S3(${quoteIdentifier(destination.named_collection)}, ${quoteString(artifact)})`;
}

function destinationLabel(destination) {
    if (!destination) return 'unknown destination';
    return destination.type === 'disk' ? `disk ${destination.disk}${destination.prefix ? `/${destination.prefix}` : ''}`
        : `${destination.endpoint}/${destination.bucket}${destination.prefix ? `/${destination.prefix}` : ''}`;
}

/// The scope of a backup: `{databases: [...], tables: [[db, table], ...], partitions: [...], structure_only,
/// access_entities, sql_objects}`. Whole databases, or tables of one database (optionally some partitions of one
/// table), plus the console's own database when chosen.
const ACCESS_ENTITY_TABLES = ['users', 'roles', 'settings_profiles', 'row_policies', 'quotas'];
/// SQL user-defined functions, workloads, and resources: kept by the server outside of any database.
const SQL_OBJECT_TABLES = ['functions', 'workloads', 'resources'];

function backupScopeSQL(scope) {
    const items = [];
    for (const db of scope.databases || []) items.push(`DATABASE ${quoteIdentifier(db)}`);
    for (const [db, table] of scope.tables || []) {
        let item = `TABLE ${quoteIdentifier(db)}.${quoteIdentifier(table)}`;
        if (scope.partitions && scope.partitions.length) item += ` PARTITIONS ${scope.partitions.map(quoteString).join(', ')}`;
        items.push(item);
    }
    if (scope.access_entities) for (const table of ACCESS_ENTITY_TABLES) items.push(`TABLE system.${table}`);
    if (scope.sql_objects) for (const table of SQL_OBJECT_TABLES) items.push(`TABLE system.${table}`);
    return items.join(', ');
}

function scopeText(scope) {
    const parts = [];
    if ((scope.databases || []).length) parts.push(`databases ${scope.databases.join(', ')}`);
    if ((scope.tables || []).length) parts.push(`tables ${scope.tables.map(([db, table]) => `${db}.${table}`).join(', ')}`);
    if ((scope.partitions || []).length) parts.push(`partitions ${scope.partitions.join(', ')}`);
    if (scope.access_entities) parts.push('access entities');
    if (scope.sql_objects) parts.push('functions, workloads, resources');
    if (scope.structure_only) parts.push('structure only');
    return parts.join('; ') || '—';
}

/// Server state that `BACKUP` cannot reach: files on the host, and SQL objects it does not back up in this version.
/// Every backup lists them, so that nobody takes a backup for a copy of the whole server.
const BACKUP_NEVER_INCLUDED = [
    'The server configuration: config.xml, config.d, users.xml, users.d',
    'Secrets in files: TLS certificates and keys, keys of encrypted disks, passwords in the configuration',
    'Named collections, including the credentials of S3 destinations',
    "Keeper's own state (RESTORE rebuilds the Keeper metadata of replicated tables)",
    'Executable UDF scripts, dictionary source files, and format schemas',
    "The cluster agent's key and the secrets of the clusters it created",
];

/// What a backup contains, and what it leaves out, from its recorded scope. Backups made before a part of the
/// scope existed have no flag for it, and are shown without it, which is what they contain.
function backupContents(scope) {
    const admin_db = session.admin.db;
    const databases = scope.databases || [];
    const data = scope.structure_only ? 'schemas only' : 'schemas and data';
    const contains = [];
    const user_dbs = databases.filter(db => db !== admin_db);
    if (user_dbs.length) contains.push(`Databases ${user_dbs.join(', ')} (${data})`);
    if ((scope.tables || []).length) {
        contains.push(`Tables ${scope.tables.map(([db, table]) => `${db}.${table}`).join(', ')}${(scope.partitions || []).length ? `, partitions ${scope.partitions.join(', ')}` : ''} (${data})`);
    }
    if (admin_db && databases.includes(admin_db)) contains.push(`The console's tables in ${admin_db}: audit log, policies, backup and cluster records`);
    if (scope.access_entities) contains.push('Users, roles, settings profiles, row policies, and quotas created with SQL');
    if (scope.sql_objects) contains.push('SQL user-defined functions, workloads, and resources');
    const missing = [];
    if (!scope.access_entities) missing.push('Users, roles, settings profiles, row policies, and quotas');
    if (!scope.sql_objects) missing.push('SQL user-defined functions, workloads, and resources');
    if (admin_db && !databases.includes(admin_db)) missing.push(`The console's tables in ${admin_db}`);
    return {contains, missing: [...missing, ...BACKUP_NEVER_INCLUDED]};
}

function backupContentsDetails(scope) {
    const {contains, missing} = backupContents(scope);
    return h('details', {className: 'contents'}, h('summary', {}, 'Contents'),
        h('div', {className: 'note'}, 'Contains:'), h('ul', {}, contains.map(text => h('li', {}, text))),
        h('div', {className: 'note'}, 'Not in this backup:'), h('ul', {}, missing.map(text => h('li', {}, text))));
}

/// The source databases a scope reads, which is also the set of `Backup` engine databases needed to open it.
function scopeDatabases(scope) {
    return [...new Set([...(scope.databases || []), ...(scope.tables || []).map(([db]) => db)])];
}

/// --- Backup & Restore: data ---

async function loadBackupState() {
    const db = quoteIdentifier(session.admin.db);
    /// Installations set up before second copies have no copy_destination_id: the Schedules tab offers the update.
    const schedule_copies = (await adminRows(`SELECT count() AS n FROM system.columns WHERE database = {db:String} AND table = 'backup_schedules' AND name = 'copy_destination_id'`,
        {db: session.admin.db}))[0].n > 0;
    const disks = new Map((await adminRows('SELECT name, type, is_encrypted, object_storage_type FROM system.disks').catch(e => {
        if (e instanceof AdminSessionChanged) throw e;
        return [];
    })).map(d => [d.name, d]));
    const [destinations, schedules, operations] = await Promise.all([
        adminRows(`SELECT id, name, description, toString(type) AS type, disk, named_collection, endpoint, bucket, prefix, credential_ref, allow_http, enabled,
                allowed_databases, test_result, if(tested_at IS NULL, '', formatDateTime(tested_at, '%Y-%m-%d %H:%i:%S')) AS tested_at, updated_by
            FROM ${db}.backup_destinations FINAL WHERE NOT deleted ORDER BY name`),
        adminRows(`SELECT id, name, enabled, destination_id, databases, tables, structure_only, toString(strategy) AS strategy, full_every,
                toString(frequency) AS frequency, minute, hour, weekday, timezone, keep_chains, toString(on_missing_base) AS on_missing_base, verify, notify_ref, updated_by,
                ${schedule_copies ? 'copy_destination_id' : "'' AS copy_destination_id"}
            FROM ${db}.backup_schedules FINAL WHERE NOT deleted ORDER BY name`),
        adminRows(`SELECT op_id, toString(kind) AS kind, formatDateTime(o.requested_at, '%Y-%m-%d %H:%i:%S') AS requested_at,
                toUnixTimestamp64Milli(o.requested_at) AS requested_ms, requested_by, server, destination_id, artifact, scope, strategy, base_op_id, schedule_id,
                if(o.scheduled_for IS NULL, '', formatDateTime(o.scheduled_for, '%Y-%m-%d %H:%i:%S')) AS scheduled_for, target, parameters, expected
            FROM ${db}.backup_operations AS o ORDER BY o.requested_at DESC LIMIT 1 BY op_id LIMIT 2000`),
    ]);
    const events = operations.length ? await adminRows(`SELECT op_id, formatDateTime(e.at, '%Y-%m-%d %H:%i:%S') AS at, toUnixTimestamp64Milli(e.at) AS at_ms, recorded_by,
            toString(kind) AS kind, toString(state) AS state, name, native_id, query_id, error, num_files, total_size, details
        FROM ${db}.backup_events AS e WHERE op_id IN {ops:Array(String)} ORDER BY e.at`, {ops: arrayParam(operations.map(op => op.op_id))}) : [];
    const worker = (await adminRows(`SELECT op_id, formatDateTime(max(e.at), '%Y-%m-%d %H:%i:%S') AS last_at, dateDiff('second', max(e.at), now64(3)) AS age,
            argMax(details, e.at) AS details
        FROM ${db}.backup_events AS e WHERE op_id LIKE 'worker:%' AND e.at > now64(3) - INTERVAL 7 DAY GROUP BY op_id ORDER BY max(e.at) DESC`).catch(e => {
        if (e instanceof AdminSessionChanged) throw e;
        return [];
    })).map(w => ({...w, details: parseJSON(w.details, {})}));
    /// Installations set up before server bundles have no such kinds of operations: the Server state tab offers the update.
    const kind_type = (await adminRows(`SELECT type FROM system.columns WHERE database = {db:String} AND table = 'backup_operations' AND name = 'kind'`,
        {db: session.admin.db}))[0];
    const bundle_kinds = !!kind_type && kind_type.type.includes("'bundle_restore'");
    const console_endpoints = session.admin.can.read_endpoints ? await adminRows(`SELECT endpoint, note, updated_by,
            formatDateTime(updated_at, '%Y-%m-%d %H:%i:%S') AS updated_at FROM ${db}.backup_endpoints FINAL WHERE NOT deleted ORDER BY endpoint`) : null;
    const by_op = new Map(operations.map(op => [op.op_id, {...op, scope: parseJSON(op.scope, {}), parameters: parseJSON(op.parameters, {}),
        expected: parseJSON(op.expected, null), target: parseJSON(op.target, {}), events: [], checks: [], state: 'queued'}]));
    for (const event of events) {
        const op = by_op.get(event.op_id);
        if (!op) continue;
        op.events.push(event);
        if (event.kind === 'state') {
            op.state = event.state;
            op.state_at = event.at;
            op.state_at_ms = Number(event.at_ms);
            if (event.native_id) op.native_id = event.native_id;
            if (event.query_id) op.query_id = event.query_id;
            if (event.error) op.error = event.error;
            if (Number(event.total_size)) op.total_size = Number(event.total_size);
            if (Number(event.num_files)) op.num_files = Number(event.num_files);
            const details = parseJSON(event.details, {});
            if (details.duration_s !== undefined) op.duration_s = details.duration_s;
            /// What the worker recorded with the last state of a server bundle or its restore.
            if (op.kind === 'bundle' || op.kind === 'bundle_restore') op.result = details;
            if (event.state === 'running' && !op.started_ms) op.started_ms = Number(event.at_ms);
            if (TERMINAL_STATES.includes(event.state) && event.state !== 'deleted') op.finished_ms = Number(event.at_ms);
            if (event.state === 'deleted') op.deleted = true;
        } else {
            op.checks.push({...event, details: parseJSON(event.details, {})});
        }
    }
    return {destinations, schedules, operations: [...by_op.values()], destinations_by_id: new Map(destinations.map(d => [d.id, d])), worker, console_endpoints, bundle_kinds, schedule_copies, disks};
}

/// The incremental chain of a backup, from the backup itself to its full base: `{chain, missing}`.
function backupChain(state, op) {
    const ops = new Map(state.operations.map(o => [o.op_id, o]));
    const chain = [op];
    let current = op;
    while (current.base_op_id) {
        const base = ops.get(current.base_op_id);
        if (!base) return {chain, missing: `the base ${current.base_op_id} has no record`};
        if (base.deleted) return {chain, missing: `the base ${shortId(base.op_id)} was deleted`};
        if (base.state !== 'succeeded') return {chain, missing: `the base ${shortId(base.op_id)} did not succeed`};
        chain.push(base);
        if (chain.length > 1000) return {chain, missing: 'the chain has a cycle'};
        current = base;
    }
    return {chain, missing: null};
}

/// Backups that depend on `op` (directly or through other incremental backups) and are not deleted.
function backupDescendants(state, op) {
    const result = [];
    const queue = [op.op_id];
    while (queue.length) {
        const id = queue.shift();
        for (const child of state.operations.filter(o => o.kind === 'backup' && o.base_op_id === id && !o.deleted && o.state !== 'failed')) {
            result.push(child);
            queue.push(child.op_id);
        }
    }
    return result;
}

/// Whether a backup can be deleted now, and why not.
function retentionBlock(state, op) {
    const descendants = backupDescendants(state, op);
    if (descendants.length) return `Required as the base of ${descendants.map(d => shortId(d.op_id)).join(', ')}.`;
    const in_use = state.operations.filter(o => ['restore', 'verify', 'bundle_restore'].includes(o.kind) && o.base_op_id === op.op_id && !TERMINAL_STATES.includes(o.state));
    if (in_use.length) return `Used by the running operation ${shortId(in_use[0].op_id)}.`;
    if (!TERMINAL_STATES.includes(op.state)) return 'The backup operation has not finished.';
    const deletion = state.operations.find(o => o.kind === 'delete' && o.base_op_id === op.op_id && !['failed', 'cancelled'].includes(o.state));
    if (deletion) return `A deletion is already requested (${shortId(deletion.op_id)}).`;
    return null;
}

/// --- Backup & Restore: reconciliation ---

const NATIVE_STATES = {
    CREATING_BACKUP: 'running', RESTORING: 'running', BACKUP_CREATED: 'succeeded', RESTORED: 'succeeded',
    BACKUP_FAILED: 'failed', RESTORE_FAILED: 'failed', BACKUP_CANCELLED: 'cancelled', RESTORE_CANCELLED: 'cancelled',
};

/// Finds the actual state of an operation that is not finished in the console's records: in `system.backups`
/// (operations since the server started), then `system.backup_log`, then, for a backup, the artifact itself.
/// Returns an event to record, or null when nothing changed or nothing is known.
async function reconcileOperation(state, op) {
    if (TERMINAL_STATES.includes(op.state) || !['backup', 'restore', 'verify'].includes(op.kind)) return null;
    const native_id = op.native_id || op.op_id;
    const can = session.admin.can;
    let row = null;
    let source = null;
    if (can.read_system_backups) {
        const rows = await adminRows(`SELECT toString(status) AS status, error, query_id, num_files, total_size,
                dateDiff('millisecond', start_time, if(end_time > start_time, end_time, now64(6))) / 1000 AS duration_s
            FROM system.backups WHERE id = {id:String}`, {id: native_id});
        if (rows.length) {
            row = rows[0];
            source = 'system.backups';
        }
    }
    if (!row && can.read_backup_log) {
        const rows = await adminRows(`SELECT toString(status) AS status, error, query_id, num_files, total_size,
                dateDiff('millisecond', start_time, if(end_time > start_time, end_time, start_time)) / 1000 AS duration_s
            FROM system.backup_log WHERE id = {id:String} ORDER BY event_time_microseconds DESC LIMIT 1`, {id: native_id});
        if (rows.length) {
            row = rows[0];
            source = 'system.backup_log';
        }
        /// The log's last record says it is still running, but the server does not list it: the server stopped
        /// before the operation finished (the log keeps only the start). Decide from the artifact below.
        if (row && can.read_system_backups && NATIVE_STATES[row.status] === 'running') row = null;
    }
    if (row) {
        const mapped = NATIVE_STATES[row.status] || 'unknown';
        if (mapped === op.state && mapped !== 'running') return null;
        if (mapped === 'running' && op.state === 'running') return null;
        return {state: mapped, native_id, query_id: row.query_id, error: row.error ? maskSecrets(row.error.split('\n')[0]) : '',
            num_files: Number(row.num_files), total_size: Number(row.total_size),
            details: {source, duration_s: Number(row.duration_s), native_status: row.status}};
    }
    /// No record on this server. Give a fresh submission time to appear before concluding anything.
    if (Date.now() - op.requested_ms < 60000) return null;
    if (op.kind === 'backup') {
        const destination = state.destinations_by_id.get(op.destination_id);
        if (!destination) return null;
        const probe = await probeBackupArtifact(destination, op);
        if (probe.ok) {
            return {state: 'succeeded', native_id, details: {source: 'artifact', note: 'The server has no record of the operation (it may have restarted), but the backup can be opened.'}};
        }
        if (probe.not_found) {
            return {state: 'failed', native_id, error: 'The operation is not running on this server, it has no log record, and no complete backup exists at its location: it was interrupted, most likely by a server restart.',
                details: {source: 'artifact'}};
        }
        return {state: 'unknown', native_id, error: `The state cannot be determined: ${probe.error}`, details: {source: 'artifact'}};
    }
    return {state: 'unknown', native_id, error: 'The server has no record of this operation (it may have restarted). Check the target before running it again.',
        details: {source: 'none'}};
}

/// Reads rows that only add detail to a dialog: a failure is returned as `{error}` and shown there, instead
/// of failing the dialog. Never substitute a value for what could not be read.
/// For dialogs opened by a button: shows why the dialog could not be opened.
function showFailure(title) {
    return e => { if (!(e instanceof AdminSessionChanged)) openDialog(title, [errorBox(e)], [button('Close', closeDialog)]); };
}

function detailRows(sql, params) {
    return adminRows(sql, params).then(rows => ({rows}), e => {
        if (e instanceof AdminSessionChanged) throw e;
        return {rows: null, error: e.message};
    });
}

/// Settings for the console's own short reads and writes of a destination (its test and the artifact probes).
/// The server retries S3 requests of backups `backup_restore_s3_retry_attempts` times (1000 by default, with
/// backoff up to 5 seconds), so an unreachable endpoint would block them for about an hour: fail in seconds instead.
function quickCheckSettings(destination) {
    return destination.type === 's3' ? {backup_restore_s3_retry_attempts: 2} : {};
}

/// Opens a backup read-only with the `Backup` database engine, to check that it is complete and readable
/// (incremental backups also need their base). This reads the backup's metadata and lists its tables; it is
/// not a test restore. Returns `{ok, tables, not_found, error}`.
async function probeBackupArtifact(destination, op, with_counts = false) {
    const databases = scopeDatabases(op.scope);
    if (!databases.length) return {ok: false, error: 'The backup has no database in its scope (access entities only cannot be opened this way).'};
    const tables = [];
    for (const source_db of databases) {
        const name = `console_inspect_${op.op_id.replace(/[^A-Za-z0-9]/g, '').slice(0, 12)}_${Math.random().toString(36).slice(2, 8)}`;
        const create = await runQuery(session, `CREATE DATABASE ${quoteIdentifier(name)} ENGINE = Backup(${quoteString(source_db)}, ${backupLocationSQL(destination, op.artifact)})`,
            session.controller.signal, 60000, {raw: true, settings: quickCheckSettings(destination)});
        if (!create.ok) {
            const not_found = /BACKUP_NOT_FOUND|not found/i.test(create.detail || '');
            let error = maskSecrets(create.detail || create.message);
            /// After a timeout, the server may still create the database.
            if (create.kind === 'timeout') {
                const drop = await runQuery(session, `DROP DATABASE IF EXISTS ${quoteIdentifier(name)} SYNC`, session.controller.signal, 60000, {raw: true});
                if (!drop.ok) error += ` The database ${name} may remain; drop it: ${drop.detail || drop.message}`;
            }
            return {ok: false, not_found, error};
        }
        try {
            const rows = await adminRows(`SELECT name, engine, total_rows FROM system.tables WHERE database = {db:String} ORDER BY name`, {db: name});
            for (const row of rows) {
                const entry = {database: source_db, table: row.name, engine: row.engine, rows: row.total_rows === null ? null : Number(row.total_rows)};
                if (with_counts && /MergeTree|Log|Memory/.test(row.engine)) {
                    const count = await adminRows(`SELECT count() AS n FROM ${quoteIdentifier(name)}.${quoteIdentifier(row.name)}`);
                    entry.read_rows = Number(count[0].n);
                }
                tables.push(entry);
            }
        } finally {
            await runQuery(session, `DROP DATABASE IF EXISTS ${quoteIdentifier(name)}`, session.controller.signal, 60000, {raw: true});
        }
    }
    return {ok: true, tables};
}

async function recordBackupEvent(op_id, event) {
    const row = {op_id, kind: event.kind || 'state', state: event.state, name: event.name || '', native_id: event.native_id || '',
        query_id: event.query_id || '', error: maskSecrets(event.error || ''), num_files: event.num_files || 0, total_size: event.total_size || 0,
        details: JSON.stringify(event.details || {})};
    const result = await runQuery(session, `INSERT INTO ${quoteIdentifier(session.admin.db)}.backup_events (op_id, kind, state, name, native_id, query_id, error, num_files, total_size, details) FORMAT JSONEachRow\n${JSON.stringify(row)}`,
        session.controller.signal, 30000, {raw: true});
    if (!result.ok) throw new AdminQueryError(result);
}

/// Reconciles the unfinished operations, records what changed (when the user may), and writes audit records
/// for completions. Returns `{changed, errors}`: the number of operations whose state changed, and the
/// operations that could not be checked.
async function reconcileAll(state) {
    let changed = 0;
    const errors = [];
    for (const op of state.operations.filter(o => !TERMINAL_STATES.includes(o.state) && ['backup', 'restore', 'verify'].includes(o.kind))) {
        let event;
        try {
            event = await reconcileOperation(state, op);
        } catch (e) {
            if (e instanceof AdminSessionChanged) throw e;
            errors.push(`${shortId(op.op_id)}: ${e.message}`);
            continue;
        }
        if (!event) continue;
        op.state = event.state;
        op.error = event.error || op.error;
        if (event.total_size) op.total_size = event.total_size;
        if (event.details && event.details.duration_s !== undefined) op.duration_s = event.details.duration_s;
        op.reconciled_from = event.details && event.details.source;
        changed++;
        if (!session.admin.can.write_backup_events) continue;
        await recordBackupEvent(op.op_id, event);
        if (TERMINAL_STATES.includes(event.state) && session.admin.can.write_audit) {
            await writeAudit(session, {action: `${op.kind}_${event.state}`, target_type: 'backup', target_name: op.op_id,
                summary: `${op.kind === 'backup' ? 'Backup' : op.kind === 'restore' ? 'Restore' : 'Restore test'} ${shortId(op.op_id)} ${event.state}`},
            {correlation_id: op.op_id, scope: 'local', result: event.state === 'succeeded' ? 'success' : 'failure', steps: []}, event.error || '');
        }
    }
    return {changed, errors};
}

/// Reconciles the unfinished operations after the page is shown (checking an artifact can take a minute),
/// and says what changed, without re-rendering under an open dialog.
function reconcileNotice(state, page) {
    const unfinished = state.operations.filter(o => !TERMINAL_STATES.includes(o.state) && ['backup', 'restore', 'verify'].includes(o.kind));
    if (!unfinished.length) return null;
    const notice = h('div', {role: 'status', className: 'reconcile-notice'}, h('p', {className: 'note'}, h('span', {className: 'spinner'}), ` Checking ${unfinished.length} unfinished operations with the server…`));
    reconcileAll(state).then(({changed, errors}) => {
        if (!isCurrent(page)) return;
        notice.replaceChildren(
            changed ? h('div', {className: 'message'}, `The state of ${changed} operations was updated from the server. `, button('Refresh', reloadAdmin, {className: 'small'})) : null,
            errors.length ? h('div', {className: 'message warning'}, `Could not check ${errors.length} operations: ${errors.join('; ')}`) : null);
    }, e => {
        if (e instanceof AdminSessionChanged || !isCurrent(page)) return;
        notice.replaceChildren(errorBox(e, 'Checking the unfinished operations failed:'));
    });
    return notice;
}

/// --- Backup & Restore: server state (server bundles of the backup worker) ---

const BUNDLE_PROVIDERS = {
    file: ['Key file on the worker host', 'Keep a copy of the key outside this host and outside the backups, with its fingerprint: without it, no bundle can be decrypted.'],
    vault: ['HashiCorp Vault Transit', 'Vault wraps the data key of each bundle; the master key never leaves Vault. Vault must be reachable to restore.'],
    passphrase: ['Passphrase', 'Entered on the worker host for each bundle and each restore (backup_worker.mjs bundle, bundle-restore): bundles are not made from the console or on a schedule.'],
};

/// The latest heartbeat of a worker that makes server bundles, with what it reports about them.
function bundleWorker(state) {
    const worker = state.worker.find(w => w.details && w.details.bundle);
    return worker ? {...worker.details.bundle, worker: worker.op_id.slice('worker:'.length), last_at: worker.last_at, age: Number(worker.age)} : null;
}

        + 'ciphertext at a destination through a backup of its own. A restore never writes into the server: it compares a bundle with the host, or stages its files '
        + 'in a directory for an operator to apply.');

function bundleRestoreResult(op) {
    const r = op.result;
    if (op.state !== 'succeeded' || !r) return '—';
    const list = entries => h('details', {}, h('summary', {}, `${entries.length} files`),
