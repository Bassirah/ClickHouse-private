/// A backup of tables (not whole databases) is restored into existing databases: create the empty targets
/// first. Returns an error message, recorded as the failure of the operation, or null.
async function createTargetDatabases(op, backup, mapping) {
    if (!(backup.scope.tables || []).length) return null;
    for (const db of new Set((backup.scope.tables || []).map(([source]) => mapping[source]))) {
        const created = await runQuery(session, `CREATE DATABASE ${quoteIdentifier(db)}`, session.controller.signal, 60000, {raw: true, settings: {log_comment: `console-admin:${op.op_id}`}});
        if (!created.ok) {
            const error = `The target database ${db} could not be created: ${maskSecrets(created.detail || created.message)}`;
            await recordBackupEvent(op.op_id, {state: 'failed', error, details: {step: 'create target database'}});
            return error;
        }
    }
    return null;
}

/// Dropping a restore target is its own action: reviewed, typed, and audited, never part of a restore.
function dropTargetDialog(db, backup) {
    const confirm = h('input', {type: 'text', autocomplete: 'off', spellcheck: false});
    const error = h('div', {className: 'message error', hidden: true});
    openDialog(`Drop ${db}`, [paragraph(`Drops the database ${db} with all its tables and data. This is not part of the restore and cannot be undone.`),
        adminField(`Type ${db} to confirm`, confirm), error], [button('Cancel', closeDialog), button('Review', () => {
        if (confirm.value !== db) {
            error.textContent = 'The name does not match.';
            error.hidden = false;
            return;
        }
        reviewPlan({action: 'drop_restore_target', target_type: 'database', target_name: db, summary: `Drop database ${db} before restoring backup ${shortId(backup.op_id)}`,
            danger: true, confirm_text: 'Drop', local_only: true, steps: [{description: `Drop database ${db}`, sql: `DROP DATABASE ${quoteIdentifier(db)} SYNC`}]});
    }, {className: 'danger primary'})]);
}

async function startRestore(state, backup, destination, w) {
    const op = {op_id: crypto.randomUUID(), kind: 'restore', destination_id: backup.destination_id, artifact: backup.artifact, scope: {...backup.scope, access_entities: w.access_entities, sql_objects: w.sql_objects},
        base_op_id: backup.op_id, target: w.mapping,
        parameters: {target_version: session.version, structure_only: w.structure_only, access_entities: w.access_entities, sql_objects: w.sql_objects}};
    openDialog('Starting the restore', [loadingBox('Submitting…')], null);
    try {
        await recordOperation(op);
        const created = await createTargetDatabases(op, backup, w.mapping);
        if (created) {
            openDialog('Restore not started', [h('div', {className: 'message error'}, created)], [button('Close', closeDialog)], {onclose: reloadAdmin});
            return;
        }
        const event = await submitOperation(op, restoreSQL(backup, destination, w.mapping, {access_entities: w.access_entities, sql_objects: w.sql_objects, structure_only: w.structure_only, op_id: op.op_id}),
            {action: 'submit_restore', summary: `Restore backup ${shortId(backup.op_id)} into ${Object.values(w.mapping).join(', ')}`});
        if (event.state !== 'running') {
            openDialog('Restore not started', [h('div', {className: 'message error'}, event.error)], [button('Close', closeDialog)], {onclose: reloadAdmin});
            return;
        }
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog('Restore not started', [errorBox(e)], [button('Close', closeDialog)], {onclose: reloadAdmin});
        return;
    }
    followOperation('Restore', op, async (final, details) => {
        if (final.state !== 'succeeded' || w.structure_only) return;
        details.append(loadingBox('Validating the restored data…'));
        const checks = await validateRestore(state, backup, w.mapping, op);
        details.lastChild.remove();
        details.append(checksSummary(checks));
    });
}

function clusterTable(name) {
    return `${quoteIdentifier(session.admin.db)}.${quoteIdentifier(name)}`;
}

function insertStep(table, row, description) {
    return {description, sql: `INSERT INTO ${clusterTable(table)} (${Object.keys(row).join(', ')}) FORMAT JSONEachRow\n${JSON.stringify(row)}`};
}

/// The statements that submit an operation: the operation, its queued state, and optionally a new revision.
function operationSteps(cluster, kind, parameters, spec, note) {
    const op_id = crypto.randomUUID();
    const steps = [];
    let revision = cluster.revision;
    if (spec) {
        revision += 1;
        steps.push(insertStep('cluster_revisions', {cluster_id: cluster.cluster_id, revision, spec: JSON.stringify(spec), source: 'console', note: note || OP_TITLES[kind]},
            `Record revision ${revision} of the desired configuration`));
    }
    steps.push(insertStep('cluster_operations', {op_id, cluster_id: cluster.cluster_id, kind, revision, parameters: JSON.stringify(parameters || {})},
        `Request the operation "${OP_TITLES[kind]}" (${op_id})`));
    steps.push(insertStep('cluster_events', {op_id, cluster_id: cluster.cluster_id, kind: 'state', state: 'queued', step: '', message: '', data: '{}'},
        'Queue it for the cluster agent'));
    return {op_id, steps};
}

/// The reviewable plan of an operation. Form dialogs return it (`formDialog` opens the review); other callers use `submitOperation`.
function operationPlan(cluster, kind, {parameters, spec, note, summary, warning, danger, capability}) {
    const {op_id, steps} = operationSteps(cluster, kind, parameters, spec, note);
    return {action: `cluster_${kind}_request`, target_type: 'cluster', target_name: cluster.name, summary: summary || `${OP_TITLES[kind]}: ${cluster.name}`,
        steps, local_only: true, danger, confirm_text: danger ? 'Submit' : undefined, correlation_id: op_id,
        warning: [warning, `The cluster agent executes the operation and checks on the server that you hold the capability ${capability}. Closing the browser does not stop it.`]
            .filter(Boolean).join(' '),
        onclose: () => navigate(adminPath('admin-clusters', cluster.cluster_id, 'operations'))};
}

function submitClusterOperation(cluster, kind, options) {
    reviewPlan(operationPlan(cluster, kind, options));
}

async function loadClusterState() {
    const db = quoteIdentifier(session.admin.db);
    const [clusters, revisions, operations, events, observations, resources, agents] = await Promise.all([
        adminRows(`SELECT cluster_id, name, environment, owner, description, provider, connection, requirements, policies, updated_by,
            formatDateTime(updated_at, '%Y-%m-%d %H:%i:%S') AS updated_at FROM ${db}.clusters FINAL WHERE NOT deleted ORDER BY name`),
        adminRows(`SELECT cluster_id, revision, spec, source, note, created_by, formatDateTime(created_at, '%Y-%m-%d %H:%i:%S') AS created_at
            FROM ${db}.cluster_revisions ORDER BY cluster_id, revision DESC LIMIT 20 BY cluster_id`),
        adminRows(`SELECT op_id, cluster_id, kind, revision, parameters, requested_by, formatDateTime(o.requested_at, '%Y-%m-%d %H:%i:%S') AS requested_at,
            toUnixTimestamp64Milli(o.requested_at) AS requested_ms FROM ${db}.cluster_operations AS o ORDER BY o.requested_at DESC LIMIT 1000`),
        adminRows(`SELECT op_id, cluster_id, kind, state, step, message, data, recorded_by, formatDateTime(e.at, '%Y-%m-%d %H:%i:%S') AS at,
            toUnixTimestamp64Milli(e.at) AS at_ms FROM ${db}.cluster_events AS e WHERE kind != 'heartbeat' ORDER BY e.at`),
        adminRows(`SELECT cluster_id, node_id, role, status, data, formatDateTime(o.at, '%Y-%m-%d %H:%i:%S') AS at, dateDiff('second', o.at, now64(3)) AS age
            FROM ${db}.cluster_observations AS o WHERE o.at > now64(3) - INTERVAL 1 DAY ORDER BY o.at DESC LIMIT 1 BY cluster_id, node_id`),
        adminRows(`SELECT cluster_id, resource_id, kind, name, owner_op, disposition, retention_until, evidence, updated_by,
            formatDateTime(updated_at, '%Y-%m-%d %H:%i:%S') AS updated_at FROM ${db}.cluster_resources FINAL ORDER BY cluster_id, kind, name`),
        adminRows(`SELECT op_id, argMax(data, e.at) AS data, formatDateTime(max(e.at), '%Y-%m-%d %H:%i:%S') AS last_at, dateDiff('second', max(e.at), now64(3)) AS age
            FROM ${db}.cluster_events AS e WHERE kind = 'heartbeat' AND e.at > now64(3) - INTERVAL 7 DAY GROUP BY op_id ORDER BY max(e.at) DESC`),
    ]);
    const by_id = new Map(clusters.map(c => [c.cluster_id, {...c, connection: parseJSON(c.connection, {}), requirements: parseJSON(c.requirements, {}),
        policies: parseJSON(c.policies, {}), revisions: [], spec: null, revision: 0, lifecycle: 'planned', lifecycle_message: '', mode: 'observe',
        drift: null, ops: [], observations: [], resources: []}]));
    for (const r of revisions) {
        const c = by_id.get(r.cluster_id);
        if (!c) continue;
        c.revisions.push({...r, revision: Number(r.revision), spec: parseJSON(r.spec, null)});
        if (Number(r.revision) > c.revision) {
            c.revision = Number(r.revision);
            c.spec = parseJSON(r.spec, null);
        }
    }
    const ops = new Map(operations.map(o => [o.op_id, {...o, revision: Number(o.revision), parameters: parseJSON(o.parameters, {}), state: 'queued', message: '',
        steps: [], events: [], cancel_requested: false}]));
    for (const e of events) {
        const c = by_id.get(e.cluster_id);
        if (c && e.kind === 'lifecycle') { c.lifecycle = e.state; c.lifecycle_message = e.message; c.lifecycle_at = e.at; }
        if (c && e.kind === 'mode') c.mode = e.state;
        if (c && e.kind === 'drift') c.drift = {...e, data: parseJSON(e.data, {})};
        const op = ops.get(e.op_id);
        if (!op) continue;
        op.events.push(e);
        if (e.kind === 'state') { op.state = e.state; op.message = e.message; op.state_at = e.at; }
        if (e.kind === 'request' && e.state === 'cancel') op.cancel_requested = true;
        if (e.kind === 'step') {
            const existing = op.steps.find(s => s.step === e.step);
            const entry = {step: e.step, state: e.state, message: e.message, data: parseJSON(e.data, {}), at: e.at};
            if (existing) Object.assign(existing, entry); else op.steps.push(entry);
        }
    }
    for (const op of ops.values()) {
        const c = by_id.get(op.cluster_id);
        if (c) c.ops.push(op);
    }
    for (const o of observations) {
        const c = by_id.get(o.cluster_id);
        if (c) c.observations.push({...o, age: Number(o.age), data: parseJSON(o.data, {})});
    }
    for (const r of resources) {
        const c = by_id.get(r.cluster_id);
        if (c) c.resources.push(r);
    }
    return {clusters: [...by_id.values()], by_id, agents: agents.map(a => ({...a, age: Number(a.age), data: parseJSON(a.data, {})}))};
}

/// Health from the latest observation of every member. `stale` when the newest is older than two observation periods.
function clusterHealth(c) {
    const ch = c.observations.filter(o => o.role === 'clickhouse');
    const keeper = c.observations.filter(o => o.role === 'keeper');
    const newest = c.observations.length ? Math.min(...c.observations.map(o => o.age)) : null;
    const count = (list, status) => list.filter(o => o.status === status).length;
    const leader = keeper.find(o => ['leader', 'standalone'].includes(o.data.server_state));
    return {ch, keeper, newest, stale: newest === null || newest > OBSERVATION_STALE_SECONDS,
        ok: count(ch, 'ok'), unreachable: count(ch, 'unreachable'), failed: count(ch, 'failed'), unknown: count(ch, 'unknown'),
        keeper_ok: count(keeper, 'ok'), quorum: keeper.length ? (leader && count(keeper, 'ok') > keeper.length / 2) : null, leader: leader ? leader.data.name : null,
        versions: [...new Set(ch.filter(o => o.data.version).map(o => o.data.version))]};
}

function observedAt(c) {
    if (c.mode === 'retired') return h('span', {className: 'note'}, '—');
    const health = clusterHealth(c);
    if (health.newest === null) return badge('Never observed', 'warn', 'The cluster agent has not recorded an observation in the last day.');
    const text = `${formatSeconds(health.newest)} ago`;
    return health.stale ? badge(`Stale: ${text}`, 'warn', 'The newest observation is older than two observation periods: the agent may be stopped.') : h('span', {}, text);
}

function healthSummary(c) {
    if (c.mode === 'retired') return h('span', {className: 'note'}, 'Retired: not observed');
    const x = clusterHealth(c);
    if (!x.ch.length) return h('span', {className: 'note'}, 'no observation');
    const parts = [`${x.ok}/${x.ch.length} nodes answer`];
    if (x.unreachable) parts.push(`${x.unreachable} unreachable`);
    if (x.failed) parts.push(`${x.failed} failed`);
    if (x.unknown) parts.push(`${x.unknown} unknown`);
    if (x.keeper.length) parts.push(`Keeper ${x.quorum ? 'quorum' : 'NO quorum'} (${x.keeper_ok}/${x.keeper.length})`);
    const proxy = c.observations.find(o => o.role === 'proxy');
    if (proxy) parts.push(proxy.status === 'ok' ? `chproxy routes to ${proxy.data.healthy}/${proxy.data.routed}` : `chproxy ${proxy.status}`);
    return h('span', {}, parts.join(', '));
}

/// Operations and drift that need someone's attention, and an unhealthy lifecycle.
function clusterAttention(c) {
    const failed = c.ops.filter(o => ['failed', 'blocked', 'unknown'].includes(o.state)).length;
    const drift = !!(c.drift && c.drift.state === 'drift');
    return {failed, drift, unhealthy: ['degraded', 'unreachable', 'failed'].includes(c.lifecycle), any: failed > 0 || drift || ['degraded', 'unreachable', 'failed'].includes(c.lifecycle)};
}

function topologyTolerance(w) {
    const lines = [];
    lines.push(w.replicas > 1 ? `Each shard keeps serving reads and writes with up to ${w.replicas - 1} of its ${w.replicas} replicas stopped.`
        : 'Each shard has one replica: stopping its node stops that shard, and losing its volume loses its data unless it was backed up.');
    if (w.keepers === 1) lines.push('One Keeper member: when it stops, replicated tables become read-only and ON CLUSTER queries wait.');
    else {
        const tolerated = Math.floor((w.keepers - 1) / 2);
        lines.push(`${w.keepers} Keeper members: the quorum survives ${tolerated} stopped member${tolerated === 1 ? '' : 's'}.`);
    }
    if (w.keepers % 2 === 0) lines.push('An even number of Keeper members tolerates no more failures than one less, and is refused.');
    if (w.routing === 'chproxy') lines.push('Clients connect to chproxy, which sends queries only to nodes that pass its health check. chproxy itself is one container: when it stops, clients that use it lose access, while direct connections to the nodes keep working.');
    else lines.push('No load balancer: clients connect to a node directly and must switch to another node themselves when it stops.');
    if (w.provider === 'docker-compose') lines.push('All containers run on one Docker host: they are one failure domain. A host failure stops the whole cluster; this lab does not provide high availability.');
    return lines;
}

/// Encrypts a password for the cluster agent with its public key (RSA-OAEP, SHA-256).
async function encryptForAgent(agent, text) {
    const der = Uint8Array.from(atob(agent.data.public_key), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('spki', der, {name: 'RSA-OAEP', hash: 'SHA-256'}, false, ['encrypt']);
    const ciphertext = new Uint8Array(await crypto.subtle.encrypt({name: 'RSA-OAEP'}, key, new TextEncoder().encode(text)));
    let binary = '';
    for (const byte of ciphertext) binary += String.fromCharCode(byte);
    return {ciphertext: btoa(binary), key_id: agent.data.key_id};
}

async function submitClusterCreation(state, w) {
    /// The password leaves the page only encrypted for the agent.
    const admin_password = await encryptForAgent(state.agents[0], w.admin_password);
    w.admin_password = '';
    w.admin_password_confirm = '';
    {
        const cluster_id = crypto.randomUUID();
        const op_id = crypto.randomUUID();
        const spec = {schema: 1, cluster_name: w.provider === 'kubernetes' ? 'default' : w.cluster_name, image: w.image,
            keeper: {image: w.provider === 'kubernetes' ? w.keeper_image : w.image, members: Array.from({length: w.keepers}, (_, i) => ({node_id: crypto.randomUUID(), name: `keeper${i + 1}`, server_id: i + 1}))},
            shards: Array.from({length: w.shards}, (_, i) => ({index: i + 1, replicas: Array.from({length: w.replicas}, (_, r) => ({node_id: crypto.randomUUID(), name: `s${i + 1}r${r + 1}`, state: 'active'}))})),
            resources: {cpus: w.cpus, memory_mb: w.memory_mb}, storage: {kind: w.provider === 'kubernetes' ? 'kubernetes-volume' : 'local-volume'}, settings: {server: {}, profile: {}},
            security: {admin_user: w.admin_user, service_user: 'console_service', tls: false, network: w.provider === 'kubernetes' ? 'kubernetes' : 'loopback'},
            ...(w.provider === 'kubernetes' ? {kubernetes: {namespace: w.k8s_namespace || `chc-${w.name}`, namespace_mode: w.k8s_namespace_mode, storage_class: w.k8s_storage_class,
                data_size_gi: w.k8s_data_gi, keeper_size_gi: w.k8s_keeper_gi, reclaim_policy: w.k8s_reclaim_policy, service_type: w.k8s_service_type}} : {}),
            routing: w.routing === 'chproxy' ? {kind: 'chproxy', image: w.proxy_image, user: w.proxy_user, max_concurrent_queries: w.proxy_max_concurrent,
                max_execution_time_s: w.proxy_max_execution} : {kind: 'none'}};
        const cluster_row = {cluster_id, name: w.name, environment: w.environment, owner: w.owner, description: w.description, provider: w.provider, connection: '{}',

        reviewPlan({action: 'cluster_create_request', target_type: 'cluster', target_name: w.name, summary: `Create cluster ${w.name}`, local_only: true, correlation_id: op_id,
            steps: [insertStep('clusters', cluster_row, `Register cluster ${w.name} (${cluster_id})`),
                insertStep('cluster_revisions', {cluster_id, revision: 1, spec: JSON.stringify(spec), source: 'console', note: 'initial plan'}, 'Record the desired configuration (revision 1)'),
                insertStep('cluster_events', {op_id: '', cluster_id, kind: 'mode', state: 'manage', step: '', message: 'created by the console', data: '{}'}, 'Set the management mode to Manage'),
                insertStep('cluster_events', {op_id: '', cluster_id, kind: 'lifecycle', state: 'planned', step: '', message: 'planned', data: '{}'}, 'Set the lifecycle state to Planned'),
                insertStep('cluster_operations', {op_id, cluster_id, kind: 'provision', revision: 1, parameters: JSON.stringify({admin_password})},
                    `Request provisioning (${op_id}), with the administrator password encrypted for the agent`),
                insertStep('cluster_events', {op_id, cluster_id, kind: 'state', state: 'queued', step: '', message: '', data: '{}'}, 'Queue it for the cluster agent')],
            warning: 'The cluster agent provisions it and checks on the server that you hold the capability create_cluster. Submitting the same plan twice provisions it once.',

function registerClusterDialog(state) {

    ], 'Review', () => {
        if (!/^[a-z][a-z0-9-]{1,40}$/.test(name.value)) return 'Enter a name of lowercase letters, digits, and dashes.';
        if (state.clusters.some(c => c.name === name.value)) return 'Another cluster has this name.';

            ['Target RPO / RTO', req.rpo_hours !== undefined ? `${req.rpo_hours} h / ${req.rto_hours} h (targets, not measurements)` : 'not set'],
            ['Last verified backup', last_backup ? `${last_backup.requested_at} UTC (operation ${shortId(last_backup.op_id)})` : 'none: no measured recovery point'],
            ['Measured restore time', 'not measured: restores into replacement clusters are not automated (see Protection & Recovery)'],
        ])),
        h('div', {className: 'box'}, h('h2', {}, 'Recent operations'), clusterOperationsTable(cluster, cluster.ops.slice(0, 5))),
    ];
}

/// Names the operator gives to the resources of a cluster (`chc-` and the first 10 hex digits of its identifier).
function k8sResource(cluster) {
    return `chc-${cluster.cluster_id.replace(/-/g, '').slice(0, 10)}`;
}

function k8sPod(cluster, node) {
    const m = /^s(\d+)r(\d+)$/.exec(node.name);
    return m ? `${k8sResource(cluster)}-clickhouse-${Number(m[1]) - 1}-${Number(m[2]) - 1}-0` : node.name;
}

/// The storage class of a cluster as the agent reports it now, or null.
function k8sStorageClass(state, cluster) {
    const inventory = state.agents[0] && state.agents[0].data.kubernetes;
    return inventory && inventory.storage_classes ? inventory.storage_classes.find(c => c.name === cluster.spec.kubernetes.storage_class) || null : null;
}

function kubernetesBox(state, cluster) {
    const k = cluster.spec.kubernetes;
    const inventory = state.agents[0] && state.agents[0].data.kubernetes;
    const storage = k8sStorageClass(state, cluster);
    return h('div', {className: 'box'}, h('h2', {}, 'Kubernetes'), kvList([
        ['Namespace', `${k.namespace} (${k.namespace_mode === 'create' ? 'created for this cluster' : 'existing'})`],
        ['Resources', `KeeperCluster ${k8sResource(cluster)}, ClickHouseCluster ${k8sResource(cluster)}, Secret ${k8sResource(cluster)}-console${k.service_type !== 'none' ? `, Service ${k8sResource(cluster)}-client` : ''}`],
        ['Operator', inventory && inventory.operator ? `${inventory.operator.image}${inventory.operator.verified ? '' : ' (not a verified version)'}` : 'not reported by the agent'],
        ['Storage class', storage ? `${storage.name} (${storage.provisioner}; expansion ${storage.expansion ? 'allowed' : 'not allowed'})` : `${k.storage_class} (not reported by the agent now)`],
        ['Volumes', `${k.data_size_gi} GiB per node, ${k.keeper_size_gi} GiB per Keeper member`],
        ['Reclaim policy', `${k.reclaim_policy}: ${k.reclaim_policy === 'Retain' ? 'a volume and its data stay when its claim is deleted, until the volume is deleted too' : 'the provisioner deletes a volume with its claim'}`],
        ['Client Service', k.service_type === 'none' ? 'none' : `${k8sResource(cluster)}-client, ${k.service_type}`],
    ]));
}

function nodeRow(o) {
    const d = o.data;
    const used = d.disk_total ? Math.round(100 * (1 - Number(d.disk_free) / Number(d.disk_total))) : null;
    return [
        badge(...(NODE_BADGES[o.status] || [o.status, '']), d.error || null),
        d.version || '—', d.uptime !== undefined ? formatSeconds(Number(d.uptime)) : '—',
        d.replication_queue !== undefined ? `${d.replication_queue} queued, ${d.max_replication_delay || 0} s delay${Number(d.readonly_replicas) ? `, ${d.readonly_replicas} read-only` : ''}` : '—',
        d.merges !== undefined ? `${d.merges} merges, ${d.unfinished_mutations} mutations, ${d.distribution_files || 0} queued distributed files` : '—',
        used !== null ? `${used}% of ${formatBytes(Number(d.disk_total))}` : '—',
        d.memory_used !== undefined ? `${formatBytes(Number(d.memory_used))} (host ${formatBytes(Number(d.memory_total))})` : '—',
        `${formatSeconds(o.age)} ago`,
    ];
}

function clusterNodes(state, cluster) {
    const observed = new Map(cluster.observations.filter(o => o.role === 'clickhouse').map(o => [o.node_id, o]));
    const out = [h('p', {className: 'note'}, 'Unreachable means the node did not answer the agent; failed is used only when the provider confirms it (a container that is not running). '
        + 'Memory is reported for the Docker host, not the container limit.')];
    if (cluster.provider === 'external') {
        const discovered = cluster.spec || {};
        out.push(h('div', {className: 'box'}, h('h2', {}, 'Observed endpoints'), dataTable([
            {title: 'Endpoint', render: o => o.data.endpoint || o.node_id},
            ...['State', 'Version', 'Uptime', 'Replication', 'Background work', 'Disk', 'Memory', 'Observed'].map((title, i) => ({title, render: o => nodeRow(o)[i]})),
        ], [...observed.values()], 'Not observed yet.', 'Endpoints')),
        h('div', {className: 'box'}, h('h2', {}, 'Discovered topology'),
            h('p', {className: 'note'}, `${(discovered.provenance || {}).clusters || ''} Confidence: ${(discovered.provenance || {}).confidence || 'unknown'}.`),
            dataTable([{title: 'Cluster definition', render: e => e[0]}, {title: 'Members (shard/replica → host)', render: e => Object.entries(e[1].members).map(([k, v]) => `${k} → ${v}`).join(', ')},
                {title: 'Seen from', render: e => e[1].seen_from.join(', ')}], Object.entries(discovered.clusters || {}), 'Nothing discovered yet.', 'Discovered clusters'),
            (discovered.conflicts || []).length ? h('div', {className: 'message warning'}, `Conflicting observations: ${discovered.conflicts.join('; ')}`) : null));
        return out;
    }
    if (!cluster.spec || !cluster.spec.shards) return [...out, paragraph('No topology yet.')];
    for (const shard of cluster.spec.shards) {
        const replicas = shard.replicas.filter(r => r.state !== 'removed');
        if (!replicas.length) continue;
        out.push(h('div', {className: 'box'}, h('h2', {}, `Shard ${shard.index}`), dataTable([
            {title: 'Node', render: r => [h('strong', {}, r.name), h('div', {className: 'note'}, `${shortId(r.node_id)} · ${r.http_port ? `127.0.0.1:${r.http_port}` : 'no port yet'} · ${(r.image || cluster.spec.image).split(':').pop()}`)]},
            ...['State', 'Version', 'Uptime', 'Replication', 'Background work', 'Disk', 'Memory', 'Observed'].map((title, i) => ({title, render: r => {
                const o = observed.get(r.node_id);

            }})),
            {title: '', render: r => (managed(cluster) ? h('span', {className: 'actions-row'},
                capabilityButton('Restart', 'maintain', () => restartDialog(cluster, [r.name])),
                onKubernetes(cluster) ? null : capabilityButton('Decommission', 'decommission', () => decommissionDialog(cluster, {...r, shard: shard.index}))) : null)},
        ], replicas, null, `Shard ${shard.index}`)));
    }
    const routing = clusterRouting(cluster);
    const proxy = cluster.observations.find(o => o.role === 'proxy');
    out.push(h('div', {className: 'box'}, h('h2', {}, 'Client routing'), routing
        ? [kvList([['Proxy', `chproxy (${routing.image})`], ['Endpoint', routing.port ? `http://127.0.0.1:${routing.port}` : 'port not assigned yet'],
            ['Proxy user', `${routing.user} → ${cluster.spec.security.admin_user}; at most ${routing.max_concurrent_queries} concurrent queries and ${routing.max_execution_time_s} s per query`],
            ['State', proxy ? [badge(...(NODE_BADGES[proxy.status] || [proxy.status, '']), proxy.data.error || null), ` observed ${formatSeconds(proxy.age)} ago`] : badge('Not observed', 'warn')],
            ['Routed nodes', proxy && proxy.data.nodes ? Object.entries(proxy.data.nodes).map(([name, healthy]) => badge(`${name}: ${healthy ? 'healthy' : 'unhealthy'}`, healthy ? 'ok' : 'bad')) : '—']]),
            h('p', {className: 'note'}, 'The agent keeps the node list of chproxy in step with the topology, takes a node out of it before stopping or restarting it, and puts it back once the node has caught up. '
                + 'Clients that connect to a node directly are not routed. The password of the proxy user is CH_PROXY_PASSWORD in the secrets file of the deployment on the agent host.')]
        : paragraph('None: clients connect to the nodes directly, and must switch to another node themselves when one stops. chproxy can be chosen when a cluster is created.')));
    out.push(h('p', {className: 'note'}, `Placement: every node runs on the agent's Docker host (one failure domain). Infrastructure: containers ${cluster.spec ? `chc-${cluster.cluster_id.replace(/-/g, '').slice(0, 10)}-<node>-1` : ''}.`));
    return out;
}

function clusterConfiguration(state, cluster) {
    const settings = (cluster.spec && cluster.spec.settings) || {server: {}, profile: {}};
    const drift = cluster.drift && cluster.drift.state === 'drift' ? cluster.drift.data : null;
    const out = [];
    out.push(h('div', {className: 'box'}, h('div', {className: 'admin-head'}, h('h2', {}, 'Desired settings'), h('span', {className: 'spacer'}),
        managed(cluster) ? capabilityButton('Change settings', 'configure', () => configureDialog(cluster)) : null),
    dataTable([{title: 'Setting', render: s => [h('code', {}, s.name), h('div', {className: 'note'}, s.hint)]},
        {title: 'Scope', render: s => (s.scope === 'server' ? 'server configuration' : 'default settings profile')},
        {title: 'Desired', render: s => { const v = settings[s.scope][s.name]; return v === undefined ? h('span', {className: 'note'}, 'server default') : String(v); }},
        {title: 'Observed differences', render: s => {
            const items = drift ? drift.items.filter(i => i.setting === s.name) : [];
            return items.length ? items.map(i => h('div', {}, `${i.node}: ${i.observed}`)) : h('span', {className: 'note'}, '—');
        }}], CLUSTER_SETTINGS, null, 'Settings'),
    h('p', {className: 'note'}, 'Source of truth: the desired configuration of the console, written by the agent into managed files per node '
        + '(config.d/console-settings.xml, users.d/console-users.xml). Whether a change needs a restart is read from the server (changeable_without_restart); '
        + 'restarts are rolling, one replica at a time. Other settings are not managed and are never overwritten. Secrets are referenced, never stored in revisions.')));
    if (cluster.drift) {
        const d = cluster.drift.data;
        out.push(h('div', {className: 'box'}, h('h2', {}, 'Drift'), cluster.drift.state === 'drift'
            ? [h('div', {className: 'message warning'}, `Detected ${cluster.drift.at} UTC: the deployment differs from revision ${d.revision}.`),
                d.items.length ? dataTable([{title: 'Node', render: i => i.node}, {title: 'Setting', render: i => i.setting}, {title: 'Desired', render: i => i.desired}, {title: 'Observed', render: i => i.observed}], d.items, null, 'Differences') : null,
                d.files.length ? paragraph(`Managed files edited outside the console: ${d.files.join(', ')}.`) : null,
                managed(cluster) ? h('div', {className: 'actions-row'},
                    capabilityButton('Apply the desired configuration', 'configure', () => submitClusterOperation(cluster, 'reconcile', {capability: 'configure',
                        summary: `Reconcile ${cluster.name} to revision ${cluster.revision}`, warning: 'The managed files are written again from the desired configuration: changes made by hand to them are overwritten.'})),
                    capabilityButton('Adopt the observed values', 'configure', () => adoptObservedDialog(cluster, d))) : null]
            : paragraph(`In sync with revision ${d.revision} (checked ${cluster.drift.at} UTC).`)));
    }
    out.push(h('div', {className: 'box'}, h('h2', {}, 'History'), dataTable([
        {title: 'Revision', className: 'num', render: r => String(r.revision)}, {title: 'Source', render: r => r.source}, {title: 'By', render: r => r.created_by},
        {title: 'At', render: r => `${r.created_at} UTC`}, {title: 'Note', render: r => r.note},
        {title: 'Change', render: r => {
            const prev = cluster.revisions.find(p => p.revision === r.revision - 1);
            return revisionDiff(prev && prev.spec, r.spec);
        }},
    ], cluster.revisions, 'No revision.', 'Revisions')));
    return out;
}

/// What changed between two revisions, in words: settings, nodes, images, resources.
function revisionDiff(before, after) {
    if (!before || !after) return h('span', {className: 'note'}, before ? '—' : 'initial');
    const changes = [];
    for (const scope of ['server', 'profile']) {
        const a = ((before.settings || {})[scope]) || {};
        const b = ((after.settings || {})[scope]) || {};
        for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) if (String(a[k]) !== String(b[k])) changes.push(`${k}: ${a[k] ?? 'default'} → ${b[k] ?? 'default'}`);
    }
    if (before.shards && after.shards) {
        const names = spec => activeNodes(spec).map(n => n.name);
        const added = names(after).filter(n => !names(before).includes(n));
        const removed = names(before).filter(n => !names(after).includes(n));
        if (added.length) changes.push(`nodes added: ${added.join(', ')}`);
        if (removed.length) changes.push(`nodes removed: ${removed.join(', ')}`);
        const images = spec => activeNodes(spec).map(n => `${n.name}=${n.image || spec.image}`);
        const changed_images = images(after).filter(i => !images(before).includes(i) && !added.some(a => i.startsWith(`${a}=`)));
        if (changed_images.length) changes.push(`images: ${changed_images.join(', ')}`);
        const ports = spec => activeNodes(spec).filter(n => n.http_port).length;
        if (ports(after) > ports(before)) changes.push('host ports assigned');
    }
    if (JSON.stringify(before.resources) !== JSON.stringify(after.resources)) changes.push(`resources: ${JSON.stringify(before.resources)} → ${JSON.stringify(after.resources)}`);
    return changes.length ? changes.join('; ') : h('span', {className: 'note'}, 'no change');
}

function configureDialog(cluster) {
    const spec = JSON.parse(JSON.stringify(cluster.spec));
    spec.settings = spec.settings || {server: {}, profile: {}};
    const inputs = CLUSTER_SETTINGS.map(s => ({s, input: h('input', {type: 'number', value: spec.settings[s.scope][s.name] ?? '', placeholder: 'server default', min: s.min, max: s.max, step: s.float ? 0.05 : 1})}));
    formDialog(`Change settings of ${cluster.name}`, [
        ...inputs.map(({s, input}) => adminField(`${s.name} (${s.scope})`, input, s.hint)),
        h('p', {className: 'note'}, 'Empty: the server default (the setting is removed from the managed file).'),
    ], 'Review', () => {
        const before = JSON.parse(JSON.stringify(spec.settings));
        for (const {s, input} of inputs) {
            if (input.value === '') { delete spec.settings[s.scope][s.name]; continue; }
            const v = Number(input.value);
            if (!(v >= s.min && v <= s.max) || (!s.float && !Number.isInteger(v))) return `${s.name}: enter ${s.float ? 'a number' : 'an integer'} from ${s.min} to ${s.max}.`;
            spec.settings[s.scope][s.name] = v;
        }
        const diff = revisionDiff({settings: before}, {settings: spec.settings});
        if (typeof diff !== 'string') return 'Nothing changed.';
        return operationPlan(cluster, 'configure', {spec, note: diff, capability: 'configure', summary: `Change settings of ${cluster.name}: ${diff}`,
            warning: 'Settings that the server cannot change without a restart are applied with a rolling restart, one replica at a time; a shard with one replica is unavailable while its node restarts. '
                + 'Reverting means submitting the previous values again; values persisted by the server meanwhile are not reverted.'});
    });
}

function adoptObservedDialog(cluster, drift) {
    const spec = JSON.parse(JSON.stringify(cluster.spec));
    const values = {};
    for (const item of drift.items) {
        const setting = CLUSTER_SETTINGS.find(s => s.name === item.setting);
        if (!setting) continue;
        if (values[item.setting] !== undefined && values[item.setting] !== item.observed) {
            openDialog('Adopt observed values', [h('div', {className: 'message error'}, `The nodes report different values for ${item.setting}: choose the desired value with Change settings.`)], [button('Close', closeDialog)]);
            return;
        }
        values[item.setting] = item.observed;
        spec.settings[setting.scope][item.setting] = Number(item.observed);
    }
    if (!Object.keys(values).length) {
        openDialog('Adopt observed values', [paragraph('No managed setting differs; the drift is in files edited by hand. Apply the desired configuration to restore them.')], [button('Close', closeDialog)]);
        return;
    }
    submitClusterOperation(cluster, 'configure', {spec, note: `adopted observed values: ${JSON.stringify(values)}`, capability: 'configure',
        summary: `Adopt the observed values of ${cluster.name}`, warning: 'The desired configuration takes the values the nodes report, and the managed files are written again with them.'});
}

function clusterScaling(state, cluster) {
    const out = [];
    const nodes = cluster.observations.filter(o => o.role === 'clickhouse');
    out.push(h('div', {className: 'box'}, h('h2', {}, 'Capacity'), dataTable([

        {title: 'Memory', render: o => (o.data.memory_used !== undefined ? formatBytes(Number(o.data.memory_used)) : '—')},

        {title: 'Observed', render: o => `${formatSeconds(o.age)} ago`},
    ], nodes, 'Not observed yet.', 'Capacity'),
    h('p', {className: 'note'}, `Requirements recorded at creation: ${JSON.stringify(cluster.requirements || {})}. Disk shows the host file system that holds the Docker volumes.`)));
    if (!managed(cluster)) return [...out, paragraph('Scaling needs a managed cluster with a provider integration.')];
    if (onKubernetes(cluster)) return [...out, kubernetesScaling(state, cluster)];
    const spec = cluster.spec;
    out.push(h('div', {className: 'box'}, h('h2', {}, 'Change resources or topology'), dataTable([
        {title: 'Operation', render: r => h('strong', {}, r[0])}, {title: 'What it involves', render: r => r[1]}, {title: '', render: r => r[2]},
    ], [
        ['Change CPU or memory', `Now ${spec.resources.cpus} CPU and ${spec.resources.memory_mb} MiB per node. Recreates the containers one at a time (a restart per node); decreasing needs headroom: check memory use above.`,
            capabilityButton('Resize', 'scale', () => resizeDialog(cluster))],
        ['Add a replica', 'A new node in a shard. The agent creates the schema of a peer, waits until replication has caught up, compares row counts, then updates the topology. Ready only after synchronization.',
            capabilityButton('Add replica', 'scale', () => addReplicaDialog(cluster))],
        ['Remove a replica', 'Decommission, on Nodes & Topology: refused for the last replica of a shard or without a synchronized remaining replica.', null],
        ['Add a shard', 'New nodes with the schema of shard 1, empty. Existing rows are not redistributed; Distributed tables place new rows by their sharding key, which now spans more shards.',
            capabilityButton('Add shard', 'scale', () => addShardDialog(cluster))],
        ['Remove a shard', 'Only an empty shard: moving data off a shard needs a migration that the console does not perform.',
            capabilityButton('Remove shard', 'scale', () => removeShardDialog(cluster))],
        ['Expand or reduce storage', 'Not supported by this provider: Docker volumes have no size; they use the host file system. Reducing storage in place is never assumed.', null],
    ], null, 'Scaling operations')));
    return out;
}

/// Scaling with the operator: it keeps the same number of replicas in every shard, and adds or removes the replica or
/// shard with the highest index.
function kubernetesScaling(state, cluster) {
    const spec = cluster.spec;
    const shards = spec.shards.filter(sh => sh.replicas.some(r => r.state !== 'removed'));
    const per_shard = shards[0].replicas.filter(r => r.state !== 'removed').length;
    const storage = k8sStorageClass(state, cluster);
    return h('div', {className: 'box'}, h('h2', {}, 'Change resources or topology'), dataTable([
        {title: 'Operation', render: r => h('strong', {}, r[0])}, {title: 'What it involves', render: r => r[1]}, {title: '', render: r => r[2]},
    ], [
        ['Change CPU or memory', `Now ${spec.resources.cpus} CPU and ${spec.resources.memory_mb} MiB per node (requests and limits). The operator recreates the pods one replica at a time.`,
            capabilityButton('Resize', 'scale', () => resizeDialog(cluster))],
        ['Add a replica to every shard', `Now ${per_shard} replicas per shard. The operator adds one replica to each shard; the agent creates the schema of a peer on it, waits until replication has caught up, and compares row counts.`,
            capabilityButton('Add replicas', 'scale', () => k8sReplicasDialog(cluster, +1))],
        ['Remove a replica from every shard', `Removes the replica with the highest index of each shard (${shards.map(sh => sh.replicas.filter(r => r.state !== 'removed').slice(-1)[0].name).join(', ')}), `
            + 'after checking that the other replicas are caught up and the Keeper quorum is healthy. Their volume claims are kept.',
            capabilityButton('Remove replicas', 'decommission', () => k8sReplicasDialog(cluster, -1), {disabled: per_shard < 2, title: per_shard < 2 ? 'Every shard has one replica.' : null})],
        ['Add a shard', `A shard of ${per_shard} replicas with the schema of shard 1, empty. Existing rows are not redistributed.`,
            capabilityButton('Add shard', 'scale', () => addShardDialog(cluster))],
        ['Remove the last shard', `Only shard ${shards[shards.length - 1].index}, and only when it holds no data: the operator removes the shard with the highest index.`,
            capabilityButton('Remove shard', 'scale', () => removeShardDialog(cluster), {disabled: shards.length < 2, title: shards.length < 2 ? 'The cluster has one shard.' : null})],
        ['Expand storage', storage && storage.expansion ? `Now ${spec.kubernetes.data_size_gi} GiB per node. The storage class ${storage.name} allows expansion: the operator enlarges every data volume. Volumes are never reduced.`
            : `Not available: the storage class ${spec.kubernetes.storage_class} ${storage ? 'does not allow volume expansion' : 'is not reported by the agent'}.`,
            capabilityButton('Expand', 'scale', () => expandStorageDialog(cluster), {disabled: !(storage && storage.expansion)})],
    ], null, 'Scaling operations'));
}

function k8sReplicasDialog(cluster, delta) {
    const spec = JSON.parse(JSON.stringify(cluster.spec));
    const shards = spec.shards.filter(sh => sh.replicas.some(r => r.state !== 'removed'));
    const names = [];
    for (const sh of shards) {
        const active = sh.replicas.filter(r => r.state !== 'removed');
        if (delta > 0) {
            const name = `s${sh.index}r${active.length + 1}`;
            const existing = sh.replicas.find(r => r.name === name);
            if (existing) existing.state = 'active';
            else sh.replicas.push({node_id: crypto.randomUUID(), name, state: 'active'});
            names.push(name);
        } else {
            names.push(active[active.length - 1].name);
        }
    }
    if (delta > 0) {
        if (shards[0].replicas.filter(r => r.state !== 'removed').length > 5) {
            openDialog('Add replicas', [paragraph('At most 5 replicas per shard.')], [button('Close', closeDialog)]);
            return;
        }
        submitClusterOperation(cluster, 'add_replica', {spec, parameters: {nodes: names}, capability: 'scale', note: `replicas ${names.join(', ')} added`,
            summary: `Add replicas ${names.join(', ')} to ${cluster.name}`,
            warning: 'The new replicas are declared ready only after their replicated tables have caught up and their row counts match a peer.'});
        return;
    }
    const confirm = h('input', {type: 'text', autocomplete: 'off'});
    formDialog(`Remove a replica from every shard of ${cluster.name}`, [
        kvList([['Replicas removed', names.join(', ')], ['Pods', names.map(name => k8sPod(cluster, {name})).join(', ')]]),
        h('ol', {className: 'steps'}, ...['Check that the replicas are the last of their shards, and that each shard keeps a replica.',
            'Check that the remaining replicas are caught up, the Keeper quorum is healthy, and no distributed inserts are queued on the removed replicas.',
            'Reduce the replicas of the ClickHouseCluster (the irreversible boundary): the operator removes the pods.',
            'Remove their replica metadata from Keeper (SYSTEM DROP REPLICA).', 'Check the remaining cluster.',
            `Keep their volume claims (reclaim policy ${cluster.spec.kubernetes.reclaim_policy}); delete them with Delete resources after retirement.`].map(t => h('li', {}, t))),
        adminField(`Type ${cluster.name} to confirm`, confirm),
    ], 'Review', () => {
        if (confirm.value !== cluster.name) return 'The name does not match.';
        return operationPlan(cluster, 'remove_replica', {parameters: {nodes: names}, capability: 'decommission', danger: true,
            summary: `Remove replicas ${names.join(', ')} of ${cluster.name}`,
            warning: 'Clients connected to these pods lose their connection. The agent refuses when the remaining replicas are not caught up.'});
    });
}

function expandStorageDialog(cluster) {
    const size = h('input', {type: 'number', min: cluster.spec.kubernetes.data_size_gi + 1, value: cluster.spec.kubernetes.data_size_gi * 2});
    formDialog(`Expand the storage of ${cluster.name}`, [adminField('Data volume per node (GiB)', size, `Now ${cluster.spec.kubernetes.data_size_gi} GiB. Volumes are never reduced.`),
        paragraph('The operator requests the new size for every data volume; the storage class expands them, online when its driver supports it. Keeper volumes are not changed.')], 'Review', () => {
        const value = Number(size.value);
        if (!Number.isInteger(value) || value <= cluster.spec.kubernetes.data_size_gi) return `Enter a whole number of GiB larger than ${cluster.spec.kubernetes.data_size_gi}.`;
        const spec = JSON.parse(JSON.stringify(cluster.spec));
        spec.kubernetes.data_size_gi = value;
        return operationPlan(cluster, 'resize_storage', {spec, capability: 'scale', note: `data volumes ${value} GiB`, summary: `Expand the data volumes of ${cluster.name} to ${value} GiB`,
            warning: 'An expanded volume cannot be reduced again. The agent refuses when the storage class does not allow expansion.'});
    });
}

function resizeDialog(cluster) {
    const cpus = h('input', {type: 'number', value: cluster.spec.resources.cpus, min: 0.5, step: 0.5});
    const memory = h('input', {type: 'number', value: cluster.spec.resources.memory_mb, min: 512, step: 256});
    formDialog(`Resize ${cluster.name}`, [adminField('CPUs per node', cpus), adminField('Memory per node (MiB)', memory)], 'Review', () => {
        const spec = JSON.parse(JSON.stringify(cluster.spec));
        spec.resources = {...spec.resources, cpus: Number(cpus.value), memory_mb: Number(memory.value)};
        if (!(spec.resources.cpus >= 0.5) || !(spec.resources.memory_mb >= 512)) return 'At least 0.5 CPU and 512 MiB.';
        const decrease = spec.resources.memory_mb < cluster.spec.resources.memory_mb || spec.resources.cpus < cluster.spec.resources.cpus;
        return operationPlan(cluster, 'resize', {spec, capability: 'scale', note: `resources ${JSON.stringify(spec.resources)}`, summary: `Resize ${cluster.name}`,
            warning: `Every node is recreated with the new limits, one at a time, after its peers have caught up. ${decrease ? 'This decreases resources: queries that need more memory than the new limit fail. ' : ''}`
                + 'A shard with one replica is unavailable while its node is recreated.'});
    });
}

function addReplicaDialog(cluster) {
    const shards = cluster.spec.shards.filter(sh => sh.replicas.some(r => r.state !== 'removed'));
    const shard = select(shards.map(sh => [String(sh.index), `Shard ${sh.index} (${sh.replicas.filter(r => r.state !== 'removed').length} replicas)`]), String(shards[0].index));
    formDialog(`Add a replica to ${cluster.name}`, [adminField('Shard', shard),
        paragraph('The new replica gets its own container and volume, the schema of a peer, and fetches the data of replicated tables. Tables that are not replicated are created empty, '
            + 'and the plan result lists them. Keeper is not resized.')], 'Review', () => {
        const spec = JSON.parse(JSON.stringify(cluster.spec));
        const target = spec.shards.find(sh => sh.index === Number(shard.value));
        const used = new Set(spec.shards.flatMap(sh => sh.replicas.map(r => r.name)));
        let n = 1;
        while (used.has(`s${target.index}r${n}`)) n++;
        const name = `s${target.index}r${n}`;
        target.replicas.push({node_id: crypto.randomUUID(), name, state: 'active'});
        return operationPlan(cluster, 'add_replica', {spec, parameters: {nodes: [name]}, capability: 'scale', note: `replica ${name} added to shard ${target.index}`,
            summary: `Add replica ${name} to shard ${target.index} of ${cluster.name}`, warning: 'The replica is declared ready only after its replicated tables have caught up and their row counts match a peer.'});
    });
}

function addShardDialog(cluster) {
    const per_shard = cluster.spec.shards.find(sh => sh.replicas.some(r => r.state !== 'removed')).replicas.filter(r => r.state !== 'removed').length;
    const replicas = h('input', {type: 'number', value: onKubernetes(cluster) ? per_shard : 2, min: 1, max: 3, disabled: !!onKubernetes(cluster)});
    const ack = checkbox('I understand that existing rows stay on their shards: nothing is redistributed, and the sharding of new rows changes.', false);
    formDialog(`Add a shard to ${cluster.name}`, [adminField('Replicas of the new shard', replicas), ack.element,
        paragraph('Data placement after the change: a Distributed table computes the shard of each new row from its sharding key over all shards, '
            + 'so rows with the same key may land on a different shard than before. Queries that read through Distributed tables see all rows; '
            + 'queries that rely on key locality (for example JOIN or IN on the sharding key without GLOBAL) may give different results. '
            + 'Moving historical rows needs a migration (INSERT SELECT with a sharding expression, checks for duplicates and missing rows, and a cutover), which the console does not run.')], 'Review', () => {
        if (!ack.input.checked) return 'Confirm that you understand the data placement.';
        const count = Number(replicas.value);
        if (!(count >= 1 && count <= 3)) return 'Choose 1 to 3 replicas.';
        const spec = JSON.parse(JSON.stringify(cluster.spec));
        const index = Math.max(...spec.shards.map(sh => sh.index)) + 1;
        const names = Array.from({length: count}, (_, r) => `s${index}r${r + 1}`);
        spec.shards.push({index, replicas: names.map(name => ({node_id: crypto.randomUUID(), name, state: 'active'}))});
        return operationPlan(cluster, 'add_shard', {spec, parameters: {nodes: names}, capability: 'scale', note: `shard ${index} added`, summary: `Add shard ${index} to ${cluster.name}`,
            warning: 'Existing rows are not moved. The new shard receives new rows routed to it by Distributed tables.'});
    });
}

function removeShardDialog(cluster) {
    const shards = cluster.spec.shards.filter(sh => sh.replicas.some(r => r.state !== 'removed'));
    if (shards.length < 2) {
        openDialog('Remove shard', [paragraph('The cluster has one shard: it cannot be removed.')], [button('Close', closeDialog)]);
        return;
    }
    const shard = select((onKubernetes(cluster) ? shards.slice(-1) : shards).map(sh => [String(sh.index), `Shard ${sh.index}`]), String(shards[shards.length - 1].index));
    formDialog(`Remove a shard of ${cluster.name}`, [adminField('Shard', shard), paragraph(onKubernetes(cluster)
        ? 'The operator removes the shard with the highest index. The agent refuses it when it holds rows in any table; its volume claims are kept.'
        : 'The agent refuses a shard that holds rows in any table. Its nodes are stopped and removed; their volumes are kept.')],
        'Review', () => {
            const spec = onKubernetes(cluster) ? JSON.parse(JSON.stringify(cluster.spec)) : undefined;
            if (spec) for (const r of spec.shards.find(sh => sh.index === Number(shard.value)).replicas) r.state = 'removed';
            return operationPlan(cluster, 'remove_shard', {spec, parameters: {shard: Number(shard.value)}, capability: 'scale', summary: `Remove shard ${shard.value} of ${cluster.name}`, danger: true,
                warning: 'Refused when the shard holds data. Routing: Distributed tables stop sending rows to it once the topology is updated.'});
        });
}

function decommissionDialog(cluster, node) {
    const peers = cluster.spec.shards.find(sh => sh.index === node.shard).replicas.filter(r => r.state !== 'removed' && r.name !== node.name);
    const keep = select([['keep', 'Keep its volume (recorded as retained)'], ['delete', 'Delete its volume (needs the capability destroy)']], 'keep');
    const retention = h('input', {type: 'date'});
    const confirm = h('input', {type: 'text', autocomplete: 'off'});
    formDialog(`Decommission ${node.name}`, [
        kvList([['Shard', String(node.shard)], ['Remaining replicas', peers.map(p => p.name).join(', ') || 'none']]),
        !peers.length ? h('div', {className: 'message error'}, `${node.name} is the last replica of shard ${node.shard}: the agent refuses to remove it.`) : null,
        h('ol', {className: 'steps'}, ...['Identify its roles (refused for a Keeper member or the last replica of a shard).',
            'Check that the remaining replicas are caught up and the Keeper quorum is healthy; compare row counts when the node answers.',
            'Check running queries and queued distributed inserts on it.', 'Stop it (the irreversible boundary: cancelling is no longer possible after this).',
            'Remove it from the cluster definition of the other nodes.', 'Remove its replica metadata from Keeper (SYSTEM DROP REPLICA, only because the agent stopped and removed it).',
            'Check the remaining cluster.', 'Remove the container; keep or delete the volume as chosen.'].map(t => h('li', {}, t))),
        adminField('Volume', keep), adminField('Keep until (optional)', retention),
        paragraph(clusterRouting(cluster) ? 'chproxy stops routing queries to the node before it stops. Clients connected to the node directly lose their connection.'
            : 'Clients connected to this node directly lose their connection; this cluster has no chproxy to update.'),
        adminField(`Type ${node.name} to confirm`, confirm),
    ], 'Review', () => {
        if (confirm.value !== node.name) return 'The name does not match.';
        if (keep.value === 'delete' && !session.admin.can.cap_destroy) return 'Deleting the volume needs the capability destroy.';
        return operationPlan(cluster, 'remove_replica', {parameters: {node: node.name, delete_volume: keep.value === 'delete', retention_until: retention.value || null},
            capability: 'decommission', danger: true, summary: `Decommission ${node.name} of ${cluster.name}`,
            warning: 'An unreachable node is not proof that its data may be deleted: the agent refuses when the remaining replicas are not caught up.'});
    });
}

function restartDialog(cluster, names) {
    submitClusterOperation(cluster, 'restart_node', {parameters: {nodes: names}, capability: 'maintain', summary: `Restart ${names.join(', ')} of ${cluster.name}`,
        warning: 'Before each node, the other replicas of its shard must be caught up; after it, the node must answer and catch up. '
            + 'ClickHouse has no drain command: queries running on the node fail when it stops, and clients must reconnect; queued distributed inserts are sent after the restart.'});
}

function clusterMaintenance(state, cluster) {
    if (!managed(cluster)) return [paragraph('Maintenance and upgrades need a managed cluster with a provider integration.')];
    const versions = clusterHealth(cluster).versions;
    return [
        h('div', {className: 'box'}, h('h2', {}, 'Maintenance window'), kvList([['Window', cluster.policies.maintenance_window || 'not set'],
            ['Note', 'Recorded for coordination; operations start when submitted.']])),
        h('div', {className: 'box'}, h('div', {className: 'admin-head'}, h('h2', {}, 'Rolling restart'), h('span', {className: 'spacer'}),
            capabilityButton('Restart all nodes', 'maintain', () => restartDialog(cluster, activeNodes(cluster.spec).map(n => n.name)))),
        paragraph('One node at a time, after its peers have caught up. There is no universal drain: new queries to a stopping node fail and clients reconnect to another node; '
            + 'inserts queued for distribution are sent after the restart; merges resume.')),
        h('div', {className: 'box'}, h('div', {className: 'admin-head'}, h('h2', {}, 'Version upgrade'), h('span', {className: 'spacer'}),
            capabilityButton('Upgrade', 'upgrade', () => upgradeDialog(cluster))),
        kvList([['Running versions', versions.join(', ') || 'unknown'], ['Desired image', cluster.spec.image]]),
        h('ol', {className: 'steps'}, ...['The agent checks the path: no downgrade, at most one year of releases at once.',
            'A verified backup of the cluster from the last 24 hours is required (or a recorded reason to waive it).',
            'Validate the target in a lab cluster first: create one with the target image and run your workload.',
            'Order: per shard, the other replicas before the first one, so that every shard keeps a node on the old version until its replicas have passed.',
            'Mixed versions are expected only during the rollout. After each node: it must answer, report the target version, catch up, and show no load or data errors.',
            'A failed check stops the rollout: the remaining nodes stay on the old version.', 'After the last node: topology and replication checks.'].map(t => h('li', {}, t))),
        h('div', {className: 'message warning'}, 'Rollback: changing the image back is not a downgrade path, because a newer version may write data or metadata that an older one cannot read. '
            + 'The recovery alternative is a restore of the pre-upgrade backup into a new cluster of the old version.')),
        h('div', {className: 'box'}, h('h2', {}, 'Certificates and credentials'), paragraph(onKubernetes(cluster)
            ? `No TLS certificates are configured (the operator supports them with cert-manager). Rotating the credentials is not implemented: they are in the Secret ${k8sResource(cluster)}-console.`
            : 'This provider configures no TLS certificates. Rotating the generated credentials is not implemented: they are in the secrets file of the deployment on the agent host.'))];
}

function upgradeDialog(cluster) {
    const image = h('input', {type: 'text', value: cluster.spec.image, spellcheck: false});
    const waive = h('input', {type: 'text', placeholder: 'only if no recent verified backup exists'});
    formDialog(`Upgrade ${cluster.name}`, [adminField('Target image', image, onKubernetes(cluster) ? 'repository:tag; the Kubernetes nodes pull it. The operator replaces the pods one replica at a time.' : 'repository:tag, already on the Docker host.'),
        adminField('Reason to waive the backup requirement', waive, 'Recorded with the operation.')], 'Review', () => {
        if (!/^[a-z0-9./_-]+:[0-9][A-Za-z0-9._-]*$/.test(image.value)) return 'Enter repository:version.';
        return operationPlan(cluster, 'upgrade', {parameters: {image: image.value, waive_backup: waive.value.trim() || undefined}, capability: 'upgrade',
            summary: `Upgrade ${cluster.name} to ${image.value}`, danger: true,
            warning: 'The rollout stops at the first failed check. A downgrade is refused. Changing the image back does not undo data written by the new version.'});
    });
}

function clusterProtection(state, cluster) {
    const backups = cluster.ops.filter(o => o.kind === 'backup');
    const destination = cluster.policies.backup_destination_id;
    return [
        h('div', {className: 'box'}, h('div', {className: 'admin-head'}, h('h2', {}, 'Backups of this cluster'), h('span', {className: 'spacer'}),
            managed(cluster) ? capabilityButton('Back up now', 'maintain', () => backupClusterDialog(cluster)) : null),
        paragraph('The agent backs up every shard from a caught-up replica to an S3 destination of Backup & Restore, then opens each shard\'s backup and compares the tables and rows. '
            + 'Only a backup with that verification counts as protection (for upgrades and retirement).'),
        kvList([['Backup policy destination', destination || 'none set']]),
        dataTable([{title: 'Backup', render: o => [h('code', {}, shortId(o.op_id)), h('div', {className: 'note'}, `${o.requested_at} UTC by ${o.requested_by}`)]},
            {title: 'State', render: o => opBadge(o.state)},
            {title: 'Verification', render: o => {
                const v = o.steps.find(s => s.step === 'verify');
                return v && v.state === 'done' ? `${(v.data.tables || []).length} tables read back: ${(v.data.tables || []).map(t => `${t.table} ${t.rows_in_backup} rows`).join(', ')}` : (v ? v.message : '—');
            }},
            {title: 'Location', render: o => { const b = o.steps.find(s => s.step === 'backup'); return b && b.data.location ? b.data.location : '—'; }},
        ], backups, 'No backup of this cluster.', 'Cluster backups')),
        h('div', {className: 'box'}, h('h2', {}, 'Recovery procedures'), dataTable([
            {title: 'Situation', render: r => h('strong', {}, r[0])}, {title: 'Procedure', render: r => r[1]}, {title: 'In the console', render: r => r[2]}], [
            ['A replica failed, others are healthy', 'Decommission the failed node, then add a replica: it copies the schema and fetches the data from the healthy replicas.', 'Implemented (Decommission, Add replica)'],
            ['Data lost or corrupted on all replicas', 'Restore a verified backup into a new cluster, check it, then switch clients.', 'Not automated: create a cluster, then RESTORE from the backup location'],
            ['Infrastructure replaced', 'Provision a new cluster with the same topology and restore its backup.', 'Partly: Create Cluster; restore not automated'],
            ['Keeper metadata lost', 'Recreate the ensemble, then SYSTEM RESTORE REPLICA on each replicated table from the parts on disk.', 'Not automated'],
            ['Switch traffic to a recovery site', 'Fence the old deployment first (stop it, or revoke its client access), switch client routing, measure the data freshness, plan failback.', 'Not automated: no cross-site provider'],
        ], null, 'Recovery procedures'),
        paragraph('The console never starts two authoritative deployments of the same data on its own: recovery into a new cluster leaves the switch of clients to an operator.')),
    ];
}

async function backupClusterDialog(cluster) {
    const rows = await detailRows(`SELECT id, name FROM ${clusterTable('backup_destinations')} FINAL WHERE NOT deleted AND enabled AND type = 's3' ORDER BY name`);
    if (!rows.rows || !rows.rows.length) {
        openDialog('Back up', [paragraph(rows.error ? `The destinations could not be read: ${rows.error}` : 'No enabled S3 destination in Backup & Restore. Add one there first.')], [button('Close', closeDialog)]);
        return;
    }
    const destination = select(rows.rows.map(d => [d.id, d.name]), cluster.policies.backup_destination_id || rows.rows[0].id);
    formDialog(`Back up ${cluster.name}`, [adminField('Destination', destination, 'The agent reads its credentials from <REF>_ACCESS_KEY_ID and _SECRET_ACCESS_KEY.')], 'Review', () => {
        return operationPlan(cluster, 'backup', {parameters: {destination_id: destination.value}, capability: 'maintain', summary: `Back up ${cluster.name}`});
    });
}

function clusterOperationsTable(cluster, ops) {
    return dataTable([
        {title: 'Operation', render: o => [h('strong', {}, OP_TITLES[o.kind] || o.kind), h('div', {className: 'note'}, h('code', {}, shortId(o.op_id)), ` · revision ${o.revision}`)]},
        {title: 'Requested', render: o => [`${o.requested_at} UTC`, h('div', {className: 'note'}, o.requested_by)]},
        {title: 'State', render: o => [opBadge(o.state), o.message ? h('div', {className: 'note'}, o.message.slice(0, 300)) : null]},
        {title: 'Steps', render: o => (o.steps.length ? `${o.steps.filter(s => s.state === 'done').length}/${o.steps.length} done${o.steps.some(s => s.state === 'failed') ? ', a step failed' : ''}` : '—')},
        {title: '', render: o => h('span', {className: 'actions-row'}, button('Details', () => operationDialog(cluster, o), {className: 'small'}),
            ['queued', 'waiting', 'blocked', 'unknown', 'running'].includes(o.state) && !o.cancel_requested && session.admin.can.write_clusters
                ? button('Cancel', () => requestDialog(cluster, o, 'cancel'), {className: 'small danger'}) : null,
            o.state === 'blocked' && session.admin.can.write_clusters ? button('Retry', () => requestDialog(cluster, o, 'retry'), {className: 'small'}) : null)},
    ], ops, 'No operation.', 'Operations');
}

function operationDialog(cluster, o) {
    openDialog(`${OP_TITLES[o.kind] || o.kind} ${shortId(o.op_id)}`, [
        kvList([['Operation', h('code', {}, o.op_id)], ['Cluster', cluster.name], ['Requested', `${o.requested_at} UTC by ${o.requested_by}`], ['Revision', String(o.revision)],
            ['Parameters', h('code', {}, JSON.stringify(o.parameters))], ['State', [opBadge(o.state), ` ${o.message || ''}`]]]),
        dataTable([{title: 'Step', render: s => [h('strong', {}, s.step), h('div', {className: 'note'}, s.message)]},
            {title: 'State', render: s => badge(s.state === 'done' ? 'Done' : (s.state === 'failed' ? 'Failed' : 'Running'), s.state === 'done' ? 'ok' : (s.state === 'failed' ? 'bad' : 'warn'))},
            {title: 'At', render: s => `${s.at} UTC`},
            {title: 'Evidence', render: s => h('pre', {className: 'code'}, JSON.stringify(s.data, null, 1).slice(0, 2000))}], o.steps, 'No step has started.', 'Steps'),
        h('p', {className: 'note'}, 'Steps marked done took effect and are not undone by a cancel or a failure. A failed operation can be submitted again: its steps are written to be safe to repeat.'),
        h('a', {href: `${adminPath('admin-audit', null, 'console')}&q=${encodeURIComponent(o.op_id)}`, dataset: {route: ''}}, 'Audit records'),
    ], [button('Close', closeDialog, {className: 'primary'})]);
}

function requestDialog(cluster, o, request) {
    reviewPlan({action: `cluster_${request}_request`, target_type: 'cluster', target_name: cluster.name, summary: `${request === 'cancel' ? 'Cancel' : 'Retry'} ${OP_TITLES[o.kind]} ${shortId(o.op_id)}`,
        local_only: true, correlation_id: o.op_id, danger: request === 'cancel',
        steps: [insertStep('cluster_events', {op_id: o.op_id, cluster_id: cluster.cluster_id, kind: 'request', state: request, step: '', message: `${request} requested in the console`, data: '{}'},
            request === 'cancel' ? 'Request the cancellation' : 'Request a retry of the blocked step')],
        warning: request === 'cancel' ? 'A running operation stops at its next step, unless it has passed its irreversible boundary. Steps already done are not undone.'
            : 'The agent runs the operation again from its first step that is not done, with the attempts counted from zero.'});
}

function clusterOperations(state, cluster) {
    return [h('p', {className: 'note'}, 'Operations run one at a time per cluster, in the order they were requested; later ones wait. The agent records every step with its evidence; '
        + 'a restarted agent continues after the last completed step. States: queued, waiting, running, succeeded, failed, rejected (not authorized or unsafe), '
        + 'needs an operator (blocked after repeated failures: retry or cancel), outcome unknown (checked again), cancelled.'),
    clusterOperationsTable(cluster, cluster.ops)];
}

const DEPENDENCY_KINDS = ['Applications and client connections', 'Ingestion pipelines', 'Scheduled jobs and automation', 'Database users and integrations',
    'Dashboards and reports', 'Backup schedules', 'Other'];

function clusterRetirement(state, cluster) {
    const out = [];
    out.push(h('div', {className: 'box'}, h('h2', {}, 'Resources'), dataTable([
        {title: 'Resource', render: r => [h('strong', {}, r.name), h('div', {className: 'note'}, r.kind)]},
        {title: 'Disposition', render: r => badge(r.disposition, {deleted: '', retained: 'ok', stopped: 'warn', present: 'ok'}[r.disposition] || '')},
        {title: 'Owner', render: r => (r.owner_op ? `operation ${shortId(r.owner_op)}` : '—')},
        {title: 'Retention deadline', render: r => r.retention_until || '—'},
        {title: 'Evidence', render: r => [r.evidence, h('div', {className: 'note'}, `${r.updated_at} UTC by ${r.updated_by}`)]},
    ], cluster.resources, cluster.provider === 'external' ? 'Registered deployments have no resources owned by the console.' : 'No resource recorded.', 'Resources'),
    paragraph('Backups made through Backup & Restore and the console\'s records and audit log are kept after retirement and deletion; delete backups in Backup & Restore.')));
    if (cluster.provider === 'external') {
        out.push(h('div', {className: 'box'}, h('h2', {}, 'Remove from the inventory'), paragraph('A registered deployment is retired from the inventory only; '
            + 'the console has no access to its infrastructure.'), capabilityButton('Retire from the inventory', 'retire', () => reviewPlan({action: 'cluster_unregister', target_type: 'cluster',
            target_name: cluster.name, summary: `Retire ${cluster.name} from the inventory`, local_only: true, danger: true,
            steps: [insertStep('cluster_events', {op_id: '', cluster_id: cluster.cluster_id, kind: 'mode', state: 'retired', step: '', message: 'retired from the inventory', data: '{}'}, 'Set the mode to Retired'),
                insertStep('cluster_events', {op_id: '', cluster_id: cluster.cluster_id, kind: 'lifecycle', state: 'retired', step: '', message: 'retired from the inventory; the deployment is unchanged', data: '{}'}, 'Set the lifecycle to Retired')]}))));
        return out;
    }
    if (cluster.mode !== 'retired') {
        out.push(h('div', {className: 'box'}, h('h2', {}, 'Retire the cluster'), paragraph('Retirement stops the managed containers and keeps the volumes, the network, '
            + 'the generated configuration, the backups, and the records. It is separate from deleting infrastructure, which is a second, explicit operation below.'),
        capabilityButton('Start retirement', 'retire', () => retireWizard(state, cluster), {className: 'primary'})));
    }
    const deletable = cluster.resources.filter(r => r.disposition !== 'deleted');
    if ((cluster.mode === 'retired' || cluster.lifecycle === 'failed') && deletable.length) {
        out.push(h('div', {className: 'box'}, h('h2', {}, 'Delete resources'), paragraph('Irreversible. Only the resources you select are deleted, and only when Docker labels them as this cluster\'s. '
            + 'Deleting a volume deletes its data; deleting the directory deletes the generated credentials.'),
        capabilityButton('Delete resources', 'destroy', () => destroyDialog(cluster, deletable), {className: 'small danger'})));
    }
    return out;
}

function retireWizard(state, cluster) {
    const backups = cluster.ops.filter(o => o.kind === 'backup' && o.state === 'succeeded' && o.steps.some(s => s.step === 'verify' && s.state === 'done'));
    const w = {dependencies: DEPENDENCY_KINDS.map(item => ({item, disposition: '', note: ''})), final_backup_op: backups[0] ? backups[0].op_id : '', no_backup_reason: '',
        retention_until: '', holds: '', exports: true};
    const dispositions = [['', 'Choose…'], ['none', 'None exist'], ['redirected', 'Redirected to another cluster'], ['stopped', 'Stopped'], ['accepted', 'Accepted: will stop working']];
    wizard(`Retire ${cluster.name}`, [
        {title: 'Dependency review', render: () => h('div', {},
            paragraph('The console cannot see who uses this cluster: review each kind of dependency and record its disposition. Unknown is not a disposition.'),
            dataTable([{title: 'Dependency', render: d => d.item},
                {title: 'Disposition', render: d => select(dispositions, d.disposition, {onchange: e => { d.disposition = e.target.value; }})},
                {title: 'Notes', render: d => h('input', {type: 'text', value: d.note, oninput: e => { d.note = e.target.value; }})}], w.dependencies, null, 'Dependencies'),
            kvList([['Observed activity', (() => {
                const nodes = cluster.observations.filter(o => o.role === 'clickhouse' && o.data.queries_total !== undefined);
                return nodes.length ? nodes.map(o => `${o.data.name}: ${o.data.queries_total} queries since start, ${o.data.running_queries} running`).join('; ') : 'not observed';
            })()]])),
        validate: () => (w.dependencies.some(d => !d.disposition) ? 'Every dependency needs a disposition.' : null)},
        {title: 'Protection and disposition', render: () => h('div', {},
            adminField('Final backup', select([['', 'No final backup'], ...backups.map(b => [b.op_id, `${shortId(b.op_id)} · ${b.requested_at} UTC (verified)`])], w.final_backup_op,
                {onchange: e => { w.final_backup_op = e.target.value; }}), backups.length ? 'Only verified backups are offered.' : 'No verified backup: back up first on Protection & Recovery.'),
            adminField('Reason no backup is needed', h('input', {type: 'text', value: w.no_backup_reason, oninput: e => { w.no_backup_reason = e.target.value; }}),
                'Required without a final backup; the agent then also refuses a cluster that holds data.'),
            adminField('Keep retained resources until', h('input', {type: 'date', value: w.retention_until, oninput: e => { w.retention_until = e.target.value; }})),
            adminField('Legal or operational holds', h('input', {type: 'text', value: w.holds, oninput: e => { w.holds = e.target.value; }})),
            kvList([['Infrastructure', 'Containers stopped; volumes, network, and generated configuration retained.'],
                ['Backups and secrets', 'Backups stay in their Backup & Restore destination and keep its credentials; delete them there. The cluster\'s generated credentials stay on the agent host until the directory is deleted.'],
                ['Records', 'Configuration history, operations, observations (7 days), and audit records stay in the console tables.']])),
        validate: () => (!w.final_backup_op && !w.no_backup_reason.trim() ? 'Choose a verified final backup, or record why none is needed.' : null)},
        {title: 'Execution', render: () => h('ol', {className: 'steps'}, ...[
            'The agent checks that every dependency has a disposition and that no other operation is in progress.',
            'It checks the protection gate: the final backup succeeded with its verification, or the cluster holds no data.',
            'Irreversible boundary: from here the operation cannot be cancelled.',
            'It stops the managed containers and records every resource with its disposition and retention deadline.',
            'It sets the mode to Retired: lifecycle operations and observation stop. Deleting resources stays a separate operation.'].map(t => h('li', {}, t)))},
    ], 'Review', () => submitClusterOperation(cluster, 'retire', {capability: 'retire', danger: true, summary: `Retire ${cluster.name}`,
        parameters: {dependencies: w.dependencies, final_backup_op: w.final_backup_op || undefined, no_backup_reason: w.no_backup_reason.trim() || undefined,
            retention_until: w.retention_until || undefined, holds: w.holds || undefined},
        warning: 'Client traffic and ingestion must already be stopped or redirected by their owners: the lab has no load balancer to change.'}));
}

function destroyDialog(cluster, resources) {
    const boxes = resources.map(r => ({r, box: checkbox(`${r.kind} ${r.name} (${r.disposition}${r.retention_until ? `, keep until ${r.retention_until}` : ''})`, false)}));
    const all = checkbox(`Select all (${resources.length} resources)`, false);
    all.element.classList.add('select-all');
    all.input.addEventListener('change', () => { for (const b of boxes) b.box.input.checked = all.input.checked; });
    for (const b of boxes) b.box.input.addEventListener('change', () => {
        const checked = boxes.filter(x => x.box.input.checked).length;
        all.input.checked = checked === boxes.length;
        all.input.indeterminate = checked > 0 && checked < boxes.length;
    });
    const confirm = h('input', {type: 'text', autocomplete: 'off'});
    formDialog(`Delete resources of ${cluster.name}`, [h('fieldset', {className: 'box'}, h('legend', {}, 'Resources'), all.element, boxes.map(b => b.box.element)),
        adminField(`Type ${cluster.name} to confirm`, confirm)], 'Review', () => {
        const chosen = boxes.filter(b => b.box.input.checked).map(b => b.r);
        if (!chosen.length) return 'Choose the resources to delete.';
        if (confirm.value !== cluster.name) return 'The name does not match.';
        const early = chosen.filter(r => r.retention_until && r.retention_until > new Date().toISOString().slice(0, 10));
        if (early.length) return `Retained until a later date: ${early.map(r => r.name).join(', ')}.`;
        return operationPlan(cluster, 'destroy', {parameters: {resources: chosen.map(r => r.resource_id.replace(/^directory:.*$/, `directory:chc-${cluster.cluster_id.replace(/-/g, '').slice(0, 10)}`))},
            capability: 'destroy', danger: true, summary: `Delete ${chosen.length} resources of ${cluster.name}`,
            warning: `Irreversible: ${chosen.map(r => r.name).join(', ')}. Resources not selected are kept.`});
    });
}

$('switch-button').append(icon('switch'));
$('menu-button').append(icon('menu'));
$('login-logo').append(icon('logo'));
$('brand-logo').append(icon('logo'));
$('brand-link').dataset.route = '';
for (const button of document.querySelectorAll('.theme-toggle')) button.addEventListener('click', toggleTheme);
initTheme();
try {
    if (localStorage.getItem('console.sidebar-collapsed') === '1') $('shell').classList.add('collapsed');
} catch (e) {
    /// Storage is disabled: start expanded.
}

document.addEventListener('visibilitychange', () => {
    /// Re-check after the tab was in the background, when the periodic check was skipped.
    if (document.visibilityState === 'visible' && session && Date.now() - (session.status.verified_at || 0) > 60000) checkConnection();
});

async function loadConfig() {
    try {
        const response = await fetch(`${BASE_PATH}/config.json`, {credentials: 'omit', cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        config = {...config, ...await response.json()};
    } catch (e) {
        config_error = e.message;
    }
}

/// The sign-in window of an OpenID Connect provider returns here with its answer: hand it to the console page that
/// opened the window, and close. Nothing else of the console starts in that window.
if (location.pathname === OIDC_CALLBACK_PATH) {
    finishOidcCallback();
} else {
    loadConfig().then(() => {
        render();
    });
}
