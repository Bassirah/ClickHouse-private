/// `system.grants`: it handles the privilege hierarchy, wildcards, and partial revokes, but the server's
/// own check is authoritative.
function grantsCover(rows, tree, [access, database, table]) {
    const names = tree.ancestors(access);
    const covers = row => names.includes(row.access_type) && row.column === null
        && (row.database === null || row.database === database) && (row.table === null || row.table === table);
    return rows.some(row => !row.is_partial_revoke && covers(row)) && !rows.some(row => row.is_partial_revoke && covers(row));
}

function subjectGrantRows(grants, role_grants, subject) {
    const roles = roleClosure(role_grants, subject).map(item => item.role);
    return grants.filter(row => (subject.type === 'user' ? row.user_name === subject.name : row.role_name === subject.name)
        || (row.role_name !== null && roles.includes(row.role_name)));
}

/// Platform administrators are the users who can change the console policy (`INSERT` on its table).
/// Returns the holders before and after a change, to refuse changes that would leave none, or null when
/// the policy is not set up or the grants cannot be read.
async function platformAdminImpact(change) {
    const admin = session.admin;
    if (!admin.db || !['active', 'empty'].includes(admin.policy.state) || !admin.can.read_grants || !admin.can.read_users) return null;
    const [users, grants, role_grants, tree] = await Promise.all([
        adminRows('SELECT name FROM system.users'),
        adminRows(`SELECT ${GRANT_COLUMNS} FROM system.grants WHERE access_type IN ('INSERT', 'ALL') OR is_partial_revoke`),
        loadRoleGrants(),
        loadPrivilegeTree(),
    ]);
    const target = ['INSERT', admin.db, 'component_policy'];
    const holders = (grants_now, role_grants_now, excluded) => users.map(row => row.name).filter(name => name !== excluded
        && grantsCover(subjectGrantRows(grants_now, role_grants_now, {type: 'user', name}), tree, target));
    const before = holders(grants, role_grants, null);
    let after_role_grants = role_grants;
    let after_grants = grants;
    if (change.revoke_role) {
        after_role_grants = role_grants.filter(row => !(row.user_name === change.revoke_role.user && row.granted_role_name === change.revoke_role.role));
    }
    if (change.drop_role) {
        after_role_grants = role_grants.filter(row => row.granted_role_name !== change.drop_role && row.role_name !== change.drop_role);
        after_grants = grants.filter(row => row.role_name !== change.drop_role);
    }
    const after = holders(after_grants, after_role_grants, change.remove_user || null);
    return {before, after};
}

function lastAdminMessage(impact) {
    if (!impact || !impact.before.length || impact.after.length) return null;
    return `This would leave no platform administrator (a user who can change the console policy, estimated from system.grants: `
        + `${impact.before.join(', ')}). Grant the platform administrator role to another user first. `
        + 'The console cannot prevent this change when it is made with SQL directly.';
}

async function protectedReason(name) {
    const admin = session.admin;
    if (!admin.can.read_protected) return null;
    const rows = await adminRows(`SELECT reason FROM ${quoteIdentifier(admin.db)}.protected_accounts FINAL WHERE name = {name:String} AND NOT deleted`, {name});
    return rows.length ? rows[0].reason || 'No reason given.' : null;
}

/// Roles the signed-in user can grant: every role with `ROLE ADMIN`, otherwise those granted to it with
/// the admin option.
async function assignableRoles() {
    if (session.admin.can.role_admin && session.admin.can.read_roles) {
        return (await adminRows('SELECT name FROM system.roles ORDER BY name')).map(row => row.name);
    }
    return session.admin.enabled_roles.filter(row => row.with_admin_option).map(row => row.role_name);
}

/// --- Administration: Users ---

const PAGE_SIZE = 50;
const user_list_state = {q: '', offset: 0};
const USER_COLUMNS = `name, toString(id) AS id, storage, auth_type, arrayMap(t -> toUnixTimestamp(t), valid_until) AS valid_until,
    host_ip, host_names, host_names_regexp, host_names_like, default_roles_all, default_roles_list, default_roles_except,
    default_database, grantees_any, grantees_list, grantees_except`;

ADMIN_PAGES.users = (root, route, page) => (route.sub !== null ? renderUserDetails(root, route, page) : renderUserList(root, page));

function scopedNote(kind) {
    const patterns = [...new Set([`CREATE ${kind}`, `ALTER ${kind}`, `DROP ${kind}`].flatMap(p => session.admin.scoped[p] || []))];
    if (!patterns.length || session.admin.can[`alter_${kind.toLowerCase()}`]) return null;
    return h('p', {className: 'note'}, `You can manage ${kind.toLowerCase()}s whose names match: ${patterns.join(', ')}.`);
}

function renderUserList(root, page) {
    const c = page.component;
    const results = h('div', {className: 'box'});
    const search = h('input', {type: 'search', value: user_list_state.q, placeholder: 'Name contains…', autocomplete: 'off', spellcheck: false});
    const load = () => loadInto(page, results, () => loadUsers(user_list_state.q, user_list_state.offset), data => renderUsersTable(data, load));
    put(root,
        pageHeader(c, 'Users', null, [button('Refresh', load),
            canManage('CREATE USER') ? button('Create user', () => createUserDialog(), {className: 'primary'}) : null]),
        h('p', {className: 'note'}, 'Database users of this server. Signing in to the console uses these users. A user here is not an account '
            + 'in ClickStack or other separately deployed services, and creating one does not give access to them. '
            + 'ClickHouse does not store e-mail addresses, creation dates, or last logins of users, so they are not shown.'),
        scopedNote('USER'), scopeControl(), identityProvidersNote(),
        h('div', {className: 'toolbar'}, adminField('Search', search)),
        results);
    let timer = null;
    search.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
            user_list_state.q = search.value.trim();
            user_list_state.offset = 0;
            load();
        }, 250);
    });
    load();
}

async function loadUsers(q, offset) {
    const result = await adminSelect(`SELECT ${USER_COLUMNS} FROM system.users WHERE positionCaseInsensitive(name, {q:String}) > 0
        ORDER BY name LIMIT {limit:UInt32} OFFSET {offset:UInt32}`, {q, limit: PAGE_SIZE, offset});
    const users = result.data;
    const names = arrayParam(users.map(user => user.name));
    const [roles, profiles, quotas] = await Promise.allSettled([
        adminRows('SELECT user_name, granted_role_name, granted_role_is_default FROM system.role_grants WHERE user_name IN {names:Array(String)} ORDER BY granted_role_name', {names}),
        adminRows('SELECT user_name, inherit_profile FROM system.settings_profile_elements WHERE user_name IN {names:Array(String)} AND inherit_profile IS NOT NULL ORDER BY index', {names}),
        adminRows('SELECT name, apply_to_all, apply_to_list, apply_to_except FROM system.quotas ORDER BY name'),
    ]);
    for (const outcome of [roles, profiles, quotas]) {
        if (outcome.status === 'rejected' && outcome.reason instanceof AdminSessionChanged) throw outcome.reason;
    }
    return {users, total: result.rows_before_limit ?? users.length, offset,
        roles: roles.status === 'fulfilled' ? roles.value : null,
        profiles: profiles.status === 'fulfilled' ? profiles.value : null,
        quotas: quotas.status === 'fulfilled' ? quotas.value : null};
}

function quotasFor(quotas, name, roles) {
    const subjects = [name, ...roles];
    return quotas.filter(q => q.apply_to_all ? !subjects.some(s => q.apply_to_except.includes(s)) : subjects.some(s => q.apply_to_list.includes(s)));
}

function renderUsersTable(data, load) {
    const unknown = h('span', {className: 'note', title: 'Your user cannot read this information.'}, 'not readable');
    const table = dataTable([
        {title: 'User', render: user => [adminLink(user.name, 'admin-users', user.name), h('div', {className: 'note', title: 'Stable identifier (UUID)'}, user.id)]},
        {title: 'Authentication', render: user => chips(user.auth_type, type => badge(type, EXTERNAL_AUTH.includes(type) ? 'warn' : '',
            EXTERNAL_AUTH.includes(type) ? 'Credentials are checked by an external service or key, not stored passwords.' : null))},
        {title: 'Source', render: user => {
            const source = entitySource(user.storage);
            return badge(source.label, source.editable ? '' : 'warn', source.title);
        }},
        {title: 'Roles', render: user => {
            if (!data.roles) return unknown.cloneNode(true);
            const granted = data.roles.filter(row => row.user_name === user.name);
            return chips(granted, row => badge(row.granted_role_name, row.granted_role_is_default ? 'ok' : '',
                row.granted_role_is_default ? 'Default role: active at login.' : 'Not a default role: active only after SET ROLE.'));
        }},
        {title: 'Hosts', render: user => formatHosts(user)},
        {title: 'Profiles & quotas', render: user => {
            const parts = [];
            if (data.profiles) parts.push(...data.profiles.filter(row => row.user_name === user.name).map(row => badge(`profile ${row.inherit_profile}`)));
            if (data.quotas && data.roles) {
                const roles = data.roles.filter(row => row.user_name === user.name).map(row => row.granted_role_name);
                parts.push(...quotasFor(data.quotas, user.name, roles).map(q => badge(`quota ${q.name}`)));
            }
            return parts.length ? h('span', {className: 'chips'}, parts) : (data.profiles ? h('span', {className: 'note'}, '—') : unknown.cloneNode(true));
        }},
        {title: 'State', render: user => {
            const state = userState(user);
            return badge(state.label, state.className, state.title);
        }},
    ], data.users, user_list_state.q ? 'No users match the search.' : 'No users.', 'Users');
    const last = data.offset + data.users.length;
    const pager = h('div', {className: 'pager'},
        h('span', {}, data.users.length ? `${data.offset + 1}–${last} of ${data.total}` : `0 of ${data.total}`),
        button('Previous', () => { user_list_state.offset = Math.max(0, data.offset - PAGE_SIZE); load(); }, {className: 'small', disabled: data.offset === 0}),
        button('Next', () => { user_list_state.offset = data.offset + PAGE_SIZE; load(); }, {className: 'small', disabled: last >= data.total}));
    const notes = [];
    if (!data.roles || !data.profiles || !data.quotas) {
        notes.push(h('p', {className: 'note'}, 'Some columns are not readable by your user (system.role_grants, system.settings_profile_elements, or system.quotas).'));
    }
    return [table, pager, ...notes];
}

const USER_TABS = [['overview', 'Overview'], ['roles', 'Roles'], ['privileges', 'Permissions'], ['limits', 'Profiles & quotas'],
    ['components', 'Component access'], ['audit', 'Audit activity']];

async function loadUser(name) {
    const rows = await adminRows(`SELECT ${USER_COLUMNS} FROM system.users WHERE name = {name:String}`, {name});
    return rows[0] || null;
}

async function checkGrant(statement) {
    try {
        return (await adminText(`CHECK GRANT ${statement}`)).trim() === '1';
    } catch (e) {
        if (e instanceof AdminSessionChanged) throw e;
        return false;
    }
}

function renderUserDetails(root, route, page) {
    const c = page.component;
    const name = route.sub;
    const tab = USER_TABS.some(([key]) => key === route.tab) ? route.tab : 'overview';
    const crumbs = adminLink('Users', 'admin-users');
    const body = h('div', {className: 'admin-page'});
    root.replaceWith(body);
    put(body, pageHeader(c, name, crumbs));
    const content = h('div', {className: 'admin-page'});
    put(body, content);
    loadInto(page, content, async () => {
        const user = await loadUser(name);
        if (!user) return null;
        const [can_alter, can_drop, protected_reason] = await Promise.all([
            checkGrant(`ALTER USER ON ${quoteIdentifier(name)}`), checkGrant(`DROP USER ON ${quoteIdentifier(name)}`), protectedReason(name)]);
        return {user, can_alter, can_drop, protected_reason};
    }, data => {
        if (!data) {
            return [h('div', {className: 'message warning'}, `There is no user named "${name}". It may have been renamed or deleted, possibly outside of the console.`),
                h('div', {className: 'actions-row'}, adminLink('Back to Users', 'admin-users'))];
        }
        const context = {...data, name, page, source: entitySource(data.user.storage), state: userState(data.user)};
        const head = body.querySelector('.admin-head');
        put(head, userActions(context));
        head.querySelector('h1').after(badge(context.source.label, context.source.editable ? '' : 'warn', context.source.title),
            badge(context.state.label, context.state.className, context.state.title));
        const panel = h('div', {className: 'admin-page'});
        const parts = [];
        if (!context.source.editable) {
            parts.push(h('div', {className: 'message info'}, `Managed outside of SQL: ${context.source.title} `
                + 'The console shows it and does not change it. It does not move users between sources.'));
        }
        if (context.protected_reason) {
            parts.push(h('div', {className: 'message info'}, `Protected account: ${context.protected_reason} The console does not delete or suspend it. `
                + 'Remove the protection on the Component Access page first.'));
        }
        parts.push(scopeControl(), tabList(c, name, USER_TABS, tab), panel);
        USER_TAB_RENDERERS[tab](panel, context);
        return parts;
    });
}

function userActions(ctx) {
    const {user, source, state, can_alter, can_drop, protected_reason, name} = ctx;
    const self = name === session.server_user;
    const why = (...conditions) => conditions.find(([failed]) => failed)?.[1] || null;
    const not_editable = [!source.editable, `${source.label} users are not changed with SQL.`];
    const no_alter = [!can_alter, 'Your user does not have ALTER USER for this user.'];
    const external = user.auth_type.filter(type => EXTERNAL_AUTH.includes(type));
    const actions = [];
    const add = (text, handler, reason, options = {}) => actions.push(button(text, handler, {className: `small ${options.className || ''}`, disabled: !!reason, title: reason}));
    add('Edit', () => editUserDialog(ctx), why(not_editable, no_alter));
    add('Password', () => passwordDialog(ctx), why(not_editable, no_alter,
        [external.length, `Authenticated with ${external.join(', ')}: the credentials are managed outside of ClickHouse.`]));
    if (state.key === 'suspended') {
        add('Reactivate', () => reactivateDialog(ctx), why(not_editable, no_alter));
    } else {
        add('Suspend', () => suspendDialog(ctx), why(not_editable, no_alter, [self, 'You cannot suspend your own user.'],
            [protected_reason, 'Protected account.']));
    }
    add('Delete', () => deleteUserDialog(ctx), why(not_editable, [!can_drop, 'Your user does not have DROP USER for this user.'],
        [self, 'You cannot delete your own user.'], [protected_reason, 'Protected account.']), {className: 'danger'});
    return h('div', {className: 'actions-row'}, actions);
}

async function assignRoleDialog(ctx) {
    const roles = await assignableRoles();
    const granted = new Set((ctx.granted_roles || []).map(row => row.role));
    const available = roles.filter(role => !granted.has(role));
    if (!available.length) {
        openDialog('Assign role', [paragraph(roles.length ? `${ctx.name} already has every role you can grant.`
            : 'You cannot grant any role: that needs ROLE ADMIN, or a role granted to you WITH ADMIN OPTION.')], [button('Close', closeDialog)]);
        return;
    }
    const role = select(available, available[0]);
    const admin_option = checkbox('With admin option: the user can grant this role to others', false);
    const make_default = checkbox('Default role: active when a session starts', true);
    formDialog(`Assign a role to ${ctx.name}`, [
        adminField('Role', role, 'Roles you can grant: with ROLE ADMIN, every role; otherwise the roles granted to you WITH ADMIN OPTION.'),
        admin_option.element, make_default.element,
    ], 'Review', () => {
        const user = ctx.user;
        const steps = [{description: `Grant role ${role.value} to ${ctx.name}${admin_option.input.checked ? ' with admin option' : ''}`,
            sql: `GRANT${onCluster()} ${quoteIdentifier(role.value)} TO ${quoteIdentifier(ctx.name)}${admin_option.input.checked ? ' WITH ADMIN OPTION' : ''}`}];
        const default_clause = defaultRolesAfterAssign(user, role.value, make_default.input.checked);
        if (default_clause) {
            steps.push({description: make_default.input.checked ? `Make ${role.value} a default role` : `Keep ${role.value} out of the default roles`,
                sql: `ALTER USER ${quoteIdentifier(ctx.name)}${onCluster()} DEFAULT ROLE ${default_clause}`});
        }
        return {action: 'assign_role', target_type: 'user', target_name: ctx.name, summary: `Assign role ${role.value} to ${ctx.name}`, steps,
            recovery: 'The role was granted. Set the default roles on the Roles tab.'};
    });
}

/// The `DEFAULT ROLE` clause needed after granting `role`, or null when the current setting already does it.
function defaultRolesAfterAssign(user, role, make_default) {
    const list = role_list => role_list.map(quoteIdentifier).join(', ');
    if (user.default_roles_all) {
        if (make_default) return null;
        return `ALL EXCEPT ${list([...user.default_roles_except, role])}`;
    }
    if (!make_default) return null;
    return list([...user.default_roles_list, role]);
}

async function revokeRoleFromUser(ctx, role) {
    const impact = await platformAdminImpact({revoke_role: {user: ctx.name, role}});
    const blocked = lastAdminMessage(impact);
    if (blocked) {
        openDialog('Revoke role', [h('div', {className: 'message error'}, blocked)], [button('Close', closeDialog)]);
        return;
    }
    reviewPlan({action: 'revoke_role', target_type: 'user', target_name: ctx.name, summary: `Revoke role ${role} from ${ctx.name}`,
        steps: [{description: `Revoke role ${role} from ${ctx.name}`, sql: `REVOKE${onCluster()} ${quoteIdentifier(role)} FROM ${quoteIdentifier(ctx.name)}`}],
        warning: 'Open sessions of the user lose the privileges of this role at their next query.', confirm_text: 'Revoke', danger: true});

/// Parses the allowed hosts: one per line, `ip`, `name`, `like`, or `regexp` followed by a value; a bare
/// value is an IP address or network when it looks like one, otherwise a host name.
function hostsClause(mode, text) {
    if (mode === 'any') return {sql: ' HOST ANY'};
    if (mode === 'local') return {sql: ' HOST LOCAL'};
    const entries = [];
    for (const raw of text.split('\n').map(line => line.trim()).filter(Boolean)) {
        const match = raw.match(/^(ip|name|like|regexp)\s+(.+)$/i);
        let kind, value;
        if (match) {
            kind = match[1].toUpperCase();
            value = match[2].trim();
        } else {
            kind = /^[0-9a-fA-F:.]+(\/\d{1,3})?$/.test(raw) && /[.:]/.test(raw) ? 'IP' : 'NAME';
            value = raw;
        }
        if (/[\u0000-\u001f]/.test(value)) return {error: 'Host entries must not contain control characters.'};
        entries.push(`${kind} ${quoteString(value)}`);
    }
    if (!entries.length) return {error: 'Enter at least one host, or choose another option.'};
    return {sql: ` HOST ${entries.join(', ')}`};
}

function hostsFields(user) {
    const current = user ? (user.host_ip.includes('::/0') ? 'any' : 'list') : 'any';
    const mode = select([['any', 'Any address'], ['local', 'Local connections only'], ['list', 'Listed addresses and names']], current);
    const lines = [];
    if (user) {
        lines.push(...user.host_ip.filter(ip => ip !== '::/0').map(ip => `ip ${ip}`), ...user.host_names.map(n => `name ${n}`),
            ...user.host_names_like.map(n => `like ${n}`), ...user.host_names_regexp.map(n => `regexp ${n}`));
    }
    const list = h('textarea', {rows: 3, spellcheck: false, value: lines.join('\n'), placeholder: '10.0.0.0/8\nname app.example.internal\nlike %.example.internal'});
    const list_field = adminField('Addresses', list, 'One per line: an IP address or network, a host name, or "like" / "regexp" followed by a pattern.');
    const sync = () => { list_field.hidden = mode.value !== 'list'; };
    mode.addEventListener('change', sync);
    sync();
    return {elements: [adminField('Allowed hosts', mode), list_field], clause: () => hostsClause(mode.value, list.value)};
}

/// Password inputs: typed twice, or generated. The value stays in these inputs and the statement only.
function passwordFields(required) {
    const mode = select([['generate', 'Generate a temporary password'], ['enter', 'Enter a password']], 'generate');
    const first = h('input', {type: 'password', autocomplete: 'new-password'});
    const second = h('input', {type: 'password', autocomplete: 'new-password'});
    const entered = h('div', {className: 'form-grid'}, adminField('Password', first), adminField('Repeat the password', second));
    const expiry = h('input', {type: 'date'});
    const sync = () => { entered.hidden = mode.value !== 'enter'; };
    mode.addEventListener('change', sync);
    sync();
    return {
        elements: [adminField('Password', mode), entered,
            adminField('Password expires (optional)', expiry, 'After this date (00:00 UTC) the password no longer works. ClickHouse cannot force a password change at the next login.')],
        value() {
            if (mode.value === 'generate') return {password: generatePassword(), generated: true};
            if (!first.value) return {error: required ? 'Enter a password.' : 'Enter a password, or generate one.'};
            if (first.value !== second.value) return {error: 'The passwords do not match.'};
            return {password: first.value, generated: false};
        },
        expiry() {
            if (!expiry.value) return 0;
            const seconds = Date.parse(`${expiry.value}T00:00:00Z`) / 1000;
            return seconds;
        },
        clear() {
            first.value = '';
            second.value = '';
        },
    };
}

/// --- Administration: directory sign-in (LDAP user directory) ---
///
/// Users are managed in the console with SQL. An LDAP user directory, configured on the server (`ldap_servers` and
/// `user_directories.ldap`), lets the users of a directory sign in as well, with their directory password and the roles
/// mapped from their LDAP groups. Such users are not created in ClickHouse and are read-only here.

/// The LDAP user directories of the server, as `system.user_directories` reports them.
function ldapDirectories() {
    return (session.admin.directories || []).filter(d => d.type === 'ldap').map(d => ({...d, params: parseJSON(d.params, {})}));
}

function directorySignInBox(page) {
    const directories = ldapDirectories();
    const box = h('div', {className: 'box'}, h('div', {className: 'admin-head'}, h('h2', {}, 'Directory sign-in (LDAP)'), h('span', {className: 'spacer'}),
        directories.length ? button('Test sign-in…', () => testDirectorySignIn(), {className: 'small'}) : null,
        button(directories.length ? 'Add a directory…' : 'Configure LDAP…', () => ldapConfigDialog(null), {className: 'small'})));
    if (!session.admin.can.read_directories) {
        box.append(paragraph('Your user cannot read system.user_directories, so the console cannot tell whether an LDAP directory is configured.'));
        return box;
    }
    if (!directories.length) {
        box.append(paragraph('Users are managed here, with SQL. To let the users of an LDAP directory (OpenLDAP, Active Directory) sign in as well, with their '
            + 'directory password and roles mapped from their groups, configure an LDAP user directory on the server: the users and roles here keep working.'));
        return box;
    }
    const content = h('div', {}, h('span', {className: 'spinner'}));
    box.append(paragraph('Users of the LDAP directory sign in with their directory password. They are not created here: their roles come from the default roles '
        + 'and from their LDAP groups, and they appear in the list below, read-only, once they have signed in. The users and roles managed here keep working.'),
    content);
    adminRows('SELECT name FROM system.roles ORDER BY name').then(rows => {
        if (!isCurrent(page)) return;
        const roles = new Set(rows.map(r => r.name));
        const order = (session.admin.directories || []).map(d => d.name);
        content.replaceChildren(...directories.map(d => {
            const mappings = d.params.role_mappings || [];
            const defaults = d.params.roles || [];
            const missing = defaults.filter(r => !roles.has(r));
            const before = order.slice(0, order.indexOf(d.name)).filter(Boolean);
            return h('div', {className: 'idp-directory'}, h('div', {className: 'actions-row'},
                h('h3', {}, d.name), h('span', {className: 'spacer'}), button('Configuration…', () => ldapConfigDialog(d), {className: 'small'})), kvList([
                ['Directory', `${d.name} (precedence ${d.precedence})`],
                ['LDAP server', h('code', {}, d.params.server || '—')],
                ['Default roles', defaults.length ? chips(defaults, r => badge(r, roles.has(r) ? 'ok' : 'bad', roles.has(r) ? null : 'This role does not exist: create it, or the users get nothing from it.'))
                    : h('span', {className: 'note'}, 'none')],
                ['Roles from groups', mappings.length ? h('div', {}, mappings.map(m => h('div', {className: 'note'},
                    `${m.attribute} of the entries under ${m.base_dn} (${m.scope}) that match ${m.search_filter}`, m.prefix ? `; values starting with "${m.prefix}" become the role named after the rest` : '; each value is a role name')))
                    : h('span', {className: 'note'}, 'no group mapping: only the default roles')],
                ['Precedence', before.length ? `A user name that also exists in ${before.join(', ')} signs in there, not in this directory.` : 'First of the user directories.'],
            ]), missing.length ? h('div', {className: 'message error'}, `Default roles that do not exist: ${missing.join(', ')}.`) : null,
            mappings.length && ![...roles].length ? h('div', {className: 'message warning'}, 'No role exists yet: groups map to roles by name, so create the roles the groups stand for.') : null);
        }));
    }, e => { if (!(e instanceof AdminSessionChanged)) content.replaceChildren(errorBox(e)); });
    return box;
}

/// Tries the credentials of a directory user once, with a query that reads the user's own name and enabled roles. The
/// password is used for this request only: it is not stored, shown again, or written to the audit log.
function testDirectorySignIn() {
    const user = h('input', {type: 'text', autocomplete: 'off', spellcheck: false});
    const password = h('input', {type: 'password', autocomplete: 'new-password'});
    const result = h('div', {});
    const run = async () => {
        result.replaceChildren(loadingBox('Signing in…'));
        let outcome;
        try {
            const response = await fetch('/', {method: 'POST', cache: 'no-store', credentials: 'omit',
                headers: {'X-ClickHouse-User': user.value, 'X-ClickHouse-Key': password.value},
                body: "SELECT currentUser() AS user, (SELECT groupArray(role_name) FROM system.enabled_roles) AS roles FORMAT JSON"});
            const text = await response.text();
            outcome = response.ok ? {ok: true, ...JSON.parse(text).data[0]} : {ok: false, error: text.trim().split('\n')[0].slice(0, 300)};
        } catch (e) {
            outcome = {ok: false, error: e.message};
        }
        password.value = '';
        let storage = null;
        if (outcome.ok) storage = ((await adminRows('SELECT storage FROM system.users WHERE name = {n:String}', {n: user.value}).catch(() => []))[0] || {}).storage || null;
        if (session.admin.can.write_audit) {
            await writeAudit(session, {action: 'test_directory_sign_in', target_type: 'user', target_name: user.value,
                summary: `Test the sign-in of ${user.value}: ${outcome.ok ? 'accepted' : 'refused'}`},
            {correlation_id: crypto.randomUUID(), scope: 'local', result: outcome.ok ? 'success' : 'failure', steps: []}, outcome.ok ? '' : outcome.error).catch(() => {});
        }
        result.replaceChildren(outcome.ok
            ? h('div', {className: 'message info'}, kvList([['Signed in as', outcome.user], ['Through', storage || 'unknown'],
                ['Roles', outcome.roles.length ? chips(outcome.roles) : 'none: the user can sign in but has no privileges from roles']]))
            : h('div', {className: 'message error'}, `Refused: ${outcome.error}`));
    };
    openDialog('Test a directory sign-in', [
        paragraph('Signs in once with these credentials and shows the roles the user gets. The password is used for this request only: it is not stored or '
            + 'recorded. With verification_cooldown, the server may reuse a successful check for that many seconds, so a change in the directory shows after it.'),
        adminField('User name', user), adminField('Password', password), result,
    ], [button('Close', closeDialog), button('Sign in', run, {className: 'primary'})]);
}

/// The XML of an LDAP server and an LDAP user directory, with secure defaults, for an administrator to deploy as a file
/// in config.d. The console cannot write the server configuration, and does not.
function ldapConfigXml(v) {
    const x = value => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const tls = {ldaps: ['yes', v.port || 636], starttls: ['starttls', v.port || 389]}[v.tls];
    return `<clickhouse>
    <!-- Directory sign-in for the web console: users of the LDAP directory sign in with their directory password.
         The users of users.xml and those created with SQL keep working. -->
    <ldap_servers>
        <${x(v.server)}>
            <host>${x(v.host)}</host>
            <port>${x(tls[1])}</port>
            <enable_tls>${tls[0]}</enable_tls>
            <tls_minimum_protocol_version>tls1.2</tls_minimum_protocol_version>
            <tls_require_cert>demand</tls_require_cert>${v.ca_file ? `
            <tls_ca_cert_file>${x(v.ca_file)}</tls_ca_cert_file>` : ''}
            <bind_dn>${x(v.bind_dn)}</bind_dn>
            <!-- Reuse a successful password check for this many seconds: the console sends a request for every action,
                 and without it each one is a bind to the directory. A user disabled in the directory keeps access for at most this long. -->
            <verification_cooldown>${x(v.cooldown)}</verification_cooldown>
            <operation_timeout>40</operation_timeout>
            <network_timeout>30</network_timeout>
            <search_timeout>20</search_timeout>
        </${x(v.server)}>
    </ldap_servers>
    <user_directories>
        <ldap>
            <server>${x(v.server)}</server>${v.roles.length ? `
            <roles>${v.roles.map(r => `<${x(r)}/>`).join('')}</roles>` : ''}${v.base_dn ? `
            <role_mapping>
                <base_dn>${x(v.base_dn)}</base_dn>
                <scope>subtree</scope>
                <search_filter>${x(v.search_filter)}</search_filter>
                <attribute>${x(v.attribute)}</attribute>
                <prefix>${x(v.prefix)}</prefix>
            </role_mapping>` : ''}
        </ldap>
    </user_directories>
</clickhouse>
`;
}

        server: field(p.server || 'corp'), host: field('ldap.example.com'), port: field('', {placeholder: '636 for LDAPS, 389 for StartTLS'}),

        ca_file: field('/etc/clickhouse-server/ldap-ca.crt'), bind_dn: field('uid={user_name},ou=users,dc=example,dc=org'), cooldown: field('300'),

        base_dn: field(m.base_dn || 'ou=groups,dc=example,dc=org'), search_filter: field(m.search_filter || '(&(objectClass=groupOfNames)(member={bind_dn}))'),

    };

    const values = () => ({server: f.server.value.trim(), host: f.host.value.trim(), port: f.port.value.trim(), tls: f.tls.value, ca_file: f.ca_file.value.trim(),
        bind_dn: f.bind_dn.value.trim(), cooldown: f.cooldown.value.trim(), roles: f.roles.value.split(',').map(r => r.trim()).filter(Boolean),
        base_dn: f.base_dn.value.trim(), search_filter: f.search_filter.value.trim(), attribute: f.attribute.value.trim(), prefix: f.prefix.value.trim()});
    const check = v => {
        if (!/^[A-Za-z_][A-Za-z0-9_-]*$/.test(v.server)) return 'The server name is an XML element name: letters, digits, _ and -.';
        if (!v.host) return 'Enter the host of the LDAP server.';

            copy.textContent = 'Copy failed: select the text';

        paragraph('Generates the server configuration of an LDAP user directory. The console does not change the server configuration: save the text as a file in '
            + 'config.d of the server (for example /etc/clickhouse-server/config.d/ldap.xml), readable by the server, and restart the server: a new user '
            + 'directory is created only when the server starts. Later changes of the LDAP server settings (host, TLS, cooldown) take effect with '
            + 'SYSTEM RELOAD CONFIG. Directory users then sign in with their directory password; the users and roles managed here keep working.'),
        existing ? h('div', {className: 'message info'}, `The server already has the directory ${existing.name} with the LDAP server ${existing.params.server}: the fields start from it, `
            + 'except the connection settings, which the server does not report.') : null,
        h('div', {className: 'form-grid'}, adminField('Server name', f.server), adminField('Host', f.host), adminField('Port', f.port), adminField('Encryption', f.tls)),
        adminField('CA certificate file', f.ca_file, 'The certificate authority of the LDAP server, on the ClickHouse host. The certificate of the server is always checked (tls_require_cert demand).'),
        adminField('Bind DN', f.bind_dn, 'The DN the server binds as to check a password; {user_name} is the name the user signs in with. For Active Directory: {user_name}@corp.example.com.'),
        adminField('Verification cooldown (seconds)', f.cooldown, 'Recommended: 300. 0 checks the password with the directory on every request.'),
        adminField('Default roles', f.roles),
        h('fieldset', {className: 'box'}, h('legend', {}, 'Roles from LDAP groups (leave the base DN empty for none)'),
            adminField('Base DN of the groups', f.base_dn), adminField('Search filter', f.search_filter),
            h('div', {className: 'form-grid'}, adminField('Attribute', f.attribute), adminField('Prefix', f.prefix)),
            h('p', {className: 'note'}, 'A group whose attribute is "<prefix>analysts" gives the role analysts. Groups without the prefix are ignored. The roles must exist.')),

/// --- Identity providers: SSO (OpenID Connect, Keycloak) ---

const OIDC_CALLBACK_PATH = `${BASE_PATH}/oidc-callback`;

/// The settings of the identity providers. A row is replaced by a new version; `deleted` removes it.
const IDP_TABLES = {
    idp_providers: () => `(
    id String,
    kind Enum8('keycloak' = 1),
    name String,
    enabled Bool,
    base_url String,
    realm String,
    client_id String,
    scopes String,
    username_claim String,
    groups_claim String,
    role_prefix String,
    default_roles Array(String),
    test_result String,
    tested_at Nullable(DateTime64(3, 'UTC')),
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY id`,
};

const IDP_COLUMNS = ['id', 'kind', 'name', 'enabled', 'base_url', 'realm', 'client_id', 'scopes', 'username_claim', 'groups_claim', 'role_prefix', 'default_roles',
    'test_result', 'tested_at', 'deleted'];

function idpIssuer(p) {
    return `${p.base_url.replace(/\/+$/, '')}/realms/${encodeURIComponent(p.realm)}`;
}

function oidcRedirectUri() {
    return `${location.origin}${OIDC_CALLBACK_PATH}`;
}

function isLoopbackHost(hostname) {
    return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';
}

/// Tokens and the sign-in page are reached over HTTPS. Plain HTTP only for a provider on this machine, for development.
function idpUrlProblem(text, what) {
    let url;
    try {
        url = new URL(text);
    } catch (e) {
        return `Enter the URL of ${what}, for example https://keycloak.example.com.`;
    }
    if (url.username || url.password || url.search || url.hash) return `The URL of ${what} cannot contain credentials, a query, or a fragment.`;
    if (url.protocol === 'https:') return null;
    if (url.protocol === 'http:' && isLoopbackHost(url.hostname)) return null;
    return `${what} must be reached over HTTPS. Plain HTTP is accepted only on localhost, for development.`;
}

function idpRowStep(row, description, removal = false) {
    const data = Object.fromEntries(IDP_COLUMNS.map(k => [k, row[k]]));
    data.tested_at = row.tested_at || null;
    data.deleted = removal;
    return {description, sql: `INSERT INTO ${quoteIdentifier(session.admin.db)}.idp_providers (${IDP_COLUMNS.join(', ')}) FORMAT JSONEachRow\n${JSON.stringify(data)}`};
}

async function loadIdpProviders() {
    const rows = await adminRows(`SELECT ${IDP_COLUMNS.join(', ')}, updated_at, updated_by FROM ${quoteIdentifier(session.admin.db)}.idp_providers FINAL
        WHERE NOT deleted ORDER BY name`);
    return rows.map(r => ({...r, enabled: r.enabled === true || r.enabled === 'true' || Number(r.enabled) === 1, test: parseJSON(r.test_result, null)}));
}

/// --- SSO: connection test ---

async function fetchProviderJSON(url, what) {
    let response;
    try {
        response = await fetch(url, {credentials: 'omit', cache: 'no-store', signal: AbortSignal.timeout(10000)});
    } catch (e) {
        throw new Error(`${what}: no answer from ${url} (${e.name === 'TimeoutError' ? 'timed out after 10 seconds' : 'the server cannot be reached, or it does not allow this console\'s origin (CORS)'}).`);
    }
    if (!response.ok) throw new Error(`${what}: ${url} answered HTTP ${response.status}${response.status === 404 ? ' (check the URL and the realm)' : ''}.`);
    try {
        return await response.json();
    } catch (e) {
        throw new Error(`${what}: ${url} did not return JSON.`);
    }
}

/// Keycloak answers an unknown realm with 404 and no CORS headers, which the browser reports as a network error, as it
/// does for a server it cannot reach. The realm master always exists: if it answers, the server is right and the realm is not.
async function idpDiscoveryProblem(p, error) {
    try {
        await fetchProviderJSON(`${p.base_url.replace(/\/+$/, '')}/realms/master/.well-known/openid-configuration`, 'Discovery');
    } catch (e) {
        return error.message;
    }
    return `Keycloak answers at ${p.base_url}, but has no realm ${p.realm}: check the name of the realm (it is case-sensitive).`;
}

/// Checks the provider from the browser, as the console will use it: the discovery document, its endpoints, the signing
/// keys, and the roles the groups map to. The client itself (redirect URI, web origin, PKCE) is checked by a test sign-in.
async function idpConnectionTest(p) {
    const checks = [];
    const add = (name, status, detail) => checks.push({name, status, detail});
    const issuer = idpIssuer(p);
    let discovery = null;
    let jwks = null;
    try {
        discovery = await fetchProviderJSON(`${issuer}/.well-known/openid-configuration`, 'Discovery');
        add('Discovery document', 'ok', `${issuer}/.well-known/openid-configuration`);
    } catch (e) {
        add('Discovery document', 'bad', await idpDiscoveryProblem(p, e));
    }
    if (discovery) {
        add('Issuer', discovery.issuer === issuer ? 'ok' : 'bad', discovery.issuer === issuer ? discovery.issuer
            : `The provider reports the issuer ${discovery.issuer}, not ${issuer}: tokens would be refused. Check the hostname setting of Keycloak (KC_HOSTNAME).`);
        const code = (discovery.response_types_supported || []).includes('code');
        add('Authorization Code flow', code ? 'ok' : 'bad', code ? 'response type code supported' : 'The provider does not offer the response type code.');
        const s256 = (discovery.code_challenge_methods_supported || []).includes('S256');
        add('PKCE', s256 ? 'ok' : 'bad', s256 ? 'S256 supported' : 'The provider does not report PKCE with S256.');
        const endpoints = ['authorization_endpoint', 'token_endpoint', 'jwks_uri', 'end_session_endpoint'].filter(k => discovery[k]);
        const insecure = endpoints.filter(k => idpUrlProblem(discovery[k], k));
        add('Endpoints', insecure.length ? 'bad' : 'ok', insecure.length ? `Not over HTTPS: ${insecure.join(', ')}.` : endpoints.map(k => k.replace(/_/g, ' ')).join(', '));
        try {
            jwks = await fetchProviderJSON(discovery.jwks_uri, 'Signing keys');
            const keys = (jwks.keys || []).filter(k => (k.use || 'sig') === 'sig' && ['RS256', 'ES256', 'PS256'].includes(k.alg || (k.kty === 'RSA' ? 'RS256' : '')));
            add('Signing keys', keys.length ? 'ok' : 'bad', keys.length ? `${keys.length} signing key${keys.length === 1 ? '' : 's'}: ${[...new Set(keys.map(k => k.alg || 'RS256'))].join(', ')}`
                : 'No signing key that the console can verify (RS256, ES256, PS256).');
        } catch (e) {
            add('Signing keys', 'bad', e.message);
        }
    }
    const roles = new Set((await adminRows('SELECT name FROM system.roles').catch(() => [])).map(r => r.name));
    const missing = (p.default_roles || []).filter(r => !roles.has(r));
    if ((p.default_roles || []).length) add('Default roles', missing.length ? 'bad' : 'ok', missing.length ? `Do not exist: ${missing.join(', ')}.` : p.default_roles.join(', '));
    if (p.groups_claim) {
        const mapped = [...roles].sort().map(r => `${p.role_prefix}${r}`);
        add('Roles for groups', roles.size ? 'ok' : 'warn', roles.size ? `A group named ${p.role_prefix ? `${p.role_prefix}<role>` : '<role>'} maps to an existing role, for example ${mapped.slice(0, 3).join(', ')}.`
            : 'No role exists yet: create the roles the groups stand for.');
    }
    const ok = checks.every(c => c.status !== 'bad');
    return {ok, checks, issuer, at: new Date().toISOString(), discovery};
}

function idpTestReport(test, title) {
    const label = {ok: ['OK', 'ok'], bad: ['Failed', 'bad'], warn: ['Check', 'warn']};
    return h('div', {className: `message ${test.ok ? 'info' : 'error'}`}, h('strong', {}, title), dataTable([
        {title: 'Check', render: c => c.name},
        {title: 'Result', render: c => badge(...label[c.status] || [c.status])},
        {title: 'Detail', render: c => c.detail},
    ], test.checks, null, 'Connection test'));
}

async function runIdpConnectionTest(p, container) {
    container.replaceChildren(loadingBox('Testing the connection…'));
    const test = await idpConnectionTest(p);
    const stored = {ok: test.ok, checks: test.checks, issuer: test.issuer};
    container.replaceChildren(idpTestReport(stored, test.ok ? 'The provider is reachable and set up for the console' : 'The connection test found problems'));
    const correlation_id = crypto.randomUUID();
    if (session.admin.can.write_idp) {
        await adminText(idpRowStep({...p, test_result: JSON.stringify(stored), tested_at: test.at.replace('T', ' ').replace('Z', '')}, '').sql).catch(e => {
            container.append(errorBox(e, 'The result could not be stored:'));
        });
    }
    if (session.admin.can.write_audit) {
        await writeAudit(session, {action: 'test_identity_provider', target_type: 'identity_provider', target_name: p.name,
            summary: `Test the connection to ${p.name}: ${test.ok ? 'passed' : 'failed'}`, audit_details: {issuer: test.issuer}},
        {correlation_id, scope: 'local', result: test.ok ? 'success' : 'failure', steps: []},
        test.ok ? '' : test.checks.filter(c => c.status === 'bad').map(c => `${c.name}: ${c.detail}`).join(' ')).catch(() => {});
    }
}

/// --- SSO: test sign-in (Authorization Code with PKCE, in a separate window) ---

function base64url(bytes) {
    let text = '';
    for (const byte of bytes) text += String.fromCharCode(byte);
    return btoa(text).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64urlDecode(text) {
    const padded = text.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - text.length % 4) % 4);
    return Uint8Array.from(atob(padded), ch => ch.charCodeAt(0));
}

const randomToken = () => base64url(crypto.getRandomValues(new Uint8Array(32)));

/// Verifies the signature of a JSON Web Token with the provider's keys, and returns its claims. Only asymmetric
/// algorithms: a token signed with `none` or a shared secret is refused.
async function verifyJwt(token, jwks) {
    const parts = String(token || '').split('.');
    if (parts.length !== 3) throw new Error('The token is not a signed JWT.');
    const header = JSON.parse(new TextDecoder().decode(base64urlDecode(parts[0])));
    const algorithms = {
        RS256: [{name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256'}, {name: 'RSASSA-PKCS1-v1_5'}],
        PS256: [{name: 'RSA-PSS', hash: 'SHA-256'}, {name: 'RSA-PSS', saltLength: 32}],
        ES256: [{name: 'ECDSA', namedCurve: 'P-256'}, {name: 'ECDSA', hash: 'SHA-256'}],
    };
    if (!algorithms[header.alg]) throw new Error(`The token is signed with ${header.alg}, which the console does not accept.`);
    const jwk = (jwks.keys || []).find(k => k.kid === header.kid && (k.use || 'sig') === 'sig');
    if (!jwk) throw new Error(`No signing key ${header.kid} among the provider's keys.`);
    const [import_params, verify_params] = algorithms[header.alg];
    const key = await crypto.subtle.importKey('jwk', {kty: jwk.kty, n: jwk.n, e: jwk.e, crv: jwk.crv, x: jwk.x, y: jwk.y}, import_params, false, ['verify']);
    const valid = await crypto.subtle.verify(verify_params, key, base64urlDecode(parts[2]), new TextEncoder().encode(`${parts[0]}.${parts[1]}`));
    if (!valid) throw new Error('The signature of the token is not valid.');
    return JSON.parse(new TextDecoder().decode(base64urlDecode(parts[1])));
}

/// Points the sign-in window at the provider's sign-in page, and waits for the answer that the window posts from the
/// redirect URI. The window is opened by the caller, in the click handler. `settings`: `{client_id, scopes, prompt}`.
function oidcAuthorize(discovery, settings, popup) {
    const state = randomToken();
    const nonce = randomToken();
    const verifier = randomToken();
    return (async () => {
        const challenge = base64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
        const url = new URL(discovery.authorization_endpoint);
        for (const [k, v] of Object.entries({client_id: settings.client_id, response_type: 'code', redirect_uri: oidcRedirectUri(), scope: settings.scopes, state, nonce,
            code_challenge: challenge, code_challenge_method: 'S256'})) url.searchParams.set(k, v);
        if (settings.prompt) url.searchParams.set('prompt', settings.prompt);
        popup.location.href = url.href;
        const answer = await new Promise((resolve, reject) => {
            const channel = new BroadcastChannel('console-oidc');
            const finish = (fn, value) => {
                clearTimeout(timeout);
                clearInterval(watch);
                channel.close();
                fn(value);
            };
            const timeout = setTimeout(() => finish(reject, new Error('No answer from the sign-in window within 5 minutes.')), 300000);
            /// The window may close itself right after it posted its answer: give the message a moment.
            const watch = setInterval(() => {
                if (popup.closed) setTimeout(() => finish(reject, new Error('The sign-in window was closed before the sign-in finished.')), 1500);
            }, 1000);
            channel.onmessage = e => {
                if (e.data && e.data.state === state) finish(resolve, e.data);
            };
        });
        return {answer, verifier, nonce};
    })();
}

/// A sign-in with an OpenID Connect provider: Authorization Code with PKCE in `popup`, the code exchanged for tokens, and the
/// ID token verified (signature, issuer, audience, expiry, nonce). `settings`: `{issuer, client_id, scopes, prompt}`.
/// Returns the verified claims of both tokens, the tokens, and the provider's discovery document.
async function oidcSignIn(settings, popup, discovery) {
    const {answer, verifier, nonce} = await oidcAuthorize(discovery, settings, popup);
    if (answer.error) throw new Error(`The provider refused the sign-in: ${answer.error}${answer.error_description ? ` (${answer.error_description})` : ''}.`);
    /// RFC 9207: the answer names the issuer that sent it, against mix-up attacks.
    if (answer.iss && answer.iss !== discovery.issuer) throw new Error(`The answer comes from ${answer.iss}, not from ${discovery.issuer}.`);
    let response;
    try {
        response = await fetch(discovery.token_endpoint, {method: 'POST', credentials: 'omit', cache: 'no-store', signal: AbortSignal.timeout(15000),
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams({grant_type: 'authorization_code', client_id: settings.client_id, code: answer.code, redirect_uri: oidcRedirectUri(), code_verifier: verifier})});
    } catch (e) {
        throw new Error(`The token request was blocked. Add ${location.origin} (or +) to the web origins of the client ${settings.client_id}.`);
    }
    const tokens = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(`The token request was refused: ${tokens.error || `HTTP ${response.status}`}${tokens.error_description ? ` (${tokens.error_description})` : ''}.`);
    const jwks = await fetchProviderJSON(discovery.jwks_uri, 'Signing keys');
    const id = await verifyJwt(tokens.id_token, jwks);
    const now = Date.now() / 1000;
    const audiences = [].concat(id.aud || []);
    const problems = [];
    if (id.iss !== discovery.issuer) problems.push(`the ID token is from ${id.iss}`);
    if (!audiences.includes(settings.client_id)) problems.push(`the ID token is not for the client ${settings.client_id}`);
    if (audiences.length > 1 && id.azp !== settings.client_id) problems.push('the ID token was issued to another client (azp)');
    if (!(id.exp > now)) problems.push('the ID token has expired');
    if (id.iat && id.iat > now + 60) problems.push('the ID token is issued in the future: check the clocks');
    if (id.nonce !== nonce) problems.push('the nonce does not match');
    if (problems.length) throw new Error(`The ID token is not valid: ${problems.join('; ')}.`);
    /// The access token is what the server checks: its audience must name the console's client.
    let access = null;
    let access_problem = null;
    try {
        access = await verifyJwt(tokens.access_token, jwks);
        if (![].concat(access.aud || []).includes(settings.client_id) && access.azp !== settings.client_id) access_problem = `its audience does not include ${settings.client_id}: add an Audience mapper`;
    } catch (e) {
        access_problem = e.message;
    }
    return {id, access, access_problem, tokens, discovery, expires_in: tokens.expires_in};
}

async function oidcTestSignIn(p, popup) {
    let discovery;
    try {
        discovery = await fetchProviderJSON(`${idpIssuer(p)}/.well-known/openid-configuration`, 'Discovery');
    } catch (e) {
        popup.close();
        throw new Error(await idpDiscoveryProblem(p, e));
    }
    /// prompt=login: a test asks for the password every time, even when the browser has a session with the provider.
    return oidcSignIn({issuer: idpIssuer(p), client_id: p.client_id, scopes: p.scopes, prompt: 'login'}, popup, discovery);
}

function idpTestSignInDialog(p) {
    const result = h('div', {});
    const run = async () => {
        /// Opened here, synchronously in the click: a window opened after an await is blocked as a pop-up.
        const popup = window.open('about:blank', 'console-oidc-test', 'popup,width=520,height=720');
        if (!popup) {
            result.replaceChildren(h('div', {className: 'message error', role: 'alert'}, 'The browser blocked the sign-in window: allow pop-ups for this page, and try again.'));
            return;
        }
        result.replaceChildren(loadingBox('Waiting for the sign-in in the other window…'));
        let outcome;
        try {
            outcome = {ok: true, ...await oidcTestSignIn(p, popup)};
        } catch (e) {

        }
        if (!outcome.ok) {
            result.replaceChildren(h('div', {className: 'message error', role: 'alert'}, outcome.error));
        } else {
            result.replaceChildren(await idpSignInReport(p, outcome));
        }
        if (session.admin.can.write_audit) {

            await writeAudit(session, {action: 'test_identity_provider_sign_in', target_type: 'identity_provider', target_name: p.name,
                summary: `Test a sign-in with ${p.name}: ${outcome.ok ? `accepted, as ${who}` : 'refused'}`, audit_details: {issuer: idpIssuer(p), user: who}},
            {correlation_id: crypto.randomUUID(), scope: 'local', result: outcome.ok ? 'success' : 'failure', steps: []}, outcome.ok ? '' : outcome.error).catch(() => {});
        }
    };
    openDialog(`Test a sign-in with ${p.name}`, [
        paragraph('Opens the Keycloak sign-in page in a new window. Sign in there as the user to test: the console then checks the answer and the tokens '
            + '(signature, issuer, audience, expiry, nonce) and shows who signed in and the roles they would get. The tokens are dropped afterwards: they are '
            + 'not stored, shown, or recorded. Keycloak asks for the password every time (prompt=login).'),
        result,
    ], [button('Close', closeDialog), button('Sign in with Keycloak', run, {className: 'primary'})]);
}

async function idpSignInReport(p, outcome) {
    const user = String(outcome.id[p.username_claim] ?? '');
    const groups_value = p.groups_claim ? (outcome.id[p.groups_claim] ?? (outcome.access || {})[p.groups_claim]) : null;
    const groups = Array.isArray(groups_value) ? groups_value.map(String) : (groups_value ? [String(groups_value)] : []);
    const from_groups = groups.filter(g => !p.role_prefix || g.startsWith(p.role_prefix)).map(g => g.slice(p.role_prefix.length).replace(/^\//, ''));
    const [roles, users] = await Promise.all([
        adminRows('SELECT name FROM system.roles').catch(() => []),
        user ? adminRows('SELECT name, storage, auth_type FROM system.users WHERE name = {n:String}', {n: user}).catch(() => []) : [],
    ]);
    const existing = new Set(roles.map(r => r.name));
    const role_chip = r => badge(r, existing.has(r) ? 'ok' : 'bad', existing.has(r) ? null : 'No such role on the server: create it, or the group gives nothing.');
    const ch_user = users[0];
    return h('div', {className: 'message info'}, kvList([
        ['Signed in as', user ? h('strong', {}, user) : h('span', {className: 'message error'}, `The ID token has no claim ${p.username_claim}.`)],
        ['Name and e-mail', [outcome.id.name, outcome.id.email].filter(Boolean).join(', ') || '—'],
        ['Groups', p.groups_claim ? chips(groups) : 'no group claim configured'],
        ['Roles it would get', chips([...new Set([...(p.default_roles || []), ...from_groups])], role_chip)],
        ['ClickHouse user', ch_user ? `${ch_user.name} exists (${ch_user.storage}, authentication ${ch_user.auth_type})`
            : 'No user of that name on this server.'],
        ['Access token', outcome.access_problem ? h('span', {className: 'badge bad'}, `Not usable by the server: ${outcome.access_problem}.`)
            : `Valid for ${outcome.expires_in} seconds; audience ${[].concat(outcome.access.aud || []).join(', ')}.`],
        ['Tokens', 'Checked and dropped: not stored or recorded.'],
    ]));
}

/// In the window that the provider redirects to: post the answer to the console page that opened the window, then close.
/// The answer is only the authorization code and the state: without the PKCE verifier, which stays in the opening page,
/// the code cannot be exchanged for a token.
function finishOidcCallback() {
    const params = new URLSearchParams(location.search);
    const answer = Object.fromEntries(['code', 'state', 'error', 'error_description', 'iss'].filter(k => params.has(k)).map(k => [k, params.get(k)]));
    history.replaceState(null, '', OIDC_CALLBACK_PATH);
    if (answer.state) {
        const channel = new BroadcastChannel('console-oidc');
        channel.postMessage(answer);
        channel.close();
    }
    document.body.replaceChildren(h('main', {className: 'oidc-callback'}, h('p', {}, answer.state
        ? 'The sign-in has finished: you can close this window.' : 'This page receives the answer of an identity provider. Open the console instead.')));
    if (answer.state) setTimeout(() => window.close(), 300);
}

/// --- Single sign-on on the sign-in page ---
///
/// With `web_console.sso_issuer` set in the server configuration, the sign-in page offers "Sign in with <sso_name>". The
/// console signs in with the provider (Authorization Code with PKCE, a public client), and uses the access token as the
/// password of the session: the server checks it through its HTTP authentication server (the token authenticator), for
/// users IDENTIFIED WITH http. The user name is the `sso_username_claim` of the verified ID token.
///
/// The tokens stay in this page's memory, like a password. The access token is refreshed before it expires, and the new
/// one is posted to the native panels; panels without that protocol (the SQL Console, the Web Terminal, ClickStack) keep
/// the token they started with, until they are reloaded. When the provider refuses a refresh (the session ended there, or
/// the user was disabled), the console signs out. Signing out also ends the session with the provider.

function ssoSettings() {
    if (!config.sso_issuer || !config.sso_client_id) return null;
    return {name: config.sso_name || 'single sign-on', issuer: String(config.sso_issuer).replace(/\/+$/, ''), client_id: config.sso_client_id,
        scopes: config.sso_scopes || 'openid profile email', username_claim: config.sso_username_claim || 'preferred_username'};
}

function updateLoginSSO() {
    const settings = ssoSettings();
    $('login-sso').hidden = !settings;
    if (settings) $('login-sso-button').textContent = `Sign in with ${settings.name}`;
}

async function ssoSignIn() {
    const settings = ssoSettings();
    if (!settings) return;
    /// Opened here, synchronously in the click: a window opened after an await is blocked as a pop-up.
    const popup = window.open('about:blank', 'console-oidc-sign-in', 'popup,width=520,height=720');
    if (!popup) {
        showLoginError('The browser blocked the sign-in window: allow pop-ups for this page, and try again.');
        return;
    }
    $('login-error').hidden = true;
    const button = $('login-sso-button');
    const attempt = ++login_attempt;
    button.disabled = true;
    button.replaceChildren(Object.assign(document.createElement('span'), {className: 'spinner'}), document.createTextNode(` Signing in with ${settings.name}…`));
    const done = () => {
        button.disabled = false;
        button.textContent = `Sign in with ${settings.name}`;
    };
    let result;
    try {
        const url_check = validateServerURL(location.origin);
        if (url_check.error) throw new Error(url_check.error);
        const problem = idpUrlProblem(settings.issuer, 'the identity provider');
        if (problem) throw new Error(problem);
        let discovery;
        try {
            discovery = await fetchProviderJSON(`${settings.issuer}/.well-known/openid-configuration`, 'Discovery');
        } catch (e) {
            popup.close();
            throw e;
        }
        result = await oidcSignIn(settings, popup, discovery);
        if (result.access_problem) throw new Error(`The access token cannot be used to sign in to ClickHouse: ${result.access_problem}.`);
        const user = String(result.id[settings.username_claim] ?? '');
        if (!user) throw new Error(`The provider's token has no claim ${settings.username_claim}, which is the user name.`);
        result.connection = {url: url_check.url, origin: url_check.origin, user, password: result.tokens.access_token};
    } catch (e) {
        if (attempt !== login_attempt) return;
        done();
        showLoginError(e.message);
        return;
    }
    const check = await runQuery(result.connection, CHECK_QUERY, new AbortController().signal);
    if (attempt !== login_attempt) return;
    done();
    if (!check.ok) {
        showLoginError(check.kind === 'credentials'
            ? `${settings.name} signed you in as ${result.connection.user}, but the server did not accept the sign-in. The user ${result.connection.user} must exist on the server, `
                + 'identified with the token authenticator (IDENTIFIED WITH http), and the authenticator must be running. Ask an administrator.'
            : check.message, check.kind === 'credentials' ? null : check.detail);
        return;
    }
    startSession(result.connection, check.data[0]);
    session.sso = {settings, discovery: result.discovery, refresh_token: result.tokens.refresh_token, id_token: result.tokens.id_token,
        expires_in: result.tokens.expires_in, timer: null};
    scheduleSsoRefresh(session);
    showLoginNotice('');
    navigate(parseRoute().next ? componentPath(parseRoute().next) : componentPath('home'), true);
}

function scheduleSsoRefresh(current, delay) {
    clearTimeout(current.sso.timer);
    current.sso.timer = setTimeout(() => refreshSsoToken(current), delay ?? Math.max(10, Number(current.sso.expires_in || 300) * 0.7) * 1000);
}

async function refreshSsoToken(current) {
    if (session !== current) return;
    let response;
    let tokens;
    try {
        response = await fetch(current.sso.discovery.token_endpoint, {method: 'POST', credentials: 'omit', cache: 'no-store', signal: AbortSignal.timeout(15000),
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams({grant_type: 'refresh_token', client_id: current.sso.settings.client_id, refresh_token: current.sso.refresh_token})});
        tokens = await response.json().catch(() => ({}));
    } catch (e) {
        /// The provider cannot be reached: the current token stays valid until it expires; try again shortly.
        if (session === current) scheduleSsoRefresh(current, 15000);
        return;
    }
    if (session !== current) return;
    if (!response.ok || !tokens.access_token) {
        const reason = tokens.error_description || tokens.error || `HTTP ${response.status}`;
        endSession();
        showLoginNotice(`Your ${current.sso.settings.name} session has ended (${reason}): sign in again. All panels were closed.`, true);
        navigate(loginPath(null), true);
        return;
    }
    current.password = tokens.access_token;
    if (tokens.refresh_token) current.sso.refresh_token = tokens.refresh_token;
    if (tokens.id_token) current.sso.id_token = tokens.id_token;
    current.sso.expires_in = tokens.expires_in;
    shareCredentials(current);
    scheduleSsoRefresh(current);
}

/// Posts new credentials to the native panels of the session, which accept them (`console-credentials`).
function shareCredentials(current) {
    for (const entry of frames.values()) {
        if (entry.component.integration !== 'native' || entry.session !== current || !entry.iframe.contentWindow) continue;
        entry.iframe.contentWindow.postMessage({type: 'console-credentials', user: current.user, password: current.password}, location.origin);
    }
}

/// The address that ends the session with the provider and returns to the sign-in page (RP-initiated logout). The
/// sign-in page must be a valid post-logout redirect URI of the client.
function ssoLogoutUrl(current) {
    const endpoint = current.sso && current.sso.discovery.end_session_endpoint;
    if (!endpoint) return null;
    const url = new URL(endpoint);
    url.searchParams.set('client_id', current.sso.settings.client_id);
    if (current.sso.id_token) url.searchParams.set('id_token_hint', current.sso.id_token);
    url.searchParams.set('post_logout_redirect_uri', `${location.origin}${BASE_PATH}/login`);
    return url.href;
}

/// How the server accepts these sign-ins: this build of ClickHouse does not check tokens itself, so a token authenticator
/// (`sso_authenticator.mjs`) does, as an HTTP authentication server. Shows what the sign-in page offers, and the users
/// identified with an HTTP authentication server.
function idpServerSideBox(page) {
    const settings = ssoSettings();
    const users = h('div', {}, h('span', {className: 'spinner'}));
    if (session.admin.can.read_users) {
        adminRows("SELECT name, arraySort(default_roles_list) AS roles FROM system.users WHERE has(auth_type, 'http') ORDER BY name").then(rows => {
            if (!isCurrent(page)) return;
            users.replaceChildren(rows.length ? dataTable([
                {title: 'User', render: r => adminLink(r.name, 'admin-users', r.name)},
                {title: 'Default roles', render: r => chips(r.roles || [])},
            ], rows, null, 'Users identified with an HTTP authentication server')
                : paragraph('No user is identified with an HTTP authentication server yet: the user sync of the authenticator creates them, or CREATE USER … IDENTIFIED WITH http SERVER \'sso\'.'));
        }, e => { if (!(e instanceof AdminSessionChanged)) users.replaceChildren(errorBox(e)); });
    } else {
        users.replaceChildren(paragraph('Your user cannot read the users of the server.'));
    }
    return h('div', {className: 'box'}, h('h2', {}, 'Signing in to ClickHouse'),
        h('p', {}, 'The console sends every query to the server, which authenticates each one. This build of ClickHouse does not check tokens itself, so the '
            + 'token authenticator (utils/web-console/sso_authenticator.mjs) does, as an HTTP authentication server: users IDENTIFIED WITH http SERVER \'sso\' sign '
            + 'in with their access token, which it checks with the keys of the provider (signature, issuer, client, audience, expiry, and the user name). '
            + 'Its user sync creates those users from the groups of the provider and grants the roles of the groups.'),
        kvList([

                : h('span', {className: 'note'}, 'No single sign-on: set web_console.sso_issuer and web_console.sso_client_id in the server configuration.')],
