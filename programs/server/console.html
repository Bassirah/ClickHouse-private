}

async function profileDialog(existing) {
    let settings, profiles;
    try {
        [settings, profiles] = await Promise.all([adminRows('SELECT name, type, description FROM system.settings ORDER BY name'),
            adminRows('SELECT name FROM system.settings_profiles ORDER BY name')]);
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog('Settings profile', [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const by_name = new Map(settings.map(s => [s.name, s]));
    const name = h('input', {type: 'text', value: existing ? existing.name : '', autocomplete: 'off', spellcheck: false, disabled: !!existing});
    const rows = h('div', {className: 'admin-page'});
    const add_row = (element = {}) => {
        const setting = h('input', {type: 'text', value: element.setting_name || '', list: 'profile-settings', autocomplete: 'off', spellcheck: false, 'aria-label': 'Setting'});
        const value = h('input', {type: 'text', value: element.value ?? '', autocomplete: 'off', spellcheck: false, 'aria-label': 'Value'});
        const min = h('input', {type: 'text', value: element.min ?? '', autocomplete: 'off', 'aria-label': 'Minimum'});
        const max = h('input', {type: 'text', value: element.max ?? '', autocomplete: 'off', 'aria-label': 'Maximum'});
        const writability = select([['WRITABLE', 'User can change'], ['CONST', 'Cannot be changed'], ['CHANGEABLE_IN_READONLY', 'Changeable in readonly']],
            element.writability || 'WRITABLE', {'aria-label': 'Writability'});
        const hint = h('span', {className: 'hint'});
        const sync = () => {
            const s = by_name.get(setting.value);
            hint.textContent = LIMIT_SETTINGS[setting.value] || (s ? `${s.type}. ${s.description.split('\n')[0].slice(0, 160)}` : (setting.value ? 'Unknown setting.' : ''));
        };
        setting.addEventListener('input', sync);
        sync();
        const row = h('div', {className: 'box'}, h('div', {className: 'form-grid'}, adminField('Setting', setting), adminField('Value', value),
            adminField('Minimum', min), adminField('Maximum', max), adminField('Users', writability)), hint,
            h('div', {className: 'actions-row'}, button('Remove', () => row.remove(), {className: 'small'})));
        row.read = () => ({setting: setting.value.trim(), value: value.value, min: min.value, max: max.value, writability: writability.value});
        rows.append(row);
    };
    for (const element of existing ? existing.elements.filter(e => e.setting_name) : []) add_row(element);
    if (!existing) add_row({setting_name: 'max_execution_time'});
    const inherits = profiles.filter(p => !existing || p.name !== existing.name).map(p => checkbox(p.name,
        !!existing && existing.elements.some(e => e.inherit_profile === p.name)));
    formDialog(existing ? `Edit profile ${existing.name}` : 'Create settings profile', [
        adminField('Name', name),
        h('datalist', {id: 'profile-settings'}, Object.keys(LIMIT_SETTINGS).concat(settings.map(s => s.name)).map(n => h('option', {value: n}))),
        rows, h('div', {className: 'actions-row'}, button('Add setting', () => add_row(), {className: 'small'})),
        inherits.length ? h('fieldset', {className: 'box'}, h('legend', {}, 'Inherit profiles'), inherits.map(b => b.element)) : null,
        h('p', {className: 'note'}, 'Minimum and maximum are constraints: users cannot set the setting outside of them. "Cannot be changed" fixes the value. '
            + (existing ? 'Saving replaces all settings of the profile.' : '')),
    ], 'Review', () => {
        const profile = existing ? existing.name : name.value;
        if (nameError(profile, 'profile')) return nameError(profile, 'profile');
        const parts = [];
        for (const row of [...rows.children].map(r => r.read())) {
            if (!row.setting) continue;
            const s = by_name.get(row.setting);
            if (!s) return `There is no setting named ${row.setting} on this server.`;
            let sql = row.setting;
            if (row.value.trim()) {
                const literal = settingLiteral(s.type, row.value, row.setting);
                if (literal.error) return literal.error;
                sql += ` = ${literal.sql}`;
            }
            for (const [keyword, raw] of [['MIN', row.min], ['MAX', row.max]]) {
                if (!raw.trim()) continue;
                const literal = settingLiteral(s.type, raw, `${row.setting} ${keyword.toLowerCase()}`);
                if (literal.error) return literal.error;
                sql += ` ${keyword} ${literal.sql}`;
            }
            if (row.writability !== 'WRITABLE') sql += ` ${row.writability}`;
            parts.push(sql);
        }
        const inherited = inherits.filter(b => b.input.checked).map(b => b.element.textContent);
        parts.push(...inherited.map(p => `INHERIT ${quoteString(p)}`));
        const clause = parts.length ? ` SETTINGS ${parts.join(', ')}` : (existing ? ' SETTINGS NONE' : '');
        return {action: existing ? 'edit_profile' : 'create_profile', target_type: 'profile', target_name: profile,
            summary: `${existing ? 'Edit' : 'Create'} settings profile ${profile}`,
            steps: [{description: `${existing ? 'Set' : 'Create with'} ${parts.length ? parts.join(', ') : 'no settings'}`,
                sql: `${existing ? 'ALTER' : 'CREATE'} SETTINGS PROFILE ${quoteIdentifier(profile)}${onCluster()}${clause}`}],
            warning: 'Sessions that are already open keep their settings.'};
    });
}

/// Quota interval units with the average lengths the server uses for them.
const INTERVAL_UNITS = [['second', 1], ['minute', 60], ['hour', 3600], ['day', 86400], ['week', 604800], ['month', 2629746], ['quarter', 7889238], ['year', 31556952]];

function intervalParts(seconds) {
    for (const [unit, size] of INTERVAL_UNITS.slice().reverse()) {
        if (seconds % size === 0) return [seconds / size, unit];
    }
    return [seconds, 'second'];
}

async function quotaDialog(existing) {
    const [users, roles] = await Promise.all([
        adminRows('SELECT name FROM system.users ORDER BY name').catch(() => []),
        adminRows('SELECT name FROM system.roles ORDER BY name').catch(() => []),
    ]);
    const name = h('input', {type: 'text', value: existing ? existing.name : '', autocomplete: 'off', spellcheck: false, disabled: !!existing});
    const KEYS = [['user_name', 'User name'], ['ip_address', 'Client IP address'], ['forwarded_ip_address', 'Forwarded IP address'],
        ['client_key', 'Client key'], ['client_key,user_name', 'Client key, else user name'], ['client_key,ip_address', 'Client key, else IP address'], ['', 'Not keyed (one shared counter)']];
    const keyed = select(KEYS, existing ? existing.keys.join(',') : 'user_name');
    const intervals = h('div', {className: 'admin-page'});
    const add_interval = (limits = null) => {
        const [amount_value, unit_value] = limits ? intervalParts(limits.duration) : [1, 'hour'];
        const amount = h('input', {type: 'number', min: 1, value: amount_value, 'aria-label': 'Interval length'});
        const unit = select(INTERVAL_UNITS.map(([u]) => u), unit_value, {'aria-label': 'Interval unit'});
        const randomized = checkbox('Randomized start', !!(limits && limits.is_randomized_interval));
        const inputs = QUOTA_LIMIT_COLUMNS.map(([column, key]) => [key, h('input', {type: 'text', inputMode: 'decimal', value: limits && limits[column] !== null ? limits[column] : '',
            autocomplete: 'off', 'aria-label': key})]);
        const row = h('div', {className: 'box'}, h('div', {className: 'form-grid'}, adminField('Every', amount), adminField('Unit', unit)), randomized.element,
            h('div', {className: 'form-grid'}, inputs.map(([key, input]) => adminField(key.replace(/_/g, ' '), input))),
            h('div', {className: 'actions-row'}, button('Remove interval', () => row.remove(), {className: 'small'})));
        row.read = () => ({amount: Number(amount.value), unit: unit.value, randomized: randomized.input.checked, limits: inputs.map(([key, input]) => [key, input.value.trim()])});
        intervals.append(row);
    };
    for (const limits of existing ? existing.limits : []) add_interval(limits);
    if (!existing) add_interval();
    const apply_mode = select([['list', 'The selected users and roles'], ['all', 'All users'], ['except', 'All users except the selected'], ['none', 'Nobody yet']],
        existing ? (existing.apply_to_all ? (existing.apply_to_except.length ? 'except' : 'all') : (existing.apply_to_list.length ? 'list' : 'none')) : 'list');
    const selected = existing ? (existing.apply_to_all ? existing.apply_to_except : existing.apply_to_list) : [];
    const targets = [...users.map(u => u.name), ...roles.map(r => r.name)].map(n => checkbox(n, selected.includes(n)));
    const target_box = h('fieldset', {className: 'box'}, h('legend', {}, 'Users and roles'), targets.map(t => t.element));
    const sync = () => { target_box.hidden = !['list', 'except'].includes(apply_mode.value); };
    apply_mode.addEventListener('change', sync);
    sync();
    formDialog(existing ? `Edit quota ${existing.name}` : 'Create quota', [
        adminField('Name', name), adminField('Count usage per', keyed), intervals,
        h('div', {className: 'actions-row'}, button('Add interval', () => add_interval(), {className: 'small'})),
        h('p', {className: 'note'}, 'Empty limits are not limited; an interval without limits only tracks usage. execution_time is in seconds; bytes accept units such as 10GiB.'),
        adminField('Applies to', apply_mode), target_box,
    ], 'Review', () => {
        const quota = existing ? existing.name : name.value;
        if (nameError(quota, 'quota')) return nameError(quota, 'quota');
        const parts = [];
        const durations = new Set();
        for (const interval of [...intervals.children].map(r => r.read())) {
            if (!Number.isInteger(interval.amount) || interval.amount < 1) return 'Interval lengths must be whole numbers of at least 1.';
            durations.add(interval.amount * INTERVAL_UNITS.find(([u]) => u === interval.unit)[1]);
            const limits = [];
            for (const [key, raw] of interval.limits) {
                if (!raw) continue;
                const literal = settingLiteral(key === 'execution_time' ? 'Float64' : 'UInt64', raw, key);
                if (literal.error) return literal.error;
                limits.push(`${key} = ${literal.sql}`);
            }
            parts.push(`FOR${interval.randomized ? ' RANDOMIZED' : ''} INTERVAL ${interval.amount} ${interval.unit} ${limits.length ? `MAX ${limits.join(', ')}` : 'TRACKING ONLY'}`);
        }
        /// `ALTER QUOTA` keeps intervals that are not mentioned: remove the ones that were deleted here.
        for (const limits of existing ? existing.limits : []) {
            if (!durations.has(limits.duration)) parts.push(`FOR INTERVAL ${limits.duration} second NO LIMITS`);
        }
        const chosen = targets.filter(t => t.input.checked).map(t => t.element.textContent);
        let to = '';
        if (apply_mode.value === 'all') to = ' TO ALL';
        else if (apply_mode.value === 'none') to = existing ? ' TO NONE' : '';
        else {
            if (!chosen.length) return 'Select at least one user or role.';
            to = apply_mode.value === 'list' ? ` TO ${chosen.map(quoteIdentifier).join(', ')}` : ` TO ALL EXCEPT ${chosen.map(quoteIdentifier).join(', ')}`;
        }
        const keys = keyed.value ? ` KEYED BY ${keyed.value.split(',').join(', ')}` : ' NOT KEYED';
        return {action: existing ? 'edit_quota' : 'create_quota', target_type: 'quota', target_name: quota, summary: `${existing ? 'Edit' : 'Create'} quota ${quota}`,
            steps: [{description: `${existing ? 'Set' : 'Create with'} ${parts.length ? parts.join('; ') : 'no intervals'}${to}`,
                sql: `${existing ? 'ALTER' : 'CREATE'} QUOTA ${quoteIdentifier(quota)}${onCluster()}${keys}${parts.length ? ' ' + parts.join(', ') : ''}${to}`}],
            warning: existing ? 'Usage counted so far is kept for intervals that stay.' : null};
    });
}

/// --- Administration: Audit Activity ---

const AUDIT_TABS = [['console', 'Console actions'], ['server', 'Access changes seen by the server'], ['decisions', 'Access decisions']];

/// Access-management statements, recognized by their first words (`ALTER USER` is logged with the query
/// kind `Create`, so the kind alone does not identify them).
const ACCESS_STATEMENT_REGEXP = '(?i)^[[:space:]]*(EXECUTE[[:space:]]+AS[[:space:]]+[^[:space:]]+[[:space:]]+)?((CREATE|ALTER|DROP)[[:space:]]+(USER|ROLE|QUOTA|SETTINGS[[:space:]]+PROFILE|PROFILE|ROW[[:space:]]+POLICY|POLICY|MASKING[[:space:]]+POLICY)|GRANT|REVOKE|SET[[:space:]]+DEFAULT[[:space:]]+ROLE)[[:space:]]';

async function loadAudit(filter) {
    return adminRows(`SELECT formatDateTime(event_time, '%Y-%m-%d %H:%i:%S', 'UTC') AS time, actor, server_host, toString(correlation_id) AS correlation_id,
            scope, target_type, target_name, action, summary, toString(result) AS result, error, details
        FROM ${quoteIdentifier(session.admin.db)}.audit_log
        WHERE event_time >= now64(3) - toIntervalDay({days:UInt32})
            AND ({target_type:String} = '' OR target_type = {target_type:String})
            AND ({target_name:String} = '' OR target_name = {target_name:String})
            AND ({result:String} = '' OR toString(result) = {result:String})
            AND ({q:String} = '' OR positionCaseInsensitive(concat(actor, ' ', target_name, ' ', action, ' ', summary, ' ', toString(correlation_id)), {q:String}) > 0)
        ORDER BY event_time DESC LIMIT 500`,
    {days: filter.days || 30, target_type: filter.target_type || '', target_name: filter.target_name || '', result: filter.result || '', q: filter.q || ''});
}

async function loadServerChanges(filter) {
    return adminRows(`SELECT formatDateTime(event_time, '%Y-%m-%d %H:%i:%S', 'UTC') AS time, user, toString(type) AS type, query,
            exception_code, exception, log_comment
        FROM system.query_log
        WHERE event_date >= toDate(now() - toIntervalDay({days:UInt32})) AND event_time >= now() - toIntervalDay({days:UInt32})
            AND type != 'QueryStart' AND is_initial_query AND match(query, {pattern:String})
            AND ({q:String} = '' OR positionCaseInsensitive(query, {q:String}) > 0 OR positionCaseInsensitive(user, {q:String}) > 0)
        ORDER BY event_time DESC LIMIT 500`,
    {days: filter.days || 7, q: filter.q || '', pattern: ACCESS_STATEMENT_REGEXP});
}

/// Query-time authorization decisions, kept apart from administrative changes: reads the server refused
/// (ACCESS_DENIED in system.query_log, with literals replaced by `normalizeQuery`, so values typed in a query
/// are not shown), and the runs of approved access tests.
async function loadDecisions(filter) {
    const denied = await adminRows(`SELECT formatDateTime(event_time, '%Y-%m-%d %H:%i:%S', 'UTC') AS time, user, normalizeQuery(query) AS query,
            extract(exception, 'necessary to have the grant ([^.]+)') AS needed, 'server' AS kind
        FROM system.query_log
        WHERE event_date >= toDate(now() - toIntervalDay({days:UInt32})) AND event_time >= now() - toIntervalDay({days:UInt32})
            AND type IN ('ExceptionBeforeStart', 'ExceptionWhileProcessing') AND exception_code = 497
            AND ({q:String} = '' OR positionCaseInsensitive(user, {q:String}) > 0 OR positionCaseInsensitive(query, {q:String}) > 0)
        ORDER BY event_time DESC LIMIT 500`, {days: filter.days || 7, q: filter.q || ''});
    const tests = session.admin.can.read_dap ? await adminRows(`SELECT formatDateTime(ran_at, '%Y-%m-%d %H:%i:%S', 'UTC') AS time, user_name AS user,
            concat('access test ', test_id, ' run by ', ran_by) AS query, concat(toString(outcome), ': ', observed) AS needed, 'test' AS kind
        FROM ${quoteIdentifier(session.admin.db)}.dap_test_runs
        WHERE ran_at >= now64(3) - toIntervalDay({days:UInt32}) AND ({q:String} = '' OR positionCaseInsensitive(user_name, {q:String}) > 0)
        ORDER BY ran_at DESC LIMIT 500`, {days: filter.days || 7, q: filter.q || ''}) : [];
    return [...denied, ...tests].sort((a, b) => b.time.localeCompare(a.time));
}

            + `ordinary table (${admin.db}.audit_log) on ${session.hostname}: users with ALTER, TRUNCATE, or DROP on it can change or remove them, so it is not tamper-proof.`
        : tab === 'decisions' ? `Reads refused by the server (ACCESS_DENIED) in system.query_log of ${session.hostname}, with the literals of the queries replaced by ?, `
            + 'and the runs of access tests. These are query-time decisions; the other tabs record administrative changes. Readable by users with SELECT on '
            + 'system.query_log (and on the access test runs); kept as long as the query_log retention and 365 days for test runs.'
        : `CREATE, ALTER, DROP of users, roles, profiles, quotas, and policies, GRANT, and REVOKE, from system.query_log of ${session.hostname}, including rejected `
            + 'attempts. Statements made in this console carry its correlation ID. Not covered: other servers of a cluster (each has its own log), users or sessions '
            + 'with log_queries disabled, changes to configuration files, and anything older than the query_log retention. The server masks passwords in the log. '
            + 'The log is flushed every few seconds, so the newest statements can be missing.';
    const load = () => {
        if (tab === 'console') loadInto(page, results, () => loadAudit({q: q.value.trim(), days: Number(days.value), result: result.value}), auditTable);
        else if (tab === 'decisions') loadInto(page, results, () => loadDecisions({q: q.value.trim(), days: Number(days.value)}), decisionsTable);
        else loadInto(page, results, () => loadServerChanges({q: q.value.trim(), days: Number(days.value)}), serverChangesTable);
    };
    let timer = null;
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 300); });
    days.addEventListener('change', load);
    result.addEventListener('change', load);
    const available = tab === 'console' ? admin.can.read_audit : admin.can.read_query_log;
    put(root, pageHeader(c, 'Audit Activity', null, [button('Refresh', load)]), tabList(c, null, AUDIT_TABS, tab),
        h('p', {className: 'note'}, coverage),
        available ? h('div', {className: 'toolbar'}, adminField('Search', q), adminField('Period', days), tab === 'console' ? adminField('Result', result) : null) : null,
        h('div', {className: 'box'}, available ? results : paragraph(tab === 'console'
            ? 'Not available: the console audit log is not set up (Component Access page), or your user cannot read it.'
            : 'Not available: your user cannot read system.query_log.')));
    if (available) load();
};

/// --- Administration: Data Access Policies, access model ---

/// The functions of this section are pure: they read rows of the system tables and of the console tables and
/// return explanations or plans, without queries or DOM. The access policy worker
/// (`utils/web-console/access_policy_worker.mjs`) loads them, with `quoteIdentifier`, `quoteString`, and
/// `roleClosure`, from this file by name, so that the console and the worker compute the same desired state.
/// Keep them free of browser APIs.

/// Names of the entities generated by policy rules start with this prefix, followed by the first 8 characters
/// of the rule ID: the prefix marks them for people; the ownership table `dap_owned` is what the console trusts.
const DAP_PREFIX = 'dap_';

/// Attribute values that disable an identity for every rule, whatever its selector.
const DAP_DISABLED_STATUSES = ['disabled', 'suspended', 'terminated', 'inactive'];

function dapGrantLevel(row) {
    if (row.database === null) return 'global';
    if (row.table === null || row.table === '') return 'database';
    if (row.column === null) return 'table';
    return 'column';
}

/// Whether a row of `system.grants` is about `access` (or a group containing it) on `column` of `database.table`.
function dapGrantCovers(row, names, database, table, column) {
    return names.includes(row.access_type) && (row.database === null || row.database === database)
        && (row.table === null || row.table === table) && (row.column === null || row.column === column);
}

/// The grantees whose privileges a user has: the user itself, then each role granted to it directly or through
/// other roles. `active` tells whether the grantee's privileges apply at login (the user itself, or a chain that
/// starts with a default role); the others apply only after `SET ROLE`.
function dapGrantees(role_grants, subject) {
    const self = {type: subject.type, name: subject.name, path: [], active: true};
    return [self, ...roleClosure(role_grants, subject).map(item => ({type: 'role', name: item.role, path: item.path,
        active: subject.type === 'role' || item.is_default}))];
}

/// How each column of `database.table` is accessible to a user or role, from `system.grants`. A partial revoke
/// removes a privilege only from the grants of the same grantee, as in the server: a revoke on the user does not
/// remove what a role gives. Returns per column the grants that give it, with their level and the role path.
/// This is the configured entitlement, an estimate from the grant tables; `EXECUTE AS ... CHECK GRANT` and the
/// access tests verify it.
function dapColumnAccess(grants, role_grants, tree, subject, access, database, table, columns) {
    const names = tree.ancestors(access);
    const grantees = dapGrantees(role_grants, subject);
    return columns.map(column => {
        const sources = [];
        for (const grantee of grantees) {
            const rows = grants.filter(row => (grantee.type === 'user' ? row.user_name === grantee.name : row.role_name === grantee.name)
                && dapGrantCovers(row, names, database, table, column));
            const revoked = rows.some(row => row.is_partial_revoke);
            for (const row of rows.filter(row => !row.is_partial_revoke)) {
                sources.push({grantee, row, level: dapGrantLevel(row), revoked});
            }
        }
        const effective = sources.filter(s => !s.revoked);
        return {column, sources, allowed_at_login: effective.some(s => s.grantee.active), allowed_with_roles: effective.length > 0,
            broad: effective.filter(s => s.level !== 'column')};
    });
}

/// Whether a row policy applies to a user with the given enabled roles (`RolesOrUsersSet::match`).
function dapPolicyApplies(policy, user, roles) {
    const names = [user, ...roles];
    if (policy.apply_to_all) return !names.some(name => policy.apply_to_except.includes(name));
    return names.some(name => policy.apply_to_list.includes(name));
}

/// The row filter a user gets on `database.table`, from `system.row_policies`: table policies and database
/// policies (`ON db.*`) together, permissive ones joined with OR, restrictive ones with AND. `unmatched_reads`
/// is the server setting `access_control_improvements.users_without_row_policies_can_read_rows`: SQL cannot
/// read it, so the caller states which value it assumes.
function dapRowFilter(policies, database, table, user, roles, unmatched_reads = true) {
    const relevant = policies.filter(p => p.database === database && (p.table === table || p.table === '' || p.table === null));
    const applying = relevant.filter(p => dapPolicyApplies(p, user, roles));
    const permissive = applying.filter(p => !p.is_restrictive);
    const restrictive = applying.filter(p => p.is_restrictive);
    const wrap = list => list.map(p => `(${p.select_filter})`);
    let text;
    let outcome;
    if (!applying.length) {
        if (!relevant.length) {
            outcome = 'no-policies';
            text = 'No row policy exists on this table: every row is visible.';
        } else if (unmatched_reads) {
            outcome = 'unmatched-all';
            text = 'Policies exist on this table, but none applies to this user: every row is visible '
                + '(access_control_improvements.users_without_row_policies_can_read_rows, enabled by default).';
        } else {
            outcome = 'unmatched-none';
            text = 'Policies exist on this table, but none applies to this user: no row is visible.';
        }
    } else {
        const parts = [];
        if (permissive.length) parts.push(permissive.length > 1 ? `(${wrap(permissive).join(' OR ')})` : wrap(permissive)[0]);
        else if (!unmatched_reads) parts.push('0');
        parts.push(...wrap(restrictive));
        outcome = 'filtered';
        text = parts.join(' AND ');
    }
    return {outcome, text, permissive, restrictive, relevant};
}

/// --- Policy rules ---

/// A rule is stored as a JSON spec in `dap_rules`, one row per revision:
/// - `kind`: `role_membership` (grant an existing role), `row_filter` (a row policy per attribute value), or
///   `column_clearance` (a generated role with SELECT on the columns classified with a label).
/// - `selector`: conditions on user attributes, all of which must hold: `[{attribute, values}]`.
/// - `on_stale`: `revoke` (a stale or missing attribute removes what the rule gave) or `keep` (what was already
///   provisioned stays until the attribute is fresh again; nothing new is provisioned from a stale value).
/// - `exceptions`: users the rule never provisions, for an entitlement revoked on purpose.
/// - kind fields: `role`; `database`, `table`, `column`, `attribute`; `label`, `attribute`, `values`.

function dapRuleShort(rule_id) {
    return rule_id.replace(/-/g, '').slice(0, 8);
}

/// A stable short name for an attribute value, for the name of its row policy.
function dapValueKey(value) {
    let hash = 2166136261;
    for (const ch of new TextEncoder().encode(value)) hash = Math.imul(hash ^ ch, 16777619) >>> 0;
    return hash.toString(16).padStart(8, '0');
}

/// The current value of each attribute of each user, with whether it is fresh: `{user: {attribute: {value,
/// source, observed_at, stale, reason}}}`. `now` is seconds since the epoch.
function dapAttributeIndex(values, definitions, now) {
    const defs = new Map(definitions.map(d => [d.attribute, d]));
    const index = {};
    for (const row of values) {
        const def = defs.get(row.attribute);
        const age = now - row.observed_at;
        let stale = false;
        let reason = '';
        if (!def) {
            stale = true;
            reason = 'The attribute is not defined.';
        } else if (row.source !== def.source) {
            stale = true;
            reason = `Reported by ${row.source}, but its source is ${def.source}.`;
        } else if (def.writer && row.updated_by !== def.writer) {
            /// `updated_by` is filled in by the server: only the writer of the definition is trusted.
            stale = true;
            reason = `Written by ${row.updated_by}, but only ${def.writer} writes ${row.attribute}.`;
        } else if (def.max_age_seconds && age > def.max_age_seconds) {
            stale = true;
            reason = `Last confirmed ${Math.round(age)} s ago; the limit is ${def.max_age_seconds} s.`;
        }
        (index[row.user_name] = index[row.user_name] || {})[row.attribute] = {value: row.value, source: row.source, observed_at: row.observed_at, stale, reason};
    }
    return index;
}

/// Why a rule cannot be represented by native controls, or null. Native grants and row policies are evaluated
/// with the identity and its roles only; attributes of the request (purpose, device, time, network) change per
/// query, so a rule on them would become a permanent grant, which is refused rather than approximated.
function dapRuleProblem(spec, definitions) {
    const defs = new Map(definitions.map(d => [d.attribute, d]));
    const attributes = [...(spec.selector || []).map(c => c.attribute), spec.attribute].filter(Boolean);
    for (const attribute of attributes) {
        const def = defs.get(attribute);
        if (!def) return `The attribute ${attribute} is not defined.`;
        if (def.dynamic) return `The attribute ${attribute} is evaluated per request (${def.category}): native grants and row policies cannot follow it. See "Dynamic access and masking".`;
        if (def.category !== 'user') return `The attribute ${attribute} describes a ${def.category}, not a user: only user attributes select users.`;
    }
    if (spec.kind === 'role_membership' && !spec.role) return 'Choose the role to grant.';
    if (spec.kind === 'row_filter' && !(spec.database && spec.table && spec.column && spec.attribute)) return 'Choose the table, the column, and the attribute that gives its value.';
    if (spec.kind === 'column_clearance' && !(spec.label && spec.attribute && (spec.values || []).length)) return 'Choose the label, the clearance attribute, and the values that clear it.';
    if (!['role_membership', 'row_filter', 'column_clearance'].includes(spec.kind)) return `Unknown rule kind ${spec.kind}.`;
    return null;
}

/// The users a rule selects: `matched` (with their attribute values), and `excluded` with the reason. A user is
/// excluded when disabled (the `employment_status` attribute), listed in the exceptions, failing the selector,
/// or when an attribute the rule needs is missing or stale: then `hold` is true when the rule keeps what was
/// already provisioned (`on_stale: keep`). `in_scope` users get the policy that shows no row of a row filter
/// rule: a disabled identity can still sign in with its own credentials, and without any policy it would see
/// every row it has SELECT on, more than while it was active.
function dapSelectUsers(spec, users, index) {
    const matched = [];
    const excluded = [];
    const needed = [...(spec.selector || []).map(c => c.attribute), spec.attribute].filter(Boolean);
    for (const user of users) {
        const attrs = index[user] || {};
        const status = attrs.employment_status;
        if (status && !status.stale && DAP_DISABLED_STATUSES.includes(status.value)) {
            excluded.push({user, reason: `Disabled identity (employment_status ${status.value}).`, hold: false, in_scope: true});
            continue;
        }
        if ((spec.exceptions || []).includes(user)) {
            excluded.push({user, reason: 'Listed in the exceptions of the rule.', hold: false});
            continue;
        }
        const missing = needed.filter(a => !attrs[a]);
        const stale = needed.filter(a => attrs[a] && attrs[a].stale);
        /// A user without any of the selector's attributes is simply not in scope.
        const selector_known = (spec.selector || []).every(c => attrs[c.attribute] && !attrs[c.attribute].stale);
        const selector_holds = selector_known && (spec.selector || []).every(c => c.values.includes(attrs[c.attribute].value));
        if (selector_known && !selector_holds) continue;
        if (!selector_known && (spec.selector || []).every(c => !attrs[c.attribute])) continue;
        if (missing.length || stale.length) {
            const reason = [missing.length ? `missing ${missing.join(', ')}` : '', ...stale.map(a => `${a} stale: ${attrs[a].reason.replace(/\.$/, '')}`)].filter(Boolean).join('; ');
            /// What was provisioned from the last known values is held only when every value is still known.
            const hold = spec.on_stale === 'keep' && !missing.length;
            excluded.push({user, reason: `In scope, but ${reason}.`, hold, in_scope: true,
                values: hold ? Object.fromEntries(needed.map(a => [a, attrs[a].value])) : null});
            continue;
        }
        matched.push({user, values: Object.fromEntries(needed.map(a => [a, attrs[a].value]))});
    }
    return {matched, excluded};
}

/// The entities a rule needs: `{key, kind, ...}` keyed for the ownership table. `owned` (keys this rule already
/// owns) lets `on_stale: keep` hold what was provisioned for users whose attributes are stale.
function dapRuleEntities(rule, users, index, classifications, owned) {
    const spec = rule.spec;
    const short = dapRuleShort(rule.rule_id);
    const {matched, excluded} = dapSelectUsers(spec, users, index);
    const held_entries = excluded.filter(e => e.hold);
    const held = held_entries.map(e => e.user);
    const entities = [];
    const notes = [];
    if (spec.kind === 'role_membership') {
        const grantees = [...matched.map(m => m.user), ...held.filter(user => owned.has(`role_grant:${spec.role}:${user}`))];
        for (const user of grantees) entities.push({key: `role_grant:${spec.role}:${user}`, kind: 'role_grant', role: spec.role, user});
    } else if (spec.kind === 'row_filter') {
        const by_value = new Map();
        const add = (value, user) => by_value.set(value, [...(by_value.get(value) || []), user]);
        for (const m of matched) add(m.values[spec.attribute], m.user);
        /// A held user keeps the policy of its last known value, if the rule provisioned it.
        for (const e of held_entries) {
            const value = e.values[spec.attribute];
            if (owned.has(`row_policy:${DAP_PREFIX}${short}_${dapValueKey(value)}:${spec.database}.${spec.table}`)) {
                add(value, e.user);
                notes.push(`${e.user}: kept in the policy for ${value} (on_stale keep): ${e.reason}`);
            }
        }
        /// Fail closed: a user in scope whose attribute is missing or stale gets a policy that shows no row,
        /// because without any policy the user would see every row.
        const closed = excluded.filter(e => e.in_scope && !e.hold).map(e => e.user);
        const policy = (name, filter, targets, value) => ({key: `row_policy:${name}:${spec.database}.${spec.table}`, kind: 'row_policy', name,
            database: spec.database, table: spec.table, filter, users: targets.slice().sort(), value});
        for (const [value, targets] of [...by_value.entries()].sort()) {
            entities.push(policy(`${DAP_PREFIX}${short}_${dapValueKey(value)}`, `${quoteIdentifier(spec.column)} = ${quoteString(value)}`, targets, value));
        }
        const unprovisioned_held = held_entries.filter(e => !by_value.get(e.values[spec.attribute])?.includes(e.user)).map(e => e.user);
        if (closed.length || unprovisioned_held.length) entities.push(policy(`${DAP_PREFIX}${short}_none`, '0', [...closed, ...unprovisioned_held], null));
    } else if (spec.kind === 'column_clearance') {
        const role = `${DAP_PREFIX}${short}_cleared`;
        entities.push({key: `role:${role}`, kind: 'role', role});
        for (const c of classifications.filter(c => c.label === spec.label)) {
            entities.push({key: `grant:${role}:${c.database}.${c.table}(${c.column})`, kind: 'grant', role, access: 'SELECT', database: c.database, table: c.table, column: c.column});
        }
        const cleared = matched.filter(m => spec.values.includes(m.values[spec.attribute])).map(m => m.user);
        const kept = held_entries.filter(e => spec.values.includes(e.values[spec.attribute]) && owned.has(`role_grant:${role}:${e.user}`)).map(e => e.user);
        for (const user of [...cleared, ...kept]) entities.push({key: `role_grant:${role}:${user}`, kind: 'role_grant', role, user});
        if (!classifications.some(c => c.label === spec.label)) notes.push(`No column is classified ${spec.label}: the role gets no privilege.`);
    }
    return {entities, matched, excluded, notes};
}

/// The state of the entities on the server, from the system tables, keyed like `dapRuleEntities`.
function dapObservedKeys(observed) {
    const keys = new Map();
    for (const role of observed.roles) keys.set(`role:${role.name}`, {kind: 'role'});
    for (const row of observed.role_grants.filter(row => row.user_name !== null)) keys.set(`role_grant:${row.granted_role_name}:${row.user_name}`, {kind: 'role_grant'});
    for (const row of observed.grants.filter(row => row.role_name !== null && !row.is_partial_revoke && row.column !== null)) {
        keys.set(`grant:${row.role_name}:${row.database}.${row.table}(${row.column})`, {kind: 'grant', access: row.access_type});
    }
    for (const p of observed.policies) {
        keys.set(`row_policy:${p.short_name}:${p.database}.${p.table}`, {kind: 'row_policy', filter: p.select_filter, users: p.apply_to_list.slice().sort(),
            all: p.apply_to_all, restrictive: p.is_restrictive});
    }
    return keys;
}

function dapCluster(scope) {
    return scope ? ` ON CLUSTER ${quoteIdentifier(scope)}` : '';
}

/// The statements that bring the server to the desired state of all enabled rules. Only entities the platform
/// owns are changed or removed: an entity that exists but is not owned is reported and left alone, and an owned
/// entity that was removed outside the platform is reported as drift and restored only when `restore` is set,
/// so that reconciliation does not silently undo a deliberate revocation.
/// `owned`: `[{rule_id, key}]` of `dap_owned`. Returns `{steps, conflicts, drift, removed_outside}`.
function dapPlan(desired, observed, owned, scope, restore = false) {
    const have = dapObservedKeys(observed);
    const owned_keys = new Set(owned.map(o => o.key));
    const want = new Map();
    for (const {rule, entities} of desired) {
        for (const e of entities) {
            const existing = want.get(e.key);
            if (existing && e.kind === 'row_policy') existing.users = [...new Set([...existing.users, ...e.users])].sort();
            else if (!existing) want.set(e.key, {...e, rule_id: rule.rule_id});
        }
    }
    const steps = [];
    const conflicts = [];
    const removed_outside = [];
    const on = dapCluster(scope);
    const policy_sql = e => `CREATE ROW POLICY OR REPLACE ${quoteIdentifier(e.name)}${on} ON ${quoteIdentifier(e.database)}.${quoteIdentifier(e.table)} `
        + `USING ${e.filter} AS permissive TO ${e.users.map(quoteIdentifier).join(', ')}`;
    const order = {role: 0, grant: 1, role_grant: 2, row_policy: 3};
    for (const e of [...want.values()].sort((a, b) => order[a.kind] - order[b.kind] || a.key.localeCompare(b.key))) {
        const current = have.get(e.key);
        const mine = owned_keys.has(e.key);
        if (current && !mine) {
            conflicts.push(e.kind === 'role_grant'
                ? {key: e.key, rule_id: e.rule_id, kind: 'granted-outside', message: `${e.user} already has the role ${e.role} through a grant made outside the platform: `
                    + 'it is left alone, and stays when the rule no longer applies.'}
                : {key: e.key, rule_id: e.rule_id, kind: 'exists-not-owned', message: `${e.key} exists but was not created by the platform: it is not changed. `
                    + 'Remove or rename it, then deploy again.'});
            continue;
        }
        if (!current && mine && !restore) {
            removed_outside.push({key: e.key, rule_id: e.rule_id, message: `${e.key} was created by the platform and removed outside of it. It is not restored unless you choose to restore removed entities; to revoke it on purpose, add an exception to the rule.`});
            continue;
        }
        if (e.kind === 'row_policy' && current) {
            /// The server stores the filter as it formats it, with backquotes only where needed.
            const plain = filter => String(filter).replace(/`([A-Za-z_][A-Za-z0-9_]*)`/g, '$1').replace(/\s+/g, ' ').trim();
            const same = plain(current.filter) === plain(e.filter) && !current.all && !current.restrictive && JSON.stringify(current.users) === JSON.stringify(e.users);
            if (!same) steps.push({op: 'update', key: e.key, rule_id: e.rule_id, description: `Update the row policy ${e.name} on ${e.database}.${e.table}: ${e.filter}, for ${e.users.join(', ')}`, sql: policy_sql(e)});
            continue;
        }
        if (current) continue;
        const create = {
            role: () => [`Create the role ${e.role}`, `CREATE ROLE IF NOT EXISTS ${quoteIdentifier(e.role)}${on}`],
            grant: () => [`Grant ${e.access}(${e.column}) ON ${e.database}.${e.table} to ${e.role}`,
                `GRANT${on} ${e.access}(${quoteIdentifier(e.column)}) ON ${quoteIdentifier(e.database)}.${quoteIdentifier(e.table)} TO ${quoteIdentifier(e.role)}`],
            role_grant: () => [`Grant the role ${e.role} to ${e.user}`, `GRANT${on} ${quoteIdentifier(e.role)} TO ${quoteIdentifier(e.user)}`],
            row_policy: () => [`Create the row policy ${e.name} on ${e.database}.${e.table}: ${e.filter}, for ${e.users.join(', ')}`, policy_sql(e)],
        }[e.kind]();
        steps.push({op: 'create', key: e.key, rule_id: e.rule_id, description: create[0], sql: create[1]});
    }
    /// Owned entities that no rule wants any more, in reverse order: memberships before privileges before roles.
    const drop_order = {row_policy: 0, role_grant: 1, grant: 2, role: 3};
    const obsolete = [...new Map(owned.filter(o => !want.has(o.key)).map(o => [o.key, o])).values()]
        .sort((a, b) => drop_order[a.key.split(':')[0]] - drop_order[b.key.split(':')[0]] || a.key.localeCompare(b.key));
    for (const o of obsolete) {
        if (!have.has(o.key)) {
            steps.push({op: 'forget', key: o.key, rule_id: o.rule_id, description: `Forget ${o.key}: it no longer exists`, sql: null});
            continue;
        }
        const [kind, ...rest] = o.key.split(':');
        const drop = {
            role: () => [`Drop the role ${rest[0]}`, `DROP ROLE IF EXISTS ${quoteIdentifier(rest[0])}${on}`],
            grant: () => {
                const match = rest.slice(1).join(':').match(/^(.*)\.(.*)\((.*)\)$/);
                return [`Revoke SELECT(${match[3]}) ON ${match[1]}.${match[2]} from ${rest[0]}`,
                    `REVOKE${on} SELECT(${quoteIdentifier(match[3])}) ON ${quoteIdentifier(match[1])}.${quoteIdentifier(match[2])} FROM ${quoteIdentifier(rest[0])}`];
            },
            role_grant: () => [`Revoke the role ${rest[0]} from ${rest[1]}`, `REVOKE${on} ${quoteIdentifier(rest[0])} FROM ${quoteIdentifier(rest[1])}`],
            row_policy: () => {
                const [database, table] = rest.slice(1).join(':').split('.');
                return [`Drop the row policy ${rest[0]} on ${database}.${table}`, `DROP ROW POLICY IF EXISTS ${quoteIdentifier(rest[0])}${on} ON ${quoteIdentifier(database)}.${quoteIdentifier(table)}`];
            },
        }[kind]();
        steps.push({op: 'remove', key: o.key, rule_id: o.rule_id, description: drop[0], sql: drop[1]});
    }
    return {steps, conflicts, removed_outside};
}

/// The desired entities of every enabled rule. Rules that native controls cannot represent are returned in
/// `rejected` and contribute nothing.
function dapDesired(rules, definitions, values, classifications, users, owned, now) {
    const index = dapAttributeIndex(values, definitions, now);
    const desired = [];
    const rejected = [];
    for (const rule of rules.filter(r => r.enabled && !r.deleted)) {
        const problem = dapRuleProblem(rule.spec, definitions);
        if (problem) {
            rejected.push({rule, problem});
            continue;
        }
        const owned_keys = new Set(owned.filter(o => o.rule_id === rule.rule_id).map(o => o.key));
        desired.push({rule, ...dapRuleEntities(rule, users, index, classifications, owned_keys)});
    }
    return {desired, rejected, index};
}

/// --- Administration: Data Access Policies ---

/// Five mechanisms, kept apart in the pages and the documentation:
/// 1. Column permissions: native grants `SELECT(column)`, enforced by the server for every client.
/// 2. Row policies: native `CREATE ROW POLICY`, a read filter enforced by the server.
/// 3. Attribute-driven provisioning: policy rules translated into native grants, role memberships, and row
///    policies, deployed and reconciled by the console and the access policy worker. Enforcement stays native;
///    a change of an attribute takes effect when it is reconciled, not per query.
/// 4. Dynamic, request-time ABAC: not provided. Native controls see only the identity and its roles; rules on
///    request attributes are refused (see "Dynamic access and masking" in the documentation).
/// 5. Column masking: native masking policies are refused by this build ("available only in ClickHouse Cloud");
///    the console does not present views as masking policies.
const DAP_TABS = [['columns', 'Column Permissions'], ['rows', 'Row Policies'], ['effective', 'Effective Access'], ['tests', 'Access Tests'],
    ['attributes', 'Attributes & Classifications'], ['rules', 'Policy Rules'], ['deployments', 'Policy Deployments']];

/// The console tables of the attribute-driven provisioning and of the access tests. Who wrote each row is filled
/// in by the server, so the attribute values carry their real writer: a value is trusted only when it was
/// written by the writer its definition names.
const DAP_TABLES = {
    dap_attributes: () => `(
    attribute String,
    category Enum8('user' = 1, 'resource' = 2, 'operation' = 3, 'environment' = 4),
    dynamic Bool,
    source String,
    writer String,
    owner String,
    max_age_seconds UInt32,
    description String,
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY attribute`,
    dap_user_attributes: () => `(
    user_name String,
    attribute String,
    value String,
    source String,
    observed_at DateTime('UTC'),
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY (user_name, attribute)`,
    dap_classifications: () => `(
    database String,
    table String,
    column String,
    label LowCardinality(String),
    source String,
    owner String,
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY (database, table, column)`,
    dap_rules: () => `(
    rule_id String,
    revision UInt32,
    name String,
    spec String,
    enabled Bool,
    deleted Bool DEFAULT false,
    note String,
    created_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    created_by String MATERIALIZED currentUser(),
    CONSTRAINT created_by_is_writer CHECK created_by = currentUser()
)
ENGINE = MergeTree ORDER BY (rule_id, revision)`,
    dap_owned: () => `(
    key String,
    rule_id String,
    revision UInt32,
    deployment_id String,
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY key`,
    dap_deployments: () => `(
    deployment_id String,
    kind Enum8('deploy' = 1, 'reconcile' = 2, 'verify' = 3, 'adopt' = 4),
    scope String,
    rules String,
    steps String,
    result Enum8('success' = 1, 'failure' = 2, 'partial' = 3, 'no_change' = 4),
    verification String,
    created_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    created_by String MATERIALIZED currentUser(),
    CONSTRAINT created_by_is_writer CHECK created_by = currentUser()
)
ENGINE = MergeTree ORDER BY created_at`,
    dap_access_tests: () => `(
    test_id String,
    name String,
    user_name String,
    database String,
    table String,
    columns Array(String),
    expect Enum8('allowed' = 1, 'denied' = 2),
    expected_rows Nullable(UInt64),
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY test_id`,
    dap_test_runs: () => `(
    run_id String,
    test_id String,
    user_name String,
    outcome Enum8('pass' = 1, 'fail' = 2, 'error' = 3),
    observed String,
    path LowCardinality(String),
    ran_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    ran_by String MATERIALIZED currentUser(),
    CONSTRAINT ran_by_is_writer CHECK ran_by = currentUser()
)
ENGINE = MergeTree ORDER BY ran_at
TTL toDateTime(ran_at) + INTERVAL 365 DAY`,
};

function dapTable(name) {
    return `${quoteIdentifier(session.admin.db)}.${quoteIdentifier(name)}`;
}

const POLICY_COLUMNS = 'name, short_name, database, table, storage, select_filter, is_restrictive, apply_to_all, apply_to_list, apply_to_except';

/// Users, roles, grants, role grants, and row policies of this server, for the pure functions of the access model.
async function dapLoadAccess() {
    const [users, roles, role_grants, grants, policies, tree] = await Promise.all([
        adminRows('SELECT name, storage FROM system.users ORDER BY name'),
        adminRows('SELECT name, storage FROM system.roles ORDER BY name'),
        loadRoleGrants(),
        adminRows(`SELECT ${GRANT_COLUMNS} FROM system.grants`),
        session.admin.can.read_row_policies ? adminRows(`SELECT ${POLICY_COLUMNS} FROM system.row_policies ORDER BY database, table, short_name`) : [],
        loadPrivilegeTree(),
    ]);
    return {users, roles, role_grants, grants, policies, tree, observed_at: new Date().toISOString().slice(0, 19).replace('T', ' ')};
}

/// The roles enabled at login for a user: the closure of its default roles.
function dapLoginRoles(role_grants, user) {
    return roleClosure(role_grants, {type: 'user', name: user}).filter(item => item.is_default).map(item => item.role);
}

function dapAllRoles(role_grants, user) {
    return roleClosure(role_grants, {type: 'user', name: user}).map(item => item.role);
}

function dapObjectPicker(databases, state, onchange) {
    const database = select([['', 'Choose a database'], ...databases.map(d => [d, d])], state.database || '');
    const table = select([['', 'Choose a table']], '');
    const fill = async () => {
        table.replaceChildren(h('option', {value: ''}, 'Choose a table'));
        if (!database.value) return;
        const rows = await adminRows('SELECT name FROM system.tables WHERE database = {db:String} AND NOT is_temporary ORDER BY name', {db: database.value});
        table.replaceChildren(h('option', {value: ''}, 'Choose a table'), ...rows.map(row => h('option', {value: row.name, selected: row.name === state.table}, row.name)));
    };
    database.addEventListener('change', async () => {
        state.database = database.value;
        state.table = '';
        await fill();
        onchange();
    });
    table.addEventListener('change', () => {
        state.table = table.value;
        onchange();
    });
    const ready = fill();
    return {database, table, ready};
}

async function dapDatabases() {
    return (await adminRows(`SELECT name FROM system.databases WHERE name NOT IN ('system', 'INFORMATION_SCHEMA', 'information_schema') ORDER BY name`)).map(row => row.name);
}

/// --- Column Permissions ---

            + 'the database, or every database, which still give every column. Prefer granting columns to a role and the role to users; direct grants to users are '
            + 'listed separately.'),
        h('details', {}, h('summary', {}, 'How column grants behave (verified on this server version)'), h('ul', {},

            h('li', {}, 'SELECT * fails unless every column of the table is granted: it does not return only the granted columns.'),

            h('li', {}, 'count() works with a grant on any one column, so the number of rows is visible.'),
            h('li', {}, 'A column added later is not covered by existing column grants; table, database, and global grants cover it, and tables created later too.'),
            h('li', {}, 'A renamed column keeps its grants only under the old name: the grant then names a column that no longer exists (listed below).'))),

function columnPermissionsView({access, columns, stale}) {
    const {database, table} = dap_state;
    const names = columns.map(c => c.name);
    const subjects = [...access.users.map(u => ({type: 'user', name: u.name, storage: u.storage})), ...access.roles.map(r => ({type: 'role', name: r.name, storage: r.storage}))];
    const rows = [];
    for (const subject of subjects) {
        const matrix = dapColumnAccess(access.grants, access.role_grants, access.tree, subject, 'SELECT', database, table, names);
        if (!matrix.some(m => m.sources.length)) continue;
        rows.push({subject, matrix});
    }
    const cell = m => {
        const effective = m.sources.filter(s => !s.revoked);
        if (!effective.length) return h('span', {className: 'note', title: m.sources.length ? 'Granted, then revoked for this column' : 'No grant'}, '—');
        const best = effective.find(s => s.grantee.active) || effective[0];
        const via = best.grantee.path.length ? ` via ${best.grantee.path.join(' → ')}` : '';
        const label = best.level === 'column' ? '✓' : '●';
        return badge(best.grantee.active ? label : `(${label})`, best.level === 'column' ? 'ok' : 'warn',
            `${COLUMN_LEVEL_TEXT[best.level]}${via}${best.grantee.active ? '' : ' (only after SET ROLE)'}`);
    };
    const users = rows.filter(r => r.subject.type === 'user');
    const roles = rows.filter(r => r.subject.type === 'role');
    const matrix = list => dataTable([
        {title: 'User or role', render: r => [adminLink(r.subject.name, r.subject.type === 'user' ? 'admin-users' : 'admin-roles', r.subject.name),
            h('div', {className: 'note'}, entitySource(r.subject.storage).label)]},
        ...names.map(name => ({title: name, render: r => cell(r.matrix.find(m => m.column === name))})),
    ], list, 'Nobody.', `Columns of ${database}.${table}`);
    const broad = [];
    for (const r of rows) {
        const narrow = r.matrix.some(m => m.sources.some(s => s.level === 'column' && !s.revoked));
        const seen = new Set();
        for (const m of r.matrix) {
            for (const s of m.broad) {
                const key = `${s.grantee.name}|${s.level}|${s.row.access_type}`;
                if (seen.has(key)) continue;
                seen.add(key);
                broad.push({subject: r.subject, source: s, narrow});
            }
        }
    }
    const direct = [];
    for (const r of users) {
        for (const m of r.matrix) {
            for (const s of m.sources) {
                if (s.level === 'column' && s.grantee.type === 'user' && !direct.some(d => d.user === r.subject.name && d.row === s.row)) direct.push({user: r.subject.name, row: s.row});
            }
        }
    }
    const editable = session.admin.can.read_grants;
    return [
        h('p', {className: 'note'}, `Observed at ${access.observed_at} UTC on ${session.hostname}. ✓ a column grant, ● a grant on the whole table or wider, `
            + '(…) only after SET ROLE (the role is not a default role), — no access. Hover a mark for its source.'),
        h('div', {className: 'actions-row'}, button('Grant columns', () => grantColumnsDialog(access, columns), {className: 'small primary', disabled: !editable})),
        h('h3', {}, 'Users'), matrix(users),
        h('h3', {}, 'Roles'), matrix(roles),
        h('h3', {}, 'Broader grants'),
        paragraph('These grants give every column of the table, whatever column grants say. A user listed here with column grants too gets the whole table: '
            + 'revoke the broader grant (or add a partial revoke) to make the column restriction effective.'),
        dataTable([
            {title: 'User or role', render: b => `${b.subject.type} ${b.subject.name}`},
            {title: 'Grant', render: b => h('code', {}, `${b.source.row.access_type} ON ${grantTargetText(b.source.row)}`)},
            {title: 'Level', render: b => badge(COLUMN_LEVEL_TEXT[b.source.level], 'warn')},
            {title: 'Through', render: b => b.source.grantee.path.length ? b.source.grantee.path.join(' → ') : 'Direct grant'},
            {title: 'Covers future objects', render: b => b.source.level === 'table' ? 'New columns' : 'New tables and columns'},
            {title: 'Overrides column grants', render: b => b.narrow ? badge('Yes', 'bad') : '—'},
        ], broad, 'None: only column grants give access to this table.', 'Broader grants'),
        h('h3', {}, 'Direct column grants to users'),
        dataTable([
            {title: 'User', render: d => adminLink(d.user, 'admin-users', d.user)},
            {title: 'Grant', render: d => h('code', {}, `${d.row.access_type}(${d.row.column}) ON ${database}.${table}`)},
            {title: '', render: d => button('Revoke', () => reviewPlan(revokeColumnPlan({type: 'user', name: d.user}, d.row)), {className: 'small'})},
        ], direct, 'None.', 'Direct column grants'),
        h('h3', {}, 'Grants on columns that no longer exist'),
        paragraph('Left behind by a renamed or dropped column. They give nothing today, but would apply again to a new column of the same name.'),
        dataTable([
            {title: 'User or role', render: row => row.user_name !== null ? `user ${row.user_name}` : `role ${row.role_name}`},
            {title: 'Grant', render: row => h('code', {}, `${row.access_type}(${row.column}) ON ${database}.${table}`)},
            {title: '', render: row => button('Revoke', () => reviewPlan(revokeColumnPlan(row.user_name !== null ? {type: 'user', name: row.user_name} : {type: 'role', name: row.role_name}, row)), {className: 'small'})},
        ], stale, 'None.', 'Stale column grants'),
    ];
}

function revokeColumnPlan(subject, row) {
    return {action: 'dap_revoke_columns', target_type: subject.type, target_name: subject.name,
        summary: `Revoke ${row.access_type}(${row.column}) ON ${row.database}.${row.table} from ${subject.name}`,
        steps: [{description: `Revoke ${row.access_type}(${row.column}) ON ${row.database}.${row.table}`, sql: revokeGrantSQL(subject, row, false)}],
        warning: 'Access to the column remains if the user or role has a broader grant, or the column through another role.'};
}

function grantColumnsDialog(access, columns) {
    const {database, table} = dap_state;
    const subject = select([['', 'Choose a role or user'], ...access.roles.map(r => [`role:${r.name}`, `role ${r.name}`]), ...access.users.map(u => [`user:${u.name}`, `user ${u.name} (direct grant)`])], '');
    const boxes = columns.map(c => ({name: c.name, box: checkbox(`${c.name} (${c.type})`, false)}));
    formDialog(`Grant columns of ${database}.${table}`, [
        adminField('To', subject, 'Prefer a role: grant the role to users. A direct grant to a user is listed separately.'),
        h('fieldset', {className: 'box'}, h('legend', {}, 'Columns'), boxes.map(b => b.box.element)),
    ], 'Review', () => {
        if (!subject.value) return 'Choose a role or user.';
        const chosen = boxes.filter(b => b.box.input.checked).map(b => b.name);
        if (!chosen.length) return 'Choose at least one column.';
        const [type, ...rest] = subject.value.split(':');
        const target = {type, name: rest.join(':')};
        const matrix = dapColumnAccess(access.grants, access.role_grants, access.tree, target, 'SELECT', database, table, columns.map(c => c.name));
        const broad = matrix.flatMap(m => m.broad);
        const all = chosen.length === columns.length;
        return {action: 'dap_grant_columns', target_type: type, target_name: target.name,
            summary: `Grant SELECT(${chosen.join(', ')}) ON ${database}.${table} to ${target.name}`,
            steps: [{description: `Grant SELECT on ${chosen.length} existing columns of ${database}.${table}`,
                sql: `GRANT${onCluster()} SELECT(${chosen.map(quoteIdentifier).join(', ')}) ON ${quoteIdentifier(database)}.${quoteIdentifier(table)} TO ${subjectSQL(target)}`}],
            warning: [broad.length ? `${target.name} already reads every column through ${[...new Set(broad.map(s => `${s.row.access_type} ON ${grantTargetText(s.row)}`))].join(', ')}: this grant changes nothing until that is revoked.` : '',
                'The grant covers these existing columns only, not columns added later.',
                all ? '' : 'SELECT * will fail for this grantee: it needs every column.'].filter(Boolean).join(' ')};
    });
}

/// --- Row Policies ---

function policyTargetsText(p) {
    if (p.apply_to_all) return p.apply_to_except.length ? `All except ${p.apply_to_except.join(', ')}` : 'All users';
    return p.apply_to_list.join(', ') || 'Nobody';
}

/// The users a row policy applies to at login, by name, from the targets and the role grants.
function policyUsers(policy, access) {
    return access.users.map(u => u.name).filter(user => dapPolicyApplies(policy, user, dapLoginRoles(access.role_grants, user)));

async function loadRowPolicyTable(database, table) {
    const access = await dapLoadAccess();
    /// Found by the name of the table in the definitions: a view that runs as its definer, any materialized view,
    /// and Distributed, Merge, and Buffer tables. A match by name is a candidate, not a proof.
    const paths = await adminRows(`SELECT database, name, engine FROM system.tables
        WHERE NOT (database = {db:String} AND name = {t:String})
            AND ((engine = 'View' AND match(create_table_query, '(?i)SQL SECURITY (DEFINER|NONE)')) OR engine IN ('MaterializedView', 'Distributed', 'Merge', 'Buffer'))
            AND (position(create_table_query, concat({db:String}, '.', {t:String})) > 0
                OR (engine IN ('Distributed', 'Merge', 'Buffer') AND position(create_table_query, {db:String}) > 0 AND position(create_table_query, {t:String}) > 0))
        ORDER BY database, name`, {db: database, t: table});
    return {access, paths, database, table};
}

function rowPolicyTableView({access, paths, database, table}) {
    const names = access.tree.ancestors('SELECT');
    const readers = access.users.map(u => u.name).filter(user => {
        const login = dapLoginRoles(access.role_grants, user);
        return access.grants.some(row => !row.is_partial_revoke && (row.user_name === user || login.includes(row.role_name))
            && names.includes(row.access_type) && (row.database === null || row.database === database) && (row.table === null || row.table === table));
    });
    const targeted = access.policies.filter(p => p.database === database && (p.table === table || p.table === '')).flatMap(p => policyUsers(p, access));
    const users = [...new Set([...readers, ...targeted])].sort();
    const rows = users.map(user => ({user, reads: readers.includes(user), filter: dapRowFilter(access.policies, database, table, user, dapLoginRoles(access.role_grants, user))}));
    const writers = access.users.map(u => u.name).filter(user => {
        const login = dapLoginRoles(access.role_grants, user);
        return access.grants.some(row => !row.is_partial_revoke && (row.user_name === user || login.includes(row.role_name))
            && ['INSERT', 'ALTER UPDATE', 'ALTER DELETE', 'ALTER TABLE', 'ALTER', 'ALL'].includes(row.access_type)
            && (row.database === null || row.database === database) && (row.table === null || row.table === table));
    });
    const outcome = {'no-policies': ['All rows', 'warn'], 'unmatched-all': ['All rows: no policy applies', 'bad'], 'unmatched-none': ['No rows', 'ok'], filtered: ['Filtered', 'ok']};
    return [
        h('p', {className: 'note'}, `Observed at ${access.observed_at} UTC on ${session.hostname}, with the roles each user has at login (default roles). `
            + 'The combined filter assumes the server default access_control_improvements.users_without_row_policies_can_read_rows = true, which SQL cannot read: '
            + 'confirm it with an access test.'),
        dataTable([
            {title: 'User', render: r => adminLink(r.user, 'admin-users', r.user)},
            {title: 'Can read the table', render: r => r.reads ? 'Yes' : badge('No SELECT', '', 'The policy applies, but the user has no SELECT on the table.')},
            {title: 'Rows visible', render: r => badge(...outcome[r.filter.outcome])},
            {title: 'Combined filter', render: r => r.filter.outcome === 'filtered' ? h('code', {}, r.filter.text) : h('span', {className: 'note'}, r.filter.text)},
            {title: 'From policies', render: r => [...r.filter.permissive, ...r.filter.restrictive].map(p => p.short_name).join(', ') || '—'},
        ], rows, 'No user can read this table, and no policy applies to anyone.', `Row filters of ${database}.${table}`),
        h('h3', {}, 'Paths that can undermine the filter'),
        dataTable([
            {title: 'Path', render: p => h('code', {}, `${p.database}.${p.name}`)},
            {title: 'Engine', render: p => p.engine},
            {title: 'Why', render: p => ({
                View: 'Runs as its definer (SQL SECURITY DEFINER or NONE): row policies of the reader on this table do not apply inside it.',
                MaterializedView: 'Copies rows into its target table as its definer; the copies are not filtered by the policies of this table.',
                Distributed: 'Reads the table on the shards. Shards apply the policies of the initial user only if a user of that name exists on them; column grants are checked on the Distributed table, not on this table.',
                Merge: 'Reads this table under the grants of the Merge table.',
                Buffer: 'Holds rows before they are written to this table.',
            })[p.engine] || 'Reads this table.'},
        ], paths, 'None found (by the name of the table in the definitions of views, materialized views, Distributed, Merge, and Buffer tables).', 'Bypass paths'),
        h('h3', {}, 'Users who can change rows'),
        paragraph('A row policy filters reads only: these users can insert, update, or delete rows outside their filter.'),
        h('p', {}, writers.length ? chips(writers, name => adminLink(name, 'admin-users', name)) : 'Nobody.'),
    ];
}

/// The structured editor writes conditions from a column, an operator, and values. Values are quoted for the type
/// of the column; the identity operator compares with `currentUser()`.
const ROW_CONDITION_OPERATORS = [['eq', '='], ['ne', '≠'], ['in', 'is one of'], ['not_in', 'is none of'], ['user', '= the user name (currentUser())']];
const ROW_CONDITION_PRESETS = ['branch', 'company', 'tenant', 'tenant_id', 'region', 'country', 'department'];

function rowConditionSQL(condition, columns) {
    const column = columns.find(c => c.name === condition.column);
    if (!column) return {error: `The column ${condition.column} does not exist.`};
    const numeric = /^(Nullable\()?(U?Int|Float|Decimal)/.test(column.type);
    const values = condition.values.split(',').map(v => v.trim()).filter(v => v !== '');
    const literal = value => {
        if (!numeric) return quoteString(value);
        if (!/^-?\d+(\.\d+)?$/.test(value)) throw new Error(`${value} is not a number, and ${column.name} is ${column.type}.`);
        return value;
    };
    const id = quoteIdentifier(column.name);
    try {
        if (condition.op === 'user') return {sql: `${id} = currentUser()`};
        if (!values.length) return {error: `Enter a value for ${column.name}.`};
        if (condition.op === 'eq' || condition.op === 'ne') {
            if (values.length > 1) return {error: `Use "is one of" for several values of ${column.name}.`};
            return {sql: `${id} ${condition.op === 'eq' ? '=' : '!='} ${literal(values[0])}`};
        }
        return {sql: `${id} ${condition.op === 'in' ? 'IN' : 'NOT IN'} (${values.map(literal).join(', ')})`};
    } catch (e) {
        return {error: e.message};
    }
}

/// Checks an expression typed by an administrator with the server's parser and analyzer: it must be one
/// expression over the columns of the table, without subqueries or table references.
async function validateRowFilter(database, table, expression) {
    const ast = await adminText(`EXPLAIN AST SELECT 1 FROM ${quoteIdentifier(database)}.${quoteIdentifier(table)} WHERE (${expression})`);
    const tables = (ast.match(/TableIdentifier|TableExpression|Subquery|TableFunction/g) || []).length;
    if (/Subquery|TableFunction/.test(ast) || tables > 2) return 'The expression must not contain subqueries, table functions, or references to other tables.';
    if (/SelectWithUnionQuery[\s\S]*SelectWithUnionQuery/.test(ast)) return 'The expression must be a single expression.';
    await adminText(`EXPLAIN QUERY TREE SELECT 1 FROM ${quoteIdentifier(database)}.${quoteIdentifier(table)} WHERE (${expression})`);
    return null;
}

async function rowPolicyDialog(existing) {
    let access;
    let databases;
    let advanced_allowed;
    try {
        [access, databases, advanced_allowed] = await Promise.all([dapLoadAccess(), dapDatabases(), checkGrant('CREATE ROW POLICY, ALTER ROW POLICY ON *.*')]);
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog('Row policy', [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const name = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, value: existing ? existing.short_name : '', disabled: !!existing});
    const state = {database: existing ? existing.database : dap_state.database, table: existing ? existing.table : dap_state.table};
    const picker = dapObjectPicker(databases, state, () => refreshColumns());
    if (existing) {
        picker.database.disabled = true;
        picker.table.disabled = true;
    }
    const whole = checkbox('Every table of the database (ON db.*)', existing ? existing.table === '' : false, {disabled: !!existing});
    const kind = select([['permissive', 'Permissive: joined with OR with other permissive policies'], ['restrictive', 'Restrictive: joined with AND']],
        existing && existing.is_restrictive ? 'restrictive' : 'permissive');
    const subjects = [...access.roles.map(r => r.name), ...access.users.map(u => u.name)];
    const target_mode = select([['list', 'These users and roles'], ['all', 'All users'], ['except', 'All users except']],
        existing ? (existing.apply_to_all ? (existing.apply_to_except.length ? 'except' : 'all') : 'list') : 'list');
    const chosen = new Set(existing ? (existing.apply_to_all ? existing.apply_to_except : existing.apply_to_list) : []);
    const target_boxes = subjects.map(s => ({name: s, box: checkbox(`${access.roles.some(r => r.name === s) ? 'role' : 'user'} ${s}`, chosen.has(s))}));
    const targets = h('fieldset', {className: 'box'}, h('legend', {}, 'Users and roles'), target_boxes.map(b => b.box.element));
    target_mode.addEventListener('change', () => { targets.hidden = target_mode.value === 'all'; });
    targets.hidden = target_mode.value === 'all';
    let columns = [];
    const conditions = h('div', {});
    const addCondition = (preset = {}) => {
        const column = select([], '');
        const op = select(ROW_CONDITION_OPERATORS, preset.op || 'eq');
        const values = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, placeholder: 'north, south', value: preset.values || ''});
        const row = h('div', {className: 'toolbar filter-bar dap-condition'}, adminField('Column', column), adminField('Condition', op), adminField('Values', values),
            button('Remove', () => row.remove(), {className: 'small'}));
        row.read = () => ({column: column.value, op: op.value, values: values.value});
        row.fill = () => column.replaceChildren(...columns.map(c => h('option', {value: c.name, selected: c.name === (preset.column || column.value)}, `${c.name} (${c.type})`)));
        row.fill();
        conditions.append(row);
    };
    const refreshColumns = async () => {
        columns = state.database && state.table && !whole.input.checked
            ? await adminRows('SELECT name, type FROM system.columns WHERE database = {db:String} AND table = {t:String} ORDER BY position', {db: state.database, t: state.table}) : [];
        for (const row of conditions.children) row.fill();
        presets.replaceChildren(...columns.filter(c => ROW_CONDITION_PRESETS.includes(c.name.toLowerCase()))
            .map(c => button(`+ ${c.name}`, () => addCondition({column: c.name}), {className: 'small'})));
    };
    const presets = h('span', {className: 'actions-row'});
    const advanced = h('textarea', {rows: 3, spellcheck: false, className: 'code', value: existing ? existing.select_filter || '' : ''});
    const mode = select([['structured', 'Conditions (joined with AND)'], ['advanced', 'Expression (advanced)']], existing ? 'advanced' : 'structured');
    const structured_box = h('div', {}, conditions, h('div', {className: 'actions-row'}, button('Add condition', () => addCondition(), {className: 'small'}), presets));
    const advanced_box = h('div', {}, adminField('Expression', advanced, advanced_allowed
        ? 'Checked with the server parser: one expression over the columns of the table, without subqueries.'
        : 'Only administrators who can create and alter row policies on every table (CREATE ROW POLICY, ALTER ROW POLICY ON *.*) can write expressions.'));
    const sync = () => {
        structured_box.hidden = mode.value !== 'structured';
        advanced_box.hidden = mode.value !== 'advanced';
        advanced.disabled = !advanced_allowed;
    };
    mode.addEventListener('change', sync);
    whole.input.addEventListener('change', () => {
        picker.table.disabled = whole.input.checked || !!existing;
        if (whole.input.checked) mode.value = 'advanced';
        sync();
        refreshColumns();
    });
    sync();
    await picker.ready;
    await refreshColumns();
    if (!existing) addCondition();
    formDialog(existing ? `Edit the row policy ${existing.name}` : 'Create a row policy', [
        adminField('Name', name), adminField('Database', picker.database), adminField('Table', picker.table), whole.element,
        adminField('Kind', kind), adminField('Applies to', target_mode), targets,
        adminField('Filter', mode), structured_box, advanced_box,
    ], 'Review', async () => {
        if (nameError(name.value, 'policy')) return nameError(name.value, 'policy');
        if (!state.database) return 'Choose a database.';
        if (!whole.input.checked && !state.table) return 'Choose a table, or every table of the database.';
        let filter;
        if (mode.value === 'structured') {
            const parts = [];
            for (const row of conditions.children) {
                const result = rowConditionSQL(row.read(), columns);
                if (result.error) return result.error;
                parts.push(result.sql);
            }
            if (!parts.length) return 'Add at least one condition.';
            filter = parts.join(' AND ');
        } else {
            if (!advanced_allowed) return 'Your user cannot write filter expressions: use conditions.';
            filter = advanced.value.trim();
            if (!filter) return 'Enter the filter expression.';
            if (!whole.input.checked) {
                const problem = await validateRowFilter(state.database, state.table, filter);
                if (problem) return problem;
            }
        }
        const picked = target_boxes.filter(b => b.box.input.checked).map(b => b.name);
        if (target_mode.value === 'list' && !picked.length) return 'Choose the users and roles the policy applies to.';
        const to = {list: picked.map(quoteIdentifier).join(', '), all: 'ALL', except: `ALL EXCEPT ${picked.map(quoteIdentifier).join(', ')}`}[target_mode.value];
        if (target_mode.value === 'except' && !picked.length) return 'Choose who is excepted, or apply the policy to all users.';
        const on = `${quoteIdentifier(state.database)}.${whole.input.checked ? '*' : quoteIdentifier(state.table)}`;
        const restrictive = kind.value === 'restrictive';
        const proposed = {short_name: name.value, database: state.database, table: whole.input.checked ? '' : state.table, select_filter: filter, is_restrictive: restrictive,
            apply_to_all: target_mode.value !== 'list', apply_to_list: target_mode.value === 'list' ? picked : [], apply_to_except: target_mode.value === 'except' ? picked : []};
        const before = access.policies;
        const after = [...before.filter(p => !(existing && p.name === existing.name)), proposed];
        const affected = access.users.map(u => u.name).filter(user => dapPolicyApplies(proposed, user, dapLoginRoles(access.role_grants, user))
            || (existing && dapPolicyApplies(existing, user, dapLoginRoles(access.role_grants, user))));
        const table_for = state.table || (await adminRows('SELECT name FROM system.tables WHERE database = {db:String} ORDER BY name LIMIT 1', {db: state.database}))[0]?.name || '';
        const changes = affected.map(user => {
            const roles = dapLoginRoles(access.role_grants, user);
            return `${user}: ${dapRowFilter(before, state.database, table_for, user, roles).text} → ${dapRowFilter(after, state.database, table_for, user, roles).text}`;
        });
        const statement = existing
            ? `ALTER ROW POLICY ${quoteIdentifier(existing.short_name)}${onCluster()} ON ${on} USING ${filter} AS ${restrictive ? 'restrictive' : 'permissive'} TO ${to}`
            : `CREATE ROW POLICY ${quoteIdentifier(name.value)}${onCluster()} ON ${on} USING ${filter} AS ${restrictive ? 'restrictive' : 'permissive'} TO ${to}`;
        return {action: existing ? 'dap_alter_row_policy' : 'dap_create_row_policy', target_type: 'row_policy', target_name: `${name.value} ON ${state.database}.${proposed.table || '*'}`,
            summary: `${existing ? 'Change' : 'Create'} the row policy ${name.value} on ${state.database}.${proposed.table || '*'}`,
            steps: [{description: `${existing ? 'Change' : 'Create'} the ${restrictive ? 'restrictive' : 'permissive'} row policy ${name.value}: ${filter}`, sql: statement}],
            warning: [`Affected users (combined filter on ${state.database}.${table_for} before → after): ${changes.join('; ') || 'none'}.`,
                'Users with SELECT on the table to whom no policy applies see every row.',
                'The policy filters reads only, on this server or on the servers the statement runs on.'].join(' ')};
    });
}
