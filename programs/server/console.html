        const listed = COMPONENTS.filter(c => c.category === category.id && isListed(c));
        if (!listed.length) continue;
        const section = document.createElement('section');
        section.className = 'category';
        section.setAttribute('aria-labelledby', `home-${category.id}`);
        const heading = document.createElement('h2');
        heading.id = `home-${category.id}`;
        heading.textContent = category.title;
        const list = document.createElement('ul');
        list.className = 'cards';
        for (const c of listed) list.append(renderCard(c));
        section.append(heading, list);
        view.append(section);
    }
    if (had_focus) {
        const target = view.querySelector(`[data-focus-key="${had_focus}"]`);
        if (target) target.focus();
    }
}

function renderOverview() {
    const box = document.createElement('section');
    box.className = 'overview';
    box.setAttribute('aria-label', 'Connection');
    const list = document.createElement('dl');
    const add = (term, value) => {
        const dt = document.createElement('dt');
        dt.textContent = term;
        const dd = document.createElement('dd');
        if (typeof value === 'string') dd.textContent = value;
        else dd.append(value);
        list.append(dt, dd);
    };
    const status = session.status;
    const badge = document.createElement('span');
    if (status.state === 'ok') {
        badge.className = 'badge ok';
        badge.append(Object.assign(document.createElement('span'), {className: 'dot'}),
            document.createTextNode(`Connected, verified at ${formatTime(status.verified_at)}`));
    } else {
        badge.className = 'badge bad';
        badge.append(Object.assign(document.createElement('span'), {className: 'dot'}),
            document.createTextNode(`${status.state === 'auth' ? 'Authentication failed' : 'Connection lost'} at ${formatTime(status.failed_at)}`));
    }
    add('Status', badge);
    add('Server', session.url);
    add('Database user', session.server_user);
    add('ClickHouse version', session.version);
    add('Host name', session.hostname);
    box.append(list);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const check = document.createElement('button');
    check.type = 'button';
    check.className = 'button';
    check.dataset.focusKey = 'check';
    check.textContent = session.checking ? 'Checking…' : 'Check connection';
    check.disabled = session.checking;
    check.addEventListener('click', checkConnection);
    const change = document.createElement('button');
    change.type = 'button';
    change.className = 'button';
    change.textContent = 'Switch connection';
    change.addEventListener('click', switchConnection);
    actions.append(check, change);
    box.append(actions);

    if (status.state !== 'ok') {
        const message = document.createElement('div');
        message.className = 'message error note';
        message.textContent = status.state === 'auth'
            ? `${status.message} The password may have changed: switch connection to sign in again.`
            : status.message;
        if (status.detail) message.append(Object.assign(document.createElement('span'), {className: 'detail', textContent: status.detail}));
        box.append(message);
    }
    box.append(Object.assign(document.createElement('p'), {className: 'note',
        textContent: 'The credentials are kept in the memory of this tab only. Reloading the page or signing out discards them. '
            + 'Each panel runs its queries as this user, and the server enforces its privileges.'}));
    return box;
}

function renderCard(c) {
    const state = componentState(c);
    const item = document.createElement('li');
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.component = c.id;
    card.setAttribute('aria-labelledby', `card-${c.id}`);

    const head = document.createElement('div');
    head.className = 'card-head';
    const title = document.createElement('h3');
    title.id = `card-${c.id}`;
    title.textContent = c.title;
    head.append(icon(c.icon), title);
    const description = paragraph(c.description);

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    const badges = document.createElement('span');
    const badge = statusBadge(state);
    if (badge) badges.append(badge);
    if (state.external) {
        const external = document.createElement('span');
        external.className = 'badge';
        external.textContent = 'External';
        badges.append(external);
    }
    if (c.needs_internet) {
        const internet = document.createElement('span');
        internet.className = 'badge warn';
        internet.textContent = 'Needs Internet';
        internet.title = `Loads ${c.needs_internet}.`;
        badges.append(internet);
    }
    const action = destinationLink(c, state, state.action, state.status === 'available' || state.status === 'unverified');
    action.dataset.focusKey = `card-${c.id}`;
    action.setAttribute('aria-describedby', `card-${c.id}`);
    foot.append(badges, action);

    card.append(head, description);
    const status_text = state.reason || state.note;
    if (status_text) card.append(Object.assign(document.createElement('p'), {className: 'status', textContent: status_text}));
    card.append(foot);
    item.append(card);
    return item;
}

/// --- Panels ---

/// --- Focus mode ---

/// While a component's page is shown, the console header and sidebar are hidden, so the component has
/// the whole window and its own navigation. The arrow at the start of the panel bar brings the console
/// navigation back; it then stays visible for that component until another component is selected.
/// Pages of the console itself (Home, Administration, and the states of components that have no page)
/// always show the console navigation.
let console_navigation_for = null;

function setFocusMode(on) {
    const shell = $('shell');
    if (on) closeMobileSidebar(false);
    const changed = shell.classList.contains('focus') !== on;
    shell.classList.toggle('focus', on);
    const toggle = $('console-toggle');
    toggle.replaceChildren(on ? icon('collapse') : icon('maximize'), on ? document.createTextNode('Console') : visuallyHidden('Hide the console navigation'));
    toggle.title = on ? 'Show the console navigation (header and sidebar)' : 'Hide the console navigation: give the component the whole window';
    toggle.setAttribute('aria-expanded', String(!on));
    if (!changed) return;
    /// The terminal sizes itself to its frame; tell it when the frame size changes.
    const terminal = frames.get('terminal');
    if (terminal && terminal.loaded && !terminal.host.hidden) postToTerminal(terminal, {type: 'webterminal-refit', focus: false});
}

/// Shows the console navigation, without the arrow: for the pages of the console itself.
function leaveFocusMode() {
    $('console-toggle').hidden = true;
    setFocusMode(false);
}

$('console-toggle').addEventListener('click', () => {
    const route = parseRoute();
    const on = !$('shell').classList.contains('focus');
    console_navigation_for = on ? null : route.id;
    setFocusMode(on);
    /// Keep the keyboard focus on the arrow, which stays in place in both modes.
    $('console-toggle').focus();
});

function hideAllFrames() {
    for (const [id, entry] of frames) {
        if (entry.component.keep_alive) entry.host.hidden = true;
        else destroyFrame(id);
    }
}

function renderPanelBar(c, title) {
    $('panel-icon').replaceChildren(c ? icon(c.icon) : '');
    $('panel-title').textContent = title;
    const badges = $('panel-badges');
    badges.replaceChildren();
    if (c && c.needs_internet) {
        const internet = document.createElement('span');
        internet.className = 'badge warn';
        internet.textContent = 'Needs Internet';
        internet.title = `Loads ${c.needs_internet}.`;
        badges.append(internet);
    }
    $('panel-reload').hidden = true;
    $('panel-standalone').hidden = true;
}

/// A page of the console in place of a component (checking, restricted, not configured, ...): the
/// component has no navigation of its own, so the console navigation stays.
function renderPanelState(title, body, actions) {
    leaveFocusMode();
    const box = $('panel-state');
    const inner = document.createElement('div');
    const heading = document.createElement('h2');
    heading.textContent = title;
    inner.append(heading, ...body);
    if (actions && actions.length) {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.gap = '0.5rem';
        row.style.flexWrap = 'wrap';
        row.append(...actions);
        inner.append(row);
    }
    box.replaceChildren(inner);
    box.hidden = false;
}

function renderPanelNotice() {
    const notice = $('panel-notice');
    const route = parseRoute();
    if (!session || route.name !== 'component' || route.id === 'home') {
        notice.hidden = true;
        return;
    }
    const entry = frames.get(route.id);
    const status = session.status;
    let message = null, kind = 'warning';
    if (entry && entry.notice) {
        ({message, kind} = entry.notice);
    } else if (status.state !== 'ok') {
        message = `${status.state === 'auth' ? 'Authentication failed' : 'Connection to the server lost'} at ${formatTime(status.failed_at)}: `
            + `${status.message} The panel may not work until the connection is restored.`;
        kind = 'error';
    }
    notice.className = `message ${kind}`;
    notice.textContent = message || '';
    notice.hidden = !message;
}

function showPanel(c) {
    for (const [id, entry] of frames) {
        if (id === c.id) continue;
        if (entry.component.keep_alive) entry.host.hidden = true;
        else destroyFrame(id);
    }
    const state = componentState(c);
    renderPanelBar(c, c.title);
    $('panel-state').hidden = true;

    if (state.status === 'denied') {
        renderUnavailableState(c, state);
        renderPanelNotice();
        return;
    }
    if (c.kind === 'link' || state.external) {
        renderExternalState(c, state);
        renderPanelNotice();
        return;
    }

    const entry = frames.get(c.id);
    if (!entry && state.status !== 'available' && !(state.status === 'unverified')) {
        if (state.status === 'checking') {
            renderPanelState(`Checking ${c.title}…`, [paragraph('Checking whether this panel is available for your user.')]);
        } else {
            renderUnavailableState(c, state);
        }
        renderPanelNotice();
        return;
    }
    openFrame(c);
}

function renderExternalState(c, state) {
    if (state.status === 'available') {
        renderPanelState(c.title, [
            paragraph(c.description),
            paragraph(`This destination is outside of this console: ${state.href}. It opens in a new tab, `
                + 'and no credentials, queries, or database names are sent to it.'),
        ], [externalLink(`Open ${c.title}`, state.href, true)]);
        return;
    }
    renderConfigureState(c, state);
}

function renderConfigureState(c, state) {
    const key = c.config_key;
    const example = c.integration === 'clickstack' ? '/clickstack/' : (config[key] || 'https://docs.example.internal/');
    const pre = document.createElement('pre');
    pre.textContent = `<clickhouse>\n    <web_console>\n        <${key}>${example}</${key}>\n    </web_console>\n</clickhouse>`;
    renderPanelState(`${c.title} is not configured`, [
        paragraph(state.reason),
        paragraph('An administrator can set the address in the server configuration, for example in a file under config.d. '
            + 'Use a path on this server (embedded in the console) or an absolute HTTP(S) URL (opened in a new tab). '
            + 'The change applies after the configuration is reloaded.'),
        pre,
    ], [routeLink('Back to Home', componentPath('home'))]);
}

function renderUnavailableState(c, state) {
    if (state.status === 'configure') {
        renderConfigureState(c, state);
        return;
    }
    if (state.status === 'denied') {
        renderPanelState(`${c.title} is not allowed`, [paragraph(state.reason), paragraph(
            'The console policy hides this component for your user and roles. It is a console policy: the server '
            + 'still decides what your user can query. Ask a platform administrator to change it on the Component Access page.')],
            [routeLink('Back to Home', componentPath('home'))]);
        return;
    }
    const body = [paragraph(state.reason)];
    if (state.detail) {
        const detail = document.createElement('pre');
        detail.textContent = state.detail;
        body.push(paragraph('The server answered:'), detail);
    }
    const actions = [routeLink('Back to Home', componentPath('home'))];
    if (state.status === 'restricted') {
        body.push(paragraph('Ask an administrator to grant the privileges, or sign in as another user. '
            + 'You can still open the panel: the server checks every query and rejects those you are not allowed to run.'));
        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'button';
        open.textContent = 'Open anyway';
        open.addEventListener('click', () => {
            $('panel-state').hidden = true;
            openFrame(c);
        });
        actions.unshift(open);
    }
    renderPanelState(state.status === 'restricted' ? `${c.title} is restricted` : `${c.title} is unavailable`, body, actions);
}

function frameSource(c) {
    if (c.integration === 'clickstack') return parseDestination(config.clickstack_url).url;
    return c.src;
}

function openFrame(c) {
    let entry = frames.get(c.id);
    if (!entry) entry = createFrame(c);
    entry.host.hidden = false;
    $('console-toggle').hidden = false;
    setFocusMode(console_navigation_for !== c.id);
    if (c.integration === 'clickstack') showClickStackNotice();
    $('panel-reload').hidden = false;
    const standalone = $('panel-standalone');
    standalone.href = frameSource(c);
    standalone.replaceChildren(document.createTextNode('Standalone page'), icon('external', 'icon-small'), visuallyHidden(' (opens in a new tab and asks for credentials separately)'));
    standalone.title = 'Open the page outside of the console. It asks for credentials separately.';
    standalone.hidden = false;
    if (c.integration === 'webterminal' && entry.loaded) postToTerminal(entry, {type: 'webterminal-refit', focus: false});
    renderPanelNotice();
}

function createFrame(c) {
    const host = document.createElement('div');
    host.className = 'frame-host';
    host.dataset.component = c.id;
    const iframe = document.createElement('iframe');
    iframe.title = c.title;
    iframe.referrerPolicy = 'no-referrer';
    const overlay = document.createElement('div');
    overlay.className = 'frame-overlay';
    overlay.setAttribute('role', 'status');
    overlay.append(Object.assign(document.createElement('span'), {className: 'spinner'}), document.createTextNode(`  Loading ${c.title}…`));
    host.append(iframe, overlay);
    const entry = {component: c, host, iframe, overlay, loaded: false, notice: null, session};
    frames.set(c.id, entry);
    if (c.integration === 'clickstack') hideClickStackBanner();
    iframe.addEventListener('load', () => onFrameLoad(entry));
    iframe.src = frameSource(c);
    $('frames').append(host);
    return entry;
}

function destroyFrame(id) {
    const entry = frames.get(id);
    if (!entry) return;
    frames.delete(id);
    entry.destroyed = true;
    /// Removing the frame unloads its page, which closes its WebSocket and aborts its requests and
    /// timers. Do not navigate it to `about:blank` first: that would add an entry to the history.
    entry.host.remove();
}

function reloadFrame(id) {
    const c = COMPONENTS_BY_ID.get(id);
    destroyFrame(id);
    openFrame(c);
}

$('panel-reload').addEventListener('click', () => {
    const route = parseRoute();
    if (route.name === 'component') reloadFrame(route.id);
});

function onFrameLoad(entry) {
    if (entry.destroyed || entry.session !== session || !session) return;
    const c = entry.component;
    let path = null;
    try {
        path = entry.iframe.contentWindow.location.pathname;
    } catch (e) {
        /// A cross-origin document: the panel navigated away from this server.
    }
    const expected = new URL(frameSource(c), location.href).pathname.replace(/\/+$/, '');
    if (path === null || !(path === expected || path.startsWith(expected + '/') || path.startsWith(expected + '?'))) {
        /// The page inside the panel navigated elsewhere, e.g. the SQL Console's own "Logout" goes to `/`.
        destroyFrame(c.id);
        if (parseRoute().id === c.id) {
            const message = c.integration === 'sql-console'
                ? 'The SQL Console session ended (it was signed out inside the panel).'
                : `${c.title} navigated away from its page.`;
            renderPanelState(message, [paragraph('Reload the panel to start it again with the current connection.')], [reloadButton(c)]);
        }
        return;
    }
    entry.loaded = true;
    if (c.integration === 'sql-console') {
        signInSQLConsole(entry);
        return;
    }
    if (c.integration === 'webterminal') {
        postToTerminal(entry, {type: 'webterminal-hello'});
        postToTerminal(entry, {type: 'webterminal-credentials', user: session.user, password: session.password});
    }
    entry.overlay.remove();
}

function reloadButton(c) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'button primary';
    button.textContent = 'Reload panel';
    button.addEventListener('click', () => {
        $('panel-state').hidden = true;
        reloadFrame(c.id);
    });
    return button;
}

function setFrameNotice(entry, message, kind) {
    entry.notice = message ? {message, kind} : null;
    if (parseRoute().id === entry.component.id) renderPanelNotice();
}

/// --- Integration: native pages ---

/// The contract with the native pages (`dashboard.html`, `merges.html`, ...): a page embedded by the
/// console calls `window.parent.clickhouseConsole.getConnection(window)` synchronously at startup.
/// The connection is returned only to the frames of native panels created by this console and only
/// while signed in, so the password never travels through a URL, a message, or storage.
Object.defineProperty(window, 'clickhouseConsole', {
    value: Object.freeze({
        version: 1,
        getConnection(panel_window) {
            if (!session) return null;
            for (const entry of frames.values()) {
                if (entry.component.integration === 'native' && entry.session === session && entry.iframe.contentWindow === panel_window) {
                    return Object.freeze({url: session.url, user: session.user, password: session.password});
                }
            }
            return null;
        },
    }),
});

/// --- Integration: Web Terminal ---

function postToTerminal(entry, message) {
    if (entry.iframe.contentWindow) entry.iframe.contentWindow.postMessage(message, location.origin);
}

window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || typeof e.data.type !== 'string') return;
    const entry = frames.get('terminal');
    if (!entry || e.source !== entry.iframe.contentWindow) return;
    if (e.data.type === 'webterminal-escape') {
        /// The terminal captures every key; Escape is how keyboard users leave it: to the sidebar, or to
        /// the arrow that shows it in focus mode.
        const link = $('shell').classList.contains('focus') ? $('console-toggle') : $('sidebar').querySelector('[aria-current="page"]');
        if (link) link.focus();
    } else if (e.data.type === 'webterminal-closed') {
        destroyFrame('terminal');
        if (parseRoute().id === 'terminal') {
            renderPanelState('The terminal session ended', [paragraph('The clickhouse-client session was closed.')], [reloadButton(COMPONENTS_BY_ID.get('terminal'))]);
        }
    }
});

/// --- Integration: ClickStack ---

/// ClickStack shows a banner across its pages ("This is not recommended for production use ...") until it
/// is closed with its button, which stores `"closed"` (JSON) under this key of the local storage of the
/// origin. The console closes it the same way, before ClickStack loads, and shows the message in a popup
/// instead, so that the banner does not take space in the panel.
const CLICKSTACK_BANNER_KEY = 'clickstack-banner-state';
const CLICKSTACK_NOTICE_KEY = 'console.clickstack-notice';
const CLICKSTACK_DOCS_URL = 'https://clickhouse.com/docs/use-cases/observability/clickstack/getting-started';

function hideClickStackBanner() {
    try {
        localStorage.setItem(CLICKSTACK_BANNER_KEY, JSON.stringify('closed'));
    } catch (e) {
        /// Storage is disabled: ClickStack cannot store its own state either, and shows the banner.
    }
}

/// Shows the message of the banner the first time ClickStack is opened after signing in, unless the user
/// asked not to see it again.
function showClickStackNotice() {
    if (session.clickstack_notice_shown) return;
    session.clickstack_notice_shown = true;
    let dismissed = false;
    try {
        dismissed = localStorage.getItem(CLICKSTACK_NOTICE_KEY) === 'dismissed';
    } catch (e) {
        /// Storage is disabled: show the message on each sign-in.
    }
    if (dismissed) return;
    const again = checkbox('Do not show this again', false);
    const docs = h('a', {href: CLICKSTACK_DOCS_URL, target: '_blank', rel: 'noopener noreferrer'}, 'ClickStack Docs', visuallyHidden(' (opens in a new tab)'));
    const ok = button('OK', closeDialog, {className: 'primary'});
    ok.autofocus = true;
    openDialog('About ClickStack in ClickHouse', [
        paragraph('This is not recommended for production use and is lacking core ClickStack features such as alerts and saved searches.'),
        h('p', {}, 'For a proper experience, visit the ', docs, '.'),
        h('p', {className: 'note'}, 'ClickStack uses its own connection settings: enter them in ClickStack on first use.'),
        again.element,
    ], [ok], {onclose: () => {
        if (!again.input.checked) return;
        try {
            localStorage.setItem(CLICKSTACK_NOTICE_KEY, 'dismissed');
        } catch (e) {
            /// Not remembered when storage is disabled.
        }
    }});
}

/// --- Integration: SQL Console ---

/// The SQL Console (`/ui`, from the `contrib/sql-console` bundle) keeps its connection in memory and has
/// no API to receive one, so the console fills in its connection form, identified by its `data-testid`
/// attributes, and submits it, as the user would. If the form changes in a future version, this fails
/// visibly with a notice, and the user can still sign in in the panel itself.
const SQL_CONSOLE_SELECTORS = {
    url: '[data-testid="standalone-url-input"]',
    user: '[data-testid="standalone-username-input"]',
    password: '[data-testid="standalone-password-input"]',
    connect: '[data-testid="standalone-connect-button"]',
    connected: '[data-testid="standalone-console-layout"], [data-testid="standalone-home-page"]',
};

function waitFor(doc, predicate, timeout_ms) {
    return new Promise(resolve => {
        const found = predicate();
        if (found) {
            resolve(found);
            return;
        }
        const observer = new MutationObserver(() => {
            const result = predicate();
            if (result) {
                observer.disconnect();
                clearTimeout(timer);
                resolve(result);
            }
        });
        const timer = setTimeout(() => {
            observer.disconnect();
            resolve(null);
        }, timeout_ms);
        observer.observe(doc, {childList: true, subtree: true, attributes: true, characterData: true});
    });
}

function findInput(doc, selector) {
    const element = doc.querySelector(selector);
    if (!element) return null;
    return element.matches('input') ? element : element.querySelector('input');
}

/// React tracks the value of controlled inputs, so set it through the native setter and dispatch
/// `input`, which is what typing does.
function setInputValue(input, value) {
    const view = input.ownerDocument.defaultView;
    Object.getOwnPropertyDescriptor(view.HTMLInputElement.prototype, 'value').set.call(input, value);
    input.dispatchEvent(new view.Event('input', {bubbles: true}));
}

async function signInSQLConsole(entry) {
    const current = session;
    const doc = entry.iframe.contentDocument;
    const fail = message => {
        if (entry.destroyed) return;
        entry.overlay.remove();
        setFrameNotice(entry, `Automatic sign-in to the SQL Console did not succeed: ${message}. You can sign in with the form in the panel.`, 'warning');
    };

    const form = await waitFor(doc, () => doc.querySelector(SQL_CONSOLE_SELECTORS.connected) || doc.querySelector(SQL_CONSOLE_SELECTORS.connect), 20000);
    if (entry.destroyed || session !== current) return;
    if (!form) return fail('its connection form did not appear');
    if (form.matches(SQL_CONSOLE_SELECTORS.connected)) {
        entry.overlay.remove();
        return;
    }
    const inputs = [findInput(doc, SQL_CONSOLE_SELECTORS.url), findInput(doc, SQL_CONSOLE_SELECTORS.user), findInput(doc, SQL_CONSOLE_SELECTORS.password)];
    if (inputs.includes(null)) return fail('its connection form has an unexpected layout');
    setInputValue(inputs[0], current.url);
    setInputValue(inputs[1], current.user);
    setInputValue(inputs[2], current.password);
    /// Let React apply the state updates before clicking, so the click handler sees the new values.
    await new Promise(resolve => setTimeout(resolve, 0));
    if (entry.destroyed || session !== current) return;
    const button = doc.querySelector(SQL_CONSOLE_SELECTORS.connect);
    button.click();

    /// Success shows the console layout. Failure re-enables the button and shows an error under the
    /// fields. The button is still enabled right after the click, before React re-renders, so a
    /// failure counts only after the connecting state was seen.
    let seen_connecting = false;
    const outcome = await waitFor(doc, () => {
        if (doc.querySelector(SQL_CONSOLE_SELECTORS.connected)) return 'connected';
        const connect = doc.querySelector(SQL_CONSOLE_SELECTORS.connect);
        if (!connect) return null;
        if (connect.disabled) seen_connecting = true;
        else if (seen_connecting) return 'failed';
        return null;
    }, 30000);
    if (entry.destroyed || session !== current) return;
    if (outcome === 'connected') {
        entry.overlay.remove();
        setFrameNotice(entry, null);
        return;
    }
    /// Do not leave the password in the form after a failure.
    const password_input = findInput(doc, SQL_CONSOLE_SELECTORS.password);
    if (password_input) setInputValue(password_input, '');
    if (outcome === null) return fail('it did not finish connecting within 30 seconds');
    const error = sqlConsoleErrorText(doc);
    fail(error ? `it reported: "${error}"` : 'it reported an error');
}

/// The error of the SQL Console form is a paragraph next to the fields.
function sqlConsoleErrorText(doc) {
    const url = doc.querySelector(SQL_CONSOLE_SELECTORS.url);
    const fields = url && url.closest('[data-testid="container"]');
    const error = fields && fields.querySelector(':scope > p');
    return error ? error.textContent.trim().slice(0, 300) : '';
}

/// --- Administration: SQL building ---

/// Names of users, roles, profiles, quotas, databases, and clusters are written into statements as
/// quoted identifiers, and other values as quoted strings, because the access-management statements
/// do not accept query parameters. Names with control characters are rejected before quoting.
function quoteIdentifier(name) {
    return '`' + name.replace(/\\/g, '\\\\').replace(/`/g, '\\`') + '`';
}

function quoteString(value) {
    return "'" + String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
}

/// A value of an `Array(String)` query parameter.
function arrayParam(values) {
    return '[' + values.map(quoteString).join(',') + ']';
}

function nameError(name, what) {
    if (!name) return `Enter a ${what} name.`;
    if (name !== name.trim()) return `The ${what} name must not start or end with spaces.`;
    if (name.length > 128) return `The ${what} name is longer than 128 characters.`;
    if (/[\u0000-\u001f\u007f]/.test(name)) return `The ${what} name must not contain control characters.`;
    return null;
}

/// The `VALID UNTIL` value that marks a user suspended by the console: 2000-01-01 00:00:00 UTC. It is in
/// the past, so the server rejects every authentication method of the user, and it is distinct from an
/// expiry date that someone set on purpose.
const SUSPENDED_UNTIL = 946684800;

function formatUnixUTC(seconds) {
    return new Date(seconds * 1000).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
}

/// `VALID UNTIL` literals are written in UTC, so the stored time does not depend on the time zone of the
/// server (or of each server for `ON CLUSTER`).
function validUntilClause(seconds) {
    return seconds ? ` VALID UNTIL ${quoteString(formatUnixUTC(seconds))}` : ` VALID UNTIL 'infinity'`;
}

/// Replaces secrets in text that may be shown or stored: the values in `secrets`, and anything that looks
/// like a password literal. The server already masks passwords in its logs and errors; this is for text
/// that comes from a statement the console built, such as an excerpt in a syntax error.
function maskSecrets(text, secrets) {
    let result = String(text || '');
    for (const secret of secrets || []) {
        if (secret) result = result.split(secret).join('[HIDDEN]');
    }
    return result.replace(/\b(BY|HASH|SALT|PASSWORD)(\s+)'(?:[^'\\]|\\.)*'/gi, "$1$2'[HIDDEN]'");
}

/// A random password from the browser's cryptographic generator. It has letters, digits, and symbols, so
/// it passes the usual `password_complexity` rules, and no quotes or backslashes.
function generatePassword() {
    const groups = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnopqrstuvwxyz', '23456789', '-_.~!@#%^*+='];
    const all = groups.join('');
    const random = new Uint32Array(24);
    crypto.getRandomValues(random);
    const chars = Array.from(random, (n, i) => (i < groups.length ? groups[i] : all)[n % (i < groups.length ? groups[i].length : all.length)]);
    /// Move the guaranteed characters away from the start (Fisher-Yates with fresh random numbers).
    const order = new Uint32Array(chars.length);
    crypto.getRandomValues(order);
    for (let i = chars.length - 1; i > 0; --i) {
        const j = order[i] % (i + 1);
        [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join('');
}

/// --- Administration: queries ---

class AdminQueryError extends Error {
    constructor(result) {
        super(result.detail || result.message || 'The query failed.');
        this.kind = result.kind;
        this.code = result.code;
        this.summary = result.message;
    }
}

/// Thrown when the session ended or changed while a query was running: the caller stops silently.
class AdminSessionChanged extends Error {}

async function adminSelect(sql, params, current = session) {
    if (!current) throw new AdminSessionChanged();
    const result = await runQuery(current, sql + '\nFORMAT JSON', current.controller.signal, 30000, {params});
    if (session !== current || result.kind === 'aborted') throw new AdminSessionChanged();
    if (!result.ok) throw new AdminQueryError(result);
    return result;
}

async function adminRows(sql, params, current = session) {
    return (await adminSelect(sql, params, current)).data;
}

/// For statements without the `FORMAT` clause (`CHECK GRANT`, `SHOW CREATE ...`): the result as text.
async function adminText(sql, current = session) {
    if (!current) throw new AdminSessionChanged();
    const result = await runQuery(current, sql, current.controller.signal, 30000, {raw: true});
    if (session !== current || result.kind === 'aborted') throw new AdminSessionChanged();
    if (!result.ok) throw new AdminQueryError(result);
    return result.data;
}

/// `SHOW GRANTS` and `SHOW CREATE` return one statement per row.
async function adminStatements(sql, current = session) {
    return (await adminText(sql, current)).split('\n').filter(line => line).map(line => line.replace(/\\'/g, "'").replace(/\\\\/g, '\\'));
}

/// --- Administration: what the signed-in user can do ---

/// Each capability is checked with the server: `LIMIT 0` reads for the system tables a page shows, and
/// `CHECK GRANT` for the statements it runs. They decide what the console offers; the server still
/// authorizes every statement, so a stale or wrong answer only shows or hides a button.
function adminChecks(db) {
    const table = name => db ? `${quoteIdentifier(db)}.${quoteIdentifier(name)}` : null;
    const read = (...tables) => ({read: tables});
    const grant = statement => ({grant: statement});
    /// A system log that the default configuration enables does not exist until the server first flushes it, a few
    /// seconds after it starts: whether the user may read it is a question for the privileges, not the table.
    const log = name => grant(`SELECT ON ${name}`);
    return {
        read_users: read('system.users'),
        read_roles: read('system.roles', 'system.role_grants', 'system.grants'),
        read_grants: read('system.grants', 'system.role_grants'),
        read_profiles: read('system.settings_profiles', 'system.settings_profile_elements'),
        read_quotas: read('system.quotas', 'system.quota_limits'),
        read_query_log: log('system.query_log'),
        read_session_log: read('system.session_log'),
        read_tables: read('system.tables'),
        read_privileges: read('system.privileges'),
        read_directories: read('system.user_directories'),
        read_clusters: read('system.clusters'),
        read_processes: read('system.processes'),
        read_audit: db ? read(table('audit_log')) : null,
        read_row_policies: read('system.row_policies'),
        read_dap: db ? read(...Object.keys(DAP_TABLES).map(table)) : null,
        write_dap_attributes: db ? grant(`INSERT ON ${table('dap_attributes')}`) : null,
        write_dap_values: db ? grant(`INSERT ON ${table('dap_user_attributes')}`) : null,
        write_dap_classifications: db ? grant(`INSERT ON ${table('dap_classifications')}`) : null,
        write_dap_rules: db ? grant(`INSERT ON ${table('dap_rules')}`) : null,
        write_dap_deploy: db ? grant(`INSERT ON ${table('dap_owned')}`) : null,
        write_dap_tests: db ? grant(`INSERT ON ${table('dap_access_tests')}`) : null,
        read_policy: db ? read(table('component_policy')) : null,
        read_idp: db ? read(table('idp_providers')) : null,
        write_idp: db ? grant(`INSERT ON ${table('idp_providers')}`) : null,
        read_protected: db ? read(table('protected_accounts')) : null,
        write_audit: db ? grant(`INSERT ON ${table('audit_log')}`) : null,
        write_policy: db ? grant(`INSERT ON ${table('component_policy')}`) : null,
        write_protected: db ? grant(`INSERT ON ${table('protected_accounts')}`) : null,
        setup: db ? grant(`CREATE TABLE ON ${quoteIdentifier(db)}.*`) : null,
        create_database: db ? grant(`CREATE DATABASE ON ${quoteIdentifier(db)}.*`) : null,
        create_user: grant('CREATE USER ON *.*'),
        alter_user: grant('ALTER USER ON *.*'),
        drop_user: grant('DROP USER ON *.*'),
        create_role: grant('CREATE ROLE ON *.*'),
        alter_role: grant('ALTER ROLE ON *.*'),
        drop_role: grant('DROP ROLE ON *.*'),
        role_admin: grant('ROLE ADMIN ON *.*'),
        create_profile: grant('CREATE SETTINGS PROFILE ON *.*'),
        alter_profile: grant('ALTER SETTINGS PROFILE ON *.*'),
        drop_profile: grant('DROP SETTINGS PROFILE ON *.*'),
        create_quota: grant('CREATE QUOTA ON *.*'),
        alter_quota: grant('ALTER QUOTA ON *.*'),
        drop_quota: grant('DROP QUOTA ON *.*'),
        kill_query: grant('KILL QUERY ON *.*'),
        read_backups: db ? read(table('backup_operations'), table('backup_events'), table('backup_destinations'), table('backup_schedules')) : null,
        write_backup_ops: db ? grant(`INSERT ON ${table('backup_operations')}`) : null,
        write_backup_events: db ? grant(`INSERT ON ${table('backup_events')}`) : null,
        write_destinations: db ? grant(`INSERT ON ${table('backup_destinations')}`) : null,
        write_schedules: db ? grant(`INSERT ON ${table('backup_schedules')}`) : null,
        read_endpoints: db ? read(table('backup_endpoints')) : null,
        read_cluster_tables: db ? read(table('clusters'), table('cluster_revisions'), table('cluster_operations'), table('cluster_events'),
            table('cluster_observations'), table('cluster_resources')) : null,
        write_clusters: db ? grant(`INSERT ON ${table('cluster_operations')}`) : null,
        ...Object.fromEntries(CLUSTER_CAPABILITIES.map(([cap]) => [`cap_${cap}`, db ? grant(`INSERT(${cap}) ON ${table('cluster_capabilities')}`) : null])),
        write_endpoints: db ? grant(`INSERT ON ${table('backup_endpoints')}`) : null,
        read_system_backups: read('system.backups'),
        read_backup_log: log('system.backup_log'),
        create_named_collection: grant('CREATE NAMED COLLECTION ON *.*'),
        read_disk: grant('READ ON DISK'),
        write_disk: grant('WRITE ON DISK'),
    };
}

function adminDatabase() {
    const db = config.admin_database;
    return typeof db === 'string' && /^[A-Za-z_][A-Za-z0-9_]{0,63}$/.test(db) ? db : null;
}

async function loadAdminContext(current) {
    const db = adminDatabase();
    /// Which panels the home page and the sidebar list depends only on the component policy and the roles of the
    /// session. They are read first, next to the checks below, so that the panels do not wait for every check.
    const early = (async () => {
        const [enabled_roles, policy] = await Promise.all([
            adminRows('SELECT role_name, with_admin_option FROM system.enabled_roles ORDER BY role_name', {}, current).catch(e => {
                if (e instanceof AdminSessionChanged) throw e;
                return [];
            }),
            db === null ? {state: 'off', message: `The admin_database setting "${config.admin_database}" is not a valid database name.`} : fetchPolicy(current, db),
        ]);
        if (session !== current || !policy) return false;
        current.admin = {...current.admin, enabled_roles, policy};
        refreshComponentStates();
        return true;
    })().catch(e => {
        if (e instanceof AdminSessionChanged) return false;
        throw e;
    });
    const can = {};
    const checks = Object.entries(adminChecks(db)).filter(([, check]) => check);
    await Promise.all(checks.map(async ([key, check]) => {
        try {
            if (check.read) {
                /// One query for all the tables of a check: it fails when any of them cannot be read.
                await adminText(check.read.map(name => `SELECT 1 FROM ${name} LIMIT 0`).join(' UNION ALL '), current);
                can[key] = true;
            } else {
                can[key] = (await adminText(`CHECK GRANT ${check.grant}`, current)).trim() === '1';
            }
        } catch (e) {
            if (e instanceof AdminSessionChanged) return;
            can[key] = false;
        }
    }));
    if (session !== current) return;

    const context = {state: 'ready', can, db, scope: '', directories: [], clusters: [], enabled_roles: [], scoped: {}, policy: {state: 'checking'}};
    const optional = async (key, load) => {
        try {
            context[key] = await load();
        } catch (e) {
            if (e instanceof AdminSessionChanged) throw e;
        }
    };
    try {
        await Promise.all([
            optional('directories', () => can.read_directories
                ? adminRows('SELECT name, type, precedence, params FROM system.user_directories ORDER BY precedence', {}, current) : []),
            optional('clusters', async () => can.read_clusters
                ? (await adminRows('SELECT DISTINCT cluster FROM system.clusters ORDER BY cluster', {}, current)).map(row => row.cluster) : []),
            optional('scoped', async () => scopedAccessManagement(await adminStatements('SHOW GRANTS FINAL', current))),
        ]);
    } catch (e) {
        return;
    }
    if (!(await early) || session !== current) return;
    /// The latest policy and roles: a reload of the policy may have replaced the ones read first.
    context.enabled_roles = current.admin.enabled_roles;
    context.policy = current.admin.policy;
    current.admin = context;
    refreshComponentStates();
}

/// User management can be granted for name patterns (`GRANT ALTER USER ON app_* TO ...`), which
/// `CHECK GRANT ... ON *.*` does not report and `system.grants` does not show. Take the patterns from the
/// user's own `SHOW GRANTS FINAL`, for display and to offer the actions; per-user checks use `CHECK GRANT`.
function scopedAccessManagement(statements) {
    const scoped = {};
    for (const statement of statements) {
        const match = statement.match(/^GRANT (.+) ON (\S+) TO /);
        if (!match || match[2] === '*.*' || match[2] === '*') continue;
        for (const privilege of match[1].split(', ')) {
            if (/^(CREATE|ALTER|DROP) (USER|ROLE)$/.test(privilege)) {
                (scoped[privilege] = scoped[privilege] || []).push(match[2]);
            }
        }
    }
    return scoped;
}

/// Whether the signed-in user can run a user or role management statement on some names, globally or
/// for a pattern.
function canManage(privilege) {
    const key = privilege.toLowerCase().replace(' ', '_');
    return !!(session.admin.can[key] || (session.admin.scoped[privilege] || []).length);
}

/// An administration page is available when the user can read what it shows and, for the pages the console
/// policy governs, when the policy allows opening it. Otherwise it is hidden, with the reason.
function adminComponentState(c) {
    const href = componentPath(c.id);
    if (!session || session.admin.state === 'checking') return {status: 'hidden', action: 'Open', href};
    const can = session.admin.can;
    if (!c.admin_needs.some(key => can[key])) {
        return {status: 'hidden', action: 'Open', href, reason: 'Your user cannot read what this page shows.'};
    }
    const decision = policyDecision(c);
    if (decision && decision.status === 'checking') return {status: 'hidden', action: 'Open', href, reason: 'The console access policy is being checked.'};
    if (decision) return {status: 'hidden', action: 'Open', href, reason: decision.reason};
    return {status: 'available', action: 'Open', href};
}

/// The source of a user or role: which user directory stores it, and whether SQL can change it.
function entitySource(storage) {
    const directories = session.admin.directories;
    const directory = directories.find(d => d.name === storage);
    const type = directory ? directory.type : storage;
    if (/users[._ ]xml/.test(type)) {
        return {kind: 'config', label: 'Configuration', editable: false, title: 'Defined in a configuration file (users.xml). Change it in the file; SQL statements cannot.'};
    }
    if (/local[._ ]directory/.test(type)) return {kind: 'sql', label: 'SQL', editable: true, title: `Created with SQL; stored on this server in ${storage}.`};
    if (type === 'replicated') return {kind: 'sql', label: 'SQL (replicated)', editable: true, title: `Created with SQL; stored in ${storage} and replicated through Keeper.`};
    if (type === 'memory') return {kind: 'sql', label: 'SQL (memory)', editable: true, title: 'Created with SQL and kept in memory only: it is lost when the server restarts.'};
    if (type === 'ldap') return {kind: 'external', label: 'LDAP', editable: false, title: 'Provided by an LDAP server for the time of a session. Manage it in the LDAP directory.'};
    return {kind: 'unknown', label: storage || 'Unknown', editable: false, title: `Stored in ${storage}. The console does not know whether SQL can change it.`};
}

/// Authentication methods whose credentials live outside of ClickHouse.
const EXTERNAL_AUTH = ['ldap', 'kerberos', 'ssl_certificate', 'ssh_key', 'http', 'jwt'];
const PASSWORD_AUTH = ['plaintext_password', 'sha256_password', 'double_sha1_password', 'bcrypt_password', 'scram_sha256_password', 'no_password'];

/// The account state that the server enforces at authentication, from `VALID UNTIL` and the allowed hosts.
function userState(user) {
    const now = Date.now() / 1000;
    const until = user.valid_until || [];
    const no_hosts = !user.host_ip.length && !user.host_names.length && !user.host_names_regexp.length && !user.host_names_like.length;
    if (until.length && until.every(t => t === SUSPENDED_UNTIL)) {
        return {key: 'suspended', label: 'Suspended', className: 'bad', title: 'Suspended by the console: every authentication method expired on 2000-01-01. New logins are rejected.'};
    }
    if (until.length && until.every(t => t && t < now)) {
        return {key: 'expired', label: 'Expired', className: 'bad', title: `Every authentication method expired (${until.map(formatUnixUTC).join(', ')}). New logins are rejected.`};
    }
    if (no_hosts) return {key: 'no-hosts', label: 'No allowed hosts', className: 'bad', title: 'HOST NONE: logins are rejected from every address.'};
    if (until.some(t => t && t < now)) {
        return {key: 'partly-expired', label: 'Partly expired', className: 'warn', title: 'Some authentication methods expired; the others still work.'};
    }
    const future = until.filter(t => t);
    if (future.length) {
        return {key: 'expiring', label: `Expires ${formatUnixUTC(Math.min(...future)).slice(0, 10)}`, className: 'warn',
            title: `Authentication expires: ${future.map(formatUnixUTC).join(', ')}.`};
    }
    return {key: 'active', label: 'Active', className: 'ok', title: 'Logins are accepted with valid credentials from an allowed host.'};
}

function formatHosts(user) {
    const parts = [];
    for (const ip of user.host_ip) parts.push(ip === '::/0' ? 'Any host' : ip);
    for (const name of user.host_names) parts.push(name === 'localhost' ? 'localhost' : `name ${name}`);
    for (const regexp of user.host_names_regexp) parts.push(`regexp ${regexp}`);
    for (const like of user.host_names_like) parts.push(`like ${like}`);
    return parts.length ? parts.join(', ') : 'None';
}

/// --- Administration: component access policy ---

/// The capabilities of a component in the policy. `open` is enforced by this console only (cards, sidebar,
/// routes). The others describe what the component does with the native privileges in `COMPONENT_NATIVE`,
/// which the server enforces on every access path.
const CAPABILITIES = [
    {key: 'open', title: 'Open'},
    {key: 'view_data', title: 'View data'},
    {key: 'run_queries', title: 'Run queries'},
    {key: 'administer', title: 'Administer'},
];

/// What enforces each capability of a component outside of this console. `privileges` are native grants
/// as `[access, database, table]`; `note` explains capabilities that have no fixed set of privileges.
const COMPONENT_NATIVE = {
    sql: {run_queries: {note: 'Every query is authorized by the grants on the tables it uses.'},
        view_data: {note: 'Same as Run queries.'}},
    dashboard: {view_data: {privileges: [['SELECT', 'system', 'dashboards'], ['SELECT', 'system', 'metric_log'], ['SELECT', 'system', 'asynchronous_metric_log']]},
        run_queries: {note: 'Charts can be edited to run any query the user is allowed to run.'}},
    clickstack: {integration: 'ClickStack is a separate application with its own connection settings and authorization. '
        + 'This policy only hides it in the console; it does not provision or remove access in ClickStack.'},
    terminal: {integration: 'The Web Terminal runs clickhouse-client on the server as the signed-in user. The server setting '
        + 'enable_webterminal turns it on or off for everyone; the page at /webterminal stays reachable to anyone with valid credentials.',
        run_queries: {note: 'Every query is authorized by the grants of the user.'}},
    binary: {view_data: {privileges: [['INTROSPECTION', null, null]]}},
    merges: {view_data: {privileges: [['SELECT', 'system', 'part_log']]}},
    schema: {view_data: {privileges: [['SELECT', 'system', 'tables'], ['SELECT', 'system', 'columns'], ['SELECT', 'system', 'dictionaries']]}},
    jemalloc: {view_data: {privileges: [['SELECT', 'system', 'jemalloc_stats'], ['SELECT', 'system', 'asynchronous_metrics']]},
        administer: {privileges: [['SYSTEM JEMALLOC', null, null]]}},
    'processors-profile': {view_data: {privileges: [['SELECT', 'system', 'processors_profile_log'], ['SELECT', 'system', 'query_log']]}},
    reference: {view_data: {privileges: [['SELECT', 'system', 'documentation']]}},
};
for (const c of COMPONENTS.filter(c => c.kind === 'link')) {
    COMPONENT_NATIVE[c.id] = {integration: 'An external website. The policy only lists or hides the link in the console: '
        + 'anyone who knows the address can still visit it.'};
}

/// What governs the actions of each administration page: the policy only lists or hides the page.
const ADMIN_NATIVE = {
    'admin-users': 'SHOW USERS to read; CREATE USER, ALTER USER, DROP USER (possibly limited to name patterns) to change',
    'admin-roles': 'SHOW ROLES and SELECT on system.grants to read; CREATE ROLE, GRANT with the grant or admin option to change',
    'admin-data-access': 'SELECT on system.grants, system.role_grants, and system.row_policies to read; GRANT with the grant option, CREATE ROW POLICY, and IMPERSONATE (for verification) to act',
    'admin-limits': 'SHOW SETTINGS PROFILES and SHOW QUOTAS to read; CREATE, ALTER, DROP SETTINGS PROFILE and QUOTA to change',
    'admin-audit': 'SELECT on the console audit log and on system.query_log',
    'admin-backups': 'SELECT on the backup tables to read; BACKUP, READ and WRITE on the destinations, and INSERT on the backup tables to act',
    'admin-clusters': 'SELECT on the cluster tables to read; the cluster capabilities (INSERT(<capability>) ON cluster_capabilities), checked again by the cluster agent',
    'idp-ldap': 'SELECT on system.user_directories to read; the directories are server configuration, which the console generates but does not change',
    'idp-sso': 'SELECT on the identity provider table to read; INSERT on it to change the provider settings and record connection tests',
};
for (const c of COMPONENTS.filter(c => c.kind === 'admin')) {
    if (ADMIN_NATIVE[c.id]) COMPONENT_NATIVE[c.id] = {integration: `An administration page. The policy lists or hides it in the console; every action on it is a statement the server authorizes: ${ADMIN_NATIVE[c.id]}.`};
}

/// The components the policy governs: the panels, the links of Resources, and the administration pages except
/// Component Access. Home is not governed, and neither is Component Access: it stays available to the users who
/// can change the policy, so that a policy mistake cannot lock them out of correcting it.
const POLICY_EXEMPT = ['admin-access'];
const POLICY_COMPONENTS = COMPONENTS.filter(c => (c.kind === 'panel' || c.kind === 'link' || c.kind === 'admin') && !POLICY_EXEMPT.includes(c.id));

/// The capabilities that apply to a component: a link and an administration page can only be opened (what can
/// be done on an administration page is decided by native privileges).
function capabilitiesOf(c) {
    return c.kind === 'link' || c.kind === 'admin' ? CAPABILITIES.slice(0, 1) : CAPABILITIES;
}

async function loadPolicy(current) {
    const policy = await fetchPolicy(current, current.admin.db);
    if (policy) current.admin.policy = policy;
}

/// The policy of the admin database, or null when the session changed while it was read.
async function fetchPolicy(current, db) {
    try {
        const rows = await adminRows(`SELECT toString(subject_type) AS subject_type, subject, component, open, view_data, run_queries, administer
            FROM ${quoteIdentifier(db)}.component_policy FINAL WHERE NOT deleted ORDER BY subject_type, subject, component`, {}, current);
        return {state: rows.length ? 'active' : 'empty', rows};
    } catch (e) {
        if (e instanceof AdminSessionChanged) return null;
        if (e.kind === 'missing') return {state: 'not-installed'};
        return {state: e.kind === 'forbidden' ? 'unreadable' : 'error', message: e.summary, detail: e.message};
    }
}

/// The capabilities that the policy rows give to a user with the given roles: for each component and
/// capability, whether it is allowed and which rows allow it. Rules only allow: for a component that has
/// rules, no rule for the user means not allowed. A component that no rule mentions yet, such as one added
/// to the console after the policy was set up, is not governed and stays open to everyone.
function effectivePolicy(rows, user, roles) {
    const governed = new Set(rows.map(row => row.component));
    const result = {};
    for (const c of POLICY_COMPONENTS) {
        result[c.id] = {};
        for (const capability of CAPABILITIES) {
            result[c.id][capability.key] = governed.has(c.id) ? {allowed: false, sources: []} : {allowed: true, sources: ['no rules yet (open to everyone)']};
        }
    }
    for (const row of rows) {
        const applies = row.subject_type === 'all' || (row.subject_type === 'user' && row.subject === user)
            || (row.subject_type === 'role' && roles.includes(row.subject));
        if (!applies || !result[row.component]) continue;
        const source = row.subject_type === 'all' ? 'all users' : `${row.subject_type} ${row.subject}`;
        for (const capability of CAPABILITIES) {
            if (row[capability.key]) {
                result[row.component][capability.key].allowed = true;
                result[row.component][capability.key].sources.push(source);
            }
        }
    }
    return result;
}

/// The policy decision for a panel of the signed-in user, or null when the panel is not restricted by it.
/// When the policy exists but cannot be read, the governed panels are not listed (fail closed).
function policyDecision(c) {
    if (!session || !POLICY_COMPONENTS.includes(c)) return null;
    const policy = session.admin.policy;
    const href = componentPath(c.id);
    /// While the policy loads, panels wait; links to public sites stay usable, and disappear if the policy
    /// turns out to hide them.
    if (policy.state === 'checking') return c.kind === 'link' ? null : {status: 'checking', action: 'Open', href};
    if (policy.state === 'unreadable' || policy.state === 'error') {
        return {status: 'denied', action: 'Details', href,
            reason: `The console access policy could not be read (${policy.message}), so the components it governs are not shown.`};
    }
    if (policy.state !== 'active') return null;
    const roles = session.admin.enabled_roles.map(row => row.role_name);
    const decision = effectivePolicy(policy.rows, session.server_user, roles)[c.id];
    if (decision.open.allowed) return null;
    return {status: 'denied', action: 'Details', href,
        reason: `The console access policy does not allow ${session.server_user} or the roles enabled for this session to open ${c.title}.`};
}

function policyNotice() {
    const policy = session.admin.policy;
    if (policy.state !== 'unreadable' && policy.state !== 'error') return null;
    const box = h('div', {className: 'message warning'},
        `The console access policy could not be read, so the components it governs are hidden. Ask a platform administrator to grant `
        + `SELECT ON ${session.admin.db}.component_policy to your user or a role. The server still authorizes every query you run.`);
    if (policy.detail) put(box, h('span', {className: 'detail', text: policy.detail}));
    return box;
}

/// --- Administration: page elements ---

/// Creates an element. `props` are properties (or attributes, when the element has no such property);
/// `on*` functions become event listeners; `text` sets the text content. Children can be nodes, strings,
/// arrays, or null.
function h(tag, props, ...children) {
    const element = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
        if (value === null || value === undefined || value === false) continue;
        if (key === 'text') element.textContent = value;
        else if (key === 'dataset') Object.assign(element.dataset, value);
        else if (key.startsWith('on') && typeof value === 'function') element.addEventListener(key.slice(2), value);
        else if (key in element && !key.includes('-') && key !== 'list') element[key] = value;
        else element.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children.flat(Infinity)) {
        if (child !== null && child !== undefined && child !== false) element.append(child instanceof Node ? child : String(child));
    }
    return element;
}

/// Appends children, skipping null and false (`Element.append` would insert them as text).
function put(parent, ...children) {
    parent.append(...children.flat(Infinity).filter(child => child !== null && child !== undefined && child !== false));
}

function badge(text, className, title) {
    return h('span', {className: `badge ${className || ''}`, title}, text);
}

function button(text, onclick, options = {}) {
    return h('button', {type: 'button', className: `button ${options.className || ''}`, onclick, disabled: options.disabled, title: options.title}, text);
}

function errorBox(error, prefix) {
    const message = error instanceof AdminQueryError ? (error.summary || 'The server returned an error.') : String(error.message || error);
    const box = h('div', {className: 'message error', role: 'alert'}, prefix ? `${prefix} ${message}` : message);
    if (error instanceof AdminQueryError && error.message !== message) put(box, h('span', {className: 'detail', text: error.message}));
    return box;
}

function loadingBox(text) {
    return h('p', {className: 'note', role: 'status'}, h('span', {className: 'spinner'}), ` ${text}`);
}

function kvList(pairs) {
    return h('dl', {className: 'kv'}, pairs.filter(Boolean).map(([term, value]) => [h('dt', {text: term}), h('dd', {}, value)]));
}

/// A table. `columns`: `{title, render(row) -> node | string, className}`.
function dataTable(columns, rows, empty, label) {
    return h('div', {className: 'table-wrap'}, h('table', {className: 'data', 'aria-label': label},
        h('thead', {}, h('tr', {}, columns.map(column => h('th', {scope: 'col', className: column.className || ''}, column.title)))),
        h('tbody', {}, rows.length
            ? rows.map(row => h('tr', {}, columns.map(column => h('td', {className: column.className || ''}, column.render(row)))))
            : h('tr', {}, h('td', {className: 'empty', colSpan: columns.length}, empty || 'Nothing to show.')))));
}

function chips(values, render) {
    if (!values.length) return h('span', {className: 'note'}, '—');
    return h('span', {className: 'chips'}, values.map(render || (value => badge(value))));
}

function adminLink(text, id, sub, tab) {
    return h('a', {href: adminPath(id, sub, tab), dataset: {route: ''}}, text);
}

function adminField(label, control, hint) {
    const id = control.id || `field-${Math.random().toString(36).slice(2)}`;
    control.id = id;
    return h('div', {className: 'field'}, h('label', {htmlFor: id}, label), control, hint ? h('span', {className: 'hint'}, hint) : null);
}

function checkbox(label, checked, props = {}) {
    const input = h('input', {type: 'checkbox', checked, ...props});
    return {input, element: h('label', {className: 'check'}, input, h('span', {}, label))};
}

function select(options, value, props = {}) {
    return h('select', props, options.map(option => {
        const [optionValue, optionLabel] = Array.isArray(option) ? option : [option, option];
        return h('option', {value: optionValue, selected: optionValue === value}, optionLabel);
    }));
}

/// The header bar of an administration page: `crumbs` are the parent pages, shown before the title as in ClickStack.
function pageHeader(c, title, crumbs, actions) {
    return h('div', {className: 'admin-head'},
        icon(c.icon), crumbs ? h('nav', {className: 'crumbs', 'aria-label': 'Breadcrumb'}, crumbs, h('span', {'aria-hidden': 'true'}, '›')) : null,
        h('h1', {className: 'page-title', tabIndex: -1}, title), h('span', {className: 'spacer'}), actions || null);
}

function tabList(c, sub, tabs, active) {
    return h('nav', {className: 'tablist', 'aria-label': 'Sections'}, tabs.map(([key, title]) =>
        h('a', {href: adminPath(c.id, sub, key), dataset: {route: ''}, 'aria-current': key === active ? 'page' : null}, title)));
}

/// "Changes apply to": this server, or a cluster with `ON CLUSTER`. Not offered when the SQL-managed
/// entities are in a replicated user directory, which propagates every change through Keeper.
function scopeControl() {
    const admin = session.admin;
    const replicated = admin.directories.some(d => d.type === 'replicated');
    if (replicated) {
        return h('p', {className: 'note'}, 'Users and roles created with SQL are stored in a replicated user directory: '
            + 'changes reach every server that shares it through Keeper.');
    }
    if (!admin.clusters.length) return null;
    const control = select([['', `This server (${session.hostname})`], ...admin.clusters.map(c => [c, `ON CLUSTER ${c}`])], admin.scope,
        {className: 'inline-input', onchange: e => { admin.scope = e.target.value; }});
    return h('div', {className: 'actions-row note'}, h('label', {htmlFor: 'admin-scope'}, 'Apply changes to'), Object.assign(control, {id: 'admin-scope'}));
}

function onCluster() {
    return session.admin.scope ? ` ON CLUSTER ${quoteIdentifier(session.admin.scope)}` : '';
}

/// --- Administration: dialogs ---

let dialog_close_handler = null;

function openDialog(title, body, actions, options = {}) {
    const dialog = $('admin-dialog');
    /// Reuse an open dialog: closing it would fire `close` later, which clears the content.
    dialog_close_handler = options.onclose || null;
    const content = h('div', {className: 'dialog-body'}, h('h2', {id: 'admin-dialog-title'}, title), body, actions ? h('div', {className: 'dialog-actions'}, actions) : null);
    dialog.replaceChildren(options.form ? h('form', {method: 'dialog', novalidate: true, onsubmit: options.form}, content) : content);
    if (!dialog.open) dialog.showModal();
    const focus = dialog.querySelector('[autofocus]') || dialog.querySelector('input, select, textarea, button');
    if (focus) focus.focus();
}

function closeDialog() {
    const dialog = $('admin-dialog');
    if (dialog.open) dialog.close();
}

$('admin-dialog').addEventListener('close', () => {
    /// Remove the content, which may show a generated password, as soon as the dialog closes.
    $('admin-dialog').replaceChildren();
    const handler = dialog_close_handler;
    dialog_close_handler = null;
    /// After sign-out the dialog closes too; there is nothing to show again then.
    if (handler && session) handler();
});

/// A form dialog. `submit(form_state)` returns a plan or an error message; the plan is reviewed and run.
function formDialog(title, fields, submit_text, submit) {
    const error = h('div', {className: 'message error', role: 'alert', hidden: true});
    const on_submit = async e => {
        e.preventDefault();
        error.hidden = true;
        let result;
        try {
            result = await submit();
        } catch (ex) {
            if (ex instanceof AdminSessionChanged) return;
            result = ex instanceof AdminQueryError ? `${ex.summary} ${ex.message}` : ex.message;
        }
        if (typeof result === 'string') {
            error.textContent = result;
            error.hidden = false;
            return;
        }
        if (result) reviewPlan(result);
    };
    openDialog(title, [fields, error], [button('Cancel', closeDialog), h('button', {type: 'submit', className: 'button primary'}, submit_text)], {form: on_submit});
}

/// --- Administration: running changes ---

/// A change is a plan: statements run one after another, stopping at the first failure, because the
/// later ones depend on the earlier ones. ClickHouse has no transactions for access entities, so a plan
/// that fails halfway is reported as partially applied, with the steps that did run.
///
/// `plan`: `{action, target_type, target_name, summary, steps: [{description, sql, secrets}], recovery,
/// after(outcome), result_extra(outcome)}`. Descriptions and the summary are what is shown and audited;
/// they never contain secrets. The statements are shown for review with secrets masked.
function reviewPlan(plan) {
    const statements = plan.steps.map(step => maskSecrets(step.sql, step.secrets)).join(';\n\n') + ';';
    const scope = plan.local_only ? '' : session.admin.scope;
    openDialog(`Review: ${plan.summary}`, [
        h('p', {}, scope ? `These statements run ON CLUSTER ${scope}: every server of the cluster applies them.`
            : `These statements run on ${session.hostname} as ${session.server_user}. The server checks your privileges for each of them.`),
        h('ol', {className: 'steps'}, plan.steps.map(step => h('li', {}, step.description))),
        h('details', {}, h('summary', {}, 'Statements'), h('pre', {className: 'code'}, statements)),
        plan.warning ? h('div', {className: 'message warning'}, plan.warning) : null,
        session.admin.can.write_audit || plan.audited_by_step ? null : h('p', {className: 'note'},
            'This change is not recorded in the console audit log: the log is not set up, or your user cannot write to it. '
            + 'The server records the statements in system.query_log, if it is enabled.'),
    ], [button('Back', closeDialog), button(plan.confirm_text || 'Apply', () => executePlan(plan), {className: plan.danger ? 'danger primary' : 'primary'})]);
}

async function executePlan(plan) {
    const current = session;
    const correlation_id = plan.correlation_id || crypto.randomUUID();
    const scope = plan.local_only ? '' : current.admin.scope;
    const items = plan.steps.map(step => h('li', {}, h('span', {className: 'state skipped'}, 'Pending'), ` ${step.description}`));
    const status = h('div', {role: 'status'}, h('span', {className: 'spinner'}), ' Applying…');
    /// After the dialog closes, show the state from the server again: the change, and any change made
    /// meanwhile outside of the console.
    openDialog(plan.summary, [status, h('ol', {className: 'steps'}, items)], null, {onclose: plan.onclose || reloadAdmin});
    const dialog = $('admin-dialog');
    /// Do not let Escape close the dialog while statements run.
    const block_cancel = e => e.preventDefault();
    dialog.addEventListener('cancel', block_cancel);

    const outcome = {correlation_id, steps: [], result: 'success', scope: scope ? `cluster:${scope}` : 'local'};
    for (const [index, step] of plan.steps.entries()) {
        const settings = {log_comment: `console-admin:${correlation_id}`};
        const on_cluster = scope && step.cluster !== false;
        if (on_cluster) {
            /// One row per server with its status, instead of an exception for the first failed server.
            Object.assign(settings, {distributed_ddl_output_mode: 'never_throw', distributed_ddl_task_timeout: '30', default_format: 'JSON'});
        }
        const result = await runQuery(current, step.sql, current.controller.signal, 120000, {settings, raw: !on_cluster});
        if (session !== current) return;
        const record = {description: step.description};
        if (!result.ok) {
            record.status = 'failed';
            record.error = maskSecrets(`${result.message} ${result.detail || ''}`.trim(), step.secrets);
        } else if (on_cluster && Array.isArray(result.data) && result.data.length) {
            record.hosts = result.data.map(row => ({host: `${row.host}:${row.port}`, status: row.status === null ? 'unfinished' : (Number(row.status) === 0 ? 'ok' : 'failed'),
                error: maskSecrets(row.error || '', step.secrets)}));
            const failed = record.hosts.filter(host => host.status !== 'ok');
            record.status = !failed.length ? 'ok' : (failed.length === record.hosts.length ? 'failed' : 'partial');
        } else {
            record.status = 'ok';
        }
        outcome.steps.push(record);
        const item = items[index];
        const label = {ok: ['Done', 'ok'], failed: ['Failed', 'bad'], partial: ['Partly applied', 'bad']}[record.status];
        item.firstChild.textContent = label[0];
        item.firstChild.className = `state ${label[1]}`;
        if (record.error) put(item, h('span', {className: 'detail'}, h('br'), record.error));
        if (record.hosts) put(item, hostTable(record.hosts));
        if (record.status !== 'ok') break;
    }
    for (const item of items.slice(outcome.steps.length)) item.firstChild.textContent = 'Not run';

    const done = outcome.steps.filter(step => step.status !== 'failed' || (step.hosts || []).some(host => host.status === 'ok'));
    const all_ok = outcome.steps.length === plan.steps.length && outcome.steps.every(step => step.status === 'ok');
    outcome.result = all_ok ? 'success' : (done.length ? 'partial' : 'failure');
    const errors = outcome.steps.filter(step => step.status !== 'ok').map(step => step.error
        || step.hosts.filter(host => host.status !== 'ok').map(host => `${host.host}: ${host.error || host.status}`).join('; '));

    const audit = plan.audited_by_step ? h('p', {className: 'note'}, `Correlation ID ${correlation_id}.`)
        : await writeAudit(current, plan, outcome, errors.join(' | '));
    if (session !== current) return;
    dialog.removeEventListener('cancel', block_cancel);

    const summary = {
        success: h('div', {className: 'message info', role: 'status'}, 'Applied.'),
        failure: h('div', {className: 'message error', role: 'alert'}, 'Not applied: the first statement failed, so nothing changed.'),
        partial: h('div', {className: 'message error', role: 'alert'},
            'Partially applied: the steps marked Done took effect and were not rolled back. ',
            plan.recovery || 'Review the current state, then repeat the failed step or undo the completed ones.'),
    }[outcome.result];
    if (outcome.steps.some(step => step.hosts && step.status !== 'ok')) {
        summary.append(h('span', {className: 'detail'}, 'Servers marked unfinished did not answer within 30 seconds: they execute the statement '
            + 'when they process the distributed DDL queue, unless they are unavailable. Run the change again once they are back; '
            + 'statements that already took effect then fail with "already exists" or similar errors on those servers.'));
    }
    status.replaceWith(summary);
    const extra = plan.result_extra && outcome.result !== 'failure' ? plan.result_extra(outcome) : null;
    const body = dialog.querySelector('.dialog-body');
    if (extra) put(body, extra);
    put(body, audit);
    put(body, h('div', {className: 'dialog-actions'}, button('Close', closeDialog, {className: 'primary'})));
    if (plan.after) plan.after(outcome);
}

function hostTable(hosts) {
    return dataTable([
        {title: 'Server', render: host => host.host},
        {title: 'Result', render: host => badge({ok: 'Done', failed: 'Failed', unfinished: 'Unfinished'}[host.status], host.status === 'ok' ? 'ok' : 'bad')},
        {title: 'Error', render: host => host.error},
    ], hosts, null, 'Results per server');
}

/// Writes the console audit record of a plan. The actor, the time, and the server are columns the server
/// fills in (`MATERIALIZED`, checked by a constraint), so a client cannot write them.
async function writeAudit(current, plan, outcome, error) {
    if (!current.admin.can.write_audit) {
        return h('p', {className: 'note'}, `Not recorded in the console audit log. Server statements carry log_comment console-admin:${outcome.correlation_id}.`);
    }
    const row = {
        correlation_id: outcome.correlation_id,
        scope: outcome.scope,
        target_type: plan.target_type,
        target_name: plan.target_name,
        action: plan.action,
        summary: plan.summary,
        result: outcome.result,
        error: maskSecrets(error),
        details: JSON.stringify({steps: outcome.steps, ...(plan.audit_details || {})}),
    };
    const db = quoteIdentifier(current.admin.db);
    const result = await runQuery(current,
        `INSERT INTO ${db}.audit_log (correlation_id, scope, target_type, target_name, action, summary, result, error, details) FORMAT JSONEachRow\n${JSON.stringify(row)}`,
        current.controller.signal, 30000, {settings: {log_comment: `console-admin:${outcome.correlation_id}`}});
    if (result.ok) return h('p', {className: 'note'}, `Recorded in the audit log with correlation ID ${outcome.correlation_id}.`);
    return h('div', {className: 'message warning'}, `The change was ${outcome.result === 'failure' ? 'not applied' : 'applied'}, but the audit record could not be written: `
        + `${result.message} ${result.detail || ''} Server statements carry log_comment console-admin:${outcome.correlation_id}.`);
}

/// --- Administration: pages ---

/// The administration page being shown: `token` changes when another page is shown, so the results of
/// queries started for the previous one are dropped.
let admin_page = null;
const ADMIN_PAGES = {};

function showAdmin(c, route) {
    const view = $('admin-view');
    const page = {component: c, route, waiting: false, token: Symbol(c.id)};
    admin_page = page;
    if (session.admin.state === 'checking') {
        page.waiting = true;
        view.replaceChildren(h('div', {className: 'admin-page'}, pageHeader(c, c.title), loadingBox('Checking your privileges…')));
        return;
    }
    const state = adminComponentState(c);
    if (state.status !== 'available') {
        view.replaceChildren(h('div', {className: 'admin-page'}, pageHeader(c, c.title),
            h('div', {className: 'box'}, h('h2', {}, `${c.title} is not available for your user`),
                paragraph(`${state.reason} The administration pages show what the server lets your user read and change; `
                    + 'ask an administrator for the privileges, or sign in as another user.'),
                h('div', {className: 'actions-row'}, routeLink('Back to Home', componentPath('home'))))));
        focusHeading(view.querySelector('h1'));
        return;
    }
    const root = h('div', {className: 'admin-page'});
    view.replaceChildren(root);
    view.scrollTop = 0;
    ADMIN_PAGES[c.page](root, route, page);
    focusHeading(view.querySelector('h1'));
}

/// Renders the current administration page again, for example after a change.
function reloadAdmin() {
    const route = parseRoute();
    if (route.name === 'component' && COMPONENTS_BY_ID.get(route.id).kind === 'admin') showAdmin(COMPONENTS_BY_ID.get(route.id), route);
}

function isCurrent(page) {
    return admin_page === page && session;
}

/// Runs `load` and renders its result into `container` while the page is still shown; errors are shown
/// in the container.
async function loadInto(page, container, load, render) {
    container.replaceChildren(loadingBox('Loading…'));
    try {
        const data = await load();
        if (!isCurrent(page)) return;
        container.replaceChildren(...[render(data)].flat(Infinity).filter(Boolean));
    } catch (e) {
        if (e instanceof AdminSessionChanged || !isCurrent(page)) return;
        container.replaceChildren(errorBox(e));
    }
}

/// --- Administration: access model helpers ---

function subjectSQL(subject) {
    return quoteIdentifier(subject.name);
}

/// `ON` target of a row of `system.grants`, for display and for statements.
function grantTarget(row) {
    if (row.database === null) return '*.*';
    if (row.table === null) return `${quoteIdentifier(row.database)}.*`;
    return `${quoteIdentifier(row.database)}.${quoteIdentifier(row.table)}`;
}

function grantTargetText(row) {
    if (row.database === null) return '*.*';
    return `${row.database}.${row.table === null ? '*' : row.table}${row.column ? `(${row.column})` : ''}`;
}

function accessSQL(access, column) {
    if (!/^[A-Za-z][A-Za-z0-9 _]*$/.test(access)) throw new Error(`Unexpected privilege name: ${access}`);
    return column ? `${access}(${quoteIdentifier(column)})` : access;
}

/// Statements to revoke a row of `system.grants`, or to remove a partial revoke (by granting it back).
function revokeGrantSQL(subject, row, grant_option_only) {
    const what = `${accessSQL(row.access_type, row.column)} ON ${grantTarget(row)}`;
    if (row.is_partial_revoke) return `GRANT${onCluster()} ${what} TO ${subjectSQL(subject)}`;
    return `REVOKE${onCluster()} ${grant_option_only ? 'GRANT OPTION FOR ' : ''}${what} FROM ${subjectSQL(subject)}`;
}

/// The roles granted to a user or role, recursively: `[{role, path, is_default}]`. `is_default` is that
/// of the first role in the path, which decides whether the chain is active at login.
function roleClosure(role_grants, subject) {
    const direct = role_grants.filter(row => subject.type === 'user' ? row.user_name === subject.name : row.role_name === subject.name);
    const result = [];
    const seen = new Set();
    const queue = direct.map(row => ({role: row.granted_role_name, path: [row.granted_role_name], is_default: !!row.granted_role_is_default}));
    while (queue.length) {
        const item = queue.shift();
        if (seen.has(item.role)) continue;
        seen.add(item.role);
        result.push(item);
        for (const row of role_grants.filter(row => row.role_name === item.role)) {
            queue.push({role: row.granted_role_name, path: [...item.path, row.granted_role_name], is_default: item.is_default});
        }
    }
    return result;
}

async function loadRoleGrants() {
    return adminRows('SELECT user_name, role_name, granted_role_name, granted_role_is_default, with_admin_option FROM system.role_grants');
}

const GRANT_COLUMNS = 'user_name, role_name, access_type, database, table, column, is_partial_revoke, grant_option';

/// The ancestors of each privilege in the privilege hierarchy (`SELECT` -> `ALL`), from `system.privileges`.
async function loadPrivilegeTree() {
    const rows = await adminRows('SELECT privilege, level, parent_group FROM system.privileges');
    const parents = new Map(rows.map(row => [row.privilege, row.parent_group]));
    return {rows, ancestors(access) {
        const result = [access];
        let parent = parents.get(access);
        while (parent && !result.includes(parent)) {
            result.push(parent);
            parent = parents.get(parent);
        }
        return result;
    }};
}

/// Whether a set of grant rows gives `[access, database, table]`. This is the console's estimate from
