async function createUserDialog() {
    const admin = session.admin;
    const [roles, profiles] = await Promise.all([
        assignableRoles().catch(() => []),
        admin.can.read_profiles ? adminRows('SELECT name FROM system.settings_profiles ORDER BY name').catch(() => []) : [],
    ]);
    const name = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, autocapitalize: 'off', autofocus: true});
    const password = passwordFields(true);
    const hosts = hostsFields(null);
    const database = h('input', {type: 'text', autocomplete: 'off', spellcheck: false});
    /// With the policy set up, the role that reads it is preselected: without it, the console hides the
    /// components the policy governs from the new user.
    const policy_installed = ['active', 'empty'].includes(admin.policy.state);
    const reader = policy_installed ? policyReaderRole() : null;
    const role_boxes = roles.map(role => checkbox(role === reader ? `${role} (lets the console apply its access policy to the user)` : role, role === reader));
    const make_default = checkbox('Make the assigned roles default roles (active at login)', true);
    const profile = select([['', 'None'], ...profiles.map(row => [row.name, row.name])], '');
    const writable = admin.directories.filter(d => ['local_directory', 'local directory', 'replicated', 'memory'].includes(d.type));
    const directory = writable.length > 1 ? select(writable.map(d => [d.name, `${d.name} (${d.type})`]), writable[0].name) : null;
    const reader_note = reader && !roles.includes(reader)
        ? h('p', {className: 'note'}, `You cannot grant the role ${reader}. Without it, or SELECT on ${admin.db}.component_policy, the console hides the components its policy governs from the new user.`)
        : null;
    formDialog('Create user', [
        adminField('Name', name, scopedPatternsHint('USER')),
        ...password.elements,
        ...hosts.elements,
        adminField('Default database (optional)', database),
        roles.length ? h('fieldset', {className: 'box'}, h('legend', {}, 'Roles'), role_boxes.map(b => b.element), make_default.element)
            : h('p', {className: 'note'}, 'You cannot grant roles: that needs ROLE ADMIN or roles granted to you WITH ADMIN OPTION.'),
        profiles.length ? adminField('Settings profile (optional)', profile) : null,
        directory ? adminField('Stored in', directory) : null,
        reader_note,
    ], 'Review', () => {
        const user = name.value;
        const name_error = nameError(user, 'user');
        if (name_error) return name_error;
        const secret = password.value();
        if (secret.error) return secret.error;
        const host = hosts.clause();
        if (host.error) return host.error;
        if (database.value && nameError(database.value, 'database')) return nameError(database.value, 'database');
        const chosen = roles.filter((role, i) => role_boxes[i].input.checked);
        let sql = `CREATE USER ${quoteIdentifier(user)}${onCluster()}${directory ? ` IN ${quoteIdentifier(directory.value)}` : ''}`
            + ` IDENTIFIED BY ${quoteString(secret.password)}${password.expiry() ? validUntilClause(password.expiry()) : ''}${host.sql}`;
        if (database.value) sql += ` DEFAULT DATABASE ${quoteIdentifier(database.value)}`;
        if (profile.value) sql += ` SETTINGS PROFILE ${quoteString(profile.value)}`;
        const steps = [{description: `Create user ${user}${profile.value ? ` with settings profile ${profile.value}` : ''}`, sql, secrets: [secret.password]}];
        if (chosen.length) {
            steps.push({description: `Grant roles ${chosen.join(', ')}`, sql: `GRANT${onCluster()} ${chosen.map(quoteIdentifier).join(', ')} TO ${quoteIdentifier(user)}`});
            if (!make_default.input.checked) {
                steps.push({description: 'Make no role a default role', sql: `ALTER USER ${quoteIdentifier(user)}${onCluster()} DEFAULT ROLE NONE`});
            }
        }
        password.clear();
        return {action: 'create_user', target_type: 'user', target_name: user, summary: `Create user ${user}`, steps,
            recovery: `The user ${user} exists. Assign the missing roles or privileges on its page, or delete it.`,
            onclose: () => navigate(adminPath('admin-users', user)),
            result_extra: secret.generated ? () => secretResult(user, secret.password) : null};
    });
}

function scopedPatternsHint(kind) {
    if (session.admin.can[`create_${kind.toLowerCase()}`]) return null;
    const patterns = session.admin.scoped[`CREATE ${kind}`] || [];
    return patterns.length ? `You can create ${kind.toLowerCase()}s whose names match: ${patterns.join(', ')}.` : null;
}

function editUserDialog(ctx) {
    const {user} = ctx;
    const new_name = h('input', {type: 'text', value: user.name, autocomplete: 'off', spellcheck: false});
    const hosts = hostsFields(user);
    const database = h('input', {type: 'text', value: user.default_database, autocomplete: 'off', spellcheck: false});
    formDialog(`Edit ${user.name}`, [
        adminField('Name', new_name, 'Renaming keeps the ID, roles, and privileges. Clients must sign in with the new name.'),
        ...hosts.elements,
        adminField('Default database', database, 'Empty for none.'),
    ], 'Review', () => {
        const rename = new_name.value !== user.name;
        if (rename && nameError(new_name.value, 'user')) return nameError(new_name.value, 'user');
        const host = hosts.clause();
        if (host.error) return host.error;
        if (database.value && nameError(database.value, 'database')) return nameError(database.value, 'database');
        const sql = `ALTER USER ${quoteIdentifier(user.name)}${onCluster()}${rename ? ` RENAME TO ${quoteIdentifier(new_name.value)}` : ''}${host.sql}`
            + ` DEFAULT DATABASE ${database.value ? quoteIdentifier(database.value) : 'NONE'}`;
        const target = rename ? new_name.value : user.name;
        return {action: 'edit_user', target_type: 'user', target_name: user.name, summary: `Edit user ${user.name}${rename ? ` (rename to ${new_name.value})` : ''}`,
            steps: [{description: `Set the ${rename ? 'name, ' : ''}allowed hosts, and default database of ${user.name}`, sql}],
            warning: 'Changing the allowed hosts applies to new logins; open sessions are not closed.',
            onclose: () => navigate(adminPath('admin-users', target), true)};
    });
}

function passwordDialog(ctx) {
    const {user} = ctx;
    const password = passwordFields(true);
    const others = user.auth_type.filter(type => !PASSWORD_AUTH.includes(type));
    const suspended = ctx.state.key === 'suspended';
    formDialog(`Password of ${user.name}`, [
        ...password.elements,
        h('p', {className: 'note'}, `This replaces every authentication method of the user (${user.auth_type.join(', ') || 'none'}) with the new password. `
            + 'Open sessions stay signed in. The statement goes to the server only; the server stores a hash and masks the password in its logs.'),
        others.length ? h('div', {className: 'message warning'}, `The user also has ${others.join(', ')} authentication, which this removes.`) : null,
        suspended ? h('div', {className: 'message info'}, 'The user is suspended and stays suspended: the new password gets the same expiry. Reactivate the user separately.') : null,
    ], 'Review', () => {
        const secret = password.value();
        if (secret.error) return secret.error;
        const until = suspended ? SUSPENDED_UNTIL : password.expiry();
        password.clear();
        return {action: secret.generated ? 'reset_password' : 'change_password', target_type: 'user', target_name: user.name,
            summary: `${secret.generated ? 'Reset' : 'Change'} the password of ${user.name}`,
            steps: [{description: `Set a ${secret.generated ? 'generated temporary' : 'new'} password${until ? ` valid until ${formatUnixUTC(until)}` : ''}`,
                sql: `ALTER USER ${quoteIdentifier(user.name)}${onCluster()} IDENTIFIED BY ${quoteString(secret.password)}${until ? validUntilClause(until) : ''}`,
                secrets: [secret.password]}],
            result_extra: secret.generated ? () => secretResult(user.name, secret.password) : null};
    });
}

const SUSPENSION_SEMANTICS = [
    'New logins are rejected over every interface (HTTP, native, Web Terminal, MySQL and PostgreSQL protocols). HTTP requests authenticate one by one, '
        + 'including those with a session_id, so the console and other HTTP clients of the user stop working at their next request.',
    'Already open native connections (clickhouse-client, the Web Terminal, drivers with connection pools) keep working until they disconnect: '
        + 'ClickHouse has no statement that closes another user\'s connection. To cut them off now, also revoke the user\'s roles and privileges, '
        + 'which applies to open sessions at their next query.',
    'Running queries finish, unless you stop them below (KILL QUERY).',
    'Roles, privileges, and settings stay as they are. Reactivating restores logins.',
];

async function suspendDialog(ctx) {
    const {user} = ctx;
    const impact = await platformAdminImpact({remove_user: user.name});
    const blocked = lastAdminMessage(impact);
    if (blocked) {
        openDialog(`Suspend ${user.name}`, [h('div', {className: 'message error'}, blocked)], [button('Close', closeDialog)]);
        return;
    }
    const kill = checkbox('Also stop the queries the user is running now (KILL QUERY)', false, {disabled: !session.admin.can.kill_query});
    const expiries = user.valid_until.filter(t => t);
    formDialog(`Suspend ${user.name}`, [
        paragraph('The console suspends a user by making every authentication method expire in the past (ALTER USER ... VALID UNTIL '
            + "'2000-01-01 00:00:00 UTC'). ClickHouse has no other statement to disable a user. What it does:"),
        h('ul', {}, SUSPENSION_SEMANTICS.map(text => h('li', {}, text))),
        expiries.length ? h('div', {className: 'message warning'}, `The current expiry dates (${expiries.map(formatUnixUTC).join(', ')}) are overwritten. `
            + 'They are kept in the audit record, and you can set them again when reactivating.') : null,
        kill.element,
        session.admin.can.kill_query ? null : h('p', {className: 'note'}, 'Stopping queries needs the KILL QUERY privilege.'),
    ], 'Review', () => {
        const steps = [{description: `Make every authentication method of ${user.name} expire (blocks new logins)`,
            sql: `ALTER USER ${quoteIdentifier(user.name)}${onCluster()}${validUntilClause(SUSPENDED_UNTIL)}`}];
        if (kill.input.checked) {
            steps.push({description: `Stop the running queries of ${user.name}`,
                sql: `KILL QUERY${onCluster()} WHERE user = ${quoteString(user.name)} ASYNC`});
        }
        return {action: 'suspend_user', target_type: 'user', target_name: user.name, summary: `Suspend ${user.name}`, steps, danger: true, confirm_text: 'Suspend',
            audit_details: {previous_valid_until: user.valid_until.map(t => (t ? formatUnixUTC(t) : 'no expiry'))},
            recovery: 'New logins are already blocked. Stop the running queries again, or wait for them to finish.'};
    });
}

async function reactivateDialog(ctx) {
    const {user} = ctx;
    let previous = null;
    if (session.admin.can.read_audit) {
        try {
            const rows = await adminRows(`SELECT details FROM ${quoteIdentifier(session.admin.db)}.audit_log
                WHERE target_type = 'user' AND target_name = {name:String} AND action = 'suspend_user' AND result != 'failure'
                ORDER BY event_time DESC LIMIT 1`, {name: user.name});
            if (rows.length) previous = JSON.parse(rows[0].details).previous_valid_until || null;
        } catch (e) {
            if (e instanceof AdminSessionChanged) return;
        }
    }
    const expiry = h('input', {type: 'date'});
    formDialog(`Reactivate ${user.name}`, [
        paragraph('Logins with the user\'s existing credentials work again. Roles, privileges, and settings were not changed by the suspension.'),
        previous ? h('p', {className: 'note'}, `Expiry before the suspension (from the audit log): ${previous.join(', ')}.`)
            : h('p', {className: 'note'}, 'The expiry before the suspension is not known (no audit record).'),
        adminField('Credentials expire (optional)', expiry, 'Empty: no expiry. Otherwise the date (00:00 UTC) when every authentication method stops working.'),
    ], 'Review', () => {
        const until = expiry.value ? Date.parse(`${expiry.value}T00:00:00Z`) / 1000 : 0;
        if (until && until <= Date.now() / 1000) return 'Choose a date in the future, or leave it empty.';
        return {action: 'reactivate_user', target_type: 'user', target_name: user.name, summary: `Reactivate ${user.name}`,
            steps: [{description: `Allow logins of ${user.name}${until ? ` until ${formatUnixUTC(until)}` : ' without expiry'}`,
                sql: `ALTER USER ${quoteIdentifier(user.name)}${onCluster()}${validUntilClause(until)}`}]};
    });
}

/// Before deleting a user, show what depends on it, and refuse when the console can tell that the deletion
/// would remove the last platform administrator.
async function deleteUserDialog(ctx) {
    const {user} = ctx;
    const name = user.name;
    openDialog(`Delete ${name}`, [loadingBox('Checking what depends on this user…')], [button('Cancel', closeDialog)]);
    const admin = session.admin;
    const optional = (condition, load) => (condition ? load().catch(e => { if (e instanceof AdminSessionChanged) throw e; return null; }) : Promise.resolve(null));
    let deps;
    try {
        deps = await Promise.all([
            optional(admin.can.read_roles, () => adminRows('SELECT granted_role_name FROM system.role_grants WHERE user_name = {name:String}', {name})),
            optional(admin.can.read_grants, () => adminRows('SELECT count() AS n FROM system.grants WHERE user_name = {name:String}', {name})),
            optional(admin.can.read_tables, () => adminRows('SELECT database, name FROM system.tables WHERE definer = {name:String} ORDER BY database, name LIMIT 50', {name})),
            optional(admin.can.read_quotas, () => adminRows('SELECT name FROM system.quotas WHERE has(apply_to_list, {name:String}) OR has(apply_to_except, {name:String})', {name})),
            optional(true, () => adminRows('SELECT name FROM system.row_policies WHERE has(apply_to_list, {name:String}) OR has(apply_to_except, {name:String})', {name})),
            optional(admin.can.read_processes, () => adminRows('SELECT count() AS n FROM system.processes WHERE user = {name:String}', {name})),
            optional(true, () => platformAdminImpact({remove_user: name})),
        ]);
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog(`Delete ${name}`, [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const [roles, grants, definers, quotas, policies, processes, impact] = deps;
    const blocked = lastAdminMessage(impact);
    const unknown = 'not readable by your user';
    const items = [
        ['Granted roles', roles ? (roles.map(r => r.granted_role_name).join(', ') || 'none') : unknown],
        ['Direct privileges', grants ? String(grants[0].n) : unknown],
        ['Views and tables that run as this user (DEFINER)', definers ? (definers.map(t => `${t.database}.${t.name}`).join(', ') || 'none') : unknown],
        ['Quotas naming this user', quotas ? (quotas.map(q => q.name).join(', ') || 'none') : unknown],
        ['Row policies naming this user', policies ? (policies.map(p => p.name).join(', ') || 'none') : unknown],
        ['Queries running now', processes ? String(processes[0].n) : unknown],
    ];
    const confirm = h('input', {type: 'text', autocomplete: 'off', spellcheck: false});
    const error = h('div', {className: 'message error', role: 'alert', hidden: true});
    const body = [
        h('div', {className: 'box'}, h('h3', {}, 'Dependencies'), kvList(items)),
        definers && definers.length ? h('div', {className: 'message warning'}, 'Views with SQL SECURITY DEFINER that use this user stop working until their definer is changed.') : null,
        paragraph('Deleting the user removes its credentials, direct privileges, role assignments, and settings. Open sessions of the user are not closed, '
            + 'but lose all privileges at their next query. This cannot be undone: a user created again with the same name gets a new ID.'),
    ];
    if (blocked) {
        openDialog(`Delete ${name}`, [...body, h('div', {className: 'message error'}, blocked)], [button('Close', closeDialog)]);
        return;
    }
    openDialog(`Delete ${name}`, [...body, adminField(`Type ${name} to confirm`, confirm), error], [button('Cancel', closeDialog),
        button('Review', () => {
            if (confirm.value !== name) {
                error.textContent = 'The name does not match.';
                error.hidden = false;
                return;
            }
            reviewPlan({action: 'delete_user', target_type: 'user', target_name: name, summary: `Delete user ${name}`, danger: true, confirm_text: 'Delete',
                steps: [{description: `Delete user ${name}`, sql: `DROP USER ${quoteIdentifier(name)}${onCluster()}`}],
                audit_details: {dependencies: Object.fromEntries(items)},
                onclose: () => navigate(adminPath('admin-users'), true)});
        }, {className: 'danger primary'})]);
}

/// --- Administration: permissions of a user or role ---

function subjectFilter(subject) {
    return subject.type === 'user' ? 'user_name = {name:String}' : 'role_name = {name:String}';
}

function grantRowsTable(rows, columns_extra, empty) {
    return dataTable([
        {title: 'Privilege', render: row => row.is_partial_revoke ? [row.access_type, ' ', badge('Revoked here', 'bad', 'A partial revoke: this part of a broader grant is excluded.')] : row.access_type},
        {title: 'On', render: row => h('code', {}, grantTargetText(row))},
        {title: 'Delegation', render: row => row.grant_option ? badge('WITH GRANT OPTION', 'warn', 'Can grant this privilege to others.') : '—'},
        ...columns_extra,
    ], rows, empty, 'Privileges');
}

function renderPermissions(panel, page, subject, editable) {
    const direct = h('div', {});
    const statements = h('div', {});
    const inherited = h('div', {});
    const effective = h('div', {});
    const label = `${subject.type} ${subject.name}`;
    put(panel,
        h('div', {className: 'box'},
            h('div', {className: 'admin-head'}, h('h2', {}, 'Direct privileges'), h('span', {className: 'spacer'}),
                editable ? button('Grant privilege', () => grantPrivilegeDialog(subject), {className: 'small'}) : null),
            h('p', {className: 'note'}, `Granted to the ${label} itself. Revoking applies to open sessions at their next query. `
                + 'To grant a privilege, you need it yourself WITH GRANT OPTION; the server refuses anything else.'),
            direct,
            h('details', {}, h('summary', {}, 'As statements (SHOW GRANTS), including user and role management scoped by name'), statements)),
        h('div', {className: 'box'}, h('h2', {}, 'Inherited from roles'),
            h('p', {className: 'note'}, 'Privileges of the roles granted to it, directly or through other roles. A role that is not a default role '
                + 'is active only in sessions that run SET ROLE.'), inherited),
        h('div', {className: 'box'}, h('h2', {}, 'Effective'),
            h('p', {className: 'note'}, subject.type === 'user'
                ? 'Computed by the server (SHOW GRANTS ... FINAL): direct privileges together with those of all granted roles. '
                    + (subject.name === session.server_user ? 'In this console session, the active roles are: ' : 'Which roles are active depends on each session; the server does not expose the sessions of other users.')
                : 'Computed by the server (SHOW GRANTS ... FINAL): direct privileges together with those of the roles granted to this role.'),
            effective));

    loadInto(page, direct, () => adminRows(`SELECT ${GRANT_COLUMNS} FROM system.grants WHERE ${subjectFilter(subject)}
        ORDER BY database NULLS FIRST, table NULLS FIRST, access_type`, {name: subject.name}), rows => grantRowsTable(rows, editable ? [{title: '', render: row =>
        h('span', {className: 'actions-row'},
            button(row.is_partial_revoke ? 'Grant back' : 'Revoke', () => reviewPlan({action: row.is_partial_revoke ? 'grant_privilege' : 'revoke_privilege',
                target_type: subject.type, target_name: subject.name, summary: `${row.is_partial_revoke ? 'Grant back' : 'Revoke'} ${row.access_type} ON ${grantTargetText(row)} ${row.is_partial_revoke ? 'to' : 'from'} ${subject.name}`,
                steps: [{description: `${row.is_partial_revoke ? 'Grant' : 'Revoke'} ${row.access_type} ON ${grantTargetText(row)}`, sql: revokeGrantSQL(subject, row, false)}]}), {className: 'small'}),
            row.grant_option && !row.is_partial_revoke ? button('Revoke grant option', () => reviewPlan({action: 'revoke_grant_option', target_type: subject.type, target_name: subject.name,
                summary: `Revoke the grant option for ${row.access_type} ON ${grantTargetText(row)} from ${subject.name}`,
                steps: [{description: `Revoke the grant option for ${row.access_type} ON ${grantTargetText(row)}`, sql: revokeGrantSQL(subject, row, true)}]}), {className: 'small'}) : null)}] : [],
    `No direct privileges.`));

    loadInto(page, statements, () => adminStatements(`SHOW GRANTS FOR ${quoteIdentifier(subject.name)}`), lines => h('pre', {className: 'code'}, lines.join('\n') || 'No grants.'));

    loadInto(page, inherited, async () => {
        const role_grants = await loadRoleGrants();
        const closure = roleClosure(role_grants, subject);
        const grants = closure.length ? await adminRows(`SELECT ${GRANT_COLUMNS} FROM system.grants WHERE role_name IN {roles:Array(String)}`, {roles: arrayParam(closure.map(item => item.role))}) : [];
        return {closure, grants};
    }, ({closure, grants}) => {
        const rows = grants.map(row => ({...row, via: closure.find(item => item.role === row.role_name)}));
        return grantRowsTable(rows, [
            {title: 'Via role', render: row => h('span', {}, row.via.path.map((role, i) => [i ? ' → ' : '', adminLink(role, 'admin-roles', role)]))},
            ...(subject.type === 'user' ? [{title: 'Active at login', render: row => row.via.is_default ? badge('Default', 'ok') : badge('After SET ROLE')}] : []),
        ], closure.length ? 'The granted roles have no privileges.' : 'No roles are granted.');
    });

    loadInto(page, effective, async () => {
        const lines = await adminStatements(`SHOW GRANTS FOR ${quoteIdentifier(subject.name)} FINAL`);
        const active = subject.type === 'user' && subject.name === session.server_user
            ? (await adminRows('SELECT role_name FROM system.current_roles ORDER BY role_name')).map(row => row.role_name) : null;
        return {lines, active};
    }, ({lines, active}) => {
        const result = [h('pre', {className: 'code'}, lines.join('\n') || 'No privileges.')];
        if (active) effective.parentElement.querySelector('p').append(active.length ? active.join(', ') : 'none', '.');
        return result;
    });
}

async function grantPrivilegeDialog(subject) {
    let tree, databases;
    try {
        [tree, databases] = await Promise.all([loadPrivilegeTree(), adminRows('SELECT name FROM system.databases ORDER BY name').catch(() => [])]);
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog('Grant privilege', [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const privileges = tree.rows.slice().sort((a, b) => a.privilege.localeCompare(b.privilege));
    const privilege = select(privileges.map(row => [row.privilege, `${row.privilege}${row.level ? ` (${row.level.toLowerCase().replace('_', ' ')})` : ' (group)'}`]), 'SELECT');
    const scope = select([], '');
    const database = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, list: 'grant-databases'});
    const table = h('input', {type: 'text', autocomplete: 'off', spellcheck: false});
    const columns = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, placeholder: 'id, name'});
    const pattern = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, placeholder: 'app_*'});
    const grant_option = checkbox('WITH GRANT OPTION: the grantee can grant this privilege to others', false);
    const fields = {
        database: adminField('Database', database),
        table: adminField('Table, view, or dictionary', table),
        columns: adminField('Columns', columns, 'Comma-separated.'),
        pattern: adminField('User or role names', pattern, 'A name, or a prefix followed by * (app_*). * alone means all.'),
    };
    const SCOPES = {global: 'Everything (*.*)', database: 'One database', table: 'One table', columns: 'Some columns of a table', names: 'Users or roles by name'};
    const level_scopes = level => ({
        GLOBAL: ['global'], DATABASE: ['global', 'database'], TABLE: ['global', 'database', 'table'], VIEW: ['global', 'database', 'table'],
        DICTIONARY: ['global', 'database', 'table'], COLUMN: ['global', 'database', 'table', 'columns'], USER_NAME: ['global', 'names'],
    }[level] || (level === null ? ['global', 'database', 'table'] : ['global']));
    const sync = () => {
        const row = privileges.find(p => p.privilege === privilege.value);
        const allowed = level_scopes(row.level);
        const previous = scope.value;
        scope.replaceChildren(...allowed.map(key => h('option', {value: key, selected: key === previous}, SCOPES[key])));
        fields.database.hidden = !['database', 'table', 'columns'].includes(scope.value);
        fields.table.hidden = !['table', 'columns'].includes(scope.value);
        fields.columns.hidden = scope.value !== 'columns';
        fields.pattern.hidden = scope.value !== 'names';
    };
    privilege.addEventListener('change', sync);
    scope.addEventListener('change', sync);
    sync();
    formDialog(`Grant a privilege to ${subject.type} ${subject.name}`, [
        adminField('Privilege', privilege, 'Privileges and groups of this server version (system.privileges).'),
        adminField('Scope', scope), fields.database, fields.table, fields.columns, fields.pattern,
        h('datalist', {id: 'grant-databases'}, databases.map(row => h('option', {value: row.name}))),
        grant_option.element,
    ], 'Review', () => {
        let target = '*.*';
        let column_list = '';
        let target_text = '*.*';
        if (['database', 'table', 'columns'].includes(scope.value)) {
            if (nameError(database.value, 'database')) return nameError(database.value, 'database');
            target = `${quoteIdentifier(database.value)}.*`;
            target_text = `${database.value}.*`;
        }
        if (['table', 'columns'].includes(scope.value)) {
            if (nameError(table.value, 'table')) return nameError(table.value, 'table');
            target = `${quoteIdentifier(database.value)}.${quoteIdentifier(table.value)}`;
            target_text = `${database.value}.${table.value}`;
        }
        if (scope.value === 'columns') {
            const names = columns.value.split(',').map(s => s.trim()).filter(Boolean);
            if (!names.length) return 'Enter at least one column.';
            for (const column of names) if (nameError(column, 'column')) return nameError(column, 'column');
            column_list = `(${names.map(quoteIdentifier).join(', ')})`;
            target_text += `(${names.join(', ')})`;
        }
        if (scope.value === 'names') {
            if (!/^(\*|[A-Za-z0-9_]+\*?)$/.test(pattern.value)) return 'Use a name of letters, digits, and underscores, optionally followed by *, or * alone.';
            target = pattern.value;
            target_text = pattern.value;
        }
        const access = privilege.value;
        const with_option = grant_option.input.checked;
        const broad = target === '*.*' && ['ALL', 'ACCESS MANAGEMENT', 'ROLE ADMIN', 'CREATE USER', 'ALTER USER', 'SYSTEM', 'INTROSPECTION'].includes(access);
        return {action: 'grant_privilege', target_type: subject.type, target_name: subject.name,
            summary: `Grant ${access} ON ${target_text} to ${subject.name}${with_option ? ' WITH GRANT OPTION' : ''}`,
            steps: [{description: `Grant ${access} ON ${target_text}${with_option ? ' with grant option' : ''}`,
                sql: `GRANT${onCluster()} ${accessSQL(access)}${column_list} ON ${target} TO ${subjectSQL(subject)}${with_option ? ' WITH GRANT OPTION' : ''}`}],
            warning: broad ? `${access} on everything is a broad administrative privilege. Prefer a scoped grant or a role template.` : (with_option ? 'The grant option lets the grantee pass this privilege on.' : null)};
    });
}

/// --- Administration: settings and quotas of a user or role ---

const QUOTA_LIMIT_COLUMNS = [
    ['max_queries', 'queries'], ['max_query_selects', 'query_selects'], ['max_query_inserts', 'query_inserts'], ['max_errors', 'errors'],
    ['max_result_rows', 'result_rows'], ['max_result_bytes', 'result_bytes'], ['max_read_rows', 'read_rows'], ['max_read_bytes', 'read_bytes'],
    ['max_execution_time', 'execution_time'], ['max_written_bytes', 'written_bytes'],
    ['max_failed_sequential_authentications', 'failed_sequential_authentications'],
];

function formatInterval(seconds) {
    const [amount, unit] = intervalParts(seconds);
    return `${amount} ${unit}${amount === 1 ? '' : 's'}`;
}

function quotaLimitsText(limits) {
    const parts = QUOTA_LIMIT_COLUMNS.filter(([column]) => limits[column] !== null).map(([column, key]) => `${key} ≤ ${limits[column]}`);
    return `${limits.is_randomized_interval ? 'randomized ' : ''}${formatInterval(limits.duration)}: ${parts.length ? parts.join(', ') : 'tracking only'}`;
}

function elementText(row) {
    if (row.inherit_profile) return `profile ${row.inherit_profile}`;
    const constraints = [];
    if (row.min !== null) constraints.push(`min ${row.min}`);
    if (row.max !== null) constraints.push(`max ${row.max}`);
    if (row.writability && row.writability !== 'WRITABLE') constraints.push(row.writability === 'CONST' ? 'cannot be changed' : 'changeable in readonly');
    return `${row.setting_name}${row.value !== null ? ` = ${row.value}` : ''}${constraints.length ? ` (${constraints.join(', ')})` : ''}`;
}

/// Settings, profiles, and quotas that apply to a user or role, with where each comes from.
function renderSubjectLimits(panel, page, subject, editable) {
    const box = h('div', {});
    const keyword = subject.type === 'user' ? 'USER' : 'ROLE';
    put(panel, h('div', {className: 'box'},
        h('div', {className: 'admin-head'}, h('h2', {}, 'Settings and profiles'), h('span', {className: 'spacer'}),
            editable && session.admin.can.read_profiles ? button('Assign profile', () => assignProfileDialog(subject), {className: 'small'}) : null),
        h('p', {className: 'note'}, 'Settings limit each query and session (for example max_execution_time per query, max_memory_usage per query). '
            + 'They do not grant or deny access to data: that is what privileges do. A setting marked "cannot be changed" is a constraint the user cannot override.'),
        box));
    const quota_box = h('div', {});
    put(panel, h('div', {className: 'box'}, h('h2', {}, 'Quotas'),
        h('p', {className: 'note'}, 'Quotas count usage over time intervals, per key (by default per user), and reject queries over the limits. '
            + `Assign them on the ${COMPONENTS_BY_ID.get('admin-limits').title} page.`), quota_box));

    loadInto(page, box, async () => {
        const role_grants = await loadRoleGrants().catch(e => { if (e instanceof AdminSessionChanged) throw e; return []; });
        const roles = roleClosure(role_grants, subject).map(item => item.role);
        const own = await adminRows(`SELECT index, setting_name, value, min, max, toString(writability) AS writability, inherit_profile
            FROM system.settings_profile_elements WHERE ${subjectFilter(subject)} ORDER BY index`, {name: subject.name});
        const inherited = roles.length ? await adminRows(`SELECT role_name, index, setting_name, value, min, max, toString(writability) AS writability, inherit_profile
            FROM system.settings_profile_elements WHERE role_name IN {roles:Array(String)} ORDER BY role_name, index`, {roles: arrayParam(roles)}) : [];
        return {own, inherited};
    }, ({own, inherited}) => {
        const rows = [...own.map(row => ({...row, source: `${subject.type} itself`})), ...inherited.map(row => ({...row, source: `role ${row.role_name}`}))];
        return dataTable([
            {title: 'Setting or profile', render: row => row.inherit_profile ? [badge('profile'), ' ', adminLink(row.inherit_profile, 'admin-limits', null, 'profiles')] : elementText(row)},
            {title: 'From', render: row => row.source},
            {title: '', render: row => editable && row.inherit_profile && row.source === `${subject.type} itself` ? button('Remove', () => reviewPlan({
                action: 'remove_profile', target_type: subject.type, target_name: subject.name, summary: `Remove profile ${row.inherit_profile} from ${subject.name}`,
                steps: [{description: `Remove profile ${row.inherit_profile}`, sql: `ALTER ${keyword} ${quoteIdentifier(subject.name)}${onCluster()} DROP PROFILES ${quoteString(row.inherit_profile)}`}]}),
            {className: 'small'}) : null},
        ], rows, 'No settings or profiles. The server default profile (default_profile in the server configuration) applies.', 'Settings');
    });

    loadInto(page, quota_box, async () => {
        const role_grants = await loadRoleGrants().catch(e => { if (e instanceof AdminSessionChanged) throw e; return []; });
        const roles = roleClosure(role_grants, subject).map(item => item.role);
        const [quotas, limits] = await Promise.all([adminRows('SELECT name, storage, keys, apply_to_all, apply_to_list, apply_to_except FROM system.quotas ORDER BY name'),
            adminRows('SELECT * FROM system.quota_limits ORDER BY quota_name, duration')]);
        return quotasFor(quotas, subject.name, roles).map(q => ({...q, limits: limits.filter(l => l.quota_name === q.name)}));
    }, rows => dataTable([
        {title: 'Quota', render: q => adminLink(q.name, 'admin-limits', null, 'quotas')},
        {title: 'Source', render: q => badge(entitySource(q.storage).label)},
        {title: 'Keyed by', render: q => q.keys.join(', ') || 'not keyed'},
        {title: 'Limits', render: q => q.limits.map(l => h('div', {}, quotaLimitsText(l)))},
    ], rows, 'No quota applies.', 'Quotas'));
}

async function assignProfileDialog(subject) {
    const profiles = await adminRows('SELECT name FROM system.settings_profiles ORDER BY name').catch(() => []);
    if (!profiles.length) {
        openDialog('Assign profile', [paragraph('There are no settings profiles, or your user cannot read them.')], [button('Close', closeDialog)]);
        return;
    }
    const profile = select(profiles.map(row => row.name), profiles[0].name);
    const keyword = subject.type === 'user' ? 'USER' : 'ROLE';
    formDialog(`Assign a settings profile to ${subject.name}`, [adminField('Profile', profile),
        h('p', {className: 'note'}, 'The other settings and profiles of the user stay (ADD PROFILES). The settings apply to new sessions.')], 'Review', () => ({
        action: 'assign_profile', target_type: subject.type, target_name: subject.name, summary: `Assign profile ${profile.value} to ${subject.name}`,
        steps: [{description: `Add profile ${profile.value}`, sql: `ALTER ${keyword} ${quoteIdentifier(subject.name)}${onCluster()} ADD PROFILES ${quoteString(profile.value)}`}]}));
}

/// The console policy as it applies to a user: with all granted roles, and with the default roles only
/// (what a new console session gets).
function renderUserComponents(panel, ctx) {
    const box = h('div', {});
    put(panel, h('div', {className: 'box'}, h('h2', {}, 'Console components'), policyExplanation(), box));
    const policy = session.admin.policy;
    if (policy.state !== 'active') {
        put(box, paragraph(policyStateText(policy)));
        return;
    }
    loadInto(ctx.page, box, async () => roleClosure(await loadRoleGrants(), {type: 'user', name: ctx.name}), closure => {
        const at_login = effectivePolicy(policy.rows, ctx.name, closure.filter(item => item.is_default).map(item => item.role));
        const all = effectivePolicy(policy.rows, ctx.name, closure.map(item => item.role));
        return dataTable([
            {title: 'Component', render: c => c.title},
            ...CAPABILITIES.map(capability => ({title: capability.title, className: 'center', render: c => {
                if (!capabilitiesOf(c).includes(capability)) return h('span', {className: 'note'}, 'n/a');
                const allowed = at_login[c.id][capability.key];
                const with_set_role = all[c.id][capability.key];
                if (allowed.allowed) return badge('Allowed', 'ok', `By ${allowed.sources.join(', ')}.`);
                if (with_set_role.allowed) return badge('After SET ROLE', 'warn', `By ${with_set_role.sources.join(', ')}, which is not a default role.`);
                return '—';
            }})),
        ], POLICY_COMPONENTS, null, 'Component access');
    });
}

function policyStateText(policy) {
    return {
        'not-installed': 'The console access policy is not set up, so the console shows every component to every user. The server still authorizes every query.',
        empty: 'The console access policy has no rules, so the console shows every component to every user.',
        off: policy.message,
        unreadable: `The console access policy could not be read: ${policy.message}`,
        error: `The console access policy could not be read: ${policy.message}`,
        checking: 'Loading the console access policy…',
    }[policy.state];
}

function policyExplanation() {
    return h('p', {className: 'note'}, 'The console policy decides which components the console lists and opens, including the administration pages. '
        + 'It is not a security boundary on its own: the SQL Console, the standalone pages, and other clients reach the server directly, where only native ClickHouse privileges apply. '
        + 'View data, Run queries, and Administer are enforced by the native privileges listed on the Component Access page; on administration pages only Open applies, '
        + 'and their actions remain statements the server authorizes. Component Access itself is not governed: it stays available to the users who can change the policy.');
}

/// `GRANT` statements for a template. Targets are quoted here: `db.*`, `db.table`, `*.*`, or a user name
/// pattern (`app_*`, written as is after validation).
function templateStatements(template, params, role) {
    const db = session.admin.db || 'console_admin';
    if (['active', 'empty'].includes(session.admin.policy.state)) params = {...params, reader: policyReaderRole()};
    const quote_target = target => {
        if (target === '*.*') return target;
        const dot = target.indexOf('.');
        if (dot < 0) return target;
        const [database, table] = [target.slice(0, dot), target.slice(dot + 1)];
        /// A database prefix pattern (`restore_*`) is a wildcard only when it is not quoted.
        const db_sql = /^[A-Za-z_][A-Za-z0-9_]*\*$/.test(database) ? database : quoteIdentifier(database);
        return `${db_sql}.${table === '*' ? '*' : quoteIdentifier(table)}`;
    };
    return template.grants(params, db).map(item => {
        if (item.role) {
            return {description: `Grant role ${item.role} WITH ADMIN OPTION`, sql: `GRANT${onCluster()} ${quoteIdentifier(item.role)} TO ${quoteIdentifier(role)} WITH ADMIN OPTION`};
        }
        const [privileges, target] = item;
        /// Source privileges carry their target: `READ ON S3` (granted without `ON db.table`).
        if (target === null) return {description: `Grant ${privileges}`, sql: `GRANT${onCluster()} ${privileges} TO ${quoteIdentifier(role)}`};
        return {description: `Grant ${privileges} ON ${target}`, sql: `GRANT${onCluster()} ${privileges} ON ${quote_target(target)} TO ${quoteIdentifier(role)}`};
    });
}

function templatePreview(template) {
    const sample = {databases: ['<database>'], pattern: '<users>', roles: ['<role>'], kill: true, s3: true, destroy: true, query_text: true, introspection: true,
        reader: `${session.admin.db || 'console_admin'}_reader`};
    return template.grants(sample, session.admin.db || 'console_admin').map(item => item.role ? `${item.role} WITH ADMIN OPTION` : (item[1] === null ? item[0] : `${item[0]} ON ${item[1]}`))

async function createRoleDialog(template) {
    const name = h('input', {type: 'text', value: template ? template.suggested : '', autocomplete: 'off', spellcheck: false, autofocus: true});
    const fields = [adminField('Role name', name, scopedPatternsHint('ROLE'))];
    const inputs = {};
    let roles = [];
    if (template && template.params.some(p => p.key === 'roles')) roles = await assignableRoles().catch(() => []);
    for (const param of template ? template.params : []) {
        if (param.flag) {
            inputs[param.key] = checkbox(param.title, false);
            fields.push(inputs[param.key].element);
        } else if (param.key === 'roles') {
            inputs.roles = roles.map(role => checkbox(role, false));
            fields.push(h('fieldset', {className: 'box'}, h('legend', {}, param.title), inputs.roles.length ? inputs.roles.map(b => b.element)
                : paragraph('You cannot grant any role.'), h('span', {className: 'note'}, param.hint)));
        } else {
            inputs[param.key] = h('input', {type: 'text', autocomplete: 'off', spellcheck: false, placeholder: param.placeholder || 'sales, marketing'});
            fields.push(adminField(param.title, inputs[param.key], param.hint || 'Comma-separated.'));
        }
    }
    if (template) fields.push(h('p', {className: 'note'}, template.purpose));
    formDialog(template ? `Create role: ${template.title}` : 'Create role', fields, 'Review', () => {
        const role = name.value;
        if (nameError(role, 'role')) return nameError(role, 'role');
        const steps = [{description: `Create role ${role}`, sql: `CREATE ROLE ${quoteIdentifier(role)}${onCluster()}`}];
        if (template) {
            const params = {};
            for (const param of template.params) {
                if (param.flag) params[param.key] = inputs[param.key].input.checked;
                else if (param.key === 'roles') params.roles = roles.filter((r, i) => inputs.roles[i].input.checked);
                else if (param.key === 'databases') {
                    params.databases = inputs.databases.value.split(',').map(s => s.trim()).filter(Boolean);
                    if (!params.databases.length) return 'Enter at least one database.';
                    for (const d of params.databases) if (nameError(d, 'database')) return nameError(d, 'database');
                } else if (param.key === 'pattern') {
                    params.pattern = inputs.pattern.value.trim();
                    if (!/^(\*|[A-Za-z0-9_]+\*?)$/.test(params.pattern)) return 'Use a user name of letters, digits, and underscores, optionally followed by *, or * alone.';
                }
            }
            steps.push(...templateStatements(template, params, role));
        }
        return {action: 'create_role', target_type: 'role', target_name: role, summary: `Create role ${role}${template ? ` from template ${template.title}` : ''}`,
            steps, recovery: `The role ${role} exists with the privileges granted so far. Grant the rest on its page, or delete it.`,
            warning: template && template.id === 'access-admin' && steps.some(s => / ON \* TO /.test(s.sql))
                ? 'User management on * lets this role change any user, including administrators.' : null,
            onclose: () => navigate(adminPath('admin-roles', role))};
    });
}

async function addMemberDialog(ctx) {
    const [users, roles] = await Promise.all([
        adminRows('SELECT name, storage FROM system.users ORDER BY name').catch(() => []),
        adminRows('SELECT name, storage FROM system.roles WHERE name != {name:String} ORDER BY name', {name: ctx.name}).catch(() => []),
    ]);
    const options = [...users.filter(u => entitySource(u.storage).editable).map(u => [`user:${u.name}`, `user ${u.name}`]),
        ...roles.filter(r => entitySource(r.storage).editable).map(r => [`role:${r.name}`, `role ${r.name}`])];
    if (!options.length) {
        openDialog('Add member', [paragraph('There are no users or roles that can be changed with SQL, or your user cannot list them.')], [button('Close', closeDialog)]);
        return;
    }
    const member = select(options, options[0][0]);
    const admin_option = checkbox('With admin option: the member can grant this role to others', false);
    formDialog(`Grant ${ctx.name}`, [adminField('To', member), admin_option.element,
        h('p', {className: 'note'}, 'For a user whose default roles are all granted roles (the default), the role is active in new sessions.')], 'Review', () => {
        const [type, target] = [member.value.slice(0, 4), member.value.slice(5)];
        return {action: 'assign_role', target_type: type, target_name: target, summary: `Grant role ${ctx.name} to ${type} ${target}`,
            steps: [{description: `Grant role ${ctx.name} to ${target}${admin_option.input.checked ? ' with admin option' : ''}`,
                sql: `GRANT${onCluster()} ${quoteIdentifier(ctx.name)} TO ${quoteIdentifier(target)}${admin_option.input.checked ? ' WITH ADMIN OPTION' : ''}`}]};
    });
}

async function deleteRoleDialog(ctx) {
    const name = ctx.name;
    openDialog(`Delete role ${name}`, [loadingBox('Checking what depends on this role…')], [button('Cancel', closeDialog)]);
    let members, impact;
    try {
        [members, impact] = await Promise.all([
            adminRows('SELECT user_name, role_name FROM system.role_grants WHERE granted_role_name = {name:String}', {name}),
            platformAdminImpact({drop_role: name}),
        ]);
    } catch (e) {
        if (!(e instanceof AdminSessionChanged)) openDialog(`Delete role ${name}`, [errorBox(e)], [button('Close', closeDialog)]);
        return;
    }
    const policy_rows = (session.admin.policy.rows || []).filter(row => row.subject_type === 'role' && row.subject === name);
    const blocked = lastAdminMessage(impact);
    const body = [h('div', {className: 'box'}, h('h3', {}, 'Dependencies'), kvList([
        ['Members', members.map(m => m.user_name !== null ? `user ${m.user_name}` : `role ${m.role_name}`).join(', ') || 'none'],
        ['Console policy rules', policy_rows.length ? `${policy_rows.length} (they no longer apply to anyone)` : 'none'],
    ])), paragraph('Members lose the privileges of the role, including open sessions at their next query. This cannot be undone.')];
    if (blocked) {
        openDialog(`Delete role ${name}`, [...body, h('div', {className: 'message error'}, blocked)], [button('Close', closeDialog)]);
        return;
    }
    const confirm = h('input', {type: 'text', autocomplete: 'off', spellcheck: false});
    const error = h('div', {className: 'message error', role: 'alert', hidden: true});
    openDialog(`Delete role ${name}`, [...body, adminField(`Type ${name} to confirm`, confirm), error], [button('Cancel', closeDialog), button('Review', () => {
        if (confirm.value !== name) {
            error.textContent = 'The name does not match.';
            error.hidden = false;
            return;
        }
        reviewPlan({action: 'delete_role', target_type: 'role', target_name: name, summary: `Delete role ${name}`, danger: true, confirm_text: 'Delete',
            steps: [{description: `Delete role ${name}`, sql: `DROP ROLE ${quoteIdentifier(name)}${onCluster()}`}],
            audit_details: {members: members.map(m => m.user_name ?? `role ${m.role_name}`)},
            onclose: () => navigate(adminPath('admin-roles'), true)});
    }, {className: 'danger primary'})]);
}

/// --- Administration: Component Access ---

/// The console's own tables. The actor, time, and server of a record are filled in by the server
/// (`MATERIALIZED`), and a constraint rejects other values even with `insert_allow_materialized_columns`,
/// so a client cannot write records in another user's name. They are ordinary tables: users with `ALTER`,
/// `TRUNCATE`, or `DROP` on them can still change or remove records, so the log is not tamper-proof.
const ADMIN_TABLES = {
    audit_log: retention_days => `(
    event_time DateTime64(3, 'UTC') MATERIALIZED now64(3),
    actor String MATERIALIZED currentUser(),
    server_host LowCardinality(String) MATERIALIZED hostName(),
    correlation_id UUID,
    scope String,
    target_type LowCardinality(String),
    target_name String,
    action LowCardinality(String),
    summary String,
    result Enum8('success' = 1, 'failure' = 2, 'partial' = 3),
    error String,
    details String,
    CONSTRAINT actor_is_writer CHECK actor = currentUser(),
    CONSTRAINT host_is_server CHECK server_host = hostName()
)
ENGINE = MergeTree ORDER BY event_time
TTL toDateTime(event_time) + INTERVAL ${retention_days} DAY`,
    component_policy: () => `(
    subject_type Enum8('all' = 1, 'role' = 2, 'user' = 3),
    subject String,
    component LowCardinality(String),
    open Bool,
    view_data Bool,
    run_queries Bool,
    administer Bool,
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY (subject_type, subject, component)`,
    protected_accounts: () => `(
    name String,
    reason String,
    deleted Bool DEFAULT false,
    updated_at DateTime64(3, 'UTC') MATERIALIZED now64(3),
    updated_by String MATERIALIZED currentUser(),
    CONSTRAINT updated_by_is_writer CHECK updated_by = currentUser()
)
ENGINE = ReplacingMergeTree(updated_at) ORDER BY name`,
};

/// The role that can read the policy. Every console user needs it (or `SELECT` on the policy table) for
/// the console to apply the policy. Assigning a role needs only the admin option on it, while a direct
/// grant would need `SELECT` on the table `WITH GRANT OPTION`, so user administrators get this role.
function policyReaderRole() {
    return `${session.admin.db}_reader`;
}

/// Loads the capabilities again (after the setup, the tables exist and grants may have changed), keeping
/// the chosen scope, and shows the current page again.
async function reloadAdminContext() {
    const current = session;
    const scope = current.admin.scope;
    current.admin = {...current.admin, state: 'checking'};
    await loadAdminContext(current);
    if (session !== current) return;
    current.admin.scope = scope;
    refreshComponentStates();
    reloadAdmin();
}

async function reloadPolicy() {
    const current = session;
    await loadPolicy(current);
    if (session !== current) return;
    refreshComponentStates();
    reloadAdmin();
}

async function setupDialog() {
    const admin = session.admin;
    const db = admin.db;
    let subjects = [];
    try {
        const [users, roles] = await Promise.all([adminRows('SELECT name, storage FROM system.users ORDER BY name'), adminRows('SELECT name, storage FROM system.roles ORDER BY name')]);
        subjects = [...users, ...roles].filter(s => entitySource(s.storage).editable).map(s => s.name);
    } catch (e) {
        if (e instanceof AdminSessionChanged) return;
    }
    const reader = policyReaderRole();
    const retention = h('input', {type: 'number', min: 1, max: 36500, value: 365});
    const grant_read = checkbox(`Assign the role ${reader} to the ${subjects.length} users and roles created with SQL, so the console can apply the policy to them`, true,
        {disabled: !subjects.length});
    formDialog('Set up console administration', [
        adminField('Keep audit records for (days)', retention, 'Older records are removed by a TTL.'),
        grant_read.element,
        h('p', {className: 'note'}, `The role ${reader} can read the policy. Users who cannot read it do not see the components it governs; `
            + 'the role must be among their default roles. Users defined in configuration files get grants in those files.'),
    ], 'Review', () => {
        const days = Number(retention.value);
        if (!Number.isInteger(days) || days < 1 || days > 36500) return 'Enter a number of days between 1 and 36500.';
        const quoted = quoteIdentifier(db);
        const correlation_id = crypto.randomUUID();
        const seed = POLICY_COMPONENTS.map(component => JSON.stringify({subject_type: 'all', subject: '', component: component.id,
            open: true, view_data: component.kind === 'panel', run_queries: component.kind === 'panel', administer: false}));
        const steps = [
            {description: `Create the database ${db}`, sql: `CREATE DATABASE IF NOT EXISTS ${quoted}`},
            ...Object.entries(ADMIN_TABLES).map(([table, ddl]) => ({description: `Create the table ${db}.${table}`,
                sql: `CREATE TABLE IF NOT EXISTS ${quoted}.${quoteIdentifier(table)}\n${ddl(days)}`})),
            {description: 'Add the initial rule: all users can open every component', sql: `INSERT INTO ${quoted}.component_policy (subject_type, subject, component, open, view_data, run_queries, administer) FORMAT JSONEachRow\n${seed.join('\n')}`},
        ];
        steps.push({description: `Create the role ${reader}, which can read the policy`, sql: `CREATE ROLE IF NOT EXISTS ${quoteIdentifier(reader)}`},
            {description: `Grant SELECT on the policy to ${reader}`, sql: `GRANT SELECT ON ${quoted}.component_policy TO ${quoteIdentifier(reader)}`});
        const members = subjects.filter(name => name !== reader);
        if (grant_read.input.checked && members.length) {
            steps.push({description: `Assign ${reader} to ${members.length} users and roles`,
                sql: `GRANT ${quoteIdentifier(reader)} TO ${members.map(quoteIdentifier).join(', ')}`});
        }
        steps.push({description: 'Record the setup in the audit log', sql: `INSERT INTO ${quoted}.audit_log (correlation_id, scope, target_type, target_name, action, summary, result, error, details) FORMAT JSONEachRow\n`
            + JSON.stringify({correlation_id, scope: 'local', target_type: 'platform', target_name: db, action: 'setup',
                summary: `Set up console administration in ${db}`, result: 'success', error: '', details: JSON.stringify({retention_days: days})})});
        return {action: 'setup', target_type: 'platform', target_name: db, summary: `Set up console administration in ${db}`, steps,
            correlation_id, audited_by_step: true, local_only: true,
            recovery: 'The statements use IF NOT EXISTS: run the setup again after fixing the error.', onclose: reloadAdminContext};
    });
}

    const subject_from = value => {

        return {type: value.slice(0, colon), name: value.slice(colon + 1)};
    };
    Promise.all([

        admin.can.read_users ? adminRows('SELECT name FROM system.users ORDER BY name') : [],

        const options = [['all', 'All users'], ...roles.map(r => [`role:${r.name}`, `Role ${r.name}`]), ...users.map(u => [`user:${u.name}`, `User ${u.name}`])];

function renderPolicyMatrix(page, container, subject) {
    const admin = session.admin;
    const rows = admin.policy.rows || [];
    const editable = admin.can.write_policy;
    const current = new Map(rows.filter(row => row.subject_type === subject.type && row.subject === subject.name).map(row => [row.component, row]));
    /// Components that no rule mentions are open to everyone: for all users, show them allowed, so that
    /// saving turns that into a rule. For a role or user, nothing is set for them yet.
    const governed = new Set(rows.map(row => row.component));
    const initially = (c, key) => {
        const row = current.get(c.id);
        if (row) return !!row[key];
        return subject.type === 'all' && !governed.has(c.id) && (key === 'open' || (c.kind === 'panel' && key !== 'administer'));
    };
    const boxes = new Map();
    const native_cells = new Map();
    /// The other capabilities need Open, and Open is cleared together with them.
    const follow = (id, key, checked) => {
        const set = boxes.get(id);
        if (key === 'open' && !checked) for (const other of Object.values(set)) other.checked = false;
        if (key !== 'open' && checked) set.open.checked = true;
    };
    /// A box in the header of each capability selects or clears it for every component it applies to, and shows
    /// whether all, some, or none of them have it.
    const heads = Object.fromEntries(CAPABILITIES.map(capability => [capability.key, h('input', {type: 'checkbox', disabled: !editable,
        'aria-label': `Select all: ${capability.title}`, title: `${capability.title} for every component`})]));
    const column = key => POLICY_COMPONENTS.map(c => boxes.get(c.id)?.[key]).filter(Boolean);
    const refreshHeads = () => {
        for (const capability of CAPABILITIES) {
            const inputs = column(capability.key);
            const checked = inputs.filter(input => input.checked).length;
            heads[capability.key].checked = inputs.length > 0 && checked === inputs.length;
            heads[capability.key].indeterminate = checked > 0 && checked < inputs.length;
        }
    };
    for (const capability of CAPABILITIES) {
        heads[capability.key].addEventListener('change', () => {
            const checked = heads[capability.key].checked;
            for (const c of POLICY_COMPONENTS) {
                const input = boxes.get(c.id)?.[capability.key];
                if (!input) continue;
                input.checked = checked;
                follow(c.id, capability.key, checked);
            }
            refreshHeads();
        });
    }
    const table = dataTable([
        {title: 'Component', render: c => [h('strong', {}, c.title), h('div', {className: 'note'}, CATEGORIES.find(category => category.id === c.category).title)]},
        ...CAPABILITIES.map(capability => ({title: h('span', {className: 'select-all-head'}, capability.title, heads[capability.key]), className: 'center', render: c => {
            if (!capabilitiesOf(c).includes(capability)) {
                return h('span', {className: 'note', title: c.kind === 'admin' ? 'Does not apply: native privileges decide what can be done on an administration page.'
                    : 'Does not apply: a link can only be opened.'}, '—');
            }
            const input = h('input', {type: 'checkbox', checked: initially(c, capability.key), disabled: !editable,
                'aria-label': `${capability.title} ${c.title}`});
            input.addEventListener('change', () => {
                follow(c.id, capability.key, input.checked);
                refreshHeads();
            });
            boxes.set(c.id, {...boxes.get(c.id), [capability.key]: input});
            return input;
        }})),
        {title: 'Enforced outside the console by', className: 'enforced', render: c => [
            governed.has(c.id) ? null : h('div', {}, badge('No rules yet: open to everyone', 'warn')),
            componentEnforcement(c)]},
        ...(subject.type === 'all' ? [] : [{title: 'Native privileges', className: 'enforced', render: c => {
            const cell = h('div', {}, h('span', {className: 'note'}, '…'));
            native_cells.set(c.id, cell);
            return cell;
        }}]),
    ], POLICY_COMPONENTS, null, 'Component access rules');
    refreshHeads();
    const error = h('div', {className: 'message error', role: 'alert', hidden: true});
    const save = button('Save rules', () => {
        const changes = [];
        for (const c of POLICY_COMPONENTS) {
            const set = boxes.get(c.id);
            const values = Object.fromEntries(CAPABILITIES.map(capability => [capability.key, !!(set[capability.key] && set[capability.key].checked)]));
            /// Compared with what the matrix showed at first, which for a component without rules is the
            /// default (open to everyone for all users).
            const unchanged = CAPABILITIES.every(capability => (initially(c, capability.key) && capabilitiesOf(c).includes(capability)) === values[capability.key]);
            if (!unchanged) changes.push({component: c, values});
        }
        if (!changes.length) {
            error.textContent = 'Nothing changed.';
            error.hidden = false;
            return;
        }
        const label = subject.type === 'all' ? 'all users' : `${subject.type} ${subject.name}`;
        const data = changes.map(change => JSON.stringify({subject_type: subject.type, subject: subject.name, component: change.component.id, ...change.values, deleted: false}));
        reviewPlan({action: 'set_component_policy', target_type: 'policy', target_name: label, summary: `Change the component access of ${label}`, local_only: true,
            steps: [{description: changes.map(change => `${change.component.title}: ${CAPABILITIES.filter(capability => change.values[capability.key]).map(capability => capability.title).join(', ') || 'nothing allowed'}`).join('; '),
                sql: `INSERT INTO ${quoteIdentifier(admin.db)}.component_policy (subject_type, subject, component, open, view_data, run_queries, administer, deleted) FORMAT JSONEachRow\n${data.join('\n')}`}],
            audit_details: {changes: changes.map(change => ({component: change.component.id, ...change.values}))},
            warning: subject.type === 'user' && subject.name === session.server_user ? 'This changes what the console shows to you.' : null,
            onclose: reloadPolicy});
    }, {className: 'primary', disabled: !editable, title: editable ? null : `Needs INSERT on ${admin.db}.component_policy.`});
    const remove = current.size && subject.type !== 'all' ? button('Remove the rules of this subject', () => reviewPlan({action: 'remove_component_policy',
        target_type: 'policy', target_name: `${subject.type} ${subject.name}`, summary: `Remove the component access rules of ${subject.type} ${subject.name}`, local_only: true,
        steps: [{description: `Remove ${current.size} rules`, sql: `INSERT INTO ${quoteIdentifier(admin.db)}.component_policy (subject_type, subject, component, open, view_data, run_queries, administer, deleted) FORMAT JSONEachRow\n`
            + [...current.keys()].map(component => JSON.stringify({subject_type: subject.type, subject: subject.name, component, open: false, view_data: false, run_queries: false, administer: false, deleted: true})).join('\n')}],
        onclose: reloadPolicy}), {disabled: !editable}) : null;
    container.replaceChildren(
        h('p', {className: 'note'}, subject.type === 'all' ? 'Rules for all users apply in addition to the rules of each role and user: a capability is allowed when any rule allows it.'
            : `A user gets the capabilities of the rules for all users, for the user, and for the roles enabled in the session (the default roles at sign-in).`),
        table, error, h('div', {className: 'actions-row'}, save, remove));
    if (subject.type !== 'all') fillNativeStatus(page, subject, native_cells, current);
}

function componentEnforcement(c) {
    const native = COMPONENT_NATIVE[c.id] || {};
    const lines = [];
    if (native.integration) lines.push(h('div', {}, native.integration));
    for (const capability of CAPABILITIES.slice(1)) {
        const item = native[capability.key];
        if (!item) continue;
        lines.push(h('div', {}, h('strong', {}, `${capability.title}: `), item.privileges
            ? item.privileges.map(([access, database, table]) => `${access} ON ${database ? `${database}.${table}` : '*.*'}`).join(', ') : item.note));
    }
    if (!lines.length) lines.push(h('div', {}, 'Open: the console only.'));
    return lines;
}

/// For a role or user: whether its grants (direct and through roles) give the native privileges of each
/// capability, and where the policy and the grants disagree, a way to make them agree.
async function fillNativeStatus(page, subject, cells, current) {
    let data;
    try {
        const [grants, role_grants, tree] = await Promise.all([adminRows(`SELECT ${GRANT_COLUMNS} FROM system.grants`), loadRoleGrants(), loadPrivilegeTree()]);
        data = {rows: subjectGrantRows(grants, role_grants, subject), tree};
    } catch (e) {
        if (e instanceof AdminSessionChanged || !isCurrent(page)) return;
        for (const cell of cells.values()) cell.replaceChildren(h('span', {className: 'note'}, 'Not readable (system.grants).'));
        return;
    }
    if (!isCurrent(page)) return;
    for (const c of POLICY_COMPONENTS) {
        const cell = cells.get(c.id);
        const native = COMPONENT_NATIVE[c.id] || {};
        const row = current.get(c.id);
        const parts = [];
        for (const capability of CAPABILITIES.slice(1)) {
            const item = native[capability.key];
            if (!item || !item.privileges) continue;
            const missing = item.privileges.filter(p => !grantsCover(data.rows, data.tree, p));
            const allowed = !!(row && row[capability.key] && row.open);
            const has = missing.length === 0;
            const text = has ? 'granted' : (missing.length === item.privileges.length ? 'not granted' : 'partly granted');
            const line = h('div', {}, `${capability.title}: `, badge(text, has ? 'ok' : (allowed ? 'warn' : '')));
            if (allowed && !has) {
                put(line, ' ', button('Grant', () => reviewPlan({action: 'grant_privilege', target_type: subject.type, target_name: subject.name,
                    summary: `Grant the privileges of ${c.title} (${capability.title}) to ${subject.name}`,
                    steps: missing.map(([access, database, table]) => ({description: `Grant ${access} ON ${database ? `${database}.${table}` : '*.*'}`,
                        sql: `GRANT${onCluster()} ${accessSQL(access)} ON ${database ? `${quoteIdentifier(database)}.${quoteIdentifier(table)}` : '*.*'} TO ${quoteIdentifier(subject.name)}`}))}),
                {className: 'small', title: 'Grant the missing native privileges. You need them WITH GRANT OPTION.'}));
            }
            if (!allowed && has) {
                const direct = item.privileges.filter(([access, database, table]) => data.rows.some(g => !g.is_partial_revoke && g.access_type === access
                    && g.database === database && g.table === table && g.column === null && (subject.type === 'user' ? g.user_name === subject.name : g.role_name === subject.name)));
                put(line, h('div', {className: 'note'}, 'The policy does not allow this, but the grants do: the data is reachable outside of the console.'));
                if (direct.length) {
                    put(line, button('Revoke direct grants', () => reviewPlan({action: 'revoke_privilege', target_type: subject.type, target_name: subject.name,
                        summary: `Revoke the privileges of ${c.title} (${capability.title}) from ${subject.name}`, danger: true, confirm_text: 'Revoke',
                        steps: direct.map(([access, database, table]) => ({description: `Revoke ${access} ON ${database ? `${database}.${table}` : '*.*'}`,
                            sql: `REVOKE${onCluster()} ${accessSQL(access)} ON ${database ? `${quoteIdentifier(database)}.${quoteIdentifier(table)}` : '*.*'} FROM ${quoteIdentifier(subject.name)}`})),
                        warning: direct.length < item.privileges.length ? 'Some privileges come from broader grants or other roles; revoke those on the Permissions tab.' : null}),
                    {className: 'small'}));
                } else {
                    put(line, h('div', {className: 'note'}, 'They come from broader grants or roles; change those on the Permissions tab.'));
                }
            }
            parts.push(line);
        }
        cell.replaceChildren(...(parts.length ? parts : [h('span', {className: 'note'}, 'No fixed privileges.')]));
    }
}

/// --- Administration: Profiles & Quotas ---

/// Common resource limits, with what each one limits.
const LIMIT_SETTINGS = {
    max_execution_time: 'Seconds a query may run.',
    max_memory_usage: 'Memory of one query on one server, in bytes (units such as 10GiB are accepted here).',
    max_memory_usage_for_user: 'Memory of all running queries of the user on one server, in bytes.',
    max_threads: 'Threads of one query.',
    max_concurrent_queries_for_user: 'Queries of the user running at the same time on one server.',
    max_result_rows: 'Rows in the result of one query.',
    max_result_bytes: 'Bytes in the result of one query.',
    max_rows_to_read: 'Rows one query may read.',
    max_bytes_to_read: 'Bytes one query may read.',
    max_query_size: 'Bytes of the query text.',
    readonly: '1: only reading queries, and settings cannot be changed; 2: reading queries, and settings can be changed.',
};

const BYTE_UNITS = {'': 1, K: 1e3, M: 1e6, G: 1e9, T: 1e12, KI: 1024, MI: 1024 ** 2, GI: 1024 ** 3, TI: 1024 ** 4};

/// A setting value as a SQL literal, validated with the type from `system.settings`. Integers accept byte
/// units (`10GiB`); the server validates the value again.
function settingLiteral(type, raw, label) {
    const value = raw.trim();
    if (/Bool/.test(type)) {
        if (/^(1|true)$/i.test(value)) return {sql: '1'};
        if (/^(0|false)$/i.test(value)) return {sql: '0'};
        return {error: `${label}: enter true or false.`};
    }
    if (/Int|MaxThreads/.test(type)) {
        const match = value.match(/^(\d+(?:\.\d+)?)\s*(K|M|G|T|Ki|Mi|Gi|Ti)?B?$/i);
        if (!match) return {error: `${label}: enter a whole number${/memory|bytes/.test(label) ? ', optionally with a unit such as 10GiB' : ''}.`};
        const number = Number(match[1]) * BYTE_UNITS[(match[2] || '').toUpperCase()];
        if (!Number.isSafeInteger(Math.round(number))) return {error: `${label}: the number is too large.`};
        return {sql: String(Math.round(number))};
    }
    if (/Float|Seconds|Milliseconds|Timespan/.test(type)) {
        if (!/^\d+(\.\d+)?$/.test(value)) return {error: `${label}: enter a number.`};
        return {sql: value};
    }
    return {sql: quoteString(value)};
}

function renderProfiles(panel, page) {
    const can = session.admin.can;
    const list = h('div', {});
    put(panel, h('div', {className: 'box'},
        h('div', {className: 'admin-head'}, h('h2', {}, 'Settings profiles'), h('span', {className: 'spacer'}),
            can.create_profile ? button('Create profile', () => profileDialog(null), {className: 'small'}) : null),
        h('p', {className: 'note'}, 'A profile is a named set of settings and constraints. Users and roles get profiles assigned; a profile can inherit others. '
            + 'Changes apply to new sessions.'), list));
    if (!can.read_profiles) {
        list.append(paragraph('Your user cannot read system.settings_profiles.'));
        return;
    }
    loadInto(page, list, async () => {
        const [profiles, elements] = await Promise.all([
            adminRows('SELECT name, toString(id) AS id, storage, apply_to_all, apply_to_list, apply_to_except FROM system.settings_profiles ORDER BY name'),
            adminRows(`SELECT profile_name, user_name, role_name, index, setting_name, value, min, max, toString(writability) AS writability, inherit_profile
                FROM system.settings_profile_elements ORDER BY index`),
        ]);
        return {profiles, elements};
    }, ({profiles, elements}) => dataTable([
        {title: 'Profile', render: p => [h('strong', {}, p.name), h('div', {className: 'note'}, p.id)]},
        {title: 'Source', render: p => { const s = entitySource(p.storage); return badge(s.label, s.editable ? '' : 'warn', s.title); }},
        {title: 'Settings', render: p => {
            const own = elements.filter(e => e.profile_name === p.name);
            return own.length ? own.map(e => h('div', {}, elementText(e))) : h('span', {className: 'note'}, 'none');
        }},
        {title: 'Assigned to', render: p => {
            const assigned = elements.filter(e => e.inherit_profile === p.name && e.profile_name === null)
                .map(e => (e.user_name !== null ? `user ${e.user_name}` : `role ${e.role_name}`));
            if (p.apply_to_all) assigned.push(p.apply_to_except.length ? `all except ${p.apply_to_except.join(', ')}` : 'all');
            else assigned.push(...p.apply_to_list.map(name => `${name} (TO)`));
            return chips(assigned);
        }},
        {title: '', render: p => {
            const editable = entitySource(p.storage).editable;
            return h('span', {className: 'actions-row'},
                editable && can.alter_profile ? button('Edit', () => profileDialog({...p, elements: elements.filter(e => e.profile_name === p.name)}), {className: 'small'}) : null,
                button('Assign', () => assignProfileToDialog(p.name), {className: 'small'}),

                    'Users and roles that use it lose its settings in new sessions.'), {className: 'small danger'}) : null,
                editable ? null : badge('Read only', 'warn', entitySource(p.storage).title));

async function assignProfileToDialog(profile) {
    const [users, roles] = await Promise.all([
        adminRows('SELECT name, storage FROM system.users ORDER BY name').catch(() => []),

        ...roles.filter(r => entitySource(r.storage).editable).map(r => [`ROLE:${r.name}`, `role ${r.name}`])];

            steps: [{description: `Add profile ${profile} to ${keyword.toLowerCase()} ${name}`,
                sql: `ALTER ${keyword} ${quoteIdentifier(name)}${onCluster()} ADD PROFILES ${quoteString(profile)}`}]};
