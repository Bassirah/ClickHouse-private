# The demo on 127.0.0.1 of the host, through an SSH tunnel (demo/setup.sh without --public): the console on
# http://localhost:8123, Keycloak on http://localhost:8180, phpLDAPadmin on http://localhost:8380.
services:
  keycloak:
    ports:
      - "127.0.0.1:8180:8180"

  # In the network of Keycloak, so that the issuer http://localhost:8180 is Keycloak for it too: the authenticator
  # accepts plain HTTP only on localhost. The server reaches it at http://keycloak:29700 (demo/config/sso.xml). Only
  # "started": the server depends on the authenticator, and must start even when Keycloak does not; the authenticator
  # restarts until Keycloak answers.
  sso-authenticator:
    network_mode: service:keycloak
    depends_on:
      keycloak:
        condition: service_started

  phpldapadmin:
    ports:
      - "127.0.0.1:8380:80"

  clickhouse:
    volumes:
      # Replaces config.d/sso.xml of compose.sso.yaml (the same target): the authenticator is at keycloak:29700.
      - ./demo/config/sso.xml:/etc/clickhouse-server/config.d/sso.xml:ro
