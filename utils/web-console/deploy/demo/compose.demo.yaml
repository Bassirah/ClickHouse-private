# Demo identity services of the web console, next to compose.yaml, compose.sso.yaml, and compose.ldap-attributes.yaml:
#
#   keycloak       single sign-on (realm `acme`), on http://localhost:8180 of the host
#   openldap       the directory of directory sign-in and of the user attributes (LDAPS inside the Compose network)
#   phpldapadmin   a web interface to add and change directory users, on http://localhost:8380 of the host
#
# demo/setup.sh writes the files these services read (under demo/state), and sets COMPOSE_FILE in .env, so that a plain
# `docker compose` uses every file. See demo/README.md. Every port is published on 127.0.0.1 only: open them through an
# SSH tunnel.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:${DEMO_KEYCLOAK_VERSION:-26.7}
    restart: unless-stopped
    # Development mode (HTTP, an embedded database in the volume): a demo, not a production Keycloak. The realm is
    # imported when it does not exist yet; later changes in the admin console stay in the volume.
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DEMO_KEYCLOAK_ADMIN_PASSWORD:?run demo/setup.sh}
      # The issuer in the tokens, the same for the browser (through the tunnel) and for the token authenticator, which
      # shares this container's network: plain HTTP is accepted only on localhost.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./demo/state/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # In the network of Keycloak, so that the issuer http://localhost:8180 is Keycloak for it too. The server reaches it
  # at http://keycloak:29700 (demo/config/sso.xml). Only "started": the server depends on the authenticator, and must
  # start even when Keycloak does not; the authenticator restarts until Keycloak answers.
  sso-authenticator:
    network_mode: service:keycloak
    depends_on:
      keycloak:
        condition: service_started

  openldap:
    image: bitnamilegacy/openldap:2.6.8
    restart: unless-stopped
    environment:
      LDAP_ROOT: dc=acme,dc=example
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: ${DEMO_LDAP_ADMIN_PASSWORD:?run demo/setup.sh}
      # The tree, the demo users, and the groups: loaded once, into an empty volume.
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_ENABLE_TLS: "yes"
      LDAP_TLS_CERT_FILE: /tls/ldap.crt
      LDAP_TLS_KEY_FILE: /tls/ldap.key
      LDAP_TLS_CA_FILE: /tls/ca.crt
    volumes:
      - ./demo/state/ldap-ldif:/ldifs:ro
      - ./demo/state/ldap-tls:/tls:ro
      - openldap-data:/bitnami/openldap
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:1389 -D cn=admin,dc=acme,dc=example -w \"$$LDAP_ADMIN_PASSWORD\" -b dc=acme,dc=example -s base > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    restart: unless-stopped
    environment:
      # Plain LDAP on the Compose network only; ClickHouse and the access policy worker use LDAPS (port 1636).
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'openldap': [{'server': [{'port': 1389}]}, {'login': [{'bind_id': 'cn=admin,dc=acme,dc=example'}]}]}]"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "127.0.0.1:8380:80"
    depends_on:
      openldap:
        condition: service_healthy

  clickhouse:
    volumes:
      # Replaces config.d/sso.xml of compose.sso.yaml (the same target): the authenticator is at keycloak:29700.
      - ./demo/config/sso.xml:/etc/clickhouse-server/config.d/sso.xml:ro
      # Directory sign-in, as generated on Identity Providers → LDAP → Configure LDAP…, with the directory's CA.
      - ./demo/config/ldap.xml:/etc/clickhouse-server/config.d/ldap.xml:ro
      - ./demo/state/ldap-tls/ca.crt:/etc/clickhouse-server/ldap/ca.crt:ro
      # A disk for backup destinations of Backup & Restore.
      - ./demo/config/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro

volumes:
  keycloak-data:
  openldap-data:
